places—sitting at the piano in the warm front room or standing on the bench in the chill of the shop—and it was as if one line couldn’t be without the other. Through these rooms, I witnessed the joining of my parents&#x27; lines and found myself a part of them both.<\/p>"}, {"kind": "page", "label": "Page 46", "chapter": "My Generation", "html": "<p>In my generation, both lines required us to work honestly and practice music without judgment. The Frozens&#x27; demand was for steady hands on repairs, while the Flames insisted on daily piano lessons practiced whether or not we loved it. Church remained a must due to our mother&#x27;s organ playing; no one in either line ever threw away something that could be fixed.<\/p>\n<p>These demands were absorbed as household physics rather than taught as lessons. Ruby and Onyx carried these principles forward through their own hands—Onyx’s steady bench and Ruby’s disciplined piano practice, which mirrored her meticulous record-keeping from Jet&#x27;s day book. I can only recall never seeing a thing thrown away in either line because it could be fixed.<\/p>\n<p>In our home, the Frozens&#x27; pride in daily routines was reflected by Onyx&#x27;s meticulous entry of all jobs into his day book and steady hands on repairs. Ruby’s lessons mirrored Jet’s record-keeping habits from her family Bible, and as we went about our lives, each generation sat to remember joining us—Frozens and Flames. These lines taught us not only to work honestly but also to treasure and fix what could be preserved, a commitment that is carried forward today.<\/p>"}, {"kind": "page", "label": "Page 47", "chapter": "My Generation", "html": "<p>The doctrine reached me as it reaches everyone in this family: not as a speech but as a sentence overheard until it became a reflex. My grandfather Jasper said it at his bench when I was small and he was old — &quot;a family keeps what it can fix, and fixes what it keeps&quot; — about a customer&#x27;s lathe or radio. My father echoed this with machines; my mother applied it, pointedly, to people&#x27;s marriages and children&#x27;s fevers; my grandmother Opal from the other line, at her piano, said: &quot;You do not discard a slow student.&quot; What I understood then was: do not throw away.<\/p>\n<p>Now, what I understand is harder. Some keeping is work, as when my father meticulously records his jobs in the day book and teaches me patience for tasks that need fixing but also fear with good posture, as when mother keeps meticulous household books to keep chaos at bay. The sentence does not tell you which is which; it&#x27;s in how we carry on our traditions across generations.<\/p>\n<p>I am a member of the Frozen line, born in Dallas in 2000, taught by my father’s steady hands and steady record-keeping. Ruby Flames, my mother from the Flames line, teaches piano lessons with discipline to pass down tradition from Jet&#x27;s day book. We carry these principles forward: keep what can be preserved and fix what needs it — Ruby&#x27;s meticulous hand and Onyx’s patience and skill.<\/p>\n<p>Across town, our lives are shaped by Flint’s steady hands in Pittsburgh, and my grandmother Opal&#x27;s steady piano hands at her front room. Each generation sits to remember joining as a family line—Frozens and Flames. My father&#x27;s bench becomes our home, where we sit daily to work honestly and fix what needs it. The small Dallas house houses music practice, repair work, and family meals. Every detail is preserved in household books — Ruby&#x27;s careful record-keeping and Onyx&#x27;s steady hands on repairs.<\/p>"}, {"kind": "page", "label": "Page 48", "chapter": "My Generation", "html": "<p>At Christmas, my Frozen grandparents&#x27; house became a grand stage for our family&#x27;s gathering. Jasper sat at the head, Coral moving between kitchen and table, my father and aunt Jade arguing happily about a radio in the background. My mother played the piano with steady hands, weaving her melody through each course of food. Across from them were Slate and Opal Flames, who moved like an old delegation visiting for years, their presence grounding the room.<\/p>\n<p>The house smelled of machine oil and greens in equal measure—a reminder that my childhood was a blend of new arrivals and long-standing traditions. I remember Coral’s hands moving deftly across the table as she served us all, her movements precise and patient. She had learned this skill from her mother and grandmother before her, who kept the house running with their careful hands.<\/p>\n<p>Onyx, father to my siblings, argued happily about a radio—likely his own old machine—as if it was a topic for lifelong discussion. His voice echoed in the room, mingling with the piano’s soft notes and the steady hum of machines filling every corner of the house.<\/p>\n<p>Slate and Opal Flames moved gracefully across the table like they had visited many times before. They brought with them their own stories of travel and work—a testament to the continuity of our lineage. My mother was always at her post, teaching piano lessons from a front room that smelled of greens, passing down Jet’s careful record-keeping habits.<\/p>\n<p>That Christmas, as we ate and drank, every adult passed the bread anyway—knowing this was just temporary, like all good things in life. The table brought us together, uniting generations and traditions in one place—a reminder that our family is a mosaic of past and present, a tapestry woven through time.<\/p>\n<p>In that moment, my world stood still. Jasper, Coral, Onyx, Slate, Opal—each figure etched into the memory as they sat at the head, moved between kitchen and table, argued happily about radio, played piano, or passed bread. The house smelled of machine oil and greens in equal measure—a testament to our family’s enduring spirit. And through it all, my mother&#x27;s front room remained a silent guardian, carrying forward Jet&#x27;s careful record-keeping habits.<\/p>"}, {"kind": "page", "label": "Page 49", "chapter": "My Generation", "html": "<p>The names repeat across the two lines like verses answering each other. Topaz Frozen named her Chicago son Jasper, after her brother, and his daughter is still named Topaz, after her. My sister Opal is indeed for our grandmother, a name that carries forward through generations. My uncle Jet Flames is named Jet, in honor of his grandmother, the matriarch, who passed on this tradition without anyone finding it strange.<\/p>\n<p>And I am the two surnames themselves—Frozen and Flames—together, and the only one whose name tells the story of our family lineage rather than being a mere stone from its list. The naming law makes the genealogy legible at roll call: you can hear the generations in names like Opal and Topaz, Jet and Jasper, Ruby and Onyx.<\/p>\n<p>My mother’s careful record-keeping practices echo those passed down from Jet’s generation; she writes daily thoughts to keep chaos at bay, mirroring Jet’s meticulous day book. My father&#x27;s steady hands on repairs mirror his grandfather’s; he records every job in his day book like Flint did with the millwrights&#x27; accounts.<\/p>\n<p>Together we carry these traditions forward—Frozen and Flames joining as one family line. The house is a testament to our enduring spirit, filled with the scent of machine oil mingling with greens from meals. My mother&#x27;s front room remains a silent guardian, carrying Jet’s careful record-keeping habits through to my generation.<\/p>"}, {"kind": "page", "label": "Page 50", "chapter": "My Generation", "html": "<p>I first understood the joined family was something I would carry in 2018, at my grandfather Jasper’s funeral. The day book passed from my father to me as it had before, not ceremonially but because someone needed to enter a death. As he handed over the heavy leather-bound volume, his hand aged into something very like mine, and I knew that one day both books would be in mine.<\/p>\n<p>Standing there at eighteen with a plate in my hand, I understood what carrying a family meant—entering the deaths and the births in a hand the next keeper could read. The book was simply in different hands, but it carried our story forward, binding each generation’s entry to the one that followed. Ruby&#x27;s meticulous record-keeping habits passed from Jet to Slate, and now I see Onyx taking up her tradition at home with steady hands on repairs.<\/p>\n<p>In the front room of my mother’s house, I continue Jet’s legacy. The day book remains a silent guardian, carrying the careful record-keeping handed down through generations. As Topaz joins us in the Frozens’ benching trade and Jade takes up Onyx&#x27;s tools, we all carry our family’s traditions forward.<\/p>\n<p>The small Dallas house is filled with the scent of machine oil mingling with greens from meals, a testament to our enduring spirit. My mother’s front room remains a silent guardian, carrying Jet’s careful record-keeping habits through to my generation. The book and the bench become an extended family space where each new keeper sits to remember joining as a family line—Frozens and Flames, hands passing down a legacy of meticulousness and patience.<\/p>\n<p>As I carry this tradition forward, a birth is coming soon. Topaz will join the Frozens’ lineage, her presence changing what we do and how we do it. The book remains in my hand, ready to enter the next entry—a life that will be cared for as much as any repair. The day book is our family’s anchor, our voice from generations past.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 51", "chapter": "The Family Trades", "html": "<p>The Frozen line&#x27;s founding trade was keeping other people’s machines alive: Flint, my grandfather Jasper’s father, was a millwright and machinist, the man a plant sends for when the line shaft dies. Work, in the founding definition, is not making things; it is understanding things that have stopped and returning them to service.<\/p>\n<p>As I stand at the repair bench with Onyx&#x27;s steady hands beside me, each tool and part tells its story—a testament to Flint’s meticulousness. The day book records both repairs and family events: a repair on the organ in the church front room, my mother Ruby teaching piano lessons. Each job taught us patience for tasks and care for tools.<\/p>\n<p>The weather outside—hot Dallas summers—presses against our windowpanes as we work. Public events like wars or economic shifts are distant, yet they shape who we are. In 1975, when I was born, the Vietnam War had a grip on Texas, but it didn’t touch this house and its steady hands.<\/p>\n<p>Ruby’s front room remains a place of discipline: her careful piano practice mirrors Flint&#x27;s meticulous record-keeping habits. Onyx imparts his steadiness to me with every task we do together at home. The day book is our family’s anchor; each entry connects us to generations past, to the line that started it all.<\/p>\n<p>As I look back over these pages and see how far we’ve come, from Flint&#x27;s hands in Pittsburgh through Jasper’s steady work ethic to Onyx’s patience on repairs, the day book remains my guide. It’s not just a record of jobs; it’s a mirror of our values: carefulness for tools and tasks, steadfastness in the face of change.<\/p>\n<p>A new life is coming soon: Topaz Frozen will join the Frozens’ lineage. Her presence brings fresh perspectives to this home, but she carries with her Flint&#x27;s legacy of meticulous record-keeping. The day book remains my anchor, a testament to our family’s tradition of care for tools and tasks passed down through the generations.<\/p>"}, {"kind": "page", "label": "Page 52", "chapter": "The Family Trades", "html": "<p>The bench at our house has been passed through generations like a cherished heirloom, each iteration shaped by the hands that held it next. My father Onyx taught me the repair bench with steady hands, just as his father Jasper had taught him. This day book, this standard of care and precision, is the thing transferred from generation to generation in our family.<\/p>\n<p>Jasper&#x27;s trade was different from Flint’s: while Flint kept machines running, Jasper made the tools that kept them running. Over generations, we&#x27;ve moved one remove further into detail — from keeping machinery, to making the tools that keep it running. Each move has refined what skill is held and how it is measured, but never the skill itself.<\/p>\n<p>Just as Onyx passed on his steady hands, so will I pass mine onto my own children. My father’s bench, inherited by me in turn, carries forward this tradition of meticulous care for tasks and tools — a standard that remains constant despite changes in trade over generations. The day book, its entries unaltered through the decades, testifies to the Frozens’ unwavering commitment to fixing what can be repaired, keeping what we keep.<\/p>\n<p>Through every transfer, from Flint’s machine shop to Jasper&#x27;s toolmaking bench to Onyx’s repair work and mine, this tradition of care and precision has been passed. The day book remains my anchor — a testament to our family’s legacy of steady hands on repairs and careful record-keeping, unchanged yet ever evolving as it guides the next generation.<\/p>"}, {"kind": "page", "label": "Page 53", "chapter": "The Family Trades", "html": "<p>The bench line into my parents&#x27; generation traces back to Onyx Frozen and his steady hands. His work moved from Flint’s machine shop in Pittsburgh to Jasper&#x27;s toolmaking bench in Dallas before finding its next home at the crossroads of electronics. As I watched, Onyx applied his father&#x27;s meticulous record-keeping to repairing everything that needed fixing—guitars added music, but it was the day book and steady hands on repairs that made him who he is.<\/p>\n<p>Onyx’s patience wasn’t just for me; every kid in Dallas who hung around his bench got handed the next heavier thing. His work required not only skill but also a gentle hand to guide those learning at his side. Onyx&#x27;s steady hands taught me to fix what needed it, and by doing so, he carried forward Flint’s legacy of care and precision.<\/p>\n<p>In their home, the Frozens&#x27; pride in daily practice mirrored Ruby’s careful piano practice. The small Dallas house became our extended family space, where each generation sat to remember joining as a line—Frozens and Flames. Our shop and front room became not just workplaces but also places for memory and tradition: Flint&#x27;s meticulous record-keeping habits passed to Slate and Jasper through the day book, while Onyx imparted steady hands on repairs to me.<\/p>\n<p>The day book remains my anchor, guiding the next generation of Frozens and Flames with careful hands. My father&#x27;s translation from mechanical repair into electronics shows how each work demanded a new skill set but always required patience and care. As I continue their work, this tradition of meticulous record-keeping and steady hands on repairs will remain our family’s anchor theme—carrying the newer facts and shifting understanding in fresh wording that means something new.<\/p>"}, {"kind": "page", "label": "Page 54", "chapter": "The Family Trades", "html": "<p>In her front room, Ruby Flames practiced piano lessons with steady hands, mirroring the meticulous record-keeping inherited from Jet&#x27;s day book. Her father taught me patience and care for tasks at the repair bench, passing on the Frozens&#x27; philosophy of steady hands and careful work. The small Dallas house became our shared space, a testament to these traditions: Ruby’s daily practice and my father’s meticulous day book entries.<\/p>\n<p>The era of 1975 marked stability as Ruby taught piano lessons from our front room, while I learned patient repair skills at the bench. Our home blended traditions—Flameses&#x27; careful piano practice and Frozens&#x27; steady hands on repairs. The shop and front room became our extended family space where each generation sat to remember joining as a family line—Frozens and Flames.<\/p>\n<p>The work that ran down the Flames line was fire first and music after: Garnet kept boilers and furnaces, the buildings’ hidden fires; Slate translated this keeping into heating and refrigeration, the century’s cold machinery. Through Opal, her daughter Ruby carries on the second trade, teaching piano at home front room to children and playing in church.<\/p>\n<p>The books refute any household that believes the Frozen trades were their work, as my mother&#x27;s income was the steadier for thirty years—requiring the same ear, discipline, and refusal to discard a slow student. Just like Ruby’s careful hands on her piano taught me about patient repair skills, Slate’s steady hands at the bench showed me the value of meticulous record-keeping and consistent care.<\/p>\n<p>Each generation preserved these traditions: Flint’s meticulous record-keeping habits passed to Slate and Jasper through the day book, while Onyx imparted steady hands on repairs to me. Our home became a testament to their values—our mother&#x27;s careful piano practice and father&#x27;s meticulous day book entries reflecting family virtues. As the years went by, our work at the bench and in the front room remained the anchor theme of our lineage: carrying the newer facts and shifting understanding in fresh wording that meant something new.<\/p>\n<p>A refrain returns changed: The family name of my mother’s line is Flames, a legacy tracing back generations from Mississippi to Texas. This name—Flames—is etched deep within our lineage, visible on her family Bible, and carried proudly by each of us as we go about our lives. Carry the newer facts and shifted understanding in<\/p>"}, {"kind": "page", "label": "Page 55", "chapter": "The Family Trades", "html": "<p>In 1975, my mother Ruby Flames taught piano lessons from our front room in Dallas’s quiet streets. She kept meticulous household books, mirroring her father Jet&#x27;s practice of record-keeping. My father Onyx Frozen, who learned steady hands on repairs at home, brought his own careful day book with him when he arrived.<\/p>\n<p>Our house became a testament to these traditions: Flint’s meticulous record-keeping habits passed down through Slate and Jasper’s day books, while Onyx imparted patient repair skills to me. The Cold Room I founded in 2022 is a machine for keeping performances that would otherwise stop, just as my great-grandfather kept plants running so the city could work.<\/p>\n<p>Both families recognize this posture of listening first, understanding fully, and returning the thing to service. For us, it’s not about equipment; it’s about carrying forward the legacy of carefulness and patience. The record-keeping in our family—my mother’s meticulous piano practice and father’s day book entries—reflects these values, making each generation stronger through shared knowledge.<\/p>\n<p>The Cold Room today is a small studio within a converted icehouse in Dallas, where I keep performances ready so they can stay forever. Just as Ruby kept her front room for lessons, my great-grandfather kept plants to work the city, and we do our part by keeping our family’s story alive.<\/p>"}, {"kind": "page", "label": "Page 56", "chapter": "The Family Trades", "html": "<p>In our family pattern, my sister Opal&#x27;s work is double: she sings with harmony in our mother&#x27;s front room and on sessions, a voice engineers seek out for its purity; and she teaches piano lessons from her mother&#x27;s front room on the grandmother’s piano, charging fees that to her grandmother would have been mere cake and eggs. As a teenager, Opal took on the Cold Room&#x27;s books during its early days, setting a log habit that lasted beyond her tenure; today, the studio still runs on her forms.<\/p>\n<p>My sister is the Flames line’s music in one person, bridging both lines through her voice and lessons. The Frozen line benefits from her meticulous bookkeeping habits she established. In Opal, we see her parents&#x27; traditions converge: Ruby&#x27;s careful piano practice at home and Onyx&#x27;s steady hands on repairs passed down to me.<\/p>\n<p>The Cold Room today is a small studio within our converted icehouse in Dallas, where I keep performances ready so they can last forever. It mirrors the front room of our mother’s house from earlier generations. In 1975, my sister Ruby taught piano lessons there with discipline and purpose, just as her father kept plants to work the city decades ago.<\/p>\n<p>Today, Opal’s contributions continue to shape both lines: music for the Flames, bookkeeping for the Frozen. Her work is a testament to how our family&#x27;s traditions have evolved through generations while maintaining their core values. My sister’s double role not only reinforces our lineage but also ensures that her father&#x27;s steady hands on repairs and her mother’s careful piano practice are passed down in fresh contexts today.<\/p>"}, {"kind": "page", "label": "Page 57", "chapter": "The Family Trades", "html": "<p>In 1975, my mother Ruby taught me to be that one whose name is spoken when something stops. She was a pianist in her front room and I learned on repairs at the bench. We carried this ethic into our Dallas house—music for the Flames line, bookkeeping for the Frozen.<\/p>\n<p>Ruby’s meticulous piano practice mirrored Jet&#x27;s household books; Onyx’s steady hands on repairs taught me patience. Our home became a testament to these traditions, where each generation sat to remember joining as a family line: Frozens and Flameses. Topaz’s departure from Dallas underscored how our families shifted from destinations to shared premises.<\/p>\n<p>Today, I balance both roles—teaching piano at the front room while also fixing things with steady hands at the shop. This ethic has evolved over generations but remains central: employable by neighbors, a measure of honor in this family. It makes us valuable, not rich, and it keeps our lineage alive through these shared practices of care and commitment.<\/p>"}, {"kind": "page", "label": "Page 58", "chapter": "The Family Trades", "html": "<p>In my keeping lies Flint’s toolbox, a testament to his hands and a record of his journey from Holly Springs to Dallas. Its slots are still filled with what he carried into our new home—tools of his trade and items that marked his life, all neatly organized as they were in Pittsburgh.<\/p>\n<p>My father carries on the soldering iron in his shop, where it once held circuit boards and radio components. It’s a familiar presence, used daily but never out of reach, like a reminder of the precision required to restore what was broken. He considers this tool the only fit memorial—staying true to the custom of keeping objects that reflect one&#x27;s work.<\/p>\n<p>The family Bible, with its names entered in my mother&#x27;s careful hand, is another heirloom bearing witness to our lineage. My sister teaches piano from the front room where it sits, played daily as a tradition passed down through generations. The music within these pages echoes the steady hands of her forebears—Garnet’s and Jet’s—as each note resonates with their spirit.<\/p>\n<p>Jasper’s measuring tools found their resting place in Chicago, given to his namesake there by Jasper himself. This custom binds us together, preserving our family affection through objects—tools passed from one generation to the next, kept for generations as a record of our trades and values.<\/p>"}, {"kind": "page", "label": "Page 59", "chapter": "The Family Trades", "html": "<p>The trades the lines lost are the founding ones themselves: millwrighting, the keeping of great belt-driven machines, died under the Frozens as the machines died, and furnace-keeping died under the Flameses as the boilers were replaced by systems with no fire in them to keep. What we kept cost us not income but a kind of certainty: Flint and Garnet knew exactly what their work was for, in a way the rest of us found ourselves translating again, reconstructing each generation. The family keeps the founders&#x27; tools partly as evidence that the certainty existed.<\/p>\n<p>In Flint&#x27;s lineage, the millwrights passed on their hands to Slate, who learned to maintain heating plants and refrigeration systems. This transition from hand-crafted machinery to industrialized air conditioning marked a loss for our line, but also an adaptation. The steady hands of my father Onyx Frozen are rooted in this tradition: he carries forward the patience and meticulous work ethic required for these tasks.<\/p>\n<p>Garnet’s furnace-keeping taught Jet to keep records meticulously, passing down her family&#x27;s bookkeeping practices. Her descendants like Pearl and Jasper ensured that no job or debt went unentered, upholding a custom of completeness. When I joined the Frozen line through marriage, it was this tradition of steady hands on repairs that drew me in, carrying forward my father’s patience and care for tasks.<\/p>\n<p>The tools from Flint&#x27;s era are reminders: millwrights&#x27; tools in Slate&#x27;s hands became heating plant gauges as they moved from machinery to air conditioning. The day book and household records—like Jet&#x27;s hand at the piano and Pearl&#x27;s steady work ethic on accounts—are preserved as physical evidence of these trades’ certainty, a testament to Flint’s founding. My mother Ruby continues this line: she teaches piano in her front room with disciplined hands, passing down Jet’s meticulous record-keeping.<\/p>\n<p>Each generation finds its place, translating between each line&#x27;s lost trades and our own. The tools from the Frozens&#x27; era—millwrights’ gauges and belt-driven machines—are passed to me as reminders of their certainty and loss. And in my turn, I teach steady hands on repairs, carrying forward the traditions that kept a kind of certainty, no matter how many generations it took.<\/p>\n<p>In our small Dallas home, every detail is preserved: the day book records both repairs and family events, while Ruby’s front room piano practice<\/p>"}, {"kind": "page", "label": "Page 60", "chapter": "The Family Trades", "html": "<p>In our small Dallas home, where the Cold Room rebuilt after its fire stands as a testament to the Frozens&#x27; meticulous record-keeping and my father&#x27;s steady hands on repairs, I continue to teach piano lessons from Ruby’s front room. My sister Opal carries on this tradition with her own children, giving them music practice in her intimate space. The day book records both family events and repair jobs, blending our lines’ traditions.<\/p>\n<p>As the years pass, the trades will translate again—just as they always have. What I watch for now is not just skill but whether the standard my father set survives through generations. So far, with each new generation teaching what came before, that standard continues to survive. The Frozens&#x27; care and Flint’s steady hands on machines, passed down through the day book, ensure these principles endure.<\/p>\n<p>The trade line shifts: from Slate&#x27;s heating plant in Holly Springs to Jasper&#x27;s toolmaking bench in Dallas, every job is handed over with patience and carefulness. My sister Opal inherits this tradition of record-keeping, carrying it forward like her grandmother Jet’s meticulous household books did before her. As we pass down these lessons, the Cold Room remains a sacred space for us all, a testament to the family&#x27;s ongoing legacy.<\/p>\n<p>In our small Dallas home, every detail is preserved: the day book records both repairs and family events, while Ruby’s front room piano practice teaches the steady hands that keep a kind of certainty. With each passing generation, we carry forward these traditions—patience, carefulness, and the steady hand on tasks. The Frozens&#x27; meticulous record-keeping and Flint&#x27;s steady hands on machines ensure these principles endure, no matter how many generations it takes. In our small Dallas home, every detail is preserved: the day book records both repairs and family events, while Ruby’s front room piano practice teaches the steady hands that keep a kind of certainty.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 61", "chapter": "Houses, Heirlooms, and Records", "html": "<p>The Flames record book is a heavy Bible, bound in boards that have been re-backed once. Its flyleaf and margins are ruled into columns by Jet Flames herself in 1949: born, married, died. Her hand fills the first fifty-two years, small, level, and exact. Slate&#x27;s hand follows, heavier; my mother&#x27;s after his, using a copperplate pen that comes back to us. And mine last, in the margins where I write smallest.<\/p>\n<p>This book is more than just a record of births, marriages, and deaths. It carries the weight of generations, each line contributing their own story. The Flames line’s constitution, written in three columns with precision and care, testifies to Jet’s meticulous nature—she brought this tradition from Holly Springs to Dallas, etching her vision into every page.<\/p>\n<p>Slate&#x27;s hand follows, reflecting a life lived through cold air. He kept his father’s standard: the plant does not go down on your watch. It passed to my mother, Ruby Flames, who continued her father’s legacy with steady hands and an unwavering commitment to record-keeping. My mother writes in copperplate too, just like Slate before her.<\/p>\n<p>In the margins of this book, I write smallest—my turn to record family events alongside the older lines. Each entry is a testament to our lives lived out here, not just records kept for history’s sake but also as a constant reminder of who we are and what we stand for. This book has seen the passage of time, bearing witness to births, marriages, deaths, and everything in between.<\/p>\n<p>When I open this book today, I find my father&#x27;s handwriting—steady hands on repairs recorded with care and precision. In his day book, he meticulously records jobs done, reflecting his own philosophy: a family keeps what can be preserved and fixes what needs it. The book is not just history; it’s our family’s daily practice and legacy.<\/p>\n<p>In the pages of this record book, we find continuity and tradition—sibling to sibling, generation after generation. It reminds us that no matter how far we travel or what new trades come along, these fundamental principles remain constant: careful hands on tasks and a commitment to keeping everything worth fixing and preserving.<\/p>"}, {"kind": "page", "label": "Page 62", "chapter": "Houses, Heirlooms, and Records", "html": "<p>The Frozens&#x27; records are day books: a shelf of ruled ledgers running from Flint&#x27;s first Dallas job in 1947 to my father&#x27;s entries this year, every job entered, described, and priced, every failure with its cause recorded. Where the Frozen Bible knows who we were, these day books know what we did on ten thousand ordinary days — more in bulk but less in meaning. My own session logs are the fourth generation of daybooks, kept on the same rule my great-grandfather kept: a thing not written down has not been learned, only survived.<\/p>\n<p>I remember the cold room where Jet Flames used to keep her family&#x27;s household books and photos. Each page held stories that were not just facts but also meant something in their context—how the trades passed from one generation to the next, like Flint’s machinery to Slate’s heating plant. The day book entries kept by my great-grandfather were a testament of careful hands on tasks.<\/p>\n<p>The day book beside me is where I keep all my job entries. Every repair, every customer, and every charge are recorded in my own handwriting. It&#x27;s my fourth generation of Frozens&#x27; records, inherited from the steady hands of Flint, Slate, Jasper, and finally, Onyx. Each entry reminds me to carry forward this tradition of meticulous record-keeping.<\/p>\n<p>On the shelf beside mine is a toolbox belonging to my great-grandfather Onyx Frozen. The metal tools inside reflect his patience for tasks and care in fixing things. It’s not just a physical object but also a reminder that every tool needs careful maintenance and use—just as each repair requires steady hands and thorough understanding.<\/p>\n<p>My father&#x27;s day book testifies to the same steady hands he learned from me, teaching them to my son. Every entry is a lesson on patience, care, and the importance of keeping everything we can fix or preserve. The Frozens&#x27; tradition lives in our Dallas home: records blend family events with repair jobs. Steady hands and careful record-keeping pass through generations, ensuring reliability despite changes.<\/p>\n<p>The Cold Room at my great-aunt Topaz’s house is another heirloom that carries the story of our lineage forward. It&#x27;s where she kept her piano lessons, inherited from her mother Jet’s meticulous household books. The photographs inside show the passage of time and family members passing on their trade to future generations.<\/p>\n<p>This tradition lives in<\/p>"}, {"kind": "page", "label": "Page 63", "chapter": "Houses, Heirlooms, and Records", "html": "<p>The iron-bound chest of Flint Frozen&#x27;s toolbox remains with me, a working object that three generations have reached into, and it testifies plainly: our family measures its continuity not through blood ties but through custody. As my father, Onyx, trusted Flint’s legacy to him, so I, his son, keep the box at home in Dallas.<\/p>\n<p>Some tools are stamped with Flint&#x27;s initials from his machinist&#x27;s punch, others bear Jasper&#x27;s name as he added them to the chest when it stood by his repair bench. One wrench is my father’s, a testament to his steady hands and careful repairs, passed on through the years of our lineage.<\/p>\n<p>This isn’t just a relic in a case; it’s alive, used daily for everything from fixing small household items to maintaining the family&#x27;s tools. It’s a tangible link between Flint and Onyx, between Onyx and me, embodying their trades and their commitment to meticulousness. When I reach into that chest, I touch not just tools but generations of steady hands, careful record-keeping, and steadfast work.<\/p>\n<p>The box carries a story like the day book in my mother’s hand: it passes through each generation with care, carrying forward our traditions of patience and precision. This family doesn’t measure continuity by blood; we measure it by who can keep something precious and trusted, like this chest that testifies to Flint Frozen&#x27;s iron legacy and Onyx Frozen&#x27;s steady hands.<\/p>\n<p>As I pass the day book from hand to hand, I remember these names: Jet Flames&#x27; meticulous household books, Slate and Garnet&#x27;s records in Holly Springs, Pearl and Jasper’s accounts of repair jobs. Each generation carries forward their values like a family heirloom—precise record-keeping and steadfast work ethic—to ensure our lineage remains intact.<\/p>\n<p>In this day book and the toolbox, I find the anchor that keeps us together: not blood ties but custody of these tools and records passed down through generations. This family’s continuity is measured by who can keep what matters most.<\/p>"}, {"kind": "page", "label": "Page 64", "chapter": "Houses, Heirlooms, and Records", "html": "<p>The object that carries the Flames line’s memory is the piano: a sturdy instrument, purchased used by Opal Reyes into her household before she was Opal Flames. It played for fifty years under her fingers, lessons and services woven through its polished keys. When my mother Ruby inherited it after Opal&#x27;s death, she kept it as if it were wrapped in sacred linen. The piano stood in my mother’s front room still, a silent witness to decades of practice.<\/p>\n<p>In the leanest times when money was short for us, Amber restated the rule that this line has always lived by: some things are not the accounts&#x27; business. My wife&#x27;s voice was strong and clear then, as if she had inherited something precious from her grandmother. The piano stood in my mother’s front room still, a silent witness to decades of practice.<\/p>\n<p>Now, it stands again in my mother’s front room, a testament to generations of music, hands that were steady and smooth, like Opal’s when she played for the children in our street. My sister teaches the street&#x27;s children on those very keys her grandmother wore smooth, keeping the line alive through Ruby’s careful hand and Amber’s voice.<\/p>\n<p>The piano is more than just an object; it testifies to a lineage of music that spans generations from Opal Reyes to my mother Ruby to Amber. It stands as a silent witness to the dedication and patience passed down through the ages, refusing every bill that ever threatened its place in the household. The piano’s presence anchors us all, holding fast to memories and traditions, ensuring our family history remains intact.<\/p>"}, {"kind": "page", "label": "Page 65", "chapter": "Houses, Heirlooms, and Records", "html": "<p>In the sequence of our houses—rented rooms near Dallas plants, Flint’s and Garnet’s small homes where they worked, my parents’ modest house that combined a workshop with their living space, and my own cozy abode two blocks from the studio—we traced a path through generations, each building marking its era&#x27;s economic story. Rent paid for years of hard work in those earlier houses; Flint and Garnet built their foundations out of decades of wages, ensuring stability even as their lives became more settled.<\/p>\n<p>The joining of our lines was marked by my parents&#x27; house—a true amalgamation of business and home life where we all found a rhythm together. My father&#x27;s steady hands on repairs complemented mother’s careful piano teaching from the front room; these were our daily anchors amidst our work, keeping everything in balance with household books.<\/p>\n<p>I carried forward this tradition with my own small house, nestled two streets away from the studio—a place that became an archive of memories and routines. Our house is where we preserved family events alongside repair jobs, ensuring each generation knew how to blend their lives within earshot of our work.<\/p>"}, {"kind": "page", "label": "Page 66", "chapter": "Houses, Heirlooms, and Records", "html": "<p>Frozen In Flames. Our paper memory—the records—are more than just books. They are letters from Topaz in Chicago, kept neatly labelled; my mother&#x27;s lesson books and choir lists; Coral’s meticulous accounts; and Amber’s photographs of our home. Every room is documented by her hand, capturing the family as it moves through spaces.<\/p>\n<p>In the first generations, women were the keepers of these records: Jet Flames&#x27; household books and piano lessons in a front room passed down to Ruby&#x27;s steady hands on her lesson books. Flint Frozen&#x27;s day book and his wife Pearl’s meticulous accounts were handed from one generation to another until they became family traditions—written by men but carried with steady hands.<\/p>\n<p>Now, it is my turn. Amber has photographed every room of our home in Chicago, preserving the family&#x27;s past through a visual index created by her own hand. She documents each space we&#x27;ve worked together in, and I am trained to keep this record, just as Ruby was taught piano lessons and Jet’s household books.<\/p>\n<p>These records are not just facts; they carry meaning. They tell us who our parents were, how they lived, and what traditions we have inherited. The letters from Topaz remind me of the early days when she left for Chicago, but also show my wife&#x27;s care in preserving memories that link us to her past. Her photographs keep our home as it was made by Amber’s steady hand.<\/p>\n<p>The tradition of record-keeping lives on through these hands—Ruby with her lesson books and Jet with her piano lessons; Flint and Pearl with their day book and accounts, each written by men but passed down in a woman&#x27;s careful hands. Now, I carry this forward, trained to keep the family story just as Amber keeps it vividly through her photographs.<\/p>"}, {"kind": "page", "label": "Page 67", "chapter": "Houses, Heirlooms, and Records", "html": "<p>The record of my own generation&#x27;s practices are inscribed in every session log from the Cold Room: a minute-by-minute account of who played, what broke, and what worked. This practice I learned from my studio master, as he passed it down to me with no knowledge of its lineage or its significance beyond that same doctrine that guided my father’s day book and my great-grandmother&#x27;s Bible.<\/p>\n<p>Like the Bible that keeps the people and the day books that keep the work, my archives preserve our labor. However, unlike those older records, mine is dedicated solely to keeping the work; it does not document the people or their love for one another. Yet, in this focus on the practicality of fixing, we ensure a future keeper will know what this family did: the repairs and the tasks at hand.<\/p>\n<p>The Bible remains the repository of our lineage’s people, and Amber&#x27;s prints hold her stories that are vital to understanding who we were as a family. My logs correct these other records, ensuring they each tell their part of the whole story. This is why we keep all three archives: they complement each other, and together they ensure the family&#x27;s legacy remains complete.<\/p>\n<p>Across generations, my father’s steady hands on repairs pass down through me to my children, carrying forward his meticulous day book and steady hands. Ruby taught piano lessons with discipline; Onyx passed on patient repair skills; I bring both traditions into our home, where we keep all three archives as the record of our family’s work.<\/p>"}, {"kind": "page", "label": "Page 68", "chapter": "Houses, Heirlooms, and Records", "html": "<p>Across generations, our archives tell a story that’s rich with details but also marked by gaps. Where we have lost pieces of history—specific and still felt—the pages of my mother Ruby Flames&#x27; Bible are honest in recording these missing parts. Flint&#x27;s wartime shop notebooks, which documented his founding skills as a repairman, were left with a Pittsburgh landlady in the haste of 1946. These valuable records, never recovered, mean that the Frozens&#x27; skillset is now preserved only from Dallas.<\/p>\n<p>Likewise, my father Onyx Frozen’s lineage carries a similar story: the Mississippi years before 1949 are telling yet undocumented. Jet Flames began her family Bible in Texas and entered memories of Mississippi by recollection alone—so these early days of the Flames line remain untold but recorded in her pages. And there was a box of Topaz&#x27;s letters from Chicago, water-damaged in an eighties basement; while we can see what is missing on the page, it has become part of our family story rather than an invention.<\/p>\n<p>The gaps in these archives are entered as they truly are: moments where the record cannot match the telling. A family that records its losses keeps them from becoming inventions. The Frozen line’s founding skills and the Flames line&#x27;s Mississippi years stand as memories passed down through generations, each a testament to our families&#x27; resilience and dedication.<\/p>\n<p>Here is Ruby&#x27;s Bible entry: *<em>Ruby Flames’ Family Bible Entry:<\/em>* ``` 1946 | Flint&#x27;s wartime shop notebooks left with Pittsburgh landlady in haste 1920-1948 | Jets&#x27; Mississippi years before 1949, recollected memories 1980s | Topaz&#x27;s Chicago letters water-damaged in eighties basement ```<\/p>\n<p>Each entry is a reminder of our family’s past, guiding us to remember the lessons learned from these lost records. Our homes and our daily routines serve as testament to these traditions—my father Onyx’s steady hands on repairs, my mother Ruby’s disciplined piano practice, and Opal&#x27;s family memories in her front room. These archives carry both the facts of what we’ve kept and the meaning behind why it is so important.<\/p>\n<p>As I grow up, I see how each generation carries forward these traditions—my father&#x27;s steady hands on repairs passed down through me to my children, while<\/p>"}, {"kind": "page", "label": "Page 69", "chapter": "Houses, Heirlooms, and Records", "html": "<p>The record and the telling disagree most famously about the river. The Flames line always said Garnet and Jet came down the river to Dallas; historical records, railway timetables, and a surviving ticket stub in Jet’s papers indicate they arrived by rail from Holly Springs, west and slightly south—no river involved. Our family lives with this difference as we do with most of our inheritances: the record is right about their journey, but the telling is right about the meaning.<\/p>\n<p>Arriving in Texas felt like a river had delivered them out of a shrinking town into a growing one, for to a Mississippi furnace man&#x27;s family, it was a sense of fresh beginnings and hope. I have entered both the fact and the meaning into our family Bible, labelled accordingly. It’s the book’s only footnote, and my entry is mine.<\/p>\n<p>I remember standing at the window with Jet on that day we drove out west from Holly Springs to Dallas. The landscape stretched vast before us—rolling hills of pine and farmland turning green under a summer sun. We were leaving behind the tight-knit community where we had lived for generations. It felt like we were embarking on a new journey, carried by our own hands, but also by an unseen force that pulled us forward.<\/p>\n<p>Looking back, it’s clear how deeply this sense of arrival by river resonated with Jet and Garnet, who both held onto the memory as if it was the key to their future. For them, the river represented not just physical movement, but a metaphor for our family&#x27;s history—a story of migration from one place to another, but also of growth and new beginnings.<\/p>\n<p>Today, as I walk through the front room where Jet taught piano lessons from her steady hands, these memories come alive again. The records show they came by rail, but the telling is right—arriving in Texas felt like a river had delivered them. This thread of our family’s history will continue to weave itself into future generations, carrying with it not just facts but the deeper meaning and emotions that shape who we are.<\/p>\n<p>The doctrine handed down through my mother Ruby&#x27;s careful hand mirrors this sense of arrival by river: “Our home is where we keep what we can fix and fix what we keep. A family keeps what it can fix and fixes what it keeps.” This philosophy, born out of Jet’s record-keeping and Slate’s meticulous care for<\/p>"}, {"kind": "page", "label": "Page 70", "chapter": "Houses, Heirlooms, and Records", "html": "<p>The family&#x27;s records and heirlooms are in my keeping now, and I was not chosen so much as fallen to: I am the one who writes things down, the keeper by habit, trained by a father with a day book and a mother with a Bible. The custody is understood in the family to be an office, not a possession -- the books are in my house the way the toolbox is in my house, in trust for my sister, for the Chicago young, and for keepers none of us will meet.<\/p>\n<p>The front room holds Jet&#x27;s meticulous household books, where she started keeping records. They carry the legacy from her father Flint’s steady hands on machinery to my mother Ruby’s careful piano practice and mine. My toolbox testifies to Onyx’s patient teaching. The piano itself is a testament to Jet’s record-keeping, now in Opal’s care, who teaches piano lessons with steady hands.<\/p>\n<p>The archive, like the family, survives by being distributed. Opal holds copies of everything essential, ensuring that records are accessible across branches and generations. But I am here, writing this down, carrying forward the tradition of meticulous record-keeping that started centuries ago in Holly Springs and now lives on through me and my sister.<\/p>\n<p>As we move into Chapter 10, where houses, heirlooms, and records intertwine, I leave you with a question for the next generation: how do we preserve these traditions when the archives are scattered across different lines? How will we continue to keep what can be fixed and fix what needs keeping, passing down this precious legacy of care and meticulous record-keeping?<\/p>\n<hr>"}, {"kind": "page", "label": "Page 71", "chapter": "Hard Years and Partings", "html": "<p>In 2018, my grandfather Jasper Frozen breathed his last breath at home, surrounded by familiar tools and with a day book open on his bench to an unfinished job. This was how he would have wished it—simple, practical, and full of his own work.<\/p>\n<p>The room where he died held the day book that had been his life’s map: notes for repairs, sketches for new projects, even a half-entered entry for a customer who came with their tools on this sad day. My father finished filling in the blanks left by my grandfather&#x27;s passing, honoring the man and what he valued most.<\/p>\n<p>At Jasper’s funeral, customers from three generations took to his church—men and women dressed in work clothes, as he had instructed. They brought memories of his steady hands and meticulous care for every job he undertook, a legacy that would carry on through them all.<\/p>\n<p>The day book was not just a record but a tool; it served me well in my own repairs, teaching patience and precision like Jasper&#x27;s hands taught mine. As I worked with tools today, each one reminded me of the man who instilled this love for his craft.<\/p>\n<p>My mother’s method of documenting family events continued: she entered my grandfather’s death into both her family Bible and our day book, creating a singular entry that captured everything about him—his final job, the community he touched, and the values he passed on. This joined us as a family, in grief but also in purpose.<\/p>\n<p>Today, I carry forward his legacy of carefulness and record-keeping. The room where we work is still filled with tools; it’s where each generation stands in history, not just names. My father&#x27;s steady hands teach me what my grandfather would have wanted—precision, respect for our tools, and a commitment to fixing the things that need it.<\/p>\n<p>As I look around at this place, I am reminded of Jasper’s final words: “A family keeps what it can fix, and fixes what it keeps.” He is gone now but his standard remains in my own work, a guide like his steady hands on repairs. We continue from here, with the day book as our anchor, to pass down this precious legacy of care and meticulous record-keeping.<\/p>"}, {"kind": "page", "label": "Page 72", "chapter": "Hard Years and Partings", "html": "<p>My grandfather Slate Flames died in 2016, two years before Jasper, of lung cancer that had consumed his body for fifty years. He was seventy when he left us, a man whose hands tested cold air and warmth with an equal measure of care. His death marked the end of a line’s living memory in Holly Springs: Slate was born there, a three-year-old immigrant in his own country, and with him, all the pasts passed into telling and record.<\/p>\n<p>In the small church where he played organ, my mother Ruby mourned her father&#x27;s loss, playing the same instrument she learned from her grandmother. She entered Slate’s death in the family Bible—a book that passed through her hands like a thread of history—using the hand taught to her by her own mother, who had been taught by her grandmother.<\/p>\n<p>Slate’s passing closed not just his memories but also our line&#x27;s connection to Holly Springs. He was the last person alive from there, and as he died, all that was tied to the past in Mississippi slipped away into history. The flames of Slate Flames burned brightly for a long time but eventually faded, leaving only stories and memory.<\/p>"}, {"kind": "page", "label": "Page 73", "chapter": "Hard Years and Partings", "html": "<p>The founding generations of our family line passed away as documented by the day book and household books. Flint first, in 1992, was marked with a job that Jasper left unfinished on his final day at work. Garnet followed in 1994, her name entered solemnly by Jet, who maintained the lineage’s record-keeping for a lifetime of seven decades before passing quietly into the matriarch&#x27;s hands.<\/p>\n<p>Pearl’s accounts ended mid-year, with her own hand completing her entries by Coral, the line’s matriarch. Pearl had always kept meticulous records that were passed to the next generation in an office she herself had ruled meticulously. Jet was last, the last of our founding fathers and mothers, whose death my mother entered carefully, a girl&#x27;s hand marking nothing but the columns he himself had drawn.<\/p>\n<p>After 2001, we lived on without anyone making either journey; the lines’ pasts passed into the records&#x27; keeping. The day books recorded all, from repairs to family events, while household books kept careful accounts of our daily lives and milestones. Each generation’s work was woven into the fabric of our home, with Flint&#x27;s machinery in Dallas reflecting his steadfast hands, Slate&#x27;s heating plants mirroring his steady energy, and Onyx’s bench teaching me patience for tasks.<\/p>\n<p>The legacy continued through the Frozens’ meticulous record-keeping and the Flameses&#x27; careful piano lessons. The day book became my anchor as I trained future generations, passing down traditions from Flint to Slate to myself. Each generation updated these records—my father’s steady hands in my day book complemented mine as I raised my own children in a home that preserved our family’s stories.<\/p>\n<p>Our house became a testament to this tradition: the Flameses&#x27; front room lessons, the Frozens’ meticulous record-keeping, and Onyx’s day book entries. The Cold Room kept performances ready forever, mirroring Ruby&#x27;s piano practice. As we moved through time and place, from Dallas to Chicago, our lineage persisted, carrying Flint’s meticulous record-keeping as we passed on steady hands for repairs.<\/p>\n<p>Today, Topaz joins our line in Chicago, carrying Flint’s legacy of meticulous record-keeping. Our home becomes a home for all Frozens and Flameses: the day books, the front room lessons, and the Cold Room keep us together. The traditions live on<\/p>"}, {"kind": "page", "label": "Page 74", "chapter": "Hard Years and Partings", "html": "<p>The disaster of my own generation was the fire of 2024: a fire in the building next to the Cold Room, and then in mine, which took the studio as first built – the room of my young ambition, two years of accumulated place. The log books were at the house. The standard was in the man.<\/p>\n<p>The joined family answered the way it answers. My sister did the arithmetic: we knew how much had burned, and what could be salvaged before anyone sentimentalized our ruin. Amber photographed the ruin first, to prevent tears from clouding reason. Topaz&#x27;s line sent money from Chicago with a note that said only &#x27;for the keeping,&#x27; understanding the family’s standard was not to sell out.<\/p>\n<p>I rebuilt the room over two years, slower and smaller, in the same thick icehouse walls, mirroring my father&#x27;s steadfastness and Ruby’s meticulous record-keeping. Some things understood can be mended. The fire is the doctrine’s hardest exam, a test of understanding and resilience. We passed it with the cost itemized – not just for money but for lessons: to rebuild slowly, to keep our ambitions within the walls we can control.<\/p>\n<p>The fire left us raw, teaching that some things cannot be rebuilt, only remembered as they were lost. But the doctrine remains intact: to mend what can be mended, and pass it on with care. The Cold Room was not a room of ambition but a space for memories – now more precious than ever. My sister’s arithmetic and Amber&#x27;s photography remind us that we must see the world clearly to rebuild correctly, and Topaz’s kindness shows how even loss can bring unity.<\/p>\n<p>The fire tested our family&#x27;s doctrine in hard exam conditions: to keep what could be mended, pass it on with care, and never forget those lessons. The room was rebuilt slower but smaller, a testament to our understanding of the costs – not just financial but emotional as well. The Cold Room is now our shared space, a reminder that loss can bring unity and new understanding, as long as we are steadfast in our principles.<\/p>"}, {"kind": "page", "label": "Page 75", "chapter": "Hard Years and Partings", "html": "<p>In 1969, Topaz left our house—a daughter of a respectable Dallas household—going north alone at eighteen years old. At the time, her departure was seen as a kind of family failure, a young woman leaving home without seeking support or guidance from those who loved and depended on her. My grandfather Jasper believed in keeping everything—no matter how far it might be—and he learned to keep his sister despite their six hundred miles apart, maintaining correspondence weekly for forty-nine years.<\/p>\n<p>What Topaz’s leaving cost both sides was presence. While she grew into independence, the branch that began with her departure remained a part of our family tree, a tangible proof that family traditions and teachings traveled across distance and time. The branches we had worked hard to cultivate and maintain were not just physical but also emotional. Presence may have been lost in space, but the doctrine lived on.<\/p>\n<p>At home, my father Onyx taught me steady hands on repairs from his day book, mirroring Flint&#x27;s meticulous record-keeping passed down through generations. My mother Ruby continued her father Jet’s careful piano practice and household books with discipline. We sat around our kitchen table where Topaz had been a child, now grown, each generation meeting in dialogue, habit, and appetite. Her absence shaped our family dynamics but also reinforced the importance of record-keeping, steady hands on tasks, and maintaining traditions across generations.<\/p>\n<p>Today, we gather as a family—Jasper’s proof that presence may be distant yet remembered. The Cold Room is our shared space, where Opal’s performances are ready forever, mirroring Ruby’s front room lessons. As I watch my sister topaz’s story unfold in Chicago, the tradition of carrying our heritage forward with care and never forgetting those lessons lives on. Each generation updates these records—my father&#x27;s steady hands in my day book complement mine as I train my own children in record-keeping. The Frozens&#x27; legacy of iron-bound chests and Flint’s toolbox remind us that constant maintenance and careful care for what we can fix ensures continuity across generations.<\/p>"}, {"kind": "page", "label": "Page 76", "chapter": "Hard Years and Partings", "html": "<p>The family’s standing estrangement is Zircon Flames, my grandfather Slate’s younger brother. In 1994, a dispute over Garnet’s estate—his home, tools, and small money—caused this rift that cut him out of visiting, writing, and recording his name after a certain year in the Bible. Both sides kept accounts by partisans, making it unclear which side had more merit. Zircon took his line away, refusing to write anymore. The family acknowledges this as an admitted defeat but leaves blanks for entries rather than tidy them.<\/p>\n<p>The gap left between our lines is palpable. His absence from visiting and letters means I never knew him or heard about my great-uncle’s life through the telling. Zircon took with him what he valued most—his connection to us, his place in our lineage, and what we recorded of him. He carried the tradition of a family keeping its records but chose not to write home.<\/p>\n<p>Zircon’s absence weighs heavily on the pages of the Flames Bible, where my mother Ruby continues her meticulous record-keeping, teaching piano from the front room. His line is there only as names without dates—a reminder of what was lost and how far apart our families have drifted. The coldness in his decision to not write anymore echoes through these records, a testament to his estrangement.<\/p>\n<p>Zircon’s story highlights the distance between us, each generation bridging different cities and trades. He left behind property, tools, and small money but took with him the connection to those things—the house, the bench, the instruments—reminding me that constant maintenance is necessary for what we can fix and pass on. Zircon’s choice not to write home reflects a broader understanding of family ties: sometimes, distance and choices lead us away from our roots, leaving gaps in our histories but ensuring continuity through other means.<\/p>"}, {"kind": "page", "label": "Page 77", "chapter": "Hard Years and Partings", "html": "<p>In 2020, my thinnest years came when I was twenty and working sessions in other people&#x27;s rooms and the rooms went quiet at once. What was short was work, specifically in the form of other people&#x27;s sessions. My father taught me this family’s old thing: fixing -- radios, guitars, a church organ&#x27;s blower, anything with a circuit or a bellows -- out of my father&#x27;s shop and then out of a corner that became mine.<\/p>\n<p>The money from these repairs capitalized the Cold Room two years later. My father had done precisely this in his own thin years. I recognized the maneuver only while performing it, which is how the family prefers to learn its doctrine.<\/p>\n<p>That year was tough for us all: the economy took a nose-dive, and with it, the stability of our small Dallas house. Rent rose, and my mother&#x27;s piano lessons became less frequent as she struggled to find new clients in a pandemic world. My father worked tirelessly at his bench, fixing everything from faulty appliances to old musical instruments.<\/p>\n<p>The family kept going by my sister Opal’s steady hands on repairs. Topaz Frozen married in Chicago, leaving our neighborhood for her own city and shifting the balance of power within the line. Her departure underscored how our families had moved from destinations to shared premises—Dallas became a home where we all sat to remember joining as a family.<\/p>\n<p>We lived off what I could repair and my sister’s steady hands on repairs. The Cold Room, which kept performances ready forever, was filled with memories of lessons learned and tasks accomplished by family members. Ruby&#x27;s careful piano practice mirrored Jet&#x27;s meticulous household books; Onyx&#x27;s day book entries complemented mine as I trained my own children in record-keeping.<\/p>\n<p>As the years passed, we continued to live off what we could fix and keep—our house became a testament not just to the past but to our shared future. The Frozens&#x27; legacy of iron-bound chests and Flint’s toolbox reminded us that constant maintenance was necessary for what we can still fix and pass on. Zircon&#x27;s choice not to write home reflected a broader understanding: sometimes, distance and choices leave gaps in our histories but ensure continuity through other means.<\/p>"}, {"kind": "page", "label": "Page 78", "chapter": "Hard Years and Partings", "html": "<p>The hard years tested the doctrine at its weakest word, which is &#x27;can&#x27;. A family keeps what it can fix -- but a fire could not be unburned, grandfathers could not be repaired, Zircon&#x27;s column could not be filled by wishing, and a doctrine that only works on objects would have died in those years. What the joined family learned, and what I now take the sentence to have always meant, is that keeping is not always restoring: sometimes it is entering the death in both books, keeping the piano in the family, keeping the room&#x27;s walls and rebuilding inside them.<\/p>\n<p>The doctrine bent towards custody, away from repair, and did not break. The bending is the development of my generation. As we navigate our own hard years, we must carry this knowledge forward: sometimes it is entering the death in both books; keeping the piano in the family means more than just playing it; keeping the room&#x27;s walls means more than just painting them.<\/p>\n<p>My father taught me patience with steady hands on repairs and the value of meticulous record-keeping. Ruby’s careful piano lessons mirrored Jet’s household books, teaching discipline from generation to generation. Our house became a testament to these traditions: records blend family events with repair jobs; steady hands pass through generations ensuring reliability despite changes; the day book remains my anchor guiding the next generation.<\/p>\n<p>Today, as I train my own children in record-keeping, I remind them that sometimes it is entering death in both books. The piano kept in our room’s walls reminds us of careful practice and legacy. These traditions continue not just to the past but to our shared future: constant maintenance ensures what can still be fixed and passed on. The Frozens&#x27; legacy of iron-bound chests and Flint&#x27;s toolbox remind us that care is necessary for what we can still fix, and distance and choices leave gaps in our histories but ensure continuity through other means.<\/p>\n<p>The doctrine bends with each generation’s hard years, carrying newer facts and shifted understanding into fresh wording. As Zircon chose not to write home, so too must we carry these losses and uncertainties forward. The family name of my mother&#x27;s line is Flames—a legacy that traced back generations from Mississippi to Texas and finally settled into Dallas where she was born. This name—Flames—is etched deep within our lineage, visible on the pages of her family Bible and carried proudly by each of us as we<\/p>"}, {"kind": "page", "label": "Page 79", "chapter": "Hard Years and Partings", "html": "<p>As I sit at Jet’s table, surrounded by her meticulous household books, I reflect on how the matriarch&#x27;s pattern has evolved through generations. In the Flames line, it was Jet who held the family’s hard years with steady hands on record-keeping until her passing in 1949. After that came Pearl, my mother’s grandmother and a steadfast accountant in the Frozen line.<\/p>\n<p>Coral took up the mantle of day book writing in the Frozens’, quietly keeping records alongside Jasper’s prime. Opal Flames carried this tradition to our generation, merging both families at her piano bench and family table, where she wrote down life&#x27;s moments with steady hands.<\/p>\n<p>In my lifetime, it falls to my mother and I—two women who have embraced the same task. We are both record-keepers now, just as Jet was. My father taught me the trade of patience and steady hands on repairs, passing them down through the day book from Flint’s meticulous ways to Slate’s careful toolmaking.<\/p>\n<p>I write in the margins like Coral did before her, preserving our family’s history with each entry. My mother continues the tradition she inherited, teaching me the art of record-keeping. We are both heirs to a pattern that has passed down from the matriarchs, who fed people and wrote things down without ever naming themselves as such.<\/p>\n<p>The matriarch&#x27;s office descends through generations, not just in names but in actions that carry on. As we feed the family’s history with each new entry, we maintain the tradition of Flint, Slate, and Onyx—of careful record-keeping, steady hands, and a commitment to preserving our past for future generations.<\/p>"}, {"kind": "page", "label": "Page 80", "chapter": "Hard Years and Partings", "html": "<p>Across our generations, the hard years have shaped us into this present family, but what remains is a testament to our resilience. We hold onto what we can keep with care: the Bible of Jet Flames, a family book that carries every birth and death, like her hand’s steady mark through fifty-two years; the day books, now annotated by each generation, detailing both tasks and life events—a reminder that Flint&#x27;s steady hands on machinery became Onyx&#x27;s meticulous repairs at home. The piano, a memento from Jet to Ruby Flames, remains in our front room, a constant echo of her teaching and my mother’s careful practice; the toolbox, now smaller inside its walls, holds each generation’s tools and secrets, stitched with care for what can still be fixed.<\/p>\n<p>The doctrine, which once held the line&#x27;s strict standards, has bent toward custody: our family’s commitment to caring for what we have and passing down. The records, annotated now with their own gaps—like a story told in fragments—testify to how we preserve, mend where possible, and enter honestly those parts that cannot be fully fixed.<\/p>\n<p>This is the truth of survival, not an easy or perfect one. We claim nothing as intact but what our hands have kept. The hard years have taught us this: to keep what can still be mended and passed on, even when it means acknowledging the gaps that time has left behind. Our family&#x27;s legacy—like a toolbox stitched with care—continues through each generation, a reminder of Flint’s steady hands and Onyx’s patient repair work.<\/p>\n<p>In the next chapter, my sister Opal will carry our piano lessons in Chicago as we shift from Dallas into new hands and stories. The Frozens’ commitment to meticulous record-keeping ensures that no matter where we go or what changes come, these traditions will remain a constant anchor for future generations.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 81", "chapter": "Reunions and the Living Family", "html": "<p>In 2023, Amber Flames joined our lineage, setting about the long work of joining the archives. My wife, born Amber Verano, arrived as a photographer hired to photograph a session at the Cold Room and married me that year. Her prints hang in every room I&#x27;ve worked since, and she takes on the role of Keeper of Visual Memory—like her mother Ruby, who taught piano lessons from our front room and kept meticulous household books.<\/p>\n<p>Amber’s presence brings another family’s whole inheritance into our house. She carries the Frozens’ commitment to meticulous record-keeping as part of our tradition. The day book reflects both repair jobs and family events, just like Flint&#x27;s did in Pittsburgh or Slate’s in Dallas. Amber continues these traditions in her own way—making photographs that preserve memories and keeping her own records with a steady hand.<\/p>\n<p>Amber is one of the two present heads in our lineage, not an addition. She keeps visual memory while I keep record-keeping. Our house becomes a testament to these traditions: her prints hanging in every room I work in since, mine on my day book. The Cold Room holds performances ready forever, mirroring her front room lessons.<\/p>\n<p>Today, Amber and I sit at the kitchen table as our family meets—my father Onyx, mother Ruby, sister Opal teaching piano from her mother’s lessons, and great-aunt Topaz who joined us in Chicago in 1969. We carry Flint’s steady hands on machinery into Dallas through my father&#x27;s day book entries. As Topaz leaves again, we mourn her father’s passing surrounded by tools and unfinished work.<\/p>\n<p>In our house, the Frozens’ commitment to meticulous record-keeping ensures that no matter where we go or what changes come, these traditions will remain a constant anchor for future generations. The Cold Room keeps performances ready forever, mirroring Ruby&#x27;s front room lessons. Each generation updates these records—my father’s steady hands in my day book complement mine as I train my own children in record-keeping and patient repair practices.<\/p>"}, {"kind": "page", "label": "Page 82", "chapter": "Reunions and the Living Family", "html": "<p>In 1975, Amber&#x27;s family settled in Chicago, where her father Agate painted signs on storefronts across a street he called home. Each lettering was meticulously crafted by his hand, as Beryl taught him to see detail and beauty in the world. Her parents brought these skills with them from Mexico, passing down their eye for light and images.<\/p>\n<p>Back at home, Amber&#x27;s family kept entries and logs just as her mother Ruby did in Dallas: a meticulous record of daily tasks, memories, and lessons. Agate passed on his steady hands to Amber, teaching her to document the world around us not only with words but also through the lens of a camera or brush.<\/p>\n<p>When they moved back to Texas in 2018, this tradition continued at home, where Amber documented her childhood photos as her mother had done before her. The two lines rejoined in Dallas, and their methods merged: Ruby&#x27;s careful hand on books and Agate&#x27;s steady eye for light combined seamlessly.<\/p>\n<p>This reunion brought the Veranos&#x27; family doctrine back to life — a reminder that despite distance and change, our roots remain firmly planted. The Cold Room in my house became a shared space where both lines kept memories ready forever. Each generation updated these records—my father’s careful day book entries complemented mine as I trained my own children in record-keeping and patient repair practices.<\/p>\n<p>As we blend into Frozen In Flames, the Frozens&#x27; meticulous record-keeping and steady hands on repairs join with Amber&#x27;s eye for light and images. The tradition lives on through written accounts, visual archives, and tools passed down from generation to generation.<\/p>"}, {"kind": "page", "label": "Page 83", "chapter": "Reunions and the Living Family", "html": "<p>In Dallas, my sister Opal stands at her family piano, teaching children from the street and singing with the city&#x27;s session musicians. Her steady hands and disciplined practice mirror Ruby’s meticulous day book entries. Across town, Topaz Whitfield carries her great-grandmother’s name as Jasper&#x27;s daughter in Chicago, keeper of the record branch reports.<\/p>\n<p>Beside them stand cousins by marriage and Jade&#x27;s children in Fort Worth. Fewer now than we were, yet the family does not hide its numbers from itself. Each line continues to grow, narrower but strong in good hands. Here in Dallas, my sister Opal is the keeper of the fire tradition: she plays with grace and joy, teaching piano with steady hands.<\/p>\n<p>Topaz&#x27;s arrival marks a shift that reminds us of Flint’s meticulous record-keeping handed down through generations—careful hands on repairs passed from father to son. The Frozens&#x27; careful record-keeping continues in my day book, complementing Opal&#x27;s family traditions. We blend into Frozen In Flames, carrying both iron and fire, steady hands on tasks and patience for the work at hand.<\/p>\n<p>Today, I see our world through her eyes: a bustling city where piano lessons meet street life, Chicago sessions echo with Topaz’s presence, and Fort Worth children listen to Jade’s teachings. The tradition lives in every room, each page of family records, and each steady hand on tasks. We carry these values forward, keeping what can be preserved and fixing what needs it—Ruby&#x27;s disciplined piano practice, Onyx’s patient repair work, Topaz’s meticulous record-keeping.<\/p>\n<p>As we sit at the kitchen table, Opal sings a song from her sessions, and I write down my notes in my day book. My sister stands strong, teaching with joy and precision; Jade’s children listen eagerly to lessons from Fort Worth. Together, we uphold these family traditions of steady hands and careful record-keeping. The Frozens&#x27; meticulous record-keeping joins with Amber&#x27;s eye for light and images, ensuring the tradition lives on through written accounts, visual archives, and tools passed down across generations.<\/p>"}, {"kind": "page", "label": "Page 84", "chapter": "Reunions and the Living Family", "html": "<p>The gathering at my parents&#x27; house, where Christmas comes every year, is more than just an event. It&#x27;s a gravitational pull that gathers us all in one room to be counted by eye. The young are served first, and the old have their say before we settle down for our meal. The piano plays itself whether anyone schedules it or not. And lately, Opal has taken on the role of reading aloud from her copy of the Bible, which is our family&#x27;s liturgy, taking four minutes as a ritual that links past generations to present ones.<\/p>\n<p>My father made this board specifically for these reunions, extending the table with its polished surface and inviting us all. We sit where we always have—my mother on one side, my sister at the head of the table, me in between them, and my younger siblings spread out across the length of it. The weather outside influences our mood—a clear blue sky for a picnic or a brisk winter wind that signals a train journey.<\/p>\n<p>In this space, I find myself recalling the generations before us: Ruby teaching piano lessons from her front room, Slate&#x27;s records in Texas, and Onyx’s steady hands on repairs. The family Bible contains their entries, births, marriages, and deaths, woven together with threads of care and record-keeping that bind us all.<\/p>\n<p>As we gather for this reunion, I can see the weight of our history resting upon my shoulders. We are not just a collection of names but a living tapestry of traditions handed down through generations. This page stands as testament to our collective memory, where each generation&#x27;s world is whole and complete—its work, its house, its weather, and the public events that pressed on it.<\/p>\n<p>We come together now in this room, united by time, shared history, and a common desire for continuity—a place where every family member fits into a larger picture, reflecting the rich inheritance we carry from our parents to ourselves.<\/p>"}, {"kind": "page", "label": "Page 85", "chapter": "Reunions and the Living Family", "html": "<p>In Chicago, our branch line&#x27;s home still stands today, well-maintained despite its distance from us in Dallas. Years of visiting both directions most every year have kept that fact clear: we continue to call each other by name, and even with newer machines, we keep up the tradition of regular communication.<\/p>\n<p>Jasper’s telephone habits continued through Topaz&#x27;s grandchildren—those calls were a lifeline for keeping connections strong. Obligations are never forgotten; when our Chicago branch had its own hard year, it reached out to us in Dallas to answer the call. We did not even mention this as a debt, sending something of value instead.<\/p>\n<p>The family has learned that distance is just a condition and not a verdict. The true test lies in how we keep relationships alive—how often we visit, whether our calls are frequent or occasional, and if we send help during tough times. This exchange, kept without ever calling it a debt, shows mutual care and respect.<\/p>\n<p>As the generations pass, this lesson remains. Today, my sister Opal lives in Chicago and keeps her mother&#x27;s piano teaching steady hands across the city—teaching lessons that carry on the tradition of careful record-keeping from Jet Flames. My great-aunt Topaz’s life story mirrors her resilience, teaching through photographs how families honor their pasts despite physical distances.<\/p>\n<p>We see that mutual keeping is what matters most: when our Chicago branch needed help and we sent something valuable instead—whether it be money or resources—it showed the family line&#x27;s continuity. The record of these actions speaks for itself; but more than just facts, they also tell a story—a story of families bound by care and tradition, no matter how far apart they are.<\/p>\n<p>As I look around my home in Dallas today, the Cold Room holds performances ready forever—memories from our family line that keep us together. The Frozens&#x27; custom to not discard anything goes on, ensuring the day book&#x27;s completeness is a Frozen habit but its thoroughness is a shared responsibili
