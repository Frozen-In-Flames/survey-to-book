n be fixed and practice with no strings attached. My father taught me patience at our kitchen table, combining Flint’s shop bench with Ruby’s lessons.<\/p>\n<p>We sit here now, the younger generation arguing over old subjects in present forms. Whether to pass the Cold Room to my engineers or keep it in the blood, which is the doctrine against the standard, round forty-one. Whether Opal’s students should be charged real money, which is the front room against the rent. Whether the Chicago young are Dallas family or Chicago family, which was still warm back then.<\/p>\n<p>These arguments circle around the inheritance—what passes to future generations and what stays tied to past memories. We have never agreed on who gets what; instead, we only ever agree to keep arguing inside our house. My wife Amber sits by my side, watching over me as I trace each entry again. The argument against the rent is still strong, her gaze fixed on these lines.<\/p>\n<p>The Cold Room debate continues: should it stay in the front room of goodwill? Opal’s students’ fees are a hot topic too—rent versus real money. Chicago young ties us to an old family custom that never changed, forty-nine years later. These arguments remind me of the fault lines still open within our lineage.<\/p>\n<p>The living family keeps these discussions alive here on the kitchen table. The record shows my mother’s meticulous entries and her father’s daybook; the telling holds them together in a shared narrative. Each generation adds its own story to this ongoing argument, a vital part of keeping both families’ names close—Flames for Ruby and Frozen for Onyx.<\/p>"}, {"kind": "page", "label": "Page 90", "chapter": "Reunions and the Living Family", "html": "<p>The joined family as it stands now, in one honest assessment: smaller in number, wider in the world, poorer in nothing but our resolve to keep these names alive. It is kept -- that is the verdict, in the family&#x27;s own verb. Not preserved, not embalmed: kept, the way a room is kept ready and a book is kept current, by work, in the present tense, by people who expect to hand it on. What we hand on is the subject of the last chapter, and it is shorter than the chapters of getting, because keeping turns out to be a brief art.<\/p>\n<p>Ruby&#x27;s meticulous records and Onyx&#x27;s careful daybooks stand testament to our lineage&#x27;s commitment. We are three generations strong, with roots tracing back to Mississippi and Pittsburgh. The doctrine we hold close remains unchanged: keep what can be fixed and practice without strings attached. My father taught me patience at the shop bench just as my mother taught music by hand.<\/p>\n<p>In 2016, Slate Flames closed our line&#x27;s memory of Holly Springs; in 1998, Flint Frozen passed through Dallas to Chicago. Our lineage continues strong with topaz Frozens and zircon Flamers who left without correspondence for decades. Each page of the family Bible holds a story: Jet&#x27;s care, Slate&#x27;s steadiness, and Ruby&#x27;s attention. The book testifies to each generation’s careful record-keeping.<\/p>\n<p>Onyx&#x27;s meticulous repairs became part of our household economy; my mother Ruby played the church organ and taught piano lessons with meticulous detail until her passing. I learned from both sides’ traditions at our kitchen table—patience, discipline, and care. My father taught me this trade, and Onyx kept his daybooks through decades.<\/p>\n<p>In 2018, my grandfather Jasper Frozen passed away, leaving behind his tools and the simple life defined by meticulous work ethic. The first generation’s legacy was carried on by Onyx Frozen, who inherited his father&#x27;s shop and tools. My mother Ruby kept records meticulously until Jet&#x27;s death, passing the tradition to her daughter Coral.<\/p>\n<p>Topaz Flames left Holly Springs in 1969, severing ties with no record of correspondence from either side for forty-nine years. Zircon followed a few generations later without trace. The doctrine remains strong: keep what can be fixed and practice with no strings attached. My generation faced<\/p>\n<hr>"}, {"kind": "page", "label": "Page 91", "chapter": "What Was Passed Down", "html": "<p>The doctrine, handed on, is this: a family keeps what it can fix, and fixes what it keeps. At its core, it meant machines like Flint&#x27;s plants and Jasper&#x27;s tools, preserving broken things until they could be understood again. In my father&#x27;s hands, it became work and record-keeping; in my mother&#x27;s, attention to people, keeping them close or letting them go based on care. For me, rooms and songs were kept, the ashes taught by fire; for my young, it means knowing the difference.<\/p>\n<p>The doctrine has evolved with each generation. Flint’s meticulous repair shop in Pittsburgh became Jasper’s careful daybook in Dallas. Ruby Flames&#x27; piano lessons and Slate&#x27;s steady handwriting preserved traditions from Mississippi to Texas. In my father Onyx Frozen&#x27;s hands, it was not just a record-keeping method but also the bench where he taught patience and discipline. For Amber, the camera lens added another tool to keep our stories.<\/p>\n<p>The doctrine asks of each generation: arrive with your tools, listen before you touch, write down what you found, and leave the thing better documented than when you found it. Each family line has embraced this, carrying their traditions through generations—Flames in meticulous piano lessons, Frozens under harsh Pittsburgh conditions, and now my own blend of Ruby’s careful entries and Onyx&#x27;s daybook. The doctrine remains: keep what can be fixed and practice with no strings attached.<\/p>\n<p>As Amber joins us today, she photographs each room, keeping the lines together through artistry as well as words. Topaz Frozens left Holly Springs decades ago without correspondence, a chapter severed but never forgotten. Zircon followed later without trace. Each generation carries on—Ruby teaching piano to Dallas street children, Opal teaching music half the street’s kids. The doctrine returns with every page: keep what can be fixed and practice with no strings attached.<\/p>"}, {"kind": "page", "label": "Page 92", "chapter": "What Was Passed Down", "html": "<p>In my own keeping are the Bible, Flint’s toolbox, the day books, and the session logs of my own years—this family’s written self in four kinds of record. Already passed on: the piano’s future, designated to Opal while it still stands in our mother&#x27;s front room, so the transfer will be a visit and not a probate; Jasper’s measuring tools, given to Chicago, before me and not by me; copies of these records, to both Opal and Chicago, against fire and other archivists who forgetfulness.<\/p>\n<p>A keeper holds everything for one lifetime only. The family&#x27;s rule is learned from its losses: to distribute the keeping while the keeper can still explain the columns. Ruby’s careful entries in the Bible testify to Jet Flames&#x27; meticulous record-keeping over fifty-two years. Onyx’s daybooks mark each repair he meticulously made, translating his father’s standards into electronic work.<\/p>\n<p>The toolbox on Flint’s bench echoes his patient work ethic and attention to detail—measured tools passed down to Chicago. The session logs of my own years continue this lineage, capturing both sides’ traditions: Ruby&#x27;s careful piano lessons and Onyx’s meticulous shop practices. Each entry preserves the family’s commitment to patience and discipline.<\/p>\n<p>This page testifies to our lineage’s resilience, showing how each generation carries forward its tradition—Ruby teaching piano to Dallas street children, Opal teaching music half the street’s kids; Topaz Frozens leaving Holly Springs decades ago without correspondence, Zircon following later. The Bible, the toolbox, the daybooks, and my session logs all hold these stories, testifying that neither line lost its identity. Ruby&#x27;s careful entries preserve her family&#x27;s legacy, while Onyx’s meticulous repairs define our work ethic.<\/p>\n<p>The doctrine remains: keep what can be fixed and practice with no strings attached—each generation carrying on Flint’s Pittsburgh tradition and Slate’s Mississippi steadiness. In my mother Ruby’s hand, the Bible holds both sides’ traditions, ensuring neither line lost its identity. The family’s rule is to distribute keeping while the keeper can still explain the columns. As I hold these records now, they remind us that each page carries the weight of our lineage, and we must carry on with care and patience for generations yet to come.<\/p>"}, {"kind": "page", "label": "Page 93", "chapter": "What Was Passed Down", "html": "<p>The kitchen table is central to our gatherings, where Ruby’s careful entries and Onyx’s meticulous daybooks intertwine. As I hold these records now, they remind us that each page carries the weight of our lineage, ensuring neither line lost its identity. The family’s rule is to distribute keeping while the keeper can still explain the columns.<\/p>\n<p>On my father’s side, it was the bench standard passed from Onyx to me and then on to every kid who hung around his counter and mine, getting handed the next heavier thing. It demanded patience and discipline, teaching me how to approach tasks with care. The tradition of fixing what we keep remains strong in our house.<\/p>\n<p>On my mother’s side, it was Ruby’s careful entries in her family Bible passed down through generations of Flamers. She kept meticulous records from Jet’s passing until Coral’s day when she taught piano lessons half the street’s children. Her careful hand ensured that no entry was lost and handed on to the next generation.<\/p>\n<p>My sister Opal inherited this tradition, teaching piano with care, and now Amber teaches photography, integrating her artistry into our history. Each room she photographs teaches patience and discipline through lens and brush. As my wife, Amber brings new light to our family story, bringing in a fresh understanding that carries on the older facts.<\/p>\n<p>Both traditions of keeping what can be fixed and fixing what we keep remain strong. Flint’s meticulous work ethic defines our Pittsburgh line, while Slate’s steadiness upholds the Mississippi tradition. Ruby’s careful entries preserve her family’s legacy, as did Onyx’s daybooks with his repairs.<\/p>\n<p>The doctrine remains: carry the newer facts and shifted understanding in fresh wording that means something new. Each room we photograph through Amber’s artistry reminds us of our lineage and ensures it continues. The kitchen table remains central to our gatherings, where both traditions intertwine, teaching patience and discipline from generation to generation.<\/p>"}, {"kind": "page", "label": "Page 94", "chapter": "What Was Passed Down", "html": "<p>The names carried by the living young are Jasper and Topaz in Chicago, in their second bearers and doing well; Opal in Dallas, in hers; Jet, in my uncle, holding the matriarch&#x27;s name in the male line; and the two family names themselves, Frozen and Flames, on both branches, on a shop door and a studio door, and joined entire in my own. What I hope the names will do for their bearers is what names in this family have always done: give them a standard to argue with. However, as we move through generations, it&#x27;s clear that a name might be mistaken for the thing it names -- that a young Frozen or Flames might think the keeping is in the blood. It isn&#x27;t. The columns are work.<\/p>\n<p>In Chicago, Jasper and Topaz, my second-born children, carry the Frozen line forward with their own distinct path. Their lives are marked by resilience, creativity, and an unwavering commitment to fixing what needs repair. They teach patience, discipline, and care in every room they inhabit, each one a testament to our family’s enduring traditions.<\/p>\n<p>Back in Dallas, Opal continues the Flames lineage, her hands steady as she plays piano lessons for a new generation of children. Her meticulous approach mirrors my mother Ruby’s careful record-keeping and ensures the flame of our tradition burns bright. In both lines, the work is what keeps us strong — not just the name itself.<\/p>\n<p>In my own case, holding Jet&#x27;s legacy in the male line, I find myself navigating a world where technology and change blur old boundaries. Yet, at the heart of it all lies the same standard: to keep what we can fix and to fix what remains within our grasp. This is how each generation has carried on, through work and practice.<\/p>\n<p>As we gather around the kitchen table, Amber&#x27;s artistry brings a new dimension to our family history narrative. Each photograph she captures adds depth and perspective, reminding us that the tradition of keeping and fixing extends beyond words into the visual language of life. Through her lens, we see not just the past but the living fabric of our lineage.<\/p>\n<p>The refrain carries on changed: carry the newer facts and the shifted understanding in fresh wording that means something new. Each generation asks its own questions about what it holds true and how it will pass it down. The kitchen table remains central, where both<\/p>"}, {"kind": "page", "label": "Page 95", "chapter": "What Was Passed Down", "html": "<p>In the kitchen at home, I turn the pages of my mother Ruby&#x27;s family Bible with care. The copperplate script is still hers, never erasing a name or entry once made. Zircon&#x27;s birth is listed as 1950 on the certificate, and 1951 in Jet&#x27;s hand — her memory was foggy then, perhaps a year late from his last count of life’s tally. But I have the record: the certificate says 1951. The winter they counted meant nothing to me at first; it was a metaphor that faded with time and my own birth.<\/p>\n<p>The Frozen line&#x27;s arrival in Dallas is marked in Flint&#x27;s discharge papers, dated 1946 — he came before her husband did. His papers are kept, labelled, as if every name counted, each move counted. The day book in the Flames line begins its pages in 1947; my grandfather Slate kept the record of our arrival and his father’s too.<\/p>\n<p>And there is a river in the Flames story — a metaphor we agreed to keep. It&#x27;s not a literal place, but it&#x27;s labelled as one, in the footnote that I wrote to hold onto this thread that runs through our lineage like veins.<\/p>\n<p>The books in this family are kept open, and used. A toolbox from Onyx Frozen&#x27;s days still sits at his bench; each tool held there is a story of workmanship and patience passed down. The piano my mother Ruby played was the heartbeat of her teaching; her careful entries marked every note she taught to half the street’s children.<\/p>\n<p>Records that cannot be changed are monuments, books like rooms where we keep our lives in use. Zircon&#x27;s birth certificate dates his year late by memory. Flint&#x27;s discharge papers show he reached Dallas in 1946. The river is a metaphor the family agreed to keep as a thread in our lineage’s story.<\/p>\n<p>The kitchen table remains central — each generation asks its own questions about what it holds true and how it will pass it down. The Bible entry, the certificate, or the letter agrees with what the telling tells; where they differ, both are visible. Each page testifies to the people who kept them, not just a record but the story of their lives lived together.<\/p>"}, {"kind": "page", "label": "Page 96", "chapter": "What Was Passed Down", "html": "<p>The family&#x27;s unfinished business is the blank column: Zircon Flames&#x27;s descendants, my mother&#x27;s cousins, whose entries stop in 1994 where the quarrel stopped them. Somewhere there are people whose births, marriages, and deaths belong in the Bible and are not in it, and the space for them is kept, ruled and empty, against the day the family is whole or a keeper braver than I goes and asks.<\/p>\n<p>Beside it, smaller: the Chicago branch&#x27;s own entries, kept in their copy there, not yet merged into ours. Beside all this, my own album of songs sits on its shelf like an entry I owe the record and have not made. Each page holds a story, each song carries a memory, but they are separate from what we keep in our family Bible.<\/p>\n<p>The Chicago branch&#x27;s history is distant now, their stories kept for another day. Their line’s entries join ours in this space, waiting for us to see them as clearly as I see the gap between my birth and the last page of their history. We can’t forget that they were here, we just have not yet marked their place.<\/p>\n<p>My own album of songs is a testament to how our family holds onto its traditions: keeping what we can fix, and fixing what we keep. My grandmother Ruby&#x27;s careful entries in the Bible and my father Onyx’s meticulous daybooks are still part of who I am. Each page tells a story about the people who kept them and passed them down through me.<\/p>\n<p>I have inherited both lines, each with its own trade: Ruby’s piano teaching from my mother and Onyx’s repair bench work from my father. Our kitchen table is where these traditions intertwine, with Amber joining us in 2023 as she photographs our rooms, bringing her artistry into the family history narrative.<\/p>\n<p>Yet, just like the Chicago branch&#x27;s stories, there are still families whose entries remain unmarked. Their births, marriages, and deaths belong in the family’s record but have not yet been written down. The space for them is ruled and empty, waiting for a keeper braver than I to go and ask.<\/p>\n<p>I know that this unfinished column of Zircon Flames&#x27;s descendants will one day be filled. It is my duty as their heir to see to it that no generation loses its place or identity in our family record. My task is<\/p>"}, {"kind": "page", "label": "Page 97", "chapter": "What Was Passed Down", "html": "<p>The space for us is ruled and empty, waiting for a keeper braver than I to go and ask. The founding myth said we were sent for when a thing stops. Yet the records tell us differently: we wrote it down. Cities forget whom they send for; books remember.<\/p>\n<p>As Slate Flames looked into Ruby&#x27;s Bible, he saw that the foundation myth held true through the first two generations but had lost its relevance by the third. The joined family’s posture had changed—widening from sent for to record-keepers of a thing whose definition grew with each passing year. What once defined them as senters now bound them in their meticulous record-keeping, ensuring no detail was left behind.<\/p>\n<p>The doctrine of Slate Flames echoed through our halls: keep what can be fixed and fix what keeps you close. In the first generation, Flint Frozen’s meticulous records marked repairs and progress; in Slate&#x27;s hands, they became a testament to patience and care passed down from his father and grandfather. Onyx’s day book reflected their dedication to service, while Ruby’s family Bible held lessons for both sides.<\/p>\n<p>The record of these generations told a story not just of physical repairs but of the families’ commitment to each other. The joined family&#x27;s posture had evolved, yet the core remained: keep what can be fixed and practice with no strings attached. Each line—Flames in piano teaching and Frozens through meticulous repair work—ensured no identity was lost.<\/p>\n<p>Ruby’s careful entries kept both lines alive, and Onyx’s day book marked each task patiently. The doctrine of three generations joined through Flint&#x27;s Pittsburgh and Garnet&#x27;s Mississippi remained strong: keep what can be fixed and practice with no strings attached. As we gather at the kitchen table today, Amber&#x27;s photography brings us together.<\/p>\n<p>Our house, like our records, combines both lines&#x27; traditions—piano lessons and repair work. Each generation carries on a tradition that defines them yet binds them in history. The book Ruby kept is not just a family Bible but the constitution of our three generations: Flint, Slate, and Onyx. The doctrine holds true through time, ensuring no line loses its identity.<\/p>\n<p>The founding myth was a beacon for the first two generations; now it&#x27;s a test for us. We must look back to ensure the past informs the present and future. Ruby’s careful entries ensured her family’s legacy, and Onyx’s<\/p>"}, {"kind": "page", "label": "Page 98", "chapter": "What Was Passed Down", "html": "<p>At our kitchen table, we gather to share stories and dreams. The Bible&#x27;s back flyleaf, with Jet Flames&#x27; copperplate script still legible, lies open where she wrote it decades ago. I hold a pen in my hand as if it were a tool from another age, like my father Onyx’s daybook.<\/p>\n<p>Our family&#x27;s advice is simple yet essential: learn a trade that can be sent for; keep a book and write in it the day things happen; never sell the piano; feed whoever is at the table; marry someone who keeps their own records; understand something before you mourn or replace it. These words fit neatly on one page, a testament to our values.<\/p>\n<p>Jet wrote these instructions after watching her mother Ruby&#x27;s careful hands fill pages with births, marriages, and deaths. She learned from Jet that everything matters, no detail is too small for the family’s memory. Onyx taught me patience by marking each repair he completed meticulously in his daybook. My mother&#x27;s piano lessons combined with Onyx’s records ensured both sides’ traditions continued.<\/p>\n<p>Each generation carries these teachings to new places. Ruby brought them to Dallas and settled our home, teaching us to write down everything we do. Onyx passed his meticulous bench work onto me, passing on the tradition of fixing what needs repair. I learned patience and discipline at this table, just as my father did from him.<\/p>\n<p>When a thing breaks, I understand it before mourning or replacing it. This wisdom is not only for repairs but also for life&#x27;s challenges. Our family’s history travels well because it is short—everything has been paid for, no detail forgotten.<\/p>\n<p>As we sit here today, sharing stories and dreams, the kitchen table remains central. It was here that Jet first wrote these instructions. Here Onyx taught me to mark each job in his daybook with care. This page holds not just words but a lesson learned from our ancestors: keep what can be fixed and practice with no strings attached.<\/p>\n<p>We sit at this table as Flint did in Pittsburgh, Slate did in Mississippi, and now I am here in Texas. The doctrine of three generations joined through Flint&#x27;s Pittsburgh and Garnet’s Mississippi remains strong—topaz Frozens&#x27; line to Chicago, Zircon Flames&#x27; to Mississippi, and my own from Dallas. Each generation carries on these teachings, ensuring no side loses its identity.<\/p>\n<p>The kitchen table is<\/p>"}, {"kind": "page", "label": "Page 99", "chapter": "What Was Passed Down", "html": "<p>The next entry I want written in the family&#x27;s records is not a birth or a death, though the books will take those in their turn. It is the entry for the day the keeping itself changes hands whole — Bible, day books, toolbox, logs — from my keeping to my sister Opal&#x27;s or to Chicago’s keeper&#x27;s, in a front room, with the piano played and the columns explained and the transfer entered, as an event of the family like any other. Keepers in this family have too often received the office at a funeral. I should like the books to record one handover that happened at a table, in daylight, with everybody fed.<\/p>\n<p>The kitchen table remains central, where Ruby&#x27;s careful entries intertwine with Onyx’s meticulous daybooks. Today, it marks not just the transfer of hands but also the inheritance passing from one generation to another — my sister Opal taking on her father’s bench and my wife Amber photographing our rooms, bringing a new medium into our family history narrative.<\/p>\n<p>As I look at my mother Ruby&#x27;s Bible, she is still the matriarch, her careful hand writing down births, marriages, and deaths. Her tradition of meticulous record-keeping ensures no line loses its identity, whether it’s Flint’s shop in Pittsburgh or Garnet’s millwrighting in Mississippi. In 2018, my grandfather Jasper passed away at home with his tools by his side, marking the end of a simple life defined by his work ethic.<\/p>\n<p>In 2016, Flint arrived in Dallas from Pittsburgh, beginning a new chapter with meticulous repair work. Onyx inherited his father’s shop and transformed it into a testament to patience and precision, marked meticulously through decades in his daybook. My mother Ruby kept records until Jet&#x27;s death; passing the tradition to her daughter Coral.<\/p>\n<p>The kitchen table continues to hold our histories — Opal teaching piano half the street&#x27;s children as we moved near the bustling plants, my father Onyx repairing dead guitars at his Dallas shop bench, and I photographing rooms with Amber joining us. Each generation carries on: Ruby’s careful entries, Flint’s meticulous repair work, Slate’s steadiness, Onyx’s daybooks, Opal’s piano lessons, and now Amber&#x27;s artistry.<\/p>\n<p>The doctrine of three generations joined through Flint in Pittsburgh and Garnet in Mississippi remains strong; topaz Frozens<\/p>"}, {"kind": "page", "label": "Page 100", "chapter": "What Was Passed Down", "html": "<p>The single fact about our family that should outlast every story told about us is this: over seventy-nine years in Texas, through two migrations, a fire, an estrangement, and the ordinary attrition of four generations, we kept the books. Every birth and death, no matter how small or significant to those who lived it, was entered, in the year it happened, by hands that the next keeper could read.<\/p>\n<p>Peoples&#x27; stories about themselves are weather—a storm raging over a family’s life—while a kept record is climate—the steady flow of time&#x27;s passage. If our telling fades and only the fact remains, let it be that one: we wrote it down, all of it, and the writing is how we loved each other across decades when we could not be in the room.<\/p>\n<p>Ruby&#x27;s meticulous entries in her hand mirror Flint’s exactitude; Slate&#x27;s steady script follows Garnet&#x27;s careful tradition. The books are the record, a testament to Jet&#x27;s care and Slate&#x27;s steadiness, preserved through generations. Onyx&#x27;s daybook marks each repair with his patience; Amber&#x27;s photographs show our rooms now, carrying on the family&#x27;s history.<\/p>\n<p>In seventy-nine years of Texas, we kept not just names but stories, hopes, losses, and everything in between. The books are where our loved ones live forever, a constant through time when they could no longer be by our side.<\/p>\n<hr>"}, {"kind": "meta", "label": "Colophon", "chapter": "", "html": "<p>Produced by survey-to-book v0.3.1 (corrected edition) with the family-history genre pack v1.0.0. This edition supersedes the v0.3.0 text: it was regenerated from the same pack, the same demonstration answers, and the same story bible, with one engine change — a generation-time subject-gender gate, added after the author read the first edition and found the narrator gendered female (page 79 of v0.3.0; full classification at DEFECTS.md, F4). The respondent is male; a page whose text attached a female pronoun or role word to him under the gate&#x27;s definite-pattern screen was rejected and regenerated with the flagged sentences named, up to two retries, with the outcome recorded in the report; the women&#x27;s own pronouns were not restricted. Generation was fully local and offline: Qwen2.5-3B-Instruct (Q4_K_M GGUF, Apache-2.0; file SHA-256 626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d) served by llama.cpp build b12651 over loopback HTTP. Sampling: temperature 0.8, top-p 0.95, repeat penalty 1.1; page budget 480 tokens; per-page context assembl const main = document.getElementById('main');
const posEl = document.getElementById('pos');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const sel = document.getElementById('chapter');
const endEl = document.getElementById('endmatter');
const POSKEY = 'reader-pos-' + DATA.slug;
document.getElementById('subtitle').textContent = DATA.subtitle;
for (const id of ['dl-top', 'dl-end']) {
  const a = document.getElementById(id);
  a.href = DATA.slug + '.md';
}
document.getElementById('dl-txt').href = DATA.slug + '.txt';
document.getElementById('footer').innerHTML =
  'Generated by survey-to-book from a structured survey: ' + DATA.pages +
  ' pages, ' + DATA.words.toLocaleString() + ' words, produced locally and ' +
  'offline (' + DATA.model + '). The respondent is a fictional ' +
  'demonstration persona; see the front matter. ' +
  '<a href="../index.html">Back to the library</a> · ' +
  '<a href="https://github.com/Frozen-In-Flames/survey-to-book">Source repository</a>';
const opt0 = document.createElement('option');
opt0.value = 0; opt0.textContent = 'Front matter';
sel.appendChild(opt0);
for (const ch of DATA.chapters) {
  const o = document.createElement('option');
  o.value = ch.first; o.textContent = ch.name;
  sel.appendChild(o);
}
const optEnd = document.createElement('option');
optEnd.value = DATA.screens.length - 1; optEnd.textContent = 'Colophon';
sel.appendChild(optEnd);
let i = 0;
try { i = Math.min(parseInt(localStorage.getItem(POSKEY) || '0', 10) || 0,
                   DATA.screens.length - 1); } catch (e) { i = 0; }
function render() {
  const s = DATA.screens[i];
  let head = '';
  if (s.kind === 'page') {
    head = '<h2>' + s.chapter + '</h2><h3 class="pagelabel">' + s.label +
           '</h3>';
  } else {
    head = '<h2>' + s.label + '</h2>';
  }
  main.innerHTML = head + s.html;
  const pages = DATA.screens.filter(x => x.kind === 'page').length;
  posEl.textContent = s.kind === 'page'
    ? s.label + ' of ' + pages + ' · ' + s.chapter
    : s.label;
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === DATA.screens.length - 1;
  endEl.hidden = !(i === 0 || i === DATA.screens.length - 1);
  let v = 0;
  for (const o of sel.options) if (parseInt(o.value, 10) <= i) v = o.value;
  sel.value = v;
  document.getElementById('progress').style.width =
    (100 * i / (DATA.screens.length - 1)) + '%';
  try { localStorage.setItem(POSKEY, String(i)); } catch (e) {}
  window.scrollTo(0, 0);
}
prevBtn.onclick = () => { if (i > 0) { i--; render(); } };
nextBtn.onclick = () => { if (i < DATA.screens.length - 1) { i++; render(); } };
sel.onchange = () => { i = parseInt(sel.value, 10); render(); };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prevBtn.onclick();
  if (e.key === 'ArrowRight') nextBtn.onclick();
});
render();
</script>
