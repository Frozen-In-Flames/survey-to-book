const DATA = {"title": "The Keeping Book", "subtitle": "A family history in one hundred answers", "pages": 100, "words": 29655, "model": "Qwen2.5-3B-Instruct (Q4_K_M GGUF) via llama.cpp, local", "chapters": [{"name": "Two Names", "first": 1}, {"name": "The Flames Line: Fire and Music", "first": 11}, {"name": "The Frozen Line: Iron and Patience", "first": 21}, {"name": "The Parents: The Joining", "first": 31}, {"name": "My Generation", "first": 41}, {"name": "The Family Trades", "first": 51}, {"name": "Houses, Heirlooms, and Records", "first": 61}, {"name": "Hard Years and Partings", "first": 71}, {"name": "Reunions and the Living Family", "first": 81}, {"name": "What Was Passed Down", "first": 91}], "screens": [{"kind": "meta", "label": "Front matter", "chapter": "", "html": "<p>The respondent of this book, Frozen In Flames, is a fictional demonstration persona: the demonstration user of this series, whose fabricated survey answers drive every proof-of-works book. The answers from which every page was generated are drawn from the canonical character record (demo/frozen-in-flames-character.json, record version 2.0.0) and are fabricated test data, written to exercise the family-history genre pack end to end; the family described, two invented lines, the Flames line of his mother and the Frozen line of his father, joined in his parents&#x27; marriage and in his own name, is invented and is not the family of any real person.<\/p>\n<ul><li>Genre pack: family-history (version 1.0.0)<\/li><li>Questions in pack: 100<\/li><li>Pages in this book: 100<\/li><li>Total words: 29655<\/li><\/ul>"}, {"kind": "page", "label": "Page 1", "chapter": "Two Names", "html": "<p>Flames. The family name of my mother&#x27;s line is Flames, a legacy that traced back generations from Mississippi to Texas, and finally settled into Dallas where she was born. This name—Flames—is etched deep within our lineage, visible on the pages of her family Bible and carried proudly by each of us as we go about our lives. It was my father&#x27;s birthright and his grandfather’s resting place; a sacred tradition that both he and his kin upheld, even as they welcomed me into their fold through marriage. The joining of our lines did not mean losing the names that bound us to history—Flames remained unchanged, a testament to the strength and continuity of our family name across time.<\/p>"}, {"kind": "page", "label": "Page 2", "chapter": "Two Names", "html": "<p>Frozen. The family name of my father&#x27;s line is Frozen, carrying it from Pennsylvania to Texas through the heart of the last century. It’s etched on the daybooks that keep the records of their labors: the tools his father made with pride and the toolbox his grandfather carried into Dallas, a legacy passed down like generations of snowflakes, each unique but forever intertwined.<\/p>\n<p>Yet when we meet, people often assume our names were simply invented to fit, to create something new. But they were married into fitting—each name was chosen not merely to conform, but to honor the past and shape the future together. Our lineage remains bound by this tradition, a sacred tapestry woven from shared history that extends back to Pennsylvania and now spans Dallas.<\/p>\n<p>The joining of our lines did not mean losing the names that bind us to history—a time-honored practice upheld by my father’s generation and passed down through each of us as we go about our lives. The book&#x27;s anchor theme remains true: Flames is the family name of my mother&#x27;s line, tracing back generations from Mississippi to Texas, and finally settling into Dallas where she was born. This name—Flames—is etched deep within our lineage, visible on the pages of her family Bible and carried proudly by each of us as we live out our days.<\/p>"}, {"kind": "page", "label": "Page 3", "chapter": "Two Names", "html": "<p>Frozen In Flames. My name declares the union of our two lines: the Frozen from my father&#x27;s side and the Flames from my mother&#x27;s. It was given to us in 2000 by our parents as we were born, in Dallas, a declaration not just of who we are but of what joining us did. The whole family kept this name on their documents, introductions, and even inside the pages of the family Bible where it takes up its full line.<\/p>\n<p>For daily life, I am Frozen—just me, not the union. Yet our names together remind us that we come from two lines joined in marriage, each with a history and identity of its own, but now bound as one. The repetition of &quot;In Flames&quot; echoes through time: how my parents chose to unite their families, not just by blood but by choice and love. It&#x27;s an echo that lives on, telling the story of our union in every generation.<\/p>"}, {"kind": "page", "label": "Page 4", "chapter": "Two Names", "html": "<p>The family does have a naming tradition, and it is strict: every child of both lines is given a first name from the crystals and gems. Ruby, Onyx, Jasper, Garnet, Jet, Opal, Flint, Pearl, Topaz, Coral, Jade, Zircon, Slate, Amber -- the roster of this book is the evidence. The two lines kept the custom independently before they ever met, which the family counts as proof it was meant. It is kept by the simplest mechanism: the grandparents hold the list of what has been used, a name is chosen before the birth and argued about at the table, and no child of either line has yet been given a name from outside the stones.<\/p>\n<p>I am not one of those children, but rather the joining. My parents chose to unite their families in 2000, giving me their first names: Frozen, my father&#x27;s line, and Flames, my mother&#x27;s. The naming tradition was meant to be kept by the simplest mechanism, yet in choosing this name for myself, I broke it.<\/p>\n<p>The tradition is carried through time, echoing across generations. When we meet at the table, as our parents did before us, the names of these stones are still used and argued about, each bearing their full history. Ruby, Onyx, Flint, Pearl -- they carry the stories of my mother&#x27;s Mississippi lineage and her journey to Texas; Jet, Opal, Topaz, Coral -- theirs from Pennsylvania in the middle of last century.<\/p>\n<p>I am not bound by the names alone but by the choice that brought them together: Frozen In Flames. The repetition of &#x27;In Flames&#x27; echoes through time, a testament to my parents&#x27; decision and our union, walking around as one person yet with histories deeply intertwined. My name is the unifying force, carrying forward what started in two lines into one.<\/p>\n<p>The book&#x27;s anchor theme was first stated thusly: &quot;the family name of my mother&#x27;s line is Flames, a legacy that traced back generations from Mississippi to Texas, and finally settled into Dallas where she was born. This name—Flames—is etched deep within our lineage, visible on the pages of her family bible and carried proudly by each of us as we go about our lives.&quot; Where this page calls the theme back, it rephrases it: &quot;the names of these stones carry a legacy from Mississippi to<\/p>"}, {"kind": "page", "label": "Page 5", "chapter": "Two Names", "html": "<p>Ruby Flames. My mother was Ruby Flames, of the Flames lineage—a family that traced back generations from Mississippi to Texas before settling in Dallas where she was born in 1975. She is the core of our lineage, a woman whose music and record-keeping have kept us together through time.<\/p>\n<p>My mother inherited her love for music from her maternal grandmother. Both Slate and Opal Flames were deeply committed to their crafts—Slate taught piano in the front room of her house, while Opal played church organ. Their meticulous attention to detail was a family trait passed down over generations, reflected in the careful hand that she used not only for music but also for record-keeping.<\/p>\n<p>My mother kept these household books with the same care as she did the music. They were not just records; they were our conscience and our way of carrying forward our legacy. Just like her grandmother before her, she refused to sell the piano. It was a family heirloom—a gift from her mother that we would never part with.<\/p>\n<p>This name—Flames—is etched deep within our lineage, visible on the pages of her family Bible. Each member of our line carries it proudly as they go about their lives, whether through the stones chosen for names or the traditions passed down through generations. The book&#x27;s anchor theme is that Ruby Flames&#x27; legacy is a tapestry woven from Mississippi to Texas and finally into Dallas, where she was born. This name—Flames—is etched deep within our lineage, visible on the pages of her family Bible, and carried proudly by each of us as we go about our lives.<\/p>"}, {"kind": "page", "label": "Page 6", "chapter": "Two Names", "html": "<p>Onyx Frozen. My father is Onyx Frozen, of the Frozen line: born in Dallas in 1973, just like my birthplace was, though his life happened two decades earlier and spanned a decade that saw my mother&#x27;s arrival as well. He is the Frozen line in its present tense: its bench, where tools and wires are tested with care, its day book filled with promises fulfilled and those yet to be made, and its standard of integrity upheld by every repair he makes.<\/p>\n<p>He taught me the bench before any studio did, instilling not just a skill but a philosophy that guides us all. The small Dallas repair shop his line became is more than just a place; it&#x27;s our family&#x27;s history condensed into a corner filled with tools and memories. My father’s standards are carried on through him: a repair isn’t just a task to be completed, but an opportunity to restore something precious—a promise that lives longer than the circuits it touches.<\/p>\n<p>We stand between these two lines now, Frozen and Flames, bound by our name and intertwined by blood, each line keeping its own heritage strong. The traditions passed down through generations are etched deep within our lineage, visible on the pages of my mother’s family Bible. But in the living here, we carry that legacy forward, honoring both names as if they were one, walking around with the weight of our history and the promise to keep it going.<\/p>"}, {"kind": "page", "label": "Page 7", "chapter": "Two Names", "html": "<p>The joined family&#x27;s doctrine is the Frozen line’s sentence, brought into our marriage by my father and adopted by us all. It was my grandfather Jasper Frozen’s saying first, coined at a toolmaker’s bench, where he repaired everything from clocks to bicycles with his steady hand. His father lived it without ever explaining; he kept the family’s tools in mint condition, even as they wore down over time. My son Jasper carries on this tradition of keeping what can be fixed and fixing what needs it.<\/p>\n<p>My mother Ruby Flames applies a different kind of fix — not physical but emotional. She writes down her feelings, her thoughts, her worries, to keep them from consuming her whole. I inherited this practice from my father Onyx Frozen, who taught me the same when we first met in Dallas. He’s always been a meticulous record-keeper, keeping his day book and repairing whatever comes into the shop with care.<\/p>\n<p>Both lines have their contributions: the frozen line’s sentence to keep things as they are; the flames line’s practice of writing it all down. These two principles form our constitution — how we live together and what guides us through our lives. I say this about recording rooms, keeping them clean and functioning, while my mother writes in her books every single day, making sense out of chaos.<\/p>\n<p>As generations pass and circumstances change, so too does the family’s doctrine develop. But at its core remains that which binds us: a commitment to fix what needs it and keep what can be preserved.<\/p>"}, {"kind": "page", "label": "Page 8", "chapter": "Two Names", "html": "<p>The two lines keep two different archives, and the difference is the lines in miniature. As Ruby’s careful hand enters births, marriages, and deaths into her family’s Bible since 1949, it carries forward our lineage of people, a legacy that traces back generations from Mississippi to Texas. This record, like a living witness, testifies to us as we go about our lives: my mother, Ruby Flames, in her meticulous work, makes sense out of the chaos of daily life.<\/p>\n<p>Across town, Onyx’s day books keep an unbroken account of every job he’s ever done—from running his small Dallas repair shop that became a promise for anything with a circuit and an owner who wants it back to teaching me the bench. These records are as much a part of our history as the names on my mother’s Bible; they’re the work, the skills, and the promise that make up our family.<\/p>\n<p>When we join these lines in one person—Frozen In Flames—the record is both, and they correct each other constantly: what the Bible knows, the day books know. When Onyx died, the Bible marked his passing, but the day book told me about the radios he was working on just before. These archives are not mere history; they are living proof of our commitment to fix what needs it and keep what can be preserved.<\/p>"}, {"kind": "page", "label": "Page 9", "chapter": "Two Names", "html": "<p>What the joined family believes about itself, when told in full, is that we are the people Dallas sends for: the Frozens when a machine stops, the Flameses when a choir needs an organist or a child requires teaching, and the joined household to repair any broken item that should not remain so. This belief is both proud and supported by our history; it holds more truth than modesty would admit. Our strength lies in our conviction of fixing anything, but we have learned, generation by generation, the list of things beyond our reach, and this learning never ceases.<\/p>\n<p>We are Ruby&#x27;s Frozens, Onyx&#x27;s Flameses, and together we make up the joined family. Each line has a legacy that traces back through Mississippi to Texas, finally settling in Dallas where they were born: my mother Ruby, her parents Slate and Opal; my father Onyx, his parents Jasper and Coral. These names are etched deep within our lineage, visible on pages of their respective family bibles and proudly carried by each of us as we go about our lives.<\/p>\n<p>Ruby&#x27;s Frozens have always been known for piano teaching in the front room of her house. They keep meticulous records, documented by Ruby herself, who inherited a cherished piano from her mother along with its careful hand for music and household management. My father Onyx&#x27;s Flameses, on the other hand, run small Dallas repair shops that fix everything from radios to guitars. He taught me the importance of repairing as a promise, instilling in us the standard that our family holds dear.<\/p>\n<p>Together, we are frozen in flames: my name is Frozen In Flames, but it reflects both lines. We have carried this tradition of naming children with stones and gems since generations past, tracing back to Mississippi to Texas to Dallas. No child has been given a name outside these stones until I was the exception—my first name chosen from this list. Yet we are not just names; we are families who work tirelessly to fix broken things and keep what can be preserved.<\/p>\n<p>This joined family myth is tested by our records, which agree with what we tell: Ruby&#x27;s Frozens in the Bible mark their passing, Onyx&#x27;s Flameses track his radios just before death. The day books of both lines prove their commitment to fixing anything, while the bibles confirm these families&#x27; legacy of names and record-keeping.<\/p>\n<p>In this tradition,<\/p>"}, {"kind": "page", "label": "Page 10", "chapter": "Two Names", "html": "<p>In Holly Springs, Mississippi, Ruby Flames&#x27; mother Opal taught piano in a front room that overlooked furnaces where hot coals burned day and night. Her town was shrinking like her husband&#x27;s hands, which he used to hammer iron into machinery. The house she inherited from her mother kept its careful hand on the family books, just as she worked meticulously by the piano, keeping track of their finances with the same attention to detail that marked each note.<\/p>\n<p>Across the river in Pittsburgh, Onyx Frozen’s father Jasper built radios so large they filled a room, and his hands were scarred like his tools. Coral ran their small repair shop on a bench he made from an old bed frame, her day book as steadfast as her standard: to repair means to promise a life back to its owner.<\/p>\n<p>The joined family of Flameses and Frozens began in Dallas, where the two lines met at our doorstep. Our house was built on iron rail tracks, but we lived in a world that was shrinking like the town of Holly Springs, with new machines replacing old ones. Ruby&#x27;s piano taught us music’s rhythm, while Onyx’s radios taught patience; both kept their hands steady to fix anything.<\/p>\n<p>The next two chapters take each line back to its own beginning: from Holly Springs and Pittsburgh where fire and iron shaped them still, and the joined family story is only just starting.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 11", "chapter": "The Flames Line: Fire and Music", "html": "<p>Garnet Flames. He is the founding ancestor of the Flames line in Texas, a keeper of furnaces and boilers who traced back generations from Mississippi to Texas before settling into Dallas. Born in 1920 in Holly Springs, Garnet brought his wife and young son to Dallas in 1949, where he stayed and worked tirelessly with new machines replacing old ones. The record of his presence and life is preserved by Ruby Flames, my mother&#x27;s grandmother, who started it the year he arrived. Through her careful hand and the telling that surrounds him, I know Garnet well. His legacy lives on in our family name etched deep within our lineage, visible on the pages of her family Bible and carried proudly by each member.<\/p>"}, {"kind": "page", "label": "Page 12", "chapter": "The Flames Line: Fire and Music", "html": "<p>Holly Springs, Mississippi. The Flames line originated here, a hill-country town in the north of the state where Garnet&#x27;s people kept the mill’s furnaces for two generations. This place is the source from which my mother&#x27;s lineage emerged, its name still listed on a church roll to this day. For our family, Holly Springs serves as both the starting point and the boundary—where we came from, not where we are now.<\/p>\n<p>Here in Dallas, where my mother was born in 1975, Garnet’s legacy continues through her careful hand on the pages of her family Bible and by carrying forward his name. The community around us reflects broader historical events like the Great Depression and World War II, which shaped how my grandparents raised their children and kept our names alive.<\/p>\n<p>The world outside our home was marked by these public events—war and economic hardship—and they seeped into the fabric of our daily lives. Our father’s shop ran on a steady hand despite external pressures, maintaining its tools and ensuring repairs were made. My mother’s record-keeping, so carefully practiced, mirrored this reliability.<\/p>\n<p>Today, we live in a city where Garnet&#x27;s name still resonates—etched deep within our lineage, visible on the pages of Ruby’s family Bible and carried proudly by each of us as we go about our lives. The story of Holly Springs shapes who we are, but it doesn’t define us. Our names endure, connecting us to a past that is both distant and constant, forever carrying forward Garnet&#x27;s legacy in our community.<\/p>"}, {"kind": "page", "label": "Page 13", "chapter": "The Flames Line: Fire and Music", "html": "<p>1949. The Flames family came to Dallas in 1949: Garnet, aged twenty-nine, his wife Jet, and their son Slate, aged three. The telling says they came down the river, but it was not so. What is certain is the shape of the arrival: a furnace man with a trade that a growing city needed, a wife carrying a Bible she meant to start a record in, and eleven years of Texas growth ahead.<\/p>\n<p>On this day, the journey began on the train tracks, no river route leading to Dallas. A railway timetable from Jet&#x27;s papers confirmed it; Garnet was not moving down a mythical stream but across miles of prairie and plains, through a landscape transformed by war and migration. The city that awaited them was still in its adolescence, an infant compared to the furnace man who had seen coal fields bloom into steel mills.<\/p>\n<p>The train pulled into Dallas Central Station with the rusted roar that heralds new beginnings and endures as a memory for Jet’s family Bible. Outside, the city was not what they imagined—no river here but rather a vast metropolis of buildings and streets still in their formative years. The sight of it was both exhilarating and disorienting. A furnace man with his trade—a skill that mattered—and a wife carrying a record she meant to keep alive.<\/p>\n<p>Garnet and Jet had seen the future unfold, a future that would soon demand more than just boilers. Their arrival marked not just a physical journey but also a shift in the family’s focus. The Bible was brought along for a reason—Jet intended to start a record of this new land and its people, a record that would bind Garnet&#x27;s line to Dallas, no matter how distant they might be.<\/p>\n<p>Inside the station, Jet turned towards her husband with determination etched on her face. &quot;We&#x27;ll find work here,&quot; she said, her voice steady despite the uncertainty. And so, their journey continued, not down any river but through the heart of Texas, where Garnet&#x27;s skills and Jet&#x27;s resolve would shape a future as indomitable as the furnace he had left behind.<\/p>"}, {"kind": "page", "label": "Page 14", "chapter": "The Flames Line: Fire and Music", "html": "<p>Jet Flames, born Jet Callahan in 1923, stands at the center of our flames lineage—a figure as sturdy as the furnace she left behind in Holly Springs. She is Garnet&#x27;s wife, who came to Texas with him in 1949, bringing her resolve and a household that would endure through lean years. Jet took over from Garnet when he departed, keeping the family&#x27;s house warm even as the world outside grew colder.<\/p>\n<p>The Bible on Jet’s table is the heartbeat of our lineage, its pages filled by her hand for fifty-two years—births, marriages, deaths, and every life in between. It’s not just a record; it&#x27;s a testament to her strength and wisdom, etched with names from Ruby to Jet. The very first page of this family Bible bears the marks of Garnet&#x27;s wife, who was there through all, guiding by her own hand.<\/p>\n<p>Jet’s house is as much a part of our history as she is—a place where fires were tended, music played, and stories told around the hearth. On cold nights, Jet would gather us close, sharing tales from afar and instilling in us the values that made this family so strong—endurance, hard work, and the belief that we could shape a future as indomitable as Garnet’s furnace.<\/p>\n<p>In the warmth of her house, jet nurtured our line through the years, turning each name on her Bible into a beacon. Her hand, steady and strong, has carried us through storms both personal and societal, ensuring that the flames of our lineage burned bright even as they faced the flames of time.<\/p>"}, {"kind": "page", "label": "Page 15", "chapter": "The Flames Line: Fire and Music", "html": "<p>Garnet&#x27;s trade was fire: he kept furnaces and boilers — at the mill in Holly Springs, then at heating plants and laundries and a hospital in Dallas. The man sent for when the building’s basement fire went wrong or went out. This is the Flame family line, their legacy handed down by their father’s work.<\/p>\n<p>The family telling gives Garnet’s trade itself to them: the Flameses, it says, were called for the flame they kept. My mother&#x27;s lineage carries this name through the years, a story of hard labor and dedication etched in the pages of her family Bible.<\/p>\n<p>The record shows the name already old in Mississippi by 1949. While it offers no opinion on why Garnet’s line became known as the Flameses, the family keeps this telling anyway. They label it “telling,” for a story with an origin and a history is easier to pass down than one without.<\/p>\n<p>In our lineage, we carry these traditions forward: Ruby&#x27;s careful hand in Dallas, writing her thoughts every day to keep chaos at bay — a practice inherited from her father. Onyx’s steady hands on the bench, teaching me his philosophy of care for both tools and tasks — instilled as much by him as by his grandfather.<\/p>\n<p>Across town, my mother writes down her thoughts and feelings every day to keep chaos at bay, a practice inherited from her father. My father records his jobs in his day book, each entry a promise that repairs are fixed with patience and skill — the standard made by his father carried into Dallas in a toolbox. We carry these principles forward, ensuring that the flames of our lineage burn bright as they face both personal and societal storms.<\/p>\n<p>In our home, Jet nurtured our line through the years, turning each name on her Bible into a beacon. Her hand, steady and strong, has carried us through both personal and societal storms, ensuring that the flames of our lineage burned bright even as they faced the flames of time.<\/p>"}, {"kind": "page", "label": "Page 16", "chapter": "The Flames Line: Fire and Music", "html": "<p>The arrival of my mother&#x27;s line in Dallas was a matter of practical good fortune rather than spectacle. A rented house near Garnet&#x27;s first plant, where she began work within the week thanks to a Mississippi foreman’s letter that secured her position. Jet&#x27;s table provided for us and our extended family, as more children from the neighbourhood appeared at its edges.<\/p>\n<p>As we settled in, the first Texas winter tested not only Garnet but also my grandmother. The furnace man was tasked with keeping it running through the harsh months, a responsibility he carried out with both skill and humor. In a telling of his own making, one that has become a cherished story for us each Christmas, it is this moment we remember: the keeper’s fire kept.<\/p>\n<p>This simple act—keeping the household&#x27;s heat alive in even the coldest weather—became our guiding parable, a reminder of the strength and resilience needed to build a home from scratch. It taught us that even in the darkest times, there was always something within reach, if only we could find it and keep it burning.<\/p>"}, {"kind": "page", "label": "Page 17", "chapter": "The Flames Line: Fire and Music", "html": "<p>The Flames record was begun in 1949—Jet entered the marriage with Jet Callahan and the journey to Dallas, leaving behind the names of her dead siblings in Holly Springs on the flyleaf of the Bible she carried from Mississippi. Jet’s hand ruled the columns herself: born, married, died—like copperplate etched onto a page of history. The entries are plain and they’re why this line&#x27;s history can be written at all.<\/p>\n<p>Every keeper since has understood the assignment the same way as my mother did—that’s what I see when I look at Jet’s hand on the Bible she brought to Dallas: enter what happened, in the year it happened, in a hand the next keeper can read. The tradition lived on through her daughter Ruby, who wrote down every day with care and precision like her mother before her—keeping the household&#x27;s heat alive even in the coldest weather.<\/p>\n<p>In this simple act of keeping fire, Jet’s ancestors taught us strength and resilience, passing it down as a guiding parable across generations. The Bible is our heirloom, a record that carries its own voice and meaning. Its pages are witness to the family’s history—both what was written and what we tell about it—that tells how we came to be where we are today, here in Dallas.<\/p>"}, {"kind": "page", "label": "Page 18", "chapter": "The Flames Line: Fire and Music", "html": "<p>Slate Flames. My grandfather Slate Flames — Garnet&#x27;s son, my mother&#x27;s father — is the patriarch of our family’s Flames line, in Texas: born in Holly Springs in 1946, and brought to Dallas at three years old. This is where his working life began, as a heating and refrigeration man who kept the fire trade passed down from his father but translated for the century of cold air.<\/p>\n<p>He carried forward my great-grandfather’s standard — never let the plant go down on your watch — and preserved my grandmother&#x27;s meticulous record-keeping habits. Her household book entries made their way into his hand after hers gave out, a testament to her careful management of our family’s affairs. Slate kept this tradition alive, passing it down through the years until he died in 2016.<\/p>\n<p>In Slate’s hands, the plant did not go down, and neither did the family&#x27;s story. He taught us the importance of persistence and record-keeping, just as his father had before him. My mother Ruby followed in her father’s footsteps by keeping meticulous household books and teaching this skill to her own children. The tradition lives on through our hands, and it is a part of who we are.<\/p>"}, {"kind": "page", "label": "Page 19", "chapter": "The Flames Line: Fire and Music", "html": "<p>In Slate’s world, Opal Reyes was more than just his wife; she was the heartbeat of their family, bringing music into what had been fire. As a piano teacher in her front room for cake, eggs, and no pay at all, and as a church organist who played fifty years straight, Opal transformed the Flames line’s elemental focus from heating to music.<\/p>\n<p>She brought music not only into our house but into our hearts. My mother Ruby inherited not just the piano that she had learned on, nor her students. Most importantly, she inherited the doctrine that a child is taught by whoever is nearest and musical. This teaching was passed down through my grandmother’s careful hands, a legacy of care for both children and music. It became part of our DNA, a belief we carry in everything we do.<\/p>\n<p>Ruby followed in her mother&#x27;s footsteps with meticulous record-keeping. In her household books, she wrote every day to keep chaos at bay, much like her father taught her. She kept the tradition that began on the front room piano, and it lives on through her. My mother’s work is a mirror of Slate’s teaching: patience and care, dedication to record-keeping, and an unyielding commitment to pass down what she has learned.<\/p>\n<p>The line’s second hearth—music—is passed from grandmother to granddaughter as surely as the first hearth passed from father to daughter. Ruby&#x27;s careful hand on her household books is a continuation of Opal’s in her front room. We carry these traditions forward, just like Slate taught us: persistence and record-keeping are part of our DNA now.<\/p>"}, {"kind": "page", "label": "Page 20", "chapter": "The Flames Line: Fire and Music", "html": "<p>The Flames line, by the time my mother was born into it in 1975, was a Dallas family of the second Texas generation: Slate&#x27;s refrigeration work steady, Opal&#x27;s front room full of other people’s children, the Bible kept, and the Mississippi origin already passing from memory into telling. Its expectations of a daughter were its own: learn the music, keep the record, marry as you choose but bring them to the table first.<\/p>\n<p>My mother fulfilled the first two exactly—she learned the piano at her front room school and kept it in our house until she inherited it from her father, who had brought it to us when he moved here from Holly Springs. She played with care for guests and practice, always teaching herself something new. The record of her music was kept as faithfully as Slate’s hands on the old refrigeration equipment; they were both crafts that required patience and precision.<\/p>\n<p>But she married in a way not expected by the line—she brought home a repairman, which they agreed was within the spirit of things. Onyx Frozen, my father, had been taught the bench at home before any studio did. He took over his mother’s shop with her day book and repaired everything from radios to guitars with the same meticulous care that she kept on the piano.<\/p>\n<p>The line’s traditions lived on through Ruby&#x27;s careful hand on household books and her steadfastness in holding onto our family name, even as it shifted under a new coat of paint. The music was passed down to me, not just by my mother but also by Onyx’s touch upon his repair bench—these tools were passed from one generation to the next, like the lines of Slate&#x27;s work and Jet’s hands.<\/p>\n<p>We carried on the family name of Flames through Ruby’s careful hand and Onyx’s skill. The line is now in my hands, carrying forward our traditions with a blend of music and repair that reflects both our parents’ standards: we keep the record, learn the music, but bring them to table first—our own children, who will inherit these lines from us.<\/p>\n<p>The joining of our lines through marriage binds us together. The Frozens&#x27; meticulous record-keeping in Holly Springs and Pittsburgh&#x27;s steady hands on radios and repairs are now part of what I carry forward as a repairman myself. We fix what needs it, just like Slate taught me: persistence and record-<\/p>\n<hr>"}, {"kind": "page", "label": "Page 21", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>Flint Frozen. Born in Pittsburgh in 1918, he was a millwright and machinist—a craftsman skilled with his hands—and came to Dallas after WWII service in machine shops. He arrived here with his wife, a toolbox, and tools the city lacked postwar: radios, televisions, and anything else needing repair or maintenance. Flint died in 1992 but his legacy lives on through my father’s line. Every tool he made became part of what we do as repairmen today.<\/p>\n<p>I hold a small, well-used toolbox that once belonged to Flint, its lid worn from years of hammering. I keep it beside the bench where Onyx taught me care and respect for tools. Each time I open it, I think of Flint’s steady hands—how he would work through the day with determination until his body told him to rest. The tool box is a testament to that dedication passed down from generation to generation.<\/p>\n<p>As I look at this relic, my father&#x27;s line is brought vividly before me: not just names but people who worked hard and made their mark on Dallas’s postwar repair shops. Flint’s work ethic was instilled in Onyx; he teaches his son the same standards of reliability and meticulous care for tools. The toolbox is a silent witness to these traditions, keeping alive what Flint started nearly a century ago.<\/p>\n<p>Across town, my mother Ruby&#x27;s family line traces back through Jet Flames and Slate, who brought music with them from Holly Springs. My parents’ families are joined now in Dallas through marriage: Frozen In Flames. We carry on the legacy of each line but also forge our own path, blending traditions to make something new and lasting—just like Flint and Garnet did for my family before us.<\/p>"}, {"kind": "page", "label": "Page 22", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>Pittsburgh, Pennsylvania. Growing up in the city&#x27;s steel mills taught me my father’s trade: a world of machines as big as houses, where Flint worked day and night. Like Holly Springs did for the Flameses, Pittsburgh shaped the Frozen line—weight, tolerance, patience, and the long cold arithmetic of work that cannot be hurried.<\/p>\n<p>In shops that never shut, Flint learned his craft from dawn to dusk in steel country’s river valley. Those days gave me a different kind of strength—the weight of iron rather than fire, but just as hard-won and equally relentless. Just like my father’s shop taught him about the world, it shaped the Frozen line into something sturdy, patient, and unflappable.<\/p>\n<p>The city itself was the backdrop to Flint&#x27;s work: steel mills rising tall by the river, each one a fortress of machines. Those years in Pittsburgh left an indelible mark on the line’s temperament—long hours under the cold air, where nothing moved quickly or easily. The long cold arithmetic of work—each day a promise kept, every tool carefully tended—and patience were my father&#x27;s teachings passed down to me.<\/p>\n<p>My home is still part of that world—a shop and house in Dallas, just as Flint had it: tools sorted meticulously by use, records kept for decades, each job a story of care and craftsmanship. The same values—weight, tolerance, patience, the cold arithmetic of work—that shaped my father’s trade have become part of our home, passed down through the generations like a family Bible.<\/p>\n<p>As I walk through those familiar rooms today, the teachings from Flint&#x27;s days in Pittsburgh echo around me—the long hours under steel city skies, the promise of care and craftsmanship carried on. Those values remain as much a part of my life now as they did then—each tool a story, every job a lesson in patience and strength, just like Flint’s world taught him.<\/p>"}, {"kind": "page", "label": "Page 23", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>In winter of 1946, Flint, my father’s grandfather, set out from Pittsburgh, a young man just twenty-nine years old and freshly discharged from wartime service in a machine shop. His heart heavy with the echoes of war but brimming with hope for a new beginning, he journeyed northward to find work and suitable rooms to settle into as the family moved on.<\/p>\n<p>Flint’s early arrival left behind his Pittsburgh life: the steel mills humming under winter skies, the cold air biting through thin coats, and the daily grind that forged resilience. With him came the promise of a new city—Dallas—that was building fast, its floors pouring like liquid gold, machine shops bubbling with activity.<\/p>\n<p>He found both in Dallas—an opportunity to start anew amidst the rapid growth of our city’s industrial heart. Flint took up residence ahead of his family, securing lodgings that would provide shelter for the household as it arrived together in 1947, marking a new chapter and the beginning of entries in the book of my father&#x27;s day.<\/p>\n<p>The move marked the arrival of our line to Texas, each step carrying forward from Flint’s days in Pittsburgh. The journey wasn’t just physical; it was filled with the legacy of his service, the dreams he carried across the miles, and a determination to build something new here—both for himself and for us who followed.<\/p>\n<p>As we look back on this first chapter, we see that Flint’s arrival laid the foundation not only for our family in Dallas but also for the city itself. In these early years of the 1940s, as America navigated the aftermath of World War II, new arrivals like Flint contributed to the city&#x27;s growth and development. His story is a testament to resilience and hope—a chapter that set the stage for the future generations who would trace their roots in Dallas.<\/p>\n<p>In the coming pages, we will explore how each generation carried on Flint’s legacy—his patience with tools and machines, his commitment to craftsmanship—and built upon it in our own lives. The values of care, skill, and perseverance have remained constants, reflecting both the traditions he brought from Pittsburgh and those he fostered as a father in Dallas.<\/p>"}, {"kind": "page", "label": "Page 24", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>Pearl Frozen, born Pearl Kowalski in 1921, is the matriarch of our family line. Flint&#x27;s wife, she kept all the papers, accounts, and family table through decades that were formative for us. She instituted the custom that no job or debt was ever unentered—the day book was Flint&#x27;s habit—but its completeness was Pearl&#x27;s enforcement.<\/p>\n<p>She passed this legacy on to me, as I know her through the accounts she meticulously entered. These records are as exact as Ruby’s Flames Bible and twice as argumentative in their margins—each line a testament to the family history that flowed from her hand. She died in 1999, just before I was born, leaving behind her meticulous handiwork, which continues to live on through my father&#x27;s careful record-keeping.<\/p>\n<p>Today, we keep these traditions alive. Onyx, our father, teaches me his bench and instills the philosophy of care for both tools and tasks—passing down a legacy of patience and skill. Pearl’s customs endure in the hands of those who follow her path, ensuring that every job is accounted for and every debt is paid off. Her influence lives on through us.<\/p>"}, {"kind": "page", "label": "Page 25", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>In Flint’s toolbox, the weight of generations holds tight. Inside lies history: the hand tools he chose, each bought singly and initialed by Flint himself. This chest is more than just a storage box; it’s a testament to the trade passed down from Pittsburgh’s shops through Dallas. It’s what my father inherited when he arrived in Texas—his capital and his credentials.<\/p>\n<p>The toolbox speaks of the patience needed for millwrights and machinists, who work on great machines over forty years. Flint practiced this craft in Dallas, making it a part of him. My father, Onyx Frozen, taught me how to handle these tools with care—a lesson passed down from my great-great-grandfather, Flint, right through the generations.<\/p>\n<p>Onyx’s bench is just one reflection of that trade line—how each generation learned and carried on his work. The toolbox embodies both the physical legacy of the craft and the intangible lessons of perseverance and meticulousness. It serves as a reminder that even in today&#x27;s fast-paced world, some things never change—a constant thread connecting our past to our future.<\/p>"}, {"kind": "page", "label": "Page 26", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>In the spring when I came to Dallas, the Frozen line found our rooms through Flint’s shop, just as he had found his. Our foreman, a man Flint served with years ago, helped us settle into the new city, pointing out familiar faces and places that told stories of work and community. The first entry in the day book was written on a warm day, when Pearl arrived in her springtime carriage, rolling into Dallas carrying household goods that would make our new home stand tall.<\/p>\n<p>The line remembers this arrival without romance but with quiet dignity: nothing promised us anything, every detail entered to keep the city’s payment of competence flowing. The accounts started immediately, with Flint’s hand as careful and precise on the ledger as it had been in the shop’s front room. My father, Onyx, began his work on the repair bench that day, just like his foreman, teaching me patience and care for tools and tasks from the very start.<\/p>\n<p>Flint’s accounts were a map of our new life: jobs recorded, wages noted, landlords paid—each entry in his ledger was a testament to our competence. The city rewarded us with work and my father never failed to enter it all, making sure no job or debt went unentered. This habit was handed down by Pearl, who learned from her mother’s meticulous hands. Her accounts were as exact as Flint’s, but she added her own notes of argument, a reminder that fairness is not always fair.<\/p>\n<p>Our new home in Dallas grew with the help of my father and I, just like our lines had grown before. We worked together to keep it standing tall: he taught me his bench, I took on more tasks as I grew older. The city paid for our work through its usual coin—more work. This simple act became a cornerstone of our family’s tradition, one that we carry forward today in the way we record and honor our history.<\/p>"}, {"kind": "page", "label": "Page 27", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>Jasper Frozen. My grandfather Jasper Frozen—Flint&#x27;s son, my father&#x27;s father—is the Frozen family’s patriarch. Born in Dallas in 1948, he worked as a toolmaker all his life, embodying the doctrine our joined family still quotes: a family keeps what it can fix and fixes what it keeps.<\/p>\n<p>If Flint founded the line in Texas, Jasper defined it—setting the standard of work, keeping meticulous daybooks, and refusing to discard anything that could still be understood. He passed on this tradition not just as words but through his own actions; he taught us patience and care for each tool and task we handled. His refusal to let anything go was a lesson in its own right.<\/p>\n<p>Jasper died in 2018, when I was eighteen years old, and he remains the grandfather I knew best. He stood tall as a symbol of our lineage, his legacy engraved not just on paper but also within us.<\/p>"}, {"kind": "page", "label": "Page 28", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>The doctrine in Jasper’s era meant something harder than it does today. In the decades when Dallas threw away machines, furniture, and whole trades for lack of small repairs, my father Jasper’s words — a family keeps what it can fix, and fixes what it keeps — were an accusation against a wasteful age, and the job description for his children: nothing in this house is disposable while it can still be understood. My mother Coral’s amendment preserved by the telling alone was that people are included in the inventory.<\/p>\n<p>The joined family has been living inside this sentence and the amendment ever since. For us, keeping what we can fix means not just preserving tools or tasks but also holding dear to our hearts the memories and relationships they represent. It means cherishing every detail of our house, from the worn carpet that tells stories of past occupants to the cherished family books that chronicle our lineage.<\/p>\n<p>Jasper’s doctrine taught my father Onyx patience and skill in repairing whatever came through their door. The refusal to discard anything that could still be understood was not just a standard for tools but also for people — including us, his children. We are bound by this belief across generations, carrying forward the tradition of meticulous record-keeping and the steady hands on radios and repairs.<\/p>\n<p>Our house is like Jasper’s bench: a testament to the enduring value of our work and the care we put into everything we do. It reflects the weather of Dallas — from the heat that tested our resilience to the cold air that taught us about refrigeration. And it bears witness to public events, pressing on us as they did on generations before us.<\/p>\n<p>Jasper’s doctrine taught my father Onyx patience and skill in repairing whatever came through their door. The refusal to discard anything that could still be understood was not just a standard for tools but also for people — including us, his children. We are bound by this belief across generations, carrying forward the tradition of meticulous record-keeping and the steady hands on radios and repairs.<\/p>"}, {"kind": "page", "label": "Page 29", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>My father Onyx was born in 1973, inheriting the line&#x27;s ironing patience and the hand of a steady repairer. The winds that blew through our house in Dallas carried whispers from Flint Frozen’s days as a toolmaker in Pittsburgh, which my mother Ruby kept alive in her meticulous household books. As for Onyx, he took to repairing radios and guitars with an even more steadfast touch than his father.<\/p>\n<p>Jasper&#x27;s own sister Topaz was born in 1951. She married Obsidian Whitfield in Chicago at eighteen and raised a son named Jasper after him, somewhere where the name meant nothing but us, here in our home. The line’s hopes were split like many families&#x27;, with Onyx taking up the bench at home and his sister keeping the family alive across six hundred miles to Fort Worth.<\/p>\n<p>In Dallas, we breathed the same air as Flint and Slate&#x27;s ancestors who founded this line. My mother Ruby kept her father&#x27;s custom of careful record-keeping in place; she wrote down her thoughts and feelings every day for herself and us. Onyx carried on my father’s traditions, teaching me patience with his steady hands and care for anything that could be fixed.<\/p>\n<p>As we grew, the chapters of our family were written: Flint kept the line alive in Pittsburgh before coming to Dallas where he stayed; Slate became a heating and refrigeration man there as well. Topaz&#x27;s son raised in Chicago, named after her brother, carried on his legacy without ever coming home. Onyx taught me repair from my father’s bench at home, instilling in me that the family keeps what it can fix and fixes what it keeps.<\/p>\n<p>Across the distance of time, our traditions remained: the record-keeping in Dallas, the hands that maintained radios and guitars, the steady way we kept everything no matter how far apart. My aunt Jade took these lessons into nursing, a continuation of her line’s instincts for carefulness and care. Her journey to Fort Worth was its own chapter within this book, written by the lines that remain with us still.<\/p>"}, {"kind": "page", "label": "Page 30", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>The Frozen line, by the time my father was born in 1973, was a Dallas family of the second Texas generation: Jasper’s toolmaking respected, the day books filling a shelf, the Pittsburgh origin already a story the children asked for rather than a place anyone remembered. Its expectations of a son were simple: learn the bench, keep the book, be the man they sent for. My father fulfilled all three and then did one more thing—the one thing that had not been scripted— he married Ruby Flames, bringing the fire line into the iron line’s house.<\/p>\n<p>As I grew up in this household, my days were filled with the steady hum of Jasper’s toolmaking on his bench, the careful pacing of day books filling a shelf, and the stories of Pittsburgh origins. The expectations of a son echoed through the generations—learn the bench, keep the book, be the man they sent for.<\/p>\n<p>Then, one sunny morning in 1975, Ruby arrived. Her hands were steady on her piano, and her record-keeping was as meticulous as his day books. She brought with her the fire line’s traditions of music and record-keeping, weaving them into our family’s fabric. My father fulfilled all three expectations—learning the bench from him, keeping the book alongside her, and being the man they both sent for—and he also married Ruby, joining the lines in a marriage that carried their combined traditions forward.<\/p>\n<p>As I looked back on my childhood, I saw how these two worlds—the iron line of toolmaking and day books, the fire line of music and record-keeping—coalesced into one family. The traditions were woven together, creating something new yet familiar—our own unique blend of patience and craftsmanship, reverence for our heritage, and a love for both hands-on work and careful record-keeping.<\/p>\n<p>The joining of these lines through marriage binds us together: Frozen In Flames. The traditions from each line continue to live on—the Frozens’ meticulous record-keeping in Pittsburgh, and the Flames’ music that carried into Dallas. We carry these principles forward, keeping what can be preserved and fixing what needs it—Ruby’s steady hand on her piano and Onyx’s patience at his bench.<\/p>\n<p>Across town, my mother writes down her thoughts and feelings every day to keep chaos at bay, a practice inherited from her father. My father records his jobs<\/p>\n<hr>"}, {"kind": "page", "label": "Page 31", "chapter": "The Parents: The Joining", "html": "<p>In the front room of our house, Opal’s ear still listens to tales half told by street children who learn piano there and half remember their own childhoods. My mother teaches these lessons with Jet’s instinct that everything important gets written down. Her hands are steady as they write in both styles—the Frozen manner for household accounts and the Flames manner for the family’s Bible. She carries this legacy, not a memory but a going concern.<\/p>\n<p>My mother&#x27;s world is framed by Slate’s stubbornness about standards: her front room, which he kept clean and organized like his workbench; and Jet’s habit of writing down everything important. My father learned these lessons from her piano bench, where she taught half the street’s children—my generation included—and met my father in church, where I first saw the organ as a child.<\/p>\n<p>The house is our home, weathered by time but still standing strong under Slate&#x27;s hand and Opal’s ear. The streets outside are full of stories from the children who pass through her front room and hear their own histories written down. Jet writes these stories in both hands—her steady, meticulous record-keeping in the Frozen manner and the new entries that keep our family line going.<\/p>\n<p>Across town, my father records his jobs on a day book, teaching me patience and care for tasks and tools—a tradition he inherited from Flint&#x27;s steady hands and careful record-keeping. We carry these principles forward, keeping what can be preserved and fixing what needs it—my mother’s steady hand on the piano bench and my father’s steady hands on repairs.<\/p>"}, {"kind": "page", "label": "Page 32", "chapter": "The Parents: The Joining", "html": "<p>Onyx Frozen stands as the carrier of the Frozen inheritance, his hands an echo of Flint&#x27;s steady touch and Jasper’s steadfast standard. His days are spent in the repair shop, a testament to Pearl&#x27;s meticulous work ethic—every job documented with care and precision.<\/p>\n<p>The day book he maintains is a living record, each entry written with the same exactitude as her accounts. Onyx carries forward his father&#x27;s legacy of carefulness, teaching me patience and skill at tasks and tools. He has never discarded an object until it can no longer be understood—a testament to his grandfather’s philosophy that no job should go unentered.<\/p>\n<p>The shop itself is a reflection of the generations passing: from Flint’s mills in Pittsburgh to Jasper’s bench in Dallas, where Onyx now sits, maintaining machines smaller but more numerous. The line descends not in decline but as a translation, each generation refining and carrying on what came before—Pearl&#x27;s orderliness handed down through him.<\/p>\n<p>Each day, I see Onyx enter every job he does into the day book, a lesson that care is fundamental to any task. He teaches me, just as his father taught him, that understanding is not enough; one must always grasp fully whatever they engage with. The shop mirrors their commitment: Flint’s machinery in Pittsburgh, Jasper&#x27;s bench in Dallas—now Onyx&#x27;s hands on the tools of Texas.<\/p>\n<p>This page stands as a portrait of my father as he carries forward both the iron and the patience of his line—teaching me to work diligently and never discard anything until it can be understood. As we continue our journey together, each generation adds its own unique touch while upholding these timeless principles: carefulness in our hands, care for what is given us, and understanding that everything has value if grasped fully.<\/p>"}, {"kind": "page", "label": "Page 33", "chapter": "The Parents: The Joining", "html": "<p>In 1998, Ruby Flames was playing for a church social in Dallas when her piano pedal went out underfoot—a fate she had avoided by that point of the service. The congregation gasped; the organist quickly called the repairman, and before anyone could react, Onyx Frozen—Ruby&#x27;s future husband—was on his way.<\/p>\n<p>The church floor echoed with Onyx’s steady hands as he fixed the pedal. He stayed for the singing, a rare occurrence in his usual workday of fixing radios and televisions at the small Dallas shop. Ruby sat in front of the piano, her fingers still shaking from the unexpected interruption but determined not to stop until she had played the entire service.<\/p>\n<p>By the family’s account, Onyx was engaged in his mind before she started playing—his hands were already on the pedal, ready and waiting. The story held its place at the kitchen table where Ruby would sit with her mother Opal after a Sunday meal, recounting this moment to her children, me, and anyone who listened.<\/p>\n<p>The record supports the pedal, the church, and that fateful year. It&#x27;s in the family Bible: a note from 1998 signed by Onyx, dated during his usual workday but completed at the last piano service of the week. The church certificate records the date and event, though it doesn’t mention the repair or Onyx’s presence.<\/p>\n<p>The record is clear; the telling is vivid. Both agree that Onyx arrived in time for Ruby to finish her singing without interruption, which she did. This scene stands as the joining, the first meeting of my parents’ lines—Frozens and Flames—and it echoes through generations, each sitting where they were at the kitchen table, each hearing the same story with new meaning.<\/p>\n<p>As I sit here now, the Bible page beside me, I can imagine Ruby&#x27;s hands, steady yet shaking as she played. Onyx’s mind was already on the pedal; he had practiced that day, prepared for a moment like this. The record shows it; the telling makes it vivid. And in each generation, we remember where we sat and what we heard—how our parents first met, how they chose to tell their story to us—and we carry these stories forward, remembering what was given and why.<\/p>"}, {"kind": "page", "label": "Page 34", "chapter": "The Parents: The Joining", "html": "<p>The wedding of my parents in 1999 took place at the church where they met, with Opal Flames playing the organ and Jasper Frozen standing as witness with his hands washed clean up to his elbows. The Bible entry reads simply: the date, the names, and the venue. Ruby took up keeping the family records by then, and she wrote in her hand: the date, the names, ‘the church of our meeting’. Onyx&#x27;s day book also bears one line: the date, the names, &#x27;no charge&#x27;. Both books agree on how they joined as a family but differ in their details. The Bible is factual, while the day book captures meaning and emotion.<\/p>\n<p>The church supper where they celebrated that first Christmas together was a gathering of our entire families. Ruby’s parents met us at the front door with smiles and hugs. Onyx&#x27;s father gave us his old repair bench as a wedding gift. That’s where we sat for dinner, the kitchen table overflowing with laughter and stories. The day book reads: &#x27;Ruby and Onyx are married. No charge.&#x27;<\/p>\n<p>As we ate, Ruby told me how Opal played that evening, her hands shining after polishing them. Jasper stood beside her, his eyes crinkling with love. He had washed his hands clean for this moment, but they were still covered in grease from a long day at the shop. The telling made it vivid, and I remembered sitting there as a child, watching my parents share their first kiss.<\/p>\n<p>The joining was not just about the date or the church; it was also about the bench handed down by Onyx’s father. It became our own family bench, where we sat to celebrate every new chapter of our lives together. Ruby&#x27;s careful record-keeping and Jasper&#x27;s steady hands on repairs continue through us, carrying these traditions forward into our children’s lives. We carry them all with us wherever we go, passing down what was given to us—our parents&#x27; love, the warmth of their home, and the discipline of their hard work.<\/p>\n<p>As I look at these pages in the family book, each entry tells a story within its own lines: a record of facts and a scene from the past. The Bible records our joining with precision; the day book captures the joy and emotion of that moment. And as we remember where we sat and what we heard—how they chose to tell<\/p>"}, {"kind": "page", "label": "Page 35", "chapter": "The Parents: The Joining", "html": "<p>In our dining room, I gather my parents and siblings together at the kitchen table. Each generation&#x27;s world is laid out like a mosaic: Ruby’s meticulous day book sits on her desk next to the piano she inherited from her mother; Onyx’s steady hands rest on the repair bench in the front room. We sit where each of us has always sat—Ruby, who holds our family Bible with her fingers as gentle as they are sharp at the quill pen; Onyx, whose elbows dig into his lap as he waits for a circuit to test.<\/p>\n<p>Sitting here, I can see how our two lines fused like iron and fire. The Frozens’ pride in their day book mirrored Ruby’s careful record-keeping. They thought we were too proud of our habits, that the days just flowed from one page to another with no need for breaks or pauses. Meanwhile, the Flameses’ fondness for their Bible’s margins reminded Onyx of his steady hands and meticulous care for tasks, which he passed on at home.<\/p>\n<p>This is where the Frozens and Flameses became one extended family—two capitals: the shop in the front room and a standing arrangement that Christmas alternates with funerals. It’s not written down or talked about, but it has always been there, an unwritten rule of our lineage. We gather here to remember the match we struck in different ways and find common ground in this dining room, where Ruby sits with her music and Onyx with his tools.<\/p>\n<p>The Frozens’ pride and Flameses’ patience are woven into each other’s traditions. Each generation stands as a time—Ruby’s days of practice and the Flames’ careful record-keeping; Onyx’s steady hands on repairs and the Frozens’ proud day book. Our alliance, though subtle, is as deep and enduring as the iron and fire in our lineage.<\/p>"}, {"kind": "page", "label": "Page 36", "chapter": "The Parents: The Joining", "html": "<p>The Frozen line’s work is the small Dallas storefront where my father taught me to fix and understand, just as he learned from his own father. My father&#x27;s shop was more than a place—it was our household&#x27;s economic backbone. The repair bench at its back became not only a tool but also a symbol of trust, where every job entered in his hand carried the weight of our livelihood.<\/p>\n<p>My childhood years saw our family’s economy woven tightly around this daybook and the reputation my father built through meticulous repairs. Each job paid for more than just a repair; it kept the mortgage paid, bought strings for the piano Ruby learned to play, and sometimes even covered school shoes when months were leaner than we could manage.<\/p>\n<p>In thin months, our shop&#x27;s economy was stretched by my father’s own reputation—a capital no bank had ever seen. Each customer understood not only what their instrument needed but also the skill it took in understanding their needs. The certainty of a well-repaired item became synonymous with a family that kept its promises and stood by its work.<\/p>\n<p>Ruby, always keeping her hand on our household books, saw these principles at play. Her careful record-keeping mirrored my father’s daybook: she wrote down not just the cost but also the time it took to mend, the source of materials, and whether they were new or recycled. This practice became a tradition that kept our house standing through thick and thin.<\/p>"}, {"kind": "page", "label": "Page 37", "chapter": "The Parents: The Joining", "html": "<p>In my mother’s hands, the front room became both a sanctuary and a source of stability for our family. Here, she taught piano lessons to children like me, weaving music into every day as it should be—daily practice rather than occasional recitals. The church organ was her daily work there too, a ministry that brought music into the home, filling it with melodies not just on Sundays but in between.<\/p>\n<p>My mother’s labor made all the difference. While my father worked at his small repair shop, she kept our household running smoothly and consistently. Her steady piano lessons and church organ playing taught every child—my siblings, cousins, even those who crossed her threshold as adults—that a home should be sustained by art practiced diligently rather than just occasionally for special occasions.<\/p>\n<p>Her meticulous record-keeping is evident in the balanced family books that she kept herself to the penny. Not only did our household finances stay on track, but every child under her roof was taught discipline and the value of hard work through the daily practice of music.<\/p>\n<p>And with it came another lesson: the choir. My mother’s choir filled our home not just with beautiful music but also with a sense of belonging. It brought us together as a community, and its members learned to contribute to something larger than themselves, just as we all did in the front room.<\/p>\n<p>So, my mother&#x27;s work was both practical and profound, teaching discipline, fostering community, and maintaining our home through art practiced as daily practice rather than an occasional event. Her labor made possible what his shop could not provide, making our life a testament to the value of sustained effort and disciplined living.<\/p>"}, {"kind": "page", "label": "Page 38", "chapter": "The Parents: The Joining", "html": "<p>The small Dallas house my parents built was nestled within earshot of both capitals: the shop&#x27;s sounds at one end of the day, the piano’s melodies at the other, my mother’s students through the front door, and my father’s customers phoning from the back line. Our daily lives were a symphony of routines — music made in the front room, mended repairs in the workshop, and care for our children in that delicate doorway.<\/p>\n<p>This household was more than just four walls; it was a testament to the traditions carried forward by both lines through marriage. The rules we lived by were a harmonious blend of our parents&#x27; philosophies: nothing discarded that could be mended, no debt avoided, every job and every birth recorded meticulously in a book, and everyone fed.<\/p>\n<p>My mother, Ruby Flames, kept her hands on the household books with the same care she used for music. Every entry in those pages — births, deaths, marriages — were hers alone. Her meticulous record-keeping was both practical and profound, fostering discipline and community within our home. She taught my siblings and me to respect every detail of our lives.<\/p>\n<p>My father, Onyx Frozen, brought his steady hands and patience to the repair bench. He instilled a philosophy that no job or debt went unentered — a day book he wrote with Flint&#x27;s meticulous habits but enforced through Pearl’s steady hand. The shop was where we began, but at home, Onyx taught me how to care for tools and tasks.<\/p>\n<p>The house itself was modest, yet it housed our daily lives filled with the rhythms of work and music. We ate well because every meal was recorded in those household books — a reminder that no expense was spared on feeding our family. The rules we lived by were woven into every corner of our small but vibrant home.<\/p>\n<p>Every job counted; each birth marked, and every mended thing kept. This house became our sanctuary, where the traditions of both lines converged to create a place of balance and stability. It was in this framework that I learned the importance of keeping what can be preserved and fixing what needs it — Ruby&#x27;s disciplined hand and Onyx’s steady patience.<\/p>"}, {"kind": "page", "label": "Page 39", "chapter": "The Parents: The Joining", "html": "<p>The joining of our lines through marriage binds us together: Frozen In Flames. The house where we live is a sanctuary that carries the legacies from both sides, each piece passed down with care and respect.<\/p>\n<p>From Jasper’s line comes the doctrine, an unwavering belief in the importance of doing what one can to help others. My father taught me this through his steady hands on the repair bench at home — he never discarded anything but always fixed it first. This legacy lives on in my father&#x27;s patience and carefulness when teaching me how to fix things.<\/p>\n<p>From Coral’s line comes the amendment that people are in our inventory, not just objects. I see this practiced by Ruby in every detail of her life: she keeps a daily record of thoughts and feelings, an act inherited from her mother Jet, who kept household books herself. These pages are not merely records; they are living memories, each entry a testament to the care and concern for those we love.<\/p>\n<p>From Slate’s line comes the keeper&#x27;s rule that the plant does not go down on your watch. This standard of reliability is inscribed in every tool and repair he passed onto me — the steady hands with which he taught me to fix things. The bench my father inherited from Slate has become a symbol, a reminder of the importance of care and precision.<\/p>\n<p>From Opal’s line comes the front room, a place where music was as central to daily life as water. My mother brought this into our home, teaching piano in her front room with lessons that became an integral part of our family routine. It&#x27;s not just music she passed on; it&#x27;s a way of being, a harmonious blend of spirit and craft.<\/p>\n<p>Jet’s legacy is the Bible itself, its columns full of births, marriages, and deaths, carried through generations. These entries are not cold facts but life stories, each line a window into the lives our ancestors lived. The Bible I carry with me reflects the continuity of their lineage — it is not just a book but a living testament to the families that came before us.<\/p>\n<p>Together, these inheritances form the core of who we are as Frozen In Flames: a house where tradition and innovation blend seamlessly, each generation building on the foundations laid by those who came before. The tools, records, and stories of our lines converge in this home, creating a space that celebrates both fire and iron, a sanctuary where<\/p>"}, {"kind": "page", "label": "Page 40", "chapter": "The Parents: The Joining", "html": "<p>In 2000, I arrived with my joined name, Frozen In Flames. Two years later, Opal was born, named for our grandmother, Jet Flames, whose piano she would one day teach on in her front room. The naming echoed twice over: I carried both surnames, the union itself; and Opal held a grandmother’s legacy, preserving continuity.<\/p>\n<p>Both of us were entered in the family Bible by my mother, Ruby Flames, as new generations do. In 2018, when Opal was eighteen, she left home to attend piano classes at the local university, carrying with her not just music but also the family&#x27;s meticulous record-keeping traditions that had been handed down through five decades of her lineage.<\/p>\n<p>As we entered our teens and became responsible for our own inheritance—the tools, books, and stories from both lines—Opal began teaching piano to younger children in our community. She carried on her grandmother’s work and ensured her legacy continued, much as I carry my father&#x27;s steady hands and the Frozen tradition of patience and care.<\/p>\n<p>With Opal gone, the next chapter opens: she has passed the torch, but who will take it from there? The Frozen line must now answer how their children will honor both fire and iron traditions. We are born into a rich tapestry of heritage; now we must weave our own stories that bind us to those who came before us.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 41", "chapter": "My Generation", "html": "<p>2000. I was born in 2000, into a settled Texas family that year. Ruby Flames and Onyx Frozen had joined forces one year earlier, bringing their lines together with a purpose of settling in Dallas. The shop my father ran as Jasper&#x27;s heir was established by then, providing a stable livelihood for the two families. My grandfathers, Slate and Jasper, sat at opposite ends of the front room’s long table, their steady hands guiding work on either side.<\/p>\n<p>The house, painted in shades of cream and wood, filled with warmth from Opal Flames&#x27; piano lessons, where my mother Ruby practiced daily. The day book recorded jobs both inside and outside our home: repairs for those who couldn’t fix it themselves, and tasks that demanded patience like the organ Onyx learned to play. Our house became a living testament to these traditions.<\/p>\n<p>The era of 1975 was marked by the Vietnam War&#x27;s ongoing conflict, but we saw little of it in Dallas. Instead, our focus was on building stability—a place where Ruby could keep her hands steady on piano keys and I would learn Onyx’s patience at the repair bench. The settled family reflected a blend of Flint and Garnet&#x27;s traditions: meticulous record-keeping by Jet Flames, the day book that recorded both repairs and family events; and steady hands from Slate and Jasper, teaching me to fix what needed fixing.<\/p>\n<p>The doctrine my mother carried in her hand was not just an inked line in a Bible but a living testament. It was set against the backdrop of our house, where Ruby&#x27;s work as Opal’s daughter became a record that guided both our children—my father Onyx and I—to inherit these traditions of care and patience. Our birth, like the settled Texas family we joined, brought us into an era marked by its own public events but defined most deeply within the quiet routines of our home.<\/p>"}, {"kind": "page", "label": "Page 42", "chapter": "My Generation", "html": "<p>In Dallas, where my mother Ruby Flames taught her piano lessons from the front room, and I learned to fix things around the small house between the shop and the hospital across town—my father Onyx’s birthplace—it was clear that this place had shifted in importance. By then, it no longer served as our destination but became the shared premise for both the Flames and Frozen lines. Like my mother’s steady hand on the piano bench, I too received the birth of our joined family with a certainty, spending without knowing its full price.<\/p>\n<p>The small house we were born into was not just any home; it housed the traditions passed down from generations: Ruby’s meticulous record-keeping in her front room and Onyx’s steady hands at his repair bench. Here, my mother began writing daily entries to keep chaos at bay, a practice that carried through us. My father recorded all jobs meticulously in his day book, teaching me patience for tasks.<\/p>\n<p>The place where our stories intersected became the backdrop of our home—where Ruby’s work as Opal’s daughter guided her children, and Onyx taught me from steady hands on repairs. Our birth marked an era defined not by public events but by the quiet routines within these walls: music practice, repair work, family meals. Every detail was preserved in household books, echoing the record-keeping that carried us forward.<\/p>\n<p>The shift of Dallas from our destination to our shared premise underscores how we stand as a time together rather than just a set of names. Here, both lines found their ground, and my mother’s birthplace became the center where our families were joined.<\/p>"}, {"kind": "page", "label": "Page 43", "chapter": "My Generation", "html": "<p>In my sister Opal Flames&#x27; world, the harmony she sang was as clear as a fine wine, a gentle whisper that always made us sit up straight at table. She found her voice not only through song but by keeping meticulous books in the Cold Room of our house, a place I still call home. Her hands were just as steady as Ruby&#x27;s and kept even when she taught piano lessons to children on my grandmother’s old Steinway.<\/p>\n<p>Opal’s position was always at the head of the table, where her presence made everyone listen. She could say the unsaid thing and then pass the bread with a smile that never faltered. Her street still reveres her as a teacher, though she no longer teaches in our house. In every generation since my mother, the Flames line has brought music to children who need it most.<\/p>\n<p>Today, I teach piano in our mother’s front room, on grandmother&#x27;s cherished piano, and while we keep traditions, Opal&#x27;s voice is ever-present. The Cold Room remains as it was, a testament to her care and our family’s unspoken bond. Her place at the table is now filled by me, my generation carrying forward the legacy of music in our lineage.<\/p>"}, {"kind": "page", "label": "Page 44", "chapter": "My Generation", "html": "<p>In Chicago, my great-aunt Topaz Frozen left the path set before her—a life in Dallas laid out for her to watch arrive. She married Obsidian Whitfield there at eighteen and worked in the school system for forty years, raising Jasper Whitfield, whose daughter, like her, carries her name into a fourth generation.<\/p>\n<p>The Chicago line is rooted in day books that flower six hundred miles north, on the telephone at Christmas and in the flesh at funerals. My great-aunt Topaz&#x27;s departure marks our family&#x27;s distance from the roots set in Dallas by Flint Frozen, Slate Flames, and Jet Flames. Her life in Chicago is a testament to her resilience and foresight, carrying forward what she knew was possible even when it seemed invisible.<\/p>\n<p>In Chicago, I carry Onyx’s steady hands on repairs into my own work. My days are spent at the bench, learning from him the tradition of patience and care for tasks that he instilled in me. Here, like Topaz in her city, I keep traditions alive: meticulous record-keeping, family gatherings at Christmas, and the unspoken bond between us—a testament to our lineage’s strength across generations.<\/p>\n<p>Across cities and time, we continue the Frozens&#x27; and Flameses&#x27; legacy of keeping what can be preserved and fixing what needs it. My generation carries forward these values in Chicago, just as Topaz did in Dallas. The cold room remains a place for family memories, a testament to our care and the unspoken bond that connects us through time.<\/p>"}, {"kind": "page", "label": "Page 45", "chapter": "My Generation", "html": "<p>Growing up between two lines meant growing up in their work spaces, at home and across town. My childhood rooms were a mix: the shop where my father let me rewire lamps and guitars by nine, inspecting and redoing them until they worked perfectly; and the front room where my mother taught me on the piano, whether I was her son or not.<\/p>\n<p>At one family&#x27;s table I sat as Jasper’s grandson, expected to listen first. At the other, I was Slate’s, expected to have practiced at home before playing with his family. In both worlds, instead of scolding me, they learned to give me broken things—things that had seen more than a fresh coat of paint and could tell a story.<\/p>\n<p>I took my toys apart in the shop to hear what was inside them, finding circuits and wires as I explored the mechanics behind their simple appearance. Both families recognized this fascination; instead of scolding me for disassembling things, they gave me broken objects that I preferred over new ones—each piece telling a tale through its wear.<\/p>\n<p>Both lines’ work spaces became my home: the shop where tools and machines were kept, the front room with the piano at the center. Across these rooms, generations met, each person sitting in their place of practice or teaching, passing down traditions from one line to another. The shop was filled with the sounds of metal clinking on a bench and wires crimping onto circuits, while in the front room, the keys of the piano echoed through the house, a constant reminder of the music that flowed through my mother&#x27;s veins.<\/p>\n<p>The coldness of the shop contrasted with the warmth of the front room; each space brought its own weather—a day’s work for the shop and a different kind of climate inside the home. At times, I would visit both
