whole is a Christmas in the middle of my childhood, at my Frozen grandparents&#x27; house: Jasper at the head, Coral moving between kitchen and table, where her constant presence always felt like home’s heartbeats thumping against mine. My father and aunt Jade argued happily about a radio, their laughter echoing through the house that smelled of machine oil and greens in equal measure — a reminder of both Flint and Garnet&#x27;s handiwork. My mother sat at the piano between courses, her fingers dancing over keys as if she were keeping time to the silent ballet of life, while Slate and Opal Flames sat across from us like visiting delegates from distant years. They brought stories of their own lives and a sense of continuity that felt both welcoming and fleeting.<\/p>\n<p>The children underfoot in this house — my siblings and cousins — moved freely, drawing smiles and tears with their presence. The kitchen table where the bread was passed remained the constant, a symbol of our shared roots and future hopes, even as every adult knew it was only temporary. As I watch now, years later, the dining room still smells of machine oil and greens in equal measure — reminders of both Flint and Garnet’s legacies. My mother&#x27;s hands at the piano have softened over time, but her dedication to record-keeping remains unchanged. The Flames’ table is a place where stories are told, traditions upheld, and family histories woven together.<\/p>\n<p>The tradition we carry ensures no line loses its identity, as my parents&#x27; dining room becomes a tableau of our history. My father&#x27;s patience in repairing broken instruments mirrors Flint’s work ethic, while the Flamels’ meticulous record-keeping echoes Jet’s approach to keeping the family books. Each generation shapes and is shaped by these traditions, creating a tapestry that bridges both lines through generations — carrying our names forward into the future.<\/p>"}, {"kind": "page", "label": "Page 49", "chapter": "My Generation", "html": "<p>The names repeat across our lineage like verses answering each other, echoing the naming law that made them so distinct and powerful. My sister Opal is a stone from our grandmother’s list—a name born of a past that still carries its weight firmly in present-day Dallas. And Topaz Frozen named her Chicago son Jasper for her brother, carrying forward the thread of their shared history and family pride.<\/p>\n<p>My uncle Jet Flames—Jet himself—is a testament to his matriarch’s influence, continuing the line without anyone finding it strange. He carries her name into the male branch with reverence, as if she herself were watching over him from beyond. I am both namesakes themselves, my own name a sentence about us—a living proof that our stories are written in every generation.<\/p>\n<p>The record and the telling agree: our lineage is made legible at roll call by these names. We can hear generations in Topaz’s list, Opal’s stone, Jet’s journey from past to present, all woven together into one seamless tapestry of history. Our genealogy sings through each name, a melody that carries us forward as we continue the family&#x27;s legacy, keeping flames close and repairing our shared history with patience and meticulous care.<\/p>"}, {"kind": "page", "label": "Page 50", "chapter": "My Generation", "html": "<p>In 2018, standing at my grandfather Jasper&#x27;s funeral, I first understood the joined family’s inheritance was something I would carry. The day book changed hands not ceremonially but simply as someone had to enter Jasper&#x27;s death, and it went into a hand that aged like his father&#x27;s. Nobody said the office had passed; it merely shifted, from one generation&#x27;s keeper to mine.<\/p>\n<p>That moment, at eighteen with a plate in my hand, I grasped what carrying this family meant: entering births and deaths, keeping these names alive in hands that could read them. It was then that both books—Ruby’s Flames Bible and Onyx’s Frozen day book—would belong to me, each line&#x27;s contributions woven into the tapestry of our shared history.<\/p>\n<p>The day book I took from Jasper became a part of my own inheritance, passing through me like it had its father before it. As I learned from Jet’s meticulous records and Flint’s careful hand in Pittsburgh, so too would Onyx’s work ethic and patience be passed on to his offspring. The Frozens&#x27; pride and Flameses&#x27; dedication intertwine at the kitchen table of our home.<\/p>\n<p>This birth marks a new chapter; now the next keeper must answer how we continue these names, carry their burdens and blessings through generations to come. Each name I carry is not just a line in a Bible but a promise: keep flames close and repair the history that binds us together.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 51", "chapter": "The Family Trades", "html": "<p>The Frozen line&#x27;s founding trade was keeping other people&#x27;s machines alive: Flint was a millwright and machinist, the man a plant sends for when the line shaft dies, and the trade shaped what that line thought work was in ways it has never escaped. Work, in the founding definition, is not making things. It is understanding things that have stopped, in the presence of the people who depend on them, and returning them to service. Every trade the joined family practices descends from this definition or answers to it.<\/p>\n<p>In Flint&#x27;s Pittsburgh shop, he worked under harsh conditions—calloused by machinery and surrounded by coal dust. His work moved at cold arithmetic pace in steel mills. The air was thick with grit; each job had a specific purpose, but each one demanded patience and precision. Flint brought these skills to Dallas, founding a small repair shop for radios, televisions, and guitars.<\/p>\n<p>In the days when I entered this home, my father Onyx taught piano to half the street’s children and played the organ at church—a role he inherited from his own father&#x27;s meticulous repairs of household tools and machinery. The shop became part of our household economy—my father&#x27;s careful work ethic mingled with mother Ruby&#x27;s meticulous record-keeping.<\/p>\n<p>The repair shop was my childhood heartbeat, where I learned patience and discipline. Onyx’s bench moved every morning, surrounded by his Pittsburgh-era toolbox filled with parts. Each job marked meticulously in his day book—a testament to the care passed down through generations. My mother Ruby kept these records with both manners—household accounts and family Bible entries. The house inherited by Flint carried tools and household books like those kept by Ruby.<\/p>\n<p>At our kitchen table, each line of work intertwined: father’s repair shop bench and mother’s piano lessons. Both taught patience, discipline, and care. I practiced these traditions at the kitchen table, keeping hands on both lines’ work ethic and record-keeping. As a child, my birth marked this new chapter; now the next keeper must answer how we continue these names, carry their burdens and blessings through generations to come.<\/p>\n<p>The doctrine of three generations joined through Flint’s Pittsburgh and Garnet&#x27;s Mississippi was strong; both families maintained their traditions meticulously—Ruby Flames&#x27; piano lessons and Onyx Frozen&#x27;s shop practices. Topaz Frozen left Dallas for Chicago but carried her great-grandmother&#x27;s name, setting an example<\/p>"}, {"kind": "page", "label": "Page 52", "chapter": "The Family Trades", "html": "<p>In my grandfather Jasper’s day, he was a toolmaker, much like his own father Flint had been in Pittsburgh—a skilled craftsman who kept machines running but went one remove further into precision by crafting the tools that made those machines work. The skill passed from hand to hand, honed and refined over decades—measuring twice, entering it all carefully in the books that both families held dear.<\/p>\n<p>What Jasper transferred to my father Onyx was not just his skill but a standard—a unwavering dedication to precision. In Flint’s shop, he saw machines running smoothly; in Jasper&#x27;s hands, tools took on an almost sacred quality—each one built with care and exactitude, ensuring no work went undone until every detail matched the meticulous standards that my mother Ruby kept.<\/p>\n<p>The family&#x27;s trades have evolved over time—from the mechanized era of Flint to the precision tools Jasper made for machines—and each generation has taken these skills further. The skill remains, but it’s held to a standard—measured and recorded not by hands or eyes, but by numbers and records that pass between generations like a thread through the fabric of our lives.<\/p>\n<p>Today, Onyx repairs radios and electronics on his bench at home in Dallas, just as Jasper had before him—a master craftsman who holds no job and no debt unentered. He teaches this standard to me, showing how meticulous record-keeping ensures nothing goes undone, passing down a legacy that never loses its focus or purpose.<\/p>\n<p>The doctrine of our line lives on through these hands, carried by the people we teach—Jasper’s toolmaking precision, Flint&#x27;s careful measurement, and now Onyx&#x27;s unwavering commitment to detail. It is this unyielding standard that keeps the family flame burning strong across generations.<\/p>"}, {"kind": "page", "label": "Page 53", "chapter": "The Family Trades", "html": "<p>The bench line traces back through my father Onyx Frozen’s hands to Flint Frozen, where his work demanded meticulous measurement for dead machines. Like Jasper, he learned this skill under harsh conditions in Pittsburgh&#x27;s steel mills. Flint brought these skills to Dallas with him, founding a repair shop for radios and televisions.<\/p>\n<p>Onyx inherited this tradition from Flint, translating it into electronics—a trade that added music to the Frozen business for the first time. He carried on his father’s meticulous habits, teaching patience: every kid on the street who hung around his bench got handed the next heavier thing—just as my father taught me by example.<\/p>\n<p>In our house, Onyx&#x27;s shop became a heartbeat of my childhood, surrounded by his Pittsburgh-era toolbox full of parts. The shop’s work demanded precision and care—a mirror of Flint’s iron discipline and Jasper’s measured approach to measurement. Onyx’s careful day book marked each job meticulously, just as Flint did for decades.<\/p>\n<p>Here, in the Dallas cold air, he defined a new standard—family keeps what it can fix, and fixes what it keeps. This doctrine held true through generations: topaz Frozens left Dallas for Chicago but carried her great-grandmother&#x27;s name. The shop became part of our household economy, ensuring no line lost its identity.<\/p>\n<p>The doctrine lives on in my hands; both traditions passed down to wife Amber as she taught piano lessons and kept records with meticulous care. As I sit here today, the work of Flint, Jasper, and Onyx still burns strong—both lines united by this unyielding standard.<\/p>"}, {"kind": "page", "label": "Page 54", "chapter": "The Family Trades", "html": "<p>The work of the Flames line ran first in fire and second in music: Garnet kept boilers and furnaces, the buildings&#x27; hidden fires; Slate translated this keeping into heating and refrigeration, the century&#x27;s cold machinery. Through Opal, the line took up its second trade, teaching music, which her daughter Ruby carries on today.<\/p>\n<p>I grew up with these trades side by side: my father Onyx’s small repair shop bench in one room, and mother Ruby’s piano lessons in another. The furnace keeper’s ear needed the same discipline as a radio fixer&#x27;s; both demanded precision, care for what might break. Neither job was easy but each required patience.<\/p>\n<p>Opal, my grandmother, kept these trades with her careful hand on both lines—piano teaching and family record-keeping. Ruby carried this legacy on: keeping household accounts in the Frozen manner alongside Bible entries in the Flames tradition. Each entry marked a milestone, no detail lost through generations of care.<\/p>\n<p>My childhood house combined the work ethic from Flint’s Pittsburgh and Garnet’s Mississippi: Onyx&#x27;s shop taught me patience as I repaired dead guitars, while Ruby kept meticulous records with her careful hand on both lines. The doctrine lives on in my hands—both traditions passed down to wife Amber as she taught piano lessons and kept records with meticulous care.<\/p>\n<p>As a child, I practiced these trades at the kitchen table: father’s shop bench and mother&#x27;s piano lessons. Both taught patience, discipline, and care. Today, my work continues this unyielding standard set by Flint, Jasper, and Onyx—both lines united under the doctrine that keeps flames close.<\/p>"}, {"kind": "page", "label": "Page 55", "chapter": "The Family Trades", "html": "<p>In 1949, my great-grandfather Slate Flames kept the mill’s furnaces humming in Holly Springs, and Jet Flames meticulously recorded each birth, marriage, or death from their house to her family Bible until she passed it on. I learned this tradition and carried it forward with care: listening first, understanding what is before me, returning it to service, entering every detail into my Cold Room’s log.<\/p>\n<p>My father Onyx Frozen taught me the art of patience and discipline at his Dallas repair shop bench, where he meticulously marked each job in a day book. I practiced these trades at our kitchen table with both lines’ work ethic and record-keeping: Ruby Flames&#x27; piano lessons for the mother side and Onyx’s meticulous repairs for the father side.<\/p>\n<p>The Cold Room studio became my labor of love, preserving performances that might otherwise fade away. It is not a break but a translation from Slate&#x27;s furnace to mine: listen first, understand what is there, return it to service in the digital age, enter it all into our log and record. Like Jet’s meticulous entries over fifty years, my Cold Room captures each performance that enters its space.<\/p>\n<p>As I carry on this work today, both families still recognize these postures even where they do not know the modern equipment. The family Bible continues to grow with my records alongside Ruby&#x27;s, maintaining their lineage intact for future generations. Just as Slate’s furnace kept a city working and Jet’s hands wrote the record of lives, so too does mine preserve the songs that come through its door. We keep flames close in our Cold Room log, ensuring no performance fades but rather is recorded, listened to, understood, returned to service, and logged for posterity.<\/p>"}, {"kind": "page", "label": "Page 56", "chapter": "The Family Trades", "html": "<p>In 1947, Flint and Jet brought their skills to Dallas, establishing a repair shop that became the cornerstone of our Frozen lineage. Slate’s furnace kept a city running, while Jet’s hands wrote the record of lives—births, marriages, and deaths in her meticulous family Bible. Ruby Flames kept household accounts in her meticulous manner as she taught piano lessons to children on both lines.<\/p>\n<p>Opal&#x27;s work is double: singing harmonies and teaching piano. She began with our mother, Ruby, in our grandmother’s front room. Fees were modest, akin to a cake and eggs in modern terms. By adolescence, Opal took over the Cold Room’s books, installing a log habit that lasted well beyond her tenure. The studio’s paperwork still runs on Opal&#x27;s forms.<\/p>\n<p>The combined family linearity is exemplified by Opal, who bridges Flames&#x27; music and Frozen&#x27;s bookkeeping. We regard this joining working exactly as designed. As we enter 2000, the Cold Room has become our family&#x27;s workspace, a place where harmony meets mechanics. My sister Opal’s work here ensures no performance fades but is instead recorded, listened to, understood, returned to service, and logged for posterity.<\/p>"}, {"kind": "page", "label": "Page 57", "chapter": "The Family Trades", "html": "<p>The work ethic deposited in our lineage through the trades taught us that being sent for was the highest honor. We were to be the one whose name is spoken when a machine stops, or a choir, a session, or a household&#x27;s need arises. It demanded we arrive with our tools, listen before touching, document what we found, charge honestly, and leave things better than we had encountered them.<\/p>\n<p>This ethos was not glamorous but it has always been an honor to be called upon by neighbors and friends. We were employed for four generations, which the family counts as an honorable status. It taught us patience, discipline, and care, and instilled a deep sense of responsibility in each generation. The doctrine held firm through Flint’s Pittsburgh shop and Garnet&#x27;s Mississippi mill, passing down through the ages to our parents&#x27; repair shop and my childhood rooms.<\/p>\n<p>My father Onyx Frozen’s meticulous work ethic at his Dallas shop taught me patience and discipline; Opal&#x27;s piano lessons nurtured my musicality and refined my touch. Each generation learned from their predecessors and adapted it to fit their circumstances, yet the core tenets remained constant: arrive with your tools, listen before you touch, document what you found, charge honestly, and leave things better documented than you found them.<\/p>\n<p>The doctrine of being sent for has become the cornerstone of our family&#x27;s work ethic. It ensures no skill goes unlearned or unnoticed; every task is recorded, understood, and returned to service. Our kitchen table remains a place where harmony meets mechanics, reflecting this joined lineage of trades from Flint’s Pittsburgh to Garnet&#x27;s Mississippi. The doctrine holds true even as we practice these traditions in different generations, each passing it down with new understanding and wisdom.<\/p>"}, {"kind": "page", "label": "Page 58", "chapter": "The Family Trades", "html": "<p>The toolbox of Flint Frozen holds a silent testimony to his handiwork and dedication. Each fitted slot still bears the marks of tools passed down from generation to generation—a hammer, pliers, wrenches, and more. These items, like pages in a book, hold the history of Flint&#x27;s work at the first Dallas plant, where he started as a young man calloused by machinery’s cold embrace. The iron from his soldering station, once heated and now still hot, is a cherished memento of a line that values its tools. For Onyx Frozen, it was not enough to keep this tool; he retained the day books—carefully filled with each job&#x27;s details, every promise made and kept. These records are like a ledger in his hand, marking the passage from Flint’s Pittsburgh plant to Dallas, where they were joined under the same roof.<\/p>\n<p>In my mother Ruby Flames&#x27; front room stands the piano that she inherited. The instrument is played daily by her sister, teaching future generations the art of music that was passed down through their matriarch Jet&#x27;s careful hands. Each note carries a piece of the past—Jet’s love for her craft and its role in the family’s legacy. This piano testifies to Flint’s trade line from Pittsburgh to Dallas, joined with Ruby’s lineage into our present home.<\/p>\n<p>Jasper’s measuring tools went on to Jasper Whitfield in Chicago, following their namesake’s directive. This is how we keep our families’ affection: not just through stories but through the objects that have carried us forward across generations. These tools speak of Flint and Onyx and my sister Ruby—each line a chapter in the larger story of this family&#x27;s hands and their legacy. The pages are filled with trades, memories, and love, all held as irreplaceable treasures by those who keep them close to their hearts.<\/p>"}, {"kind": "page", "label": "Page 59", "chapter": "The Family Trades", "html": "<p>At our kitchen table where stories but through the objects that have carried us forward across generations, I am reminded of the trades we lost and those handed down. The founding ones are gone: millwrighting, the keeping of great belt-driven machines, died under the Frozens as their steel mills gave way to mechanized factories; furnace-keeping died under the Flameses as the boilers were replaced by systems with no fire in them to keep.<\/p>\n<p>The cost was not income — each generation found the next remove — but a kind of certainty: Flint and Garnet knew exactly what their work was for, in a way the rest of us, translating and reconstructing again, have had to recreate. My mother Ruby kept these founders&#x27; tools partly as evidence that the certainty existed.<\/p>\n<p>My father Onyx&#x27;s line began with millwrights in Pittsburgh. Flint worked there as a machinist before moving to Dallas after wartime service. He founded our repair shop with his skill, but over time, newer technologies replaced older trades, leaving us with less tangible work to pass on. My brother Jasper followed the Frozen lineage, born in Dallas and trained as a toolmaker all his working life.<\/p>\n<p>The Frozens&#x27; trade was the millwrighting that brought Flint to Dallas, which later gave way to machinery. The Flames’ furnace-keeping moved us away from coal dust into cold air, but still kept their legacy alive through meticulous records. Both lines hold onto what they can fix and keep, maintaining the standard of work and repairing what they inherit.<\/p>\n<p>In my childhood home, I witnessed both traditions at our kitchen table: father’s meticulous repair shop bench and mother’s careful piano lessons. The Frozens’ pride and Flameses&#x27; patience intertwined at our family&#x27;s heart. The house we grew up in combined two families&#x27; traditions, ensuring no line lost its identity. My parents taught me their trades with patience and discipline.<\/p>\n<p>The tradition holds that a family keeps what it can fix, practices with no strings attached, and passes down the name of Flint and Garnet through generations. Ruby’s meticulous record-keeping preserved both lines’ history in her family Bible, while Onyx’s careful shop became part of our household economy. The doctrine of three generations joined through Flint’s Pittsburgh and Garnet’s Mississippi is strong. My father&#x27;s patience taught me discipline; my mother’s piano lessons ensured I kept hands on both lines&#x27;<\/p>"}, {"kind": "page", "label": "Page 60", "chapter": "The Family Trades", "html": "<p>The joined family&#x27;s line of work stands now in a converted icehouse and a front room: the Cold Room, rebuilt after its fire, where I record other people&#x27;s music to the standard my father set for radios; and my sister&#x27;s piano lessons, which she gives to the children of her street in a direct descent from her grandmother Opal&#x27;s front room that nobody arranged and everybody recognizes. The trades will translate again -- they always have.<\/p>\n<p>At my age now, I watch not just the skill but whether the standard survives the translation. In this evidence available to me, it does. Ruby’s meticulous record-keeping preserved both lines&#x27; history in her family Bible. Onyx’s careful shop became part of our household economy, ensuring no line lost its identity. The doctrine held strong: keep what can be fixed and practice with no strings attached.<\/p>\n<p>Topaz left Dallas for Chicago but carried her great-grandmother&#x27;s name, setting an example for future intergenerational ties in Chicago. My childhood rooms divided by purpose—father’s repair shop bench and mother’s piano lessons. Both taught patience, discipline, and care. I practiced these traditions at the kitchen table, keeping hands on both lines&#x27; work ethic and record-keeping.<\/p>\n<p>This joining of three generations is strong. Flint&#x27;s Pittsburgh and Garnet&#x27;s Mississippi are inscribed in our family Bible. My father’s patience taught me discipline; my mother&#x27;s piano lessons ensured I kept hands on both lines’ work. At the end of this page, we pass hands to the next generation: a birth, a leaving, an inheritance changing hands, or a question the next chapter must answer.<\/p>\n<p>Where will these families go? What new standards will they set, and how will their children practice patience, discipline, and care? The trades line passes from me as I prepare for my own child.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 61", "chapter": "Houses, Heirlooms, and Records", "html": "<p>In 1949, Jet Flames ruled her family’s Bible, a heavy tome bound in boards with leather re-backed once. Her hand filled its first fifty-two years, precise as she documented births, marriages, and deaths. Slate&#x27;s followed after hers, heavier yet steady as his copperplate script came back. My mother Ruby then wrote in the margins, small but exact; my turn now to keep these pages smallest in her hand.<\/p>\n<p>The Bible testifies: Jet’s careful, even-handed record-keeping ensured no detail was lost. She kept births and marriages, marked deaths with quiet respect, and all passed into Slate&#x27;s hands as he filled his columns after her. Ruby&#x27;s meticulous entries joined ours here, our hand writing last but smallest in its margins.<\/p>\n<p>The book is more than a Bible; it’s the Flames line’s constitution in three columns: case law for every birth, marriage, or death that passes through my mother&#x27;s hand now. Each page holds a story—Jet’s carefulness, Slate’s steadiness, and Ruby’s meticulous attention to detail. The record stands beside the family telling, where entries agree with our stories of ancestors. Here, Jet’s care becomes case law, as she documented every life in her hand.<\/p>\n<p>The Bible speaks, its testimony unspoken by words: Jet&#x27;s careful hands held the line&#x27;s heartbeat through births and deaths. Slate&#x27;s steady strokes marked each family milestone, ensuring no memory slipped away. Ruby’s meticulous entries hold them all here now, a testament to her care, as she wrote last but smallest in her mother&#x27;s hand.<\/p>\n<p>The record stands beside our telling; it holds case law for every birth, marriage, or death that passes through my mother’s careful hands today.<\/p>"}, {"kind": "page", "label": "Page 62", "chapter": "Houses, Heirlooms, and Records", "html": "<p>The Frozen records are day books: a shelf of ruled ledgers running from Flint’s first Dallas job in 1947 to my father&#x27;s entries this year, every job entered, described, and priced, every failure entered with its cause. Where the Bible knows who the family was, these day books know what we did on ten thousand ordinary days -- which is more in bulk but less in meaning for a joined family that needs both kinds of knowing.<\/p>\n<p>My own session logs are the day books&#x27; fourth generation, kept on the same rule my great-grandfather kept: a thing not written down has not been learned, only survived. The entry for today, as with all days, describes and prices our repair work—every job marked from A to Z, its price in dollars and cents, every failure noted with its cause. It&#x27;s more than just numbers; it’s the fabric of Flint&#x27;s work ethic, passed down through five decades.<\/p>\n<p>The day books testify not only to Flint&#x27;s meticulousness but also to his pride: each entry is a testament to the hours spent on a job well done or a fix that could have failed. They hold the legacy of every piece of machinery we’ve repaired and returned to service, from radios and televisions to guitars—a reminder that even in an era of technology, there’s still something special about fixing things ourselves.<\/p>\n<p>The Bible with names entered in my mother Ruby&#x27;s hand holds her version of these days: the births, marriages, and deaths marked by her careful hand. They are more than just entries; they&#x27;re a family story passed through generations like a river flowing from Flint to me, ensuring no memory slips away. Ruby’s entries hold them all here now—testaments not only to her care but also to her role in keeping the names alive.<\/p>\n<p>The tradition of writing everything down ensures neither line loses its identity. Onyx&#x27;s meticulous repair work taught me patience and discipline, while Ruby’s careful piano lessons combined with Onyx’s records ensured both lines practiced the same virtues of patience and discipline. I practiced these traditions at our kitchen table—fusing Flint’s shop bench with Ruby’s lessons.<\/p>\n<p>The doctrine holds strong: keep what can be fixed and practice without strings attached. The day books&#x27; entries are case law for every birth, marriage, or death in my mother&#x27;s careful hand today. As a child, I learned the importance of detailed<\/p>"}, {"kind": "page", "label": "Page 63", "chapter": "Houses, Heirlooms, and Records", "html": "<p>In my keeping sits Flint&#x27;s toolbox, an iron-bound chest made by a carpenter like my great-great-grandfather. The slots are worn bright where tools have slid home ten thousand times. Some belong to Flint himself, initialed in the machinist’s punch; others were Jasper’s, added when the chest stood at his bench. One wrench is my father&#x27;s, a testament to us all.<\/p>\n<p>It is not a relic in a case. It is a working object that three generations have reached into and kept alive. The testimony is plain: this family measures its continuity not in blood but in custody -- who was trusted to keep the box. Ruby Flames’ careful hand with her piano lessons combined with Onyx Frozen’s meticulous records ensured neither line lost its identity, keeping the flames close.<\/p>\n<p>The boxes held by each generation tell a story of trust and custodianship, passing down through Flint, Garnet, Slate, Pearl, and finally to me. Each slot worn bright bears witness to the family&#x27;s journey from Pittsburgh to Dallas, ensuring no detail is lost and every line retains its identity. The toolbox’s testimony echoes the lessons handed down: keep what can be fixed and practice with no strings attached.<\/p>\n<p>This object, Flint’s chest, carries not just a name but a promise of continuity that transcends blood ties. It stands as our lodestone, a reminder to always trust those entrusted with keeping us together, passing down through generations without losing its purpose or identity.<\/p>"}, {"kind": "page", "label": "Page 64", "chapter": "Houses, Heirlooms, and Records", "html": "<p>The object that carries the Flames line&#x27;s memory is the piano: a grand upright bought used from Opal Reyes into my great-grandmother Ruby Flames&#x27; household before she was born as Opal Flames. It stood in her front room, played by her through fifty years of lessons and services until her passing. This same piano now stands in my mother&#x27;s house still, passed down not just physically but through generations of memory and practice.<\/p>\n<p>I inherited this grand instrument, a testament to the Flamers&#x27; dedication to music. When money was shortest during Amber and I’s thin years, it was she who restated the rule the line has always lived by: some things are not the accounts&#x27; business. The piano stands in my mother&#x27;s front room still, her hand smoothing the keys as if they were her own.<\/p>\n<p>My sister teaches the street’s children on its keys today, carrying forward the Flamers’ legacy of music and record-keeping with each lesson she imparts. The object that carries the Flames line&#x27;s memory remains a constant, a silent witness to our lineage&#x27;s dedication to both fire and music, keeping what can be fixed and practicing with no strings attached.<\/p>"}, {"kind": "page", "label": "Page 65", "chapter": "Houses, Heirlooms, and Records", "html": "<p>In 1973, Onyx Frozen took Flint’s first shop in a bustling Dallas plant and transformed it into a testament to patience and care. Here, he honed his skills under harsh conditions, mastering the art of machinery with precision and dedication. The daybook my father kept was meticulously marked, each entry a promise made to the customer whose machine needed fixing.<\/p>\n<p>The years passed, and the shop became a heartbeat of our lives. My mother Ruby taught piano lessons to half the street&#x27;s children as we moved into rented rooms near these bustling plants. Her meticulous records in her Bible were an extension of both sides&#x27; traditions—Flames for her teaching and Frozen for her meticulous record-keeping.<\/p>\n<p>As the years went by, Onyx’s shop became a testament to Flint’s legacy and Ruby’s teaching. The house my parents built with decades of their wages was our sanctuary—where we raised our children under the watchful eye of the plant just across the street. Here, work and home intertwined in the front room where both sides kept their traditions.<\/p>\n<p>I grew up between these worlds—the shop where father practiced his iron skills and mother’s piano lessons, each a reflection of her side&#x27;s dedication to record-keeping. The house we called our own was not just any home but an archive—where every detail was preserved through meticulous record-keeping in both hands: Ruby’s for the family Bible and Onyx’s for the daybook.<\/p>\n<p>The joining of these lines is visible in the succession of roofs, each marking its era&#x27;s economics honestly. Rent for the early years, wages from Flint’s and Garnet’s labor, trade as we moved into rented rooms near the bustling plants, and keeping our traditions intact—our family becomes an archive through every roof that marks a generation.<\/p>\n<p>The doctrine that keeps both lines alive—the Frozens&#x27; iron work and Flamers&#x27; musical lessons—are practiced in each room of this succession. The shop bench where father’s patience was honed, mother’s piano lessons carried forward by her children, and the house as our sanctuary—each place echoes the commitment to keeping what can be fixed and practicing with no strings attached.<\/p>\n<p>We have always lived within earshot of our work, whether it&#x27;s the sound of machinery in the shop or the melody from mother’s piano. Each generation adds its chapter to this book of record-keeping, ensuring that neither line loses its identity<\/p>"}, {"kind": "page", "label": "Page 66", "chapter": "Houses, Heirlooms, and Records", "html": "<p>In this house where we have always lived, the paper memory of our joined lineage extends beyond the two sets of books into letters and photographs. Topaz&#x27;s letters from Chicago are carefully kept in a labelled box, each one a glimpse into her life far from home, testament to her journey and the connection she has with us.<\/p>\n<p>My mother&#x27;s lesson books and choir lists carry a thread of music through generations, reminding me of the piano lessons we had together and the church duties that shaped our family. I inherited these records as part of my inheritance: a tradition handed down by my grandmother Ruby Flames, who kept them meticulously in her hand.<\/p>\n<p>Coral’s annotated accounts reveal a meticulous side, one shared with my father Onyx Frozen, who ran his Dallas repair shop diligently through decades, marking each job in his day book. I carry forward the family&#x27;s commitment to record-keeping—both sides of our lineage have done so for generations.<\/p>\n<p>In this present generation, Amber has added her own touch, photographing every room we&#x27;ve worked in over the years and creating a visual index that matches the family story. This is not just an archive but a living testament to who we are, what we do, and how much care we take with our work. She keeps these photographs, ensuring no detail of this family&#x27;s history is lost.<\/p>\n<p>The keeping of all of it was women&#x27;s work in the first generations, passed down by Ruby Flames and Pearl Frozen as they wrote everything down—births, marriages, deaths, household events. It was a default and training for me: raised by people who wrote things down, never once considering that a family might not write its history.<\/p>\n<p>From Flint Frozen to Garnet Flames, from Pittsburgh to Holly Springs, our lineage traces through time with a record-keeping conscience and a refusal to discard anything of importance. Each page is an heirloom—letters, photographs, lesson books, accounts, and now Amber’s prints—that carry the story forward, ensuring no line loses its identity in this house where we have always worked.<\/p>"}, {"kind": "page", "label": "Page 67", "chapter": "Houses, Heirlooms, and Records", "html": "<p>In 2016, Slate Flames died at my grandmother’s side in Oak Lawn Cemetery. He had a quiet end as usual; Flint, his Pittsburgh father, would have appreciated that too. His standard of work remained intact even after his passing, carried by Onyx Frozen and me.<\/p>\n<p>Like my father’s day book, I keep session logs: every practice, every tuning, every song played or not — in the minute, as he taught me to do. The records from the Cold Room are now stored on Amber&#x27;s prints, who inherited them from her mother Ruby.<\/p>\n<p>My own generation&#x27;s record is kept here, alongside our family Bible and Onyx’s day book. Each line corrects each other: Flint&#x27;s trade of precision and patience in Pittsburgh, my father’s meticulous work ethic in Dallas, my own minute-by-minute practice. These three archives ensure no detail is lost.<\/p>\n<p>When a future keeper reads the logs, they will know what we did as musicians — who played with whom, who loved music or who didn’t. The Bible keeps our lineage and Amber&#x27;s prints keep her mother&#x27;s records; Onyx’s day book tracks his work through time. Together, these three archives correct each other and ensure no line loses its identity in the Cold Room.<\/p>\n<p>The doctrine of keeping what we can fix and fixing what we keep remains strong—both my father’s bench at his Dallas shop and Ruby’s piano lessons combined in our house. A refrain returns: carry the newer facts and shifted understanding, fresh wording that means something new.<\/p>"}, {"kind": "page", "label": "Page 68", "chapter": "Houses, Heirlooms, and Records", "html": "<p>The archives&#x27; gaps are specific and still felt, echoing the loss of Flint’s wartime shop notebooks, left with a Pittsburgh landlady in 1946 and never recovered, so the Frozen line&#x27;s founding skill is documented only from Dallas; the Flames line&#x27;s Mississippi years before 1949, which are telling but not recorded, because Jet began her Bible in Texas and entered the Mississippi dead from memory. We keep these gaps as they are: a family that records its losses keeps them from becoming inventions.<\/p>\n<p>A toolbox carries the story of Flint Frozen’s Pittsburgh shop, with his tools still here, though some were lost to Pittsburgh coal dust. The repaired guitars at Onyx Frozen&#x27;s Dallas shop bear witness to the same precision and patience he learned under Flint&#x27;s bench in Millersville.<\/p>\n<p>In our house, a copperplate script from my mother Ruby Flames’ hand marks the family Bible entries: birth dates, marriage anniversaries, death records. Jet’s meticulous record-keeping ensured her line’s legacy was preserved; Pearl’s day books kept the Frozen line intact until she passed away in 1999.<\/p>\n<p>The topaz Frozens&#x27; box of Topaz&#x27;s early Chicago letters from the eighties, water-damaged and lost to damp, is entered here as a gap: a family that records its losses keeps them from becoming inventions. Each entry tells a story we keep from our mother Jet’s memory and her careful record-keeping.<\/p>\n<p>As I hold my mother&#x27;s hand in these pages, I carry the newer facts and shifted understanding, in fresh wording that means something new. A refrain returns changed: carry the newer facts and the shifted understanding, in fresh wording that means something new.<\/p>"}, {"kind": "page", "label": "Page 69", "chapter": "Houses, Heirlooms, and Records", "html": "<p>The record and the telling disagree most famously about the river: Garnet Flames and Jet came down it to Dallas, according to their family’s narrative; whereas the geography, railway timetables, and a surviving ticket stub in Jet&#x27;s papers suggest they arrived by rail from Holly Springs, west and slightly south. We live with this difference as we do with most of our inheritances: the record is right about the journey and the telling is right about the meaning.<\/p>\n<p>Arriving in Texas felt like a river had delivered them out of a shrinking town into a growing one. This sentiment remains the core of how they saw their arrival. The record notes the railway route, but arriving by rail was just as symbolic for a family born under Mississippi’s furnace skies. We keep both facts and meaning: the geography shows the journey took place by train; the telling imbues it with a profound feeling that settled into their bones.<\/p>\n<p>This is written in my mother Ruby Flames’ careful hand, marked with my father Onyx Frozen&#x27;s meticulous records of his workbench. I have entered both in our family Bible, labelled. It’s not just a footnote; it’s mine. The book holds the record and the telling, showing how we live between them.<\/p>\n<p>The doctrine that neither line loses its identity is as strong as ever: carry the newer facts and the shifted understanding, in fresh wording that means something new. A refrain returns changed by each era that speaks it. Ruby kept these lessons, just like Jet and Garnet did their careful record-keeping. Onyx taught me patience at his shop bench; I learned from him to mark each job meticulously as he did.<\/p>\n<p>The doctrine remains a guide in my life: keep what can be fixed and fix what can’t, pass on the tradition of meticulousness. As I hold my mother’s hand in these pages, I carry the newer facts and the shifted understanding, in fresh wording that means something new.<\/p>"}, {"kind": "page", "label": "Page 70", "chapter": "Houses, Heirlooms, and Records", "html": "<p>The family&#x27;s records and heirlooms are in my keeping now, and I was not chosen so much as fallen to: I am the one who writes things down, the keeper by habit, trained by a father with a day book and a mother with a Bible. The custody is understood in the family to be an office, not a possession -- the books are in my house the way the toolbox is in my house, in trust for my sister, for the Chicago young, and for keepers none of us will meet. Opal holds copies of everything essential. The Chicago branch holds its own papers.<\/p>\n<p>I have a toolbox that testifies to the Fires&#x27; trade: it sits at the door of our house, polished wood with rusted fasteners, keys in its side pocket. It is as much part of this home as any other heirloom, and it has seen it all. Inside, tools of every kind line shelves — wrenches for tightening, pliers for gripping, screwdrivers to loosen and secure. The hands that used these tools were the ones who kept Flint&#x27;s records in Pittsburgh: calloused from machinery&#x27;s cold embrace, they marked each job with precision. The day book was Flint&#x27;s habit, but it took Pearl&#x27;s enforcement to ensure no entry went lost.<\/p>\n<p>My mother Ruby&#x27;s hand still writes in the Bible she inherited — her father Slate&#x27;s careful script and my grandfather Flint&#x27;s meticulous entries intertwine on its pages. These books have seen generations of Flames: Jet’s wife kept them until she passed, and now I carry this responsibility, not as a possession but an office handed down.<\/p>\n<p>As I write these words today, the toolbox testifies to the trade that binds us — a practice passed through Flint&#x27;s Pittsburgh shop and Slate&#x27;s Dallas home. These tools were what my father Onyx taught me at his bench: each job marked in careful detail. The doctrine of three generations joined through Flint’s Pittsburgh and Garnet’s Mississippi remains strong; topaz Frozens carry this identity.<\/p>\n<p>The archive, like the family, survives by being distributed — Opal holds copies for the Chicago branch, ensuring no line loses its identity. As I look around my home today, filled with tools and books from both sides of our lineage, it feels right to pass these records on, just as they were passed down before me.<\/p>\n<p>In this house, a birth has happened. The next<\/p>\n<hr>"}, {"kind": "page", "label": "Page 71", "chapter": "Hard Years and Partings", "html": "<p>In 2018, my grandfather Jasper Frozen passed away at home, with his beloved tools by his side as he had wished. He was seventy, a man of simple tastes and quiet dignity who lived life to its fullest on his small Dallas repair shop bench. The day book remained open on the bench where he worked, revealing a job half-entered—a testament to his meticulous nature and the care he put into every detail.<\/p>\n<p>Afterwards, what stayed in our house was not just the physical items but the methods that defined us as a family: the customers of three generations who had come to pay their respects in work clothes, and my father’s entry in the day book. My mother finished the death entry in the Bible, sealing it with her careful hand, ensuring no memory slipped away.<\/p>\n<p>Together, these entries marked our method—one page of sadness that defined us as a joined family. The day book held more than just a job; it was a reminder of Jasper’s work ethic and his enduring influence on my father. And in the Bible, each entry became not just a record but a story, passing down from generation to generation.<\/p>\n<p>In this house, where every piece has its place and every line holds significance, we honor Jasper’s memory by keeping what he held dear: his tools, his day book, and the standard that shaped us all. The Bible continues to hold our stories, written with both hands—my mother’s meticulous entry in her hand and my father’s steady work on the bench.<\/p>\n<p>My grandfather&#x27;s passing was a hard year for us, but it also marked a pivotal moment where we reaffirmed our commitment to keeping flames close. Through these entries, we remember him not just as a family patriarch, but as a mentor whose legacy lives on through us.<\/p>"}, {"kind": "page", "label": "Page 72", "chapter": "Hard Years and Partings", "html": "<p>My grandfather Slate Flames died in 2016, two years before Jasper, of the lungs he spent fifty years testing. He was seventy, a life marked by the constant demands of his trade — the furnace and the refrigeration work that defined him. His passing wasn’t just a number but the close of our line’s memory of Mississippi.<\/p>\n<p>Slate’s departure in 2016 marked an end to our family&#x27;s recollection of Holly Springs, where he was born as a three-year-old immigrant in his own country — a life lived through stories passed down by my mother Ruby Flames. Slate was the last living Flame to bear this origin story; with him, the line’s past became history rather than living memory.<\/p>\n<p>My mother played the organ at his funeral, just like her father did at his. It was on my grandmother Jet’s church organ, and she taught Ruby how to play it meticulously. My grandmother also taught her mother the art of keeping family records in a meticulous hand — entries that passed down through generations were written by her, then by Ruby.<\/p>\n<p>Slate’s death closed our line&#x27;s connection with Mississippi, leaving only the telling and record-keeping as our bridge back home. The Bible entry was his last act of care for the lineage he had built; it was written in my grandmother Jet’s hand, a testament to the importance she placed on passing these records down.<\/p>\n<p>The funeral scene encapsulates the tension between Slate&#x27;s legacy and its fading: the organ playing mourns not just Slate but also the origin story of our line. It is a poignant reminder that while the family has moved beyond Mississippi, the connection remains in the stories and records we keep.<\/p>\n<p>Slate’s death was more than a number; it was the closure of our line&#x27;s memory of Holly Springs, his origin, and the living thread of our history passed through my mother Ruby’s hand.<\/p>"}, {"kind": "page", "label": "Page 73", "chapter": "Hard Years and Partings", "html": "<p>In 1992, Flint Frozen first arrived, a young man just out of wartime service. His work was meticulous as he learned to repair radios in Dallas&#x27;s early days, his hands calloused by cold steel and hot solder. The shop where Jasper worked had already begun, the tools scattered across the bench waiting for Flint’s touch.<\/p>\n<p>Jasper finished his day book with Flint&#x27;s entry, leaving behind a job that would be passed on to future generations. That same year, Garnet Flames arrived in Dallas with Jet, settling into a rented room near the first plant Flint worked at. His work as a furnace keeper brought them both into the city where their children would one day find solace.<\/p>\n<p>Jet kept her family&#x27;s records faithfully until 1996, when she passed away peacefully, the hand that had written all these years still steady. Pearl&#x27;s accounts were completed by Coral’s office, passing down to the next generation as families did in those first Texas years. Pearl’s careful entries showed every milestone—births, marriages, deaths—each one a story of resilience and love.<\/p>\n<p>In 1999, Jet Flames passed away, her hand carefully entering nothing on my mother&#x27;s page. The last of the founders had come to rest, their lives marked by service and family. After her death, no one in either line took the journey that was so central to our origins. Both lines’ pasts passed entirely into the records&#x27; keeping.<\/p>\n<p>Today, we live on the legacy they left us—Ruby’s meticulous housekeeping, Onyx’s steady day book, and my father&#x27;s careful bench. Each entry is a thread in our family tapestry, connecting us back to Flint’s Pittsburgh, Garnet’s Mississippi, and Jet’s hand at the end of her life. We keep what can be fixed and practice with no strings attached, carrying both sides&#x27; traditions through generations.<\/p>\n<p>The house we grew up in was testament to their work—Onyx&#x27;s Dallas repair shop bench and Ruby&#x27;s piano lessons. As I sat here, each line&#x27;s story still woven within its history, I remember the founders’ legacy: Flint’s meticulousness and Garnet’s resilience. They taught us patience, discipline, and care, ensuring no thread of our family was lost. The book that Jet kept passed down to my mother is not just a record but the line&#x27;s constitution in three<\/p>"}, {"kind": "page", "label": "Page 74", "chapter": "Hard Years and Partings", "html": "<p>In 2024, my generation faced a monumental challenge when a fire ravaged not only our neighbors&#x27; building but also mine—the room where I first envisioned my studio. The log books were safely kept at home, and the standard of resilience was firmly in place within us.<\/p>\n<p>Amber, with her keen eye for detail, captured the ruin before sentimentality had its way. Topaz&#x27;s line from Chicago sent a gift to ensure no memory was lost; they valued the past as much as we did. My sister, Amber, did the arithmetic, calculating how long it would take to rebuild and what resources were needed.<\/p>\n<p>I began by rebuilding over two years—slower and smaller than my original vision but still in the same thick icehouse walls that kept us safe. The fire tested our doctrine of keeping what can be fixed; we passed with a cost itemized on every repair, every detail meticulously accounted for.<\/p>\n<p>The doctrine of &quot;some things understood can be mended&quot; held true: rebuilding took time and effort, but it was worth the investment. We learned to value what remained, to rebuild slowly, carefully, and faithfully. The fire served as our most difficult exam, sharpening us all into a stronger family.<\/p>"}, {"kind": "page", "label": "Page 75", "chapter": "Hard Years and Partings", "html": "<p>The family&#x27;s oldest parting is Topaz&#x27;s leaving, in 1969, and it must be weighed in its own era&#x27;s terms: an eighteen-year-old daughter of a respectable Dallas household going north alone was seen then, as a kind of failure, and my grandfather Jasper -- who believed in keeping everything -- had to learn to keep a sister at six hundred miles, by letter and telephone, which he did, weekly, for forty-nine years, without ever once asking her to come home to live. What the leaving cost both sides was presence. What it bought was the branch, and the proof that the doctrine travels.<\/p>\n<p>I remember when Topaz left, an eighteen-year-old from our respectable Dallas household — read as a kind of failure by many. My grandfather Jasper kept in his heart the loss but also the strength to keep in touch with her across six hundred miles. He wrote weekly letters for forty-nine years without once asking her to come home and live with us again. What we lost was presence, but what we gained was the branch — a tangible reminder of our ties that persisted through absence. Her leaving proved the doctrine still traveled, that even after time apart, we could still keep in mind who came from where.<\/p>"}, {"kind": "page", "label": "Page 76", "chapter": "Hard Years and Partings", "html": "<p>Slate Flames&#x27; departure was like a branch breaking off from our family tree, a break that never fully healed. In 1994, Zircon Flames, Slate’s younger brother, had an argument over Garnet&#x27;s estate — the house, the tools, and small money they all shared. The dispute centered on property rights; no one could agree on its merits, as both sides kept their accounts by partisan hands.<\/p>\n<p>Zircon took his line out of visiting, letters, and records completely. What remained were empty spaces in Ruby’s family Bible from that point onward, marking the end of communication between us. The space was left blank, not tidy or pretended to continue; it was a silent admission of our estrangement, an act I chose rather than pretend what had happened.<\/p>\n<p>Zircon&#x27;s descendants are listed only by name in the Bible after a certain year. His line severed, we kept his absence honest, and no entry fills those gaps. Zircon’s departure left behind not just physical things but also ties that could never be reconciled.<\/p>\n<p>The family doctrine still holds: keep what can be fixed and fix what keeps you together. Even though our lines were separated by property disputes, the practice of record-keeping passed down through my mother Ruby ensures neither line lost its identity. Her meticulous entries in her family Bible kept both traditions alive, a testament to our unbroken lineage.<\/p>\n<p>I have not filled those blanks in the Bible; instead, I write the truth that Zircon took from us — his departure and his refusal to come home. What we lost was the presence of another branch at the table, yet what we gained is something deeper: the memory of our ties that persisted through absence. Zircon’s story reminds me that even after time apart, we can still keep in mind who came from where.<\/p>\n<p>The doctrine remains strong as ever — to carry flames close across generations, no matter the distance or the years between us.<\/p>"}, {"kind": "page", "label": "Page 77", "chapter": "Hard Years and Partings", "html": "<p>In 2020, at twenty, my work in other people&#x27;s rooms went quiet all at once. The sessions stopped, and no one needed anything fixed. What little income I earned was from repairing things out of my father’s shop—a corner that became mine—and it capitalized the Cold Room two years later. My father had done this too in his thin years. I recognized the maneuver only as a repairer, which is how the doctrine prefers to be learned.<\/p>\n<p>The household economy was tight. We lived off my father&#x27;s modest wage and small income from repairs, along with a meager pension for my grandparents, who were retired by then. The kids brought home only what they earned playing piano or teaching guitar lessons. Rent was high in Dallas, and we struggled to keep up. Debts accumulated, but the doctrine held strong: no job and no debt went unentered.<\/p>\n<p>My parents worked tirelessly at the bench and in my mother’s hand—she kept our books meticulously. My father taught me patience and discipline, marking each repair on his daybook with care. Ruby’s meticulous entries were a testament to her forebears&#x27; record-keeping tradition. I learned these virtues at the kitchen table, practicing what we knew.<\/p>\n<p>The era frame was marked by public events like the recession and war, but we focused inward—our family&#x27;s doctrine remained constant: keep what can be fixed and practice with no strings attached. Even as the outside world changed, our household economy held firm. The doctrine was a rock in an uncertain sea, ensuring that neither line lost its identity.<\/p>\n<p>The Cold Room opened two years after my father’s work capitalized it, but the family’s record-keeping continued to thrive, passing down from generation to generation with each page filled by meticulous entries. The doctrine remained unbroken, no matter what the era brought.<\/p>"}, {"kind": "page", "label": "Page 78", "chapter": "Hard Years and Partings", "html": "<p>The hard years tested the doctrine at its weakest word, which is &#x27;can&#x27;. A family keeps what it can fix -- but the fire could not be unburned, the grandfathers could not be repaired, Zircon&#x27;s column could not be filled by wishing, and a doctrine that only works on objects would have died in those years. What we learned, and what I now take the sentence to have always meant, is that keeping is not always restoring: sometimes it is entering the death in both books, keeping the piano in the family, keeping the room’s walls and rebuilding inside them. The doctrine bent towards custody, away from repair; it did not break, and the bending is a legacy for us. We inherited this understanding but have carried it further, ensuring that even in loss, our traditions endure.<\/p>"}, {"kind": "page", "label": "Page 79", "chapter": "Hard Years and Partings", "html": "<p>Jet Flames sat at her table, pouring out stories with her copperplate script as she kept the family’s birth, marriage, and death entries. Pearl Frozen penned numbers meticulously on ledger pages, her hands steady under fluorescent lights in the shop where repairs were counted and recorded. Coral continued this tradition quietly, her daybooks filled with faded ink through the decades Jasper&#x27;s prime.<\/p>\n<p>Opal Flames played piano beside the table, passing down tales of laughter and tears. In my generation, my mother Ruby and wife Amber kept it all. We fed people, wrote things down, refused to let the family scatter.<\/p>\n<p>The matriarch&#x27;s pattern is not a person but a job that descends in both lines to whoever is willing to feed and write. Jet passed her handiwork on to Pearl, who carried forward through decades of Jasper’s reign. Coral took over at the piano and table, ensuring no entry slipped from ink. Opal taught this trade to me and Amber, passing down traditions with every note and word.<\/p>\n<p>The pattern held strong in our hands: Ruby kept it all with meticulous care, her hand never faltering on ledger pages or family Bible entries. My mother&#x27;s steady script mirrored my wife’s steady camera work, both ensuring no line lost its identity. We fed people, wrote things down, and refused to let the family scatter.<\/p>\n<p>The matriarch’s role is not a person but a job that descends in both lines. It passes through hands willing to feed and write, keeping what can be fixed and fixing what it keeps. Ruby and Amber carried this tradition on from Jet to Pearl, Coral, Opal, until it became the pattern of my generation: feeding people and writing down everything that mattered.<\/p>\n<p>The family’s doctrine returned, shaped by its new facts and shifting understanding: carry the newer facts in fresh wording, ensuring no line loses its identity. The matriarch’s role is not a person but a job that descends through hands willing to feed and write, keeping traditions alive.<\/p>"}, {"kind": "page", "label": "Page 80", "chapter": "Hard Years and Partings", "html": "<p>The survival of our hard years is a short list recited with honesty: the Bible, the day books, the toolbox, the piano, and the doctrine. But what survived changed into an honest inventory: the studio, rebuilt smaller but still part of its old walls; the family itself, now fewer in Dallas yet larger across the world; the doctrine, subtly bent toward custody; the records, annotated with their own gaps.<\/p>\n<p>What matters to us is clear: a family that claims everything survived intact lies. Ours endured by keeping what we could mend and entering truth where it was necessary. The Bible and day books testify to our careful record-keeping. Ruby’s meticulous entries in her hand reveal births, marriages, and deaths—each entry an act of care.<\/p>\n<p>The piano, the legacy from Jet Flames, remains as a testament to our music. Onyx’s toolbox at his Dallas shop marks each repair with patience and precision, passing down his father&#x27;s standards. The doctrine, inherited from both lines, is now bent toward custody—a standard we uphold.<\/p>\n<p>Each generation carries these traditions fresh, ensuring no line loses its identity. The doctrine of three generations joined through Flint in Pittsburgh and Garnet in Mississippi remains strong, shaped by new facts and shifting understanding: carry the newer facts in fresh wording, meaning something new to each. A family that holds onto its past but also faces the present faithfully is the one that survives.<\/p>\n<p>The book’s anchor theme resurfaces here: &quot;the family name of my line is flames, carried by our people from Mississippi to Texas and into Dallas, where I was born to it.&quot; The doctrine on which we rest ensures neither line loses its identity. Topaz Frozens carry their great-grandmother&#x27;s name in Chicago; Ruby Flames’ careful piano lessons blend with Onyx Frozen’s meticulous shop records.<\/p>\n<p>The Bible and day books, the toolbox and piano, all testify of our care for each other and each generation. My father taught me to practice these virtues at our kitchen table—patience, discipline, and record-keeping. The doctrine remains a promise: keep what can be fixed and fix what we keep. Carry the newer facts in fresh wording, ensuring no line loses its identity.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 81", "chapter": "Reunions and the Living Family", "html": "<p>The kitchen table was my favorite spot, where all generations gathered. Ruby&#x27;s careful hands wrote entries in the Bible, while Onyx’s daybook marked every repair meticulously. The photographs of our rooms hung on the walls—Amber’s prints, her lens capturing the past and present.<\/p>\n<p>In 2023, as I sat at this table with my wife Amber, she brought another lineage to our home. She was born Amber Verano, a photographer—a skill that became part of both sides’ tradition. My wife came into this family in 2022, hired by Ruby to photograph a session at the Cold Room, and married me in 2023. The joining of her family’s inheritance brought three lines together: Flames, Frozen, and now Verano.<\/p>\n<p>Amber entered our house with her prints of our rooms hanging in every room I have worked in since—each print capturing a moment from past generations. She became one of the two present heads of this family, keeping its visual memory as faithfully as Ruby kept her records.<\/p>\n<p>The archives she brought into our home are not additions but part of what makes us whole. Amber’s photographs join ours in every room I have worked in since—our spaces filled with her lens’ reflections and Ruby’s meticulous entries. Together, they tell the story of three lines joining in Dallas: Flames, Frozen, and now Verano.<\/p>\n<p>This kitchen table continues to be our gathering place where both sides meet. The book&#x27;s tradition holds true: keep what can be fixed and fix what we keep—both Amber’s photographs and Ruby’s records carry this promise. Carry the newer facts and shift understanding in fresh words that mean something new today, ensuring no line loses its identity as we continue to honor our pasts together.<\/p>"}, {"kind": "page", "label": "Page 82", "chapter": "Reunions and the Living Family", "html": "<p>Amber&#x27;s family, the Veranos, brought our lineage a new sense of detail. Her father Agate painted signs on Dallas streets, each lettering a part of his street&#x27;s identity. Her mother Beryl taught school, her hand beautiful in the books she kept, just as mine holds our records with care. What Amber taught us was not to merely document but to see and remember.<\/p>\n<p>Her family&#x27;s naming custom is the same as ours -- we use stones for names. At our first Christmas together, my parents found a shared relative, delighting in their discovery. Amber&#x27;s lineage brought the eye: she showed it to me with her artistry and attention, teaching us to document life in light rather than merely words.<\/p>\n<p>Both lines understand the importance of keeping what can be fixed and fixing what we keep. Agate’s meticulous painting passed down from Flint to Slate, and Beryl&#x27;s careful teaching from Jet to Ruby. Amber taught us both media: writing with ink and painting with light. Her family kept their records in letters and her father&#x27;s hand; mine keeps its entries in copperplate script.<\/p>\n<p>Our traditions now intertwine at our kitchen table, where we combine the Frozens&#x27; bench work with the Flamers&#x27; meticulous record-keeping. The house combines both families’ legacies: Amber’s street names and my family’s careful logs. Each generation teaches patience, discipline, and care to those coming after them. My father taught me to repair things with his daybook, just as Amber&#x27;s mother taught her children piano lessons.<\/p>\n<p>In our present home, the traditions of Flint in Pittsburgh and Garnet in Mississippi meet again through us. Both families keep their records meticulously—Amber’s letters and Ruby’s books joined by my own entries in the family Bible. The tradition of keeping what can be fixed remains strong, ensuring no line loses its identity as we honor our pasts together.<\/p>\n<p>The doctrine holds true: carry the newer facts and shifted understanding in fresh words that mean something new today. Carry Amber&#x27;s photographs alongside Ruby&#x27;s records, honoring both lines&#x27; traditions with care.<\/p>"}, {"kind": "page", "label": "Page 83", "chapter": "Reunions and the Living Family", "html": "<p>In Dallas, my sister Opal stands at the head of our street&#x27;s children on our piano, teaching them melodies that echo through the city’s sessions. She carries our family’s traditions with grace and passion, a true heir to Jet Flames’ careful record-keeping. In Chicago, Topaz Whitfield, Jasper Whitfield’s daughter, maintains her great-grandmother’s name and continues the line’s stewardship of the record.<\/p>\n<p>Beside them stand cousins by marriage and Jade’s children in Fort Worth, fewer than before but no less significant for their presence. The lines continue to narrow, yet they remain strong under the hands of the next generation: Opal at the piano, Topaz with her own recordings, and cousins whose names whisper through our family tree.<\/p>\n<p>At my kitchen table, we gather as a family, savoring memories from both sides of our lineage. Opal shares stories from Dallas, while Topaz brings tales from Chicago, each story rich in detail and emotion. We sit where the generations have always met—where Flint’s Pittsburgh bench meets Slate’s Mississippi house.<\/p>\n<p>The weather outside is crisp, just as it has been for decades—a testament to patience passed down through our veins. Opal and I discuss her work with the children on our street; Topaz fills us in on Chicago’s vibrant scene. We savor this moment, knowing that each word spoken ties us more closely together.<\/p>\n<p>As we eat, a photograph of Zircon Flames hangs above, reminding all of our connection to Holly Springs—no matter how far apart we have traveled. It serves as a constant reminder: carry the newer facts and shifted understanding in fresh words that mean something new. Carry Amber’s photographs alongside Ruby’s records, honoring both lines’ traditions with care.<\/p>\n<p>The tradition remains strong; it has been tested by time and challenges yet continues to thrive through each generation’s hands. Opal’s teaching echoes through Dallas, while Topaz preserves her family&#x27;s legacy in Chicago—keeping flames close, just as we have done since Jet Flames began the record-keeping centuries ago.<\/p>"}, {"kind": "page", "label": "Page 84", "chapter": "Reunions and the Living Family", "html": "<p>The table scene: Gather the family in one place — our kitchen table, where we have assembled at least once a year to be counted by eye. The young are fed first, as always, followed by those who&#x27;ve earned their weight in wisdom from years of patience and sacrifice. We take our places around the board my father made for exactly this purpose, each generation&#x27;s world whole.<\/p>\n<p>My mother Ruby sits closest to me; her hands steady on the cold metal bench, her fingers never loose from careful record-keeping. She reads aloud from the family Bible, a copy she inherited from Jet Flames, who kept it meticulously until her passing. Opal and Topaz sit at either end, their presence a reminder of topaz Frozens&#x27; departure to Chicago four decades ago.<\/p>\n<p>The piano gets played whether anyone schedules it or not, its keys pressed by my mother Ruby in a way that brings comfort to all present, the sound echoing through time. Each page from her family Bible marks a story: births, marriages, and deaths — each entry telling of lives lived within our lines.<\/p>\n<p>Slate sits next to his father Onyx Frozen at the other end of the table, their bench a testament to Flint’s meticulous work ethic in Pittsburgh. Slate&#x27;s copperplate script in Jet&#x27;s family Bible remains unchanged over fifty-two years, an unbroken line carrying our traditions forward from Mississippi to Texas and into Dallas.<\/p>\n<p>As my grandfather Jasper Frozen passed away at home with his tools still close, ensuring no line lost its identity through a life defined by meticulous work ethic, so the doctrine of keeping what can be fixed and fixing what we keep carries on. The tradition continues with Amber&#x27;s photographs alongside Ruby’s records, honoring both lines&#x27; traditions with care.<\/p>\n<p>The family reunion is not an event; it is gravity: gathering around this table where we&#x27;ve counted each other year after year, a ritual that marks the passing of time in the hands of our ancestors and ensures no line loses its identity.<\/p>"}, {"kind": "page", "label": "Page 85", "chapter": "Reunions and the Living Family", "html": "<p>The Chicago branch stands with the root today in good repair, which was not inevitable and is not automatic: visits in both directions most years, the telephone habits Onyx established with Amber continued by their grandchildren on newer machines, obligations kept -- the money sent at the fire was answered, in kind and in silence, when the branch had its own hard year, and both sides entered the exchange in their books without ever calling it a debt. Distance, the family has learned, is a condition, not a verdict. The verdict is made by the keeping, and the keeping, on present evidence, is mutual.<\/p>\n<p>In 2016, my grandfather Slate Flames passed away at seventy, closing our line&#x27;s memory of Holly Springs. Jet’s death in 1996 marked the closure of her family recollection of Mississippi. In 2018, Topaz Flames left our family line in Holly Springs, severing ties with no record of correspondence from either side for forty-nine years. The Chicago branch stands today with good repair, but the distance between us and the root was not always so harmonious.<\/p>\n<p>The phone calls and letters continue to connect, just as they did when my father Onyx worked his daybook meticulously in Dallas. He kept his end of the bargain without ever calling it a debt. The family reunion is not an event; it is gravity: gathering around this table where we&#x27;ve counted each other year after year, a ritual that marks the passing of time in the hands of our ancestors and ensures no line loses its identity.<\/p>\n<p>In 2018, Flint Frozen arrived in Dallas from Pittsburgh, beginning a new chapter with meticulous repair work. The first generation’s legacy was carried on by Onyx Frozen, who inherited his father’s shop and tools. My mother Ruby kept records meticulously until Jet’s death, passing the tradition to her daughter Coral.<\/p>\n<p>The Chicago branch stands today with good repair, but the distance between us and the root was not always so harmonious. The phone calls and letters continue to connect, just as they did when my father Onyx worked his daybook meticulously in Dallas. He kept his end of the bargain without ever calling it a debt. The family reunion is not an event; it is gravity: gathering around this table where we&#x27;ve counted each other year after year, a ritual that marks the passing of time in the hands of our<\/p>"}, {"kind": "page", "label": "Page 86", "chapter": "Reunions and the Living Family", "html": "<p>In 2018, our tradition of record-keeping began to shift in subtle yet significant ways, echoing the transfer moving through my generation as I raised our children. Onyx&#x27;s meticulous daybook taught me patience at his bench; Ruby&#x27;s piano lessons and careful handwriting demonstrated the importance of keeping what can be fixed. We carried this forward, but the younger generation began to see it differently.<\/p>\n<p>When Opal first started teaching her students in Chicago, they received copies of the record and instructions from its columns. Like four generations of Flames children before them, these new young people were taught to get the scales — the records themselves — before the songs, as we did at home. Their curiosity about our past was tangible; it was evident when they asked questions like, &quot;Why do you write everything down?&quot; and &quot;How did your grandfathers keep track of things?&quot;<\/p>\n<p>Meanwhile, in Chicago where I trained two engineers to work at Cold Room, their approach was different. They brought the log book back with them, just as I had done when I taught my master&#x27;s secrets to Onyx. The doctrine they carried is similar, but the practice has evolved. These young men began to see it not just as a ritual of keeping, but as a tool for understanding and maintaining their work. It was written in columns now — something concrete that required interpretation.<\/p>\n<p>But what we hold dear may be lost if it is not understood or used. The young refused to learn the day book&#x27;s patience; they did not appreciate its value until after something broke. Opal&#x27;s students learned to break things with passion, but they also learned to repair them as a part of their love for music.<\/p>\n<p>In 2016, when Onyx taught me about the log book at his bench, he said, &quot;The thing you have to remember is that it’s not just a record, it&#x27;s a promise. A promise to understand something deeply enough to fix it.&quot; That lesson has been passed down through my children and now to our grandchildren, who will learn by breaking things they love.<\/p>\n<p>Ruby kept the family books with meticulous copperplate script in her hand — household accounts on one side, the Bible entries on the other — just as I did. Our tradition is alive here at home, but it’s also evolving. As my daughter Amber and I photograph our family history together, we see how each generation shapes<\/p>"}, {"kind": "page", "label": "Page 87", "chapter": "Reunions and the Living Family", "html": "<p>The doctrine as my generation says it is shorter and holds a laugh: keep what can be fixed and enter the loss, don&#x27;t embalm it. Opal delivered her version at table, and now I quote it back. It adds that learned from the fire -- keep the ashes out of the book.<\/p>\n<p>I record their version without endorsing every word of it. Just as Jasper would have had to mine, my generation is still arguing with this sentence. A doctrine nobody argues with becomes a slogan, and this family has never kept slogans in the books.<\/p>\n<p>The fires, both literal and metaphorical, define our reality. The ashes out of the book ensure no loss is embalmed, keeping the truth raw and accessible to all generations. This principle guides us through each chapter of our lives, from the repairs Onyx taught me at his bench to the photographs Amber and I take now.<\/p>\n<p>The doctrine carries a weight that echoes in every generation: keep what can be fixed, enter the loss, don&#x27;t embalm it. We are the family&#x27;s hands, ensuring no line loses its identity or tradition, whether it’s our father Onyx’s meticulous shop records or mother Ruby’s exact piano lessons. Each page of the family Bible is a testament to this enduring wisdom.<\/p>\n<p>In Flint Frozen’s Pittsburgh and Garnet Flames’ Mississippi, we find the roots that define who we are today. The doctrine holds true, even as our family grows stronger through generations: keep what can be fixed, enter the loss, don&#x27;t embalm it. This principle ensures no line loses its identity or tradition, keeping flames close in every generation.<\/p>"}, {"kind": "page", "label": "Page 88", "chapter": "Reunions and the Living Family", "html": "<p>In the heart of Dallas, my parents, sister, and I walk a few blocks from where both lines first chose to settle in the forties. Our home is our anchor, yet it feels as if we are moving within its walls, like grains of sand caught between fingers. The work here defines us: Ruby&#x27;s meticulous piano lessons for half the street’s children and my father Onyx&#x27;s steady repairs at his Dallas shop bench.<\/p>\n<p>In Chicago, where the branch took root deeply in its city, I walk among towering skyscrapers and crowded streets. There, the Frozen lineage found its place, working diligently to keep their name alive through Flint’s daybooks of 1947-1992. The cold air here presses on us like the iron trade did for generations before, yet we hold tight to our traditions.<\/p>\n<p>In Fort Worth, my aunt Jade&#x27;s household holds the family&#x27;s western door. It is a place where she and her children practice the Frozens&#x27; care in their daily routines—whether it’s mending clothes or baking pies. The winds here carry stories of resilience from Mississippi, keeping flames close with every generation passing through.<\/p>\n<p>The map of our lives stretches across these places, as boundless as my family&#x27;s traditions. Each place defines us differently but shares a common thread: the work and keeping that keeps both lines alive. Some years ago, I thought it might be fitting to draw this map on the Bible’s flyleaf—here, where all three generations meet, ready to carry forward our legacy.<\/p>"}, {"kind": "page", "label": "Page 89", "chapter": "Reunions and the Living Family", "html": "<p>The kitchen table is where we gather again, our hands tracing over the family Bible entries and my father’s daybook. Jet Flames’ careful script against Slate’s steady copperplate: both lines’ traditions come together here. My mother Ruby taught piano lessons at half the street’s children; her hand meticulously documented each entry in the family Bible until her passing.<\/p>\n<p>Onyx Frozen kept his meticulous marks on his daybook, just as she did with hers. The doctrine of three generations joined through Flint and Garnet remains strong: keep what ca
