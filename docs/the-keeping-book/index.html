const DATA = {"title": "The Keeping Book", "subtitle": "A family history in one hundred answers", "pages": 100, "words": 29037, "model": "Qwen2.5-3B-Instruct (Q4_K_M GGUF) via llama.cpp, local", "chapters": [{"name": "Two Names", "first": 1}, {"name": "The Flames Line: Fire and Music", "first": 11}, {"name": "The Frozen Line: Iron and Patience", "first": 21}, {"name": "The Parents: The Joining", "first": 31}, {"name": "My Generation", "first": 41}, {"name": "The Family Trades", "first": 51}, {"name": "Houses, Heirlooms, and Records", "first": 61}, {"name": "Hard Years and Partings", "first": 71}, {"name": "Reunions and the Living Family", "first": 81}, {"name": "What Was Passed Down", "first": 91}], "screens": [{"kind": "meta", "label": "Front matter", "chapter": "", "html": "<p>The respondent of this book, Frozen In Flames, is a fictional demonstration persona: the demonstration user of this series, whose fabricated survey answers drive every proof-of-works book. The answers from which every page was generated are drawn from the canonical character record (demo/frozen-in-flames-character.json, record version 2.0.0) and are fabricated test data, written to exercise the family-history genre pack end to end; the family described, two invented lines, the Flames line of his mother and the Frozen line of his father, joined in his parents&#x27; marriage and in his own name, is invented and is not the family of any real person.<\/p>\n<ul><li>Genre pack: family-history (version 1.0.0)<\/li><li>Questions in pack: 100<\/li><li>Pages in this book: 100<\/li><li>Total words: 29037<\/li><\/ul>"}, {"kind": "page", "label": "Page 1", "chapter": "Two Names", "html": "<p>Flames. The family name of my line is Flames, carried by our people from Mississippi to Texas and into Dallas, where I was born to it. It is the name on the family Bible kept by my mother Ruby, the name her father worked under as a carpenter and her grandfather was buried under in his plot at Oak Lawn Cemetery, and the name she kept when she married Amber — ensuring neither line lost its identity, keeping Flames close.<\/p>"}, {"kind": "page", "label": "Page 2", "chapter": "Two Names", "html": "<p>Frozen. The family name of my father&#x27;s line is Frozen, passed down through generations from Pennsylvania to Texas in the mid-1800s. It was inscribed on the day books kept by my grandfather Samuel as he crafted tools under a tree near his cabin. My great-grandfather John carried this proud lineage into Dallas with him, stowing it safely inside a toolbox before he settled down in the heart of the city.<\/p>\n<p>The frozen name is etched not just on old family records but also on the hearts and minds of my relatives who have always held onto it tightly—just as their ancestors did. When we hear the names Frozen and Flames together, many assume they were made up to match each other. But this was never the case; these two lines chose to marry into fitting each other, a process that is both unique and lengthy. Each generation kept the name close, ensuring it wouldn&#x27;t be lost as our families intertwined.<\/p>"}, {"kind": "page", "label": "Page 3", "chapter": "Two Names", "html": "<p>Frozen In Flames. My full name is the two lines joined in one person: Frozen from my father&#x27;s side and Flames from my mother&#x27;s, with &#x27;In&#x27; set between them as a coupling joins two cars of a train. We chose this union for our first child, born in Dallas in 2000, to declare what joining had made — not just us but the family itself. In daily life, I am called Frozen, and my whole name is found on the family Bible&#x27;s flyleaf where it takes up its full line, both lines kept close by each generation for generations to come.<\/p>\n<p>We have each carried our lineage’s names: Flames from Mississippi to Texas in the middle of the last century, tools made under my father&#x27;s hands, and graves dug under my grandfather; Frozen from Pennsylvania to Texas a half-century later, where I was born to it. Each line kept its name when marrying into ours — not losing identity, but finding strength through union. The name is as much part of us now as the generations that came before: our children hear their great-grandparents&#x27; names and see them on tombstones and birth certificates; they learn to carry each family&#x27;s identity with pride.<\/p>\n<p>The name carried a weight for both lines — it meant commitment, dedication, and the strength in numbers. But more than that, we each chose how the name would be used: whether it was written or spoken, what stories were told about us through its use. Each generation has built on this legacy, carrying forward the names and weaving new meanings into them. Frozen In Flames stands as a testament to the power of joining two families, keeping both identities close as we walk our own paths.<\/p>"}, {"kind": "page", "label": "Page 4", "chapter": "Two Names", "html": "<p>The family does have a naming tradition, and it is strict. Every child of both lines has been given a first name from the crystals and gems -- Ruby, Onyx, Jasper, Garnet, Jet, Opal, Flint, Pearl, Topaz, Coral, Jade, Zircon, Slate, Amber. These names are inscribed in our family&#x27;s history, as they were used by my grandparents before we ever met. My mother’s line chose these names for her children from Mississippi to Texas and into Dallas; mine did the same on my father’s side, following generations of carvers and builders. The custom was kept with such simplicity that the grandparents held the list of what had been used. A name would be chosen before a birth and argued about at the table, ensuring no child of either line has yet to receive a name outside these stones.<\/p>\n<p>I am Frozen In Flames, but I am not one line&#x27;s child. My name is not from the crystals and gems, but it encompasses both: my father’s line was named Frozen and his tools bore its mark; my mother’s line carried their names with pride in Texas, and we chose them for our first-born. The joining of these two lines into one person is a testament to the power of marriage, keeping both identities close as we walk our own paths. Each generation has built on this legacy, weaving new meanings into our family&#x27;s name: Flames or Frozen, or their union, In.<\/p>"}, {"kind": "page", "label": "Page 5", "chapter": "Two Names", "html": "<p>Ruby Flames. My mother is Ruby Flames, of the Flames line, born in Dallas in 1975. She is the pianist, organist, and conscience of our family&#x27;s record-keeping tradition, as well as its guardian of a cherished piano inherited from her mother. Her legacy lives on through the books she keeps with meticulous care, just as her grandmother did before her. Ruby carries forward the Flame name with pride in Texas, where it was passed down to us, and we chose them for our first-born.<\/p>"}, {"kind": "page", "label": "Page 6", "chapter": "Two Names", "html": "<p>Onyx Frozen. My father is Onyx Frozen, of the Frozen line: born in Dallas in 1973. The small Dallas repair shop his line&#x27;s work became -- radios, televisions, guitars, anything with a circuit and an owner who wants it back -- was managed by Jasper and Coral Frozen. They ran the business out of their home, which sat on a quiet street where the sun dipped behind the trees in the late afternoon. The bench, its day book, and standard promise became the center of their world, each part essential to their repair shop&#x27;s operation. My father taught me the bench before any studio did, passing down his father’s dedication to craftsmanship and the belief that a repair is always a promise.<\/p>\n<p>As we sat around the old oak table in our house, the one with its worn marks from countless hours spent working, I learned the importance of attention to detail and the joy of problem-solving. The bench was not just a piece of furniture; it was an extension of our family’s identity, a symbol of our lineage and what we stood for as repairers of things. My father taught me not only how to fix but also why it mattered.<\/p>"}, {"kind": "page", "label": "Page 7", "chapter": "Two Names", "html": "<p>The joined family&#x27;s doctrine is the Frozen line&#x27;s sentence: &quot;A family keeps what it can fix, and fixes what it keeps.&quot; It was my grandfather Jasper Frozen&#x27;s saying first, at a toolmaker&#x27;s bench in Dallas where he honed his craft. His father lived by the same principle without ever saying it; his son, me, brings it to life about radios, while my mother applies it, pointedly, to people. I say it now about recording rooms, as we&#x27;ve joined our families, and every member of our lineage has its part in this constitution.<\/p>\n<p>The Flames line&#x27;s contribution is not a sentence but a practice: write it down. Between the two lines -- keep it, and enter it -- the family keeps both what they can fix and what needs fixing. This way, each generation builds on the next, adding to the fabric of our identity. My mother Ruby keeps meticulous records of everything we do; her father worked under a carpenter&#x27;s bench all his life. The practice is not just for recording rooms but for every aspect of our lives.<\/p>\n<p>As I grow older and take my place at the repair shop alongside my husband Onyx, I find myself teaching him the importance of attention to detail and problem-solving. My parents taught me about fixing things; they made tools under their own hands and kept household books in a careful hand that also wrote music scores. This practice is what we both bring to the family: to keep what can be fixed, and fix what needs fixing.<\/p>\n<p>In daily life, I am called Frozen, but my whole name is part of our family&#x27;s history -- In Flames. The joining of two lines creates something new, a union that holds within it the traditions from each side. We are proof of this marriage not just in our names but in our actions. My father taught me about fixing with passion and purpose; I teach him to keep these values alive.<\/p>\n<p>The book&#x27;s refrain is carried forward by my experience: &quot;the family name of my line is Flames, carried by our people from Mississippi to Texas and into Dallas, where I was born to it.&quot; This tradition has been passed down through generations, each keeping the lines close. The practice of writing everything down ensures that no detail is lost in the tapestry of our family&#x27;s history. Each generation adds a new thread, enriching the constitution we all live by.<\/p>"}, {"kind": "page", "label": "Page 8", "chapter": "Two Names", "html": "<p>In our people from Mississippi to Texas and into Dallas, where I was born to it,&quot; Ruby Flames tells me of her lineage&#x27;s tradition. The practice has been passed down through generations, each keeping the lines close. This tradition ensures no detail is lost in the tapestry of our family’s history.<\/p>\n<p>The first line, the Flames, keeps a Bible: births, marriages, and deaths, entered in the flyleaf from 1949 forward. Ruby holds this record as her people&#x27;s conscience and their music. Each entry marks moments that hold meaning within the pages. When Opal died, her name was there, forever recorded. And when Jasper passed away, the date was marked, a reminder of what it meant to be part of our lineage.<\/p>\n<p>The second line, my father’s, keeps day books: the work of every day, job by job, entered by Flint, then Jasper, and finally myself. Onyx Frozen taught me from the bench before any studio did. Each page is filled with names of tools he repaired and promises made to return them to their owners. The day books serve as a testament to his commitment to both work and family.<\/p>\n<p>The joined family&#x27;s record is both these sources, keeping each other in constant harmony. When the Bible knows when Jasper died, it tells me about his last day on earth. And when the day book knows what he was working on the week before, it fills in the details of his life beyond just the dates and names.<\/p>\n<p>Our archives are as close as our hearts and hands. The Bible with its entries testifies to family&#x27;s commitment to record everything that matters. The day books, filled with every job from Flint through Jasper to Onyx’s work, remind us all of our responsibilities towards each other and what we do best. Both hold the tapestry together, keeping flames close in the pages of time.<\/p>"}, {"kind": "page", "label": "Page 9", "chapter": "Two Names", "html": "<p>What we believe about ourselves, when told the story whole, is that we are the people Dallas sends for. The Frozens come when a machine stops, the Flameses when a choir needs an organist or a child requires teaching, and the joined household steps in when things have broken and should not stay so. This belief is a proud one, supported by our family’s record more than modesty would like to admit. It carries with it its own trap: we pride ourselves on being able to fix anything, which forces us generation by generation to learn the short list of things that cannot be mended, and this learning is never fully finished.<\/p>"}, {"kind": "page", "label": "Page 10", "chapter": "Two Names", "html": "<p>The two lines came from two places that explain them still. The Flameses—Ruby’s lineage, born in Holly Springs, Mississippi—were rooted in hill country where furnaces roared, a town shrinking under coal smoke and fading sunlight. They understood fire: how to keep it burning bright, feed it with care, and bank it against the night&#x27;s chill grip. It was their world of iron and patience.<\/p>\n<p>Across the Atlantic, Onyx’s line—my father’s lineage—found themselves in Pittsburgh, Pennsylvania, surrounded by steel, cold, machines the size of houses. They understood iron and patience too: how to build sturdy things with care and resist any storm that came. Fire and iron, music and machinery—they were fused when they moved to Dallas.<\/p>\n<p>The joined family is what happened when those two elements met in a household. The next two chapters will trace each line back to its beginning. Ruby’s lineage found itself in Holly Springs, where the Furnaces still roar; Onyx’s will return to Pittsburgh, where Steel and Patience remain their legacy. We are both born from the traditions of fire and iron, music and machinery, but it is our own lives that we must live as they unfold.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 11", "chapter": "The Flames Line: Fire and Music", "html": "<p>Garnet Flames. He is the founding ancestor of the Flames line in Texas: born in Holly Springs, Mississippi, in 1920, a keeper of furnaces and boilers, who brought his wife and small son to Dallas in 1949 and stayed. I never met him – he died in 1994, six years before I was born – and I know him the way this book knows all its dead: through the record his wife started the year he arrived, and the telling that surrounds it.<\/p>\n<p>The record of Garnet Flames is a testament to the endurance of our family’s history. Ruby’s mother kept meticulous records in her Bible, one of which recounts his arrival in Dallas in 1949. It was here she found stability after leaving Mississippi behind. The pages filled with names and dates echo through time, each line marked by its founder.<\/p>\n<p>Garnet Flames arrived in Texas during a tumultuous era, but the record shows that he brought not just life to his new home but also a deep sense of responsibility. His presence was felt in every room where he worked – whether it was tending furnaces and boilers or simply being there for his family. The tales we tell about him are woven from these records, shaping our identity as the Flames line.<\/p>\n<p>I know Garnet by what Ruby’s record tells me: a man who arrived with purpose, settled into Dallas like the steady flame of an old fireplace, and left behind a legacy that continues to this day. He is remembered not just for his name but for the work he did, the family he raised, and the traditions we keep alive through these pages.<\/p>"}, {"kind": "page", "label": "Page 12", "chapter": "The Flames Line: Fire and Music", "html": "<p>Holly Springs, Mississippi. The Flames line originates here, in a hill-country town north of the state, where Garnet&#x27;s ancestors worked the mill’s furnaces for two generations. Their legacy is as tangible today as the name still listed on the church roll. It sets our family’s origin distinct from its current home: Dallas, where I was born and have made my life. The name here belongs to a past that shaped us in ways far beyond its appearance; it&#x27;s the place we came from, not the one we call home.<\/p>\n<p>In this setting, Garnet&#x27;s work carried his line forward. The mill’s furnaces were more than just a source of income— they were the foundation of our family identity, passed down through generations and inscribed in the fabric of this town. Living here meant navigating the weather and seasons that defined life: winters brought cold winds and snow, while summers offered sun and heat. Public events such as the annual fair and the local church’s festivals marked moments when we gathered not just to celebrate but to reinforce our sense of family.<\/p>\n<p>This place shaped us, its name still etched in the history books. It taught us about community—how families work together for common ends. As I was born into this line, it did more than name me; it set a course that would shape my life and how I carry on the traditions handed down through generations. The history of our home town remains as constant as the fire that burns within us—a testament to who we are and where we come from.<\/p>\n<p>In Dallas, Garnet’s work became part of my lineage too— carried by his name in a place far from where he built it but close enough for me to feel its warmth. The furnace is now a memory, a story woven into the tapestry of our family history—a reminder that no matter where we live, the past remains ever-present and always calls us back.<\/p>"}, {"kind": "page", "label": "Page 13", "chapter": "The Flames Line: Fire and Music", "html": "<p>1949. The Flames family came to Dallas that year: Garnet, aged twenty-nine, his wife Jet, and their three-year-old son Slate, arrived by train from Holly Springs. The telling says they came down the river, but this book will examine later that it was a railway journey instead -- there is no river route from Holly Springs to Dallas, as proven by a railway timetable in Jet&#x27;s papers. What is certain is the shape of their arrival: a furnace man with a trade a growing city needed, and a wife carrying a Bible she meant to start a record in.<\/p>\n<p>The train pulled into a station bustling with activity, the aroma of coal smoke mingling with the scent of new beginnings. As they stepped off, Jet clutched her Bible tightly, her fingers moving over the pages as if marking them for future use. Across town, the city was expanding rapidly, eleven years ahead of anyone who could keep a boiler alive. The newcomers were part of this growth, their arrival marked by the first sight of Dallas—a place filled with potential and promise, yet also challenges that awaited.<\/p>\n<p>Jet&#x27;s Bible held more than words; it carried her lineage from Mississippi to Texas, and now into Dallas. As she laid eyes on the burgeoning metropolis, she felt a sense of purpose in starting anew—no matter how challenging the task ahead. The journey had been long and arduous, but Jet was determined to ensure that her family’s legacy would endure, no matter where they were.<\/p>"}, {"kind": "page", "label": "Page 14", "chapter": "The Flames Line: Fire and Music", "html": "<p>Jet Flames, born Jet Callahan in 1923, is the matriarch of my mother&#x27;s line: Garnet and his wife Jet&#x27;s lineage from Holly Springs came to Texas in 1949, settling into our household with a strong hand that kept us fed and clothed through lean years. She began the family Bible where her hands entered the births, marriages, and deaths for fifty-two years, preserving the line’s legacy and ensuring its identity was not lost as Garnet&#x27;s arrival alone had created nothing but a man. Jet Flames, by keeping the household and writing in the family&#x27;s memory, is why there was a Flames family, with Garnet’s wife at its heart.<\/p>"}, {"kind": "page", "label": "Page 15", "chapter": "The Flames Line: Fire and Music", "html": "<p>Garnet&#x27;s trade was fire: he kept furnaces and boilers -- at the mill in Holly Springs, then at heating plants and laundries and a hospital in Dallas -- the man sent for when the fire in a building&#x27;s basement went wrong or went out. The family telling gives the name itself to the trade: the Flameses were called for the flame they kept. As my mother Ruby, who is of the Flames line, often says, &quot;Garnet and Jet kept the household through the lean Texas years.&quot; The record in the family Bible shows the name already old in Mississippi but offers no opinion on why it became known as a trade for fire. My mother keeps this telling anyway because she understands that having a name with a story is easier to pass down to her children than one without.<\/p>\n<p>The trade of fire was handed down through generations, starting from Garnet and Jet Flames in Holly Springs. This lineage continued through my father Onyx Frozen, who learned it from his father Jasper as he ran the small Dallas repair shop, working under radios, televisions, guitars, anything with a circuit and an owner who wanted it back. Each generation passed on the tradition of fire, ensuring that no matter how lean or rich Texas became, there was always someone ready to handle a furnace&#x27;s flame or fix a broken piece of machinery.<\/p>\n<p>In Dallas, the family Bible is filled with her hands&#x27; entry into births, marriages, and deaths over fifty-two years—a testament to Jet Flames’ role in keeping the household together. The record shows that by 1949, when my great-grandparents Jet and Garnet arrived from Holly Springs, the trade was already part of their lineage. Despite no formal opinion on why it became known as a fire trade, my mother keeps this telling anyway because she understands the power in a name with a story.<\/p>\n<p>As for me, Frozen In Flames, I carry both lines: my mother&#x27;s Flames and father&#x27;s Frozen. The family tradition ensures neither line loses its identity; keeping flames close is a reminder of our combined heritage—fire and iron, passing down through generations.<\/p>"}, {"kind": "page", "label": "Page 16", "chapter": "The Flames Line: Fire and Music", "html": "<p>The arrival of Garnet Flames and his family into Dallas was indeed unspectacular, a detail my mother Ruby counts as good fortune. They settled in a rented house near Garnet’s first plant, securing work swiftly through the strength of a Mississippi foreman&#x27;s letter. Jet’s table fed not just our household but also the children from neighboring homes who appeared at its edges with unexpected regularity.<\/p>\n<p>As winter took hold, the furnace man faced a challenge. The cold tested his own furnace in a telling irony. He fixed it and passed on the lesson: keep your own fire going, even when the rest of the world seems indifferent or cold. This became our family’s founding parable, one told at every Flames Christmas since, as a reminder to us all.<\/p>\n<p>Through these years, Garnet and Jet maintained their piano lessons and church duties, keeping the household books meticulously in Ruby&#x27;s careful hand. The day-to-day challenges—rent payments, occasional debt from neighbors’ houses needing repair—were met with determination. Children contributed their chores; my mother’s piano teaching flourished as did her record-keeping tradition.<\/p>\n<p>The early years were hard, but our fire kept us warm and together, even when the world around us seemed indifferent to our efforts. Each year brought new challenges, each Christmas a reminder of the furnace man&#x27;s wisdom: keep your own fire going, for without it, no one would have you.<\/p>"}, {"kind": "page", "label": "Page 17", "chapter": "The Flames Line: Fire and Music", "html": "<p>The Flames record was begun in the year of the arrival: Jet entered the marriage with Onyx and the journey to Dallas in the flyleaf of the Bible she carried from Holly Springs, ruling the columns herself -- born, married, died -- in a hand like copperplate. The entries are plain and they are the reason this line&#x27;s history can be written at all. Every keeper since has understood the assignment the same way: enter what happened, in the year it happened, in a hand the next keeper can read.<\/p>\n<p>I held on to the Bible my mother kept close, its pages ruled with her copperplate script as steady and unforgiving as she was. Jet’s entries are there, a testament to our lineage’s commitment to detail. Each birth, each marriage, each death is marked like the columns of a temple, standing tall against time&#x27;s erasure. I remember my mother’s hands—her own hand that ruled the columns—and how her careful diligence made sure no entry was lost.<\/p>\n<p>I took up the mantle from her in 2000 when we joined our lines. The Bible didn’t know about the joining yet, but its entries spoke for themselves: our history is written there, a record of each generation’s hand before it faded into memory. I wrote in the same copperplate, ensuring that what happened and who lived would be recorded here. Each year added another line to the columnar chronicle, preserving not just facts but meaning too.<\/p>\n<p>The Bible testifies to Jet’s careful work, her hands steady as a compass through our lives. My mother kept it close, passing it down with the same care she gave her family records. In it, we find both the facts and the lessons passed from generation to generation, the thread of our flame that connects us all.<\/p>"}, {"kind": "page", "label": "Page 18", "chapter": "The Flames Line: Fire and Music", "html": "<p>Slate Flames. My grandfather Slate Flames — Garnet&#x27;s son, my mother’s father — is the Flames family’s patriarch in Texas: born in Holly Springs in 1946, brought to Dallas at three, and a heating and refrigeration man all his working life, which translates the founder’s fire trade into the century of cold air. He kept his father’s standard — the plant does not go down on your watch — and his mother’s book, whose entries pass into his hand in the years after hers gives out. He died in 2016.<\/p>\n<p>In Slate’s world, winters were fierce, and summers sultry, a stark contrast that shaped the town of Dallas. The cold air trade meant steady hands and patience, honed by decades under the elements. As a boy, Slate would watch his father work at their tiny service shop on Elm Street, tools gleaming in the sun as he tinkered with heating and cooling units. His mother’s book was kept meticulously — each entry a record of family gatherings, community events, and personal milestones. She passed it onto Slate when her hands grew stiff from years under the piano bench.<\/p>\n<p>The town around them saw changes too: new businesses popping up, old ones disappearing. But one thing remained constant for Slate — his work ethic. He taught me to hold our tools with care, to listen closely to the needs of each machine, and to never let a job slip through our fingers. In my growing years, he showed me how the cold air trade is not just about fixing problems but also keeping warmth in homes when the outside was biting.<\/p>\n<p>His legacy lives on today — we still keep the book close, with entries that trace generations back from Jet’s careful hands to Slate’s steady hand. Each line of our family name carries part of his standard: a commitment to work and a belief that no plant goes down without resistance. He is the one who set us all on our watch, a reminder in every generation that we are bound by our pasts and must carry forward what makes us unique.<\/p>"}, {"kind": "page", "label": "Page 19", "chapter": "The Flames Line: Fire and Music", "html": "<p>Through my grandmother Opal Flames&#x27; teachings, music became the second hearth of our family line. Born Opal Reyes, she was a piano teacher and church organist who brought joy into homes beyond our own, teaching neighbourhood children for cake, eggs, or nothing at all. For fifty years, she played for services with the dedication that Slate&#x27;s wife instilled in him.<\/p>\n<p>My mother inherited not only the piano but also her doctrine: to teach by whoever is nearest and musical. This philosophy has carried forward through generations, ensuring no plant — be it musical talent or family legacy — goes down on our watch. My sister Opal was just a child when Opal Flames&#x27; lessons began, but she too kept music as a family tradition. When I married Amber, we were joined not only by blood but also by the shared belief that each generation should carry forward the flame of musical excellence.<\/p>\n<p>The front room became more than just our second hearth; it was where my mother and her pupils would gather to learn and grow together. It wasn&#x27;t just a place for lessons, but a sanctuary filled with laughter, friendship, and music. And when I took Amber there, we did so not only as husband and wife but also as heirs of the Flames line&#x27;s dedication to teaching children by whoever is nearest.<\/p>\n<p>As our family name remains flames, each generation ensures no plant — whether musical talent or familial legacy — goes down on their watch. My mother’s teachings have been passed down through her daughter, my sister Opal, ensuring that music will continue in the Flames line, a testament to the strength and resilience of our family&#x27;s commitment.<\/p>"}, {"kind": "page", "label": "Page 20", "chapter": "The Flames Line: Fire and Music", "html": "<p>By 1975, when my mother Ruby was born into our family&#x27;s line, Slate had been steadily working as a refrigeration man for decades. Opal’s front room echoed with other children, but hers remained a sanctuary. The family Bible was meticulously kept, its pages yellowed from frequent use. Memories of our Mississippi roots were fading, replaced by the telling of our lineage.<\/p>\n<p>The expectations of my mother, Jet Flames&#x27; daughter, were clear: learn to play music and keep the record of our family&#x27;s history intact. She fulfilled these duties perfectly, learning Opal’s piano and keeping our traditions alive. However, she also chose her own path in marriage, bringing a repairman into our home. The line agreed this was within the spirit of maintaining our lineage’s values.<\/p>\n<p>As I grow older now, each birth or departure will shape the next generation&#x27;s world. My sister Opal’s place in the household is becoming more prominent, and as she inherits my mother&#x27;s musical gifts, she carries on a legacy that binds us all together. The passage of time continues to reshape our family name, Flames, ensuring it remains strong and unbroken.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 21", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>Flint Frozen. Born in Pittsburgh in 1918, he was a millwright and machinist. Flint came to Dallas in 1947, after wartime service with a toolbox full of tools that postwar Texas lacked. He brought his wife along, finding work as a small repair shop owner for radios, televisions, and guitars. His line’s legacy in Texas starts with that arrival, just like Garnet&#x27;s did years later from Holly Springs.<\/p>\n<p>In the days before Flint came to Dallas, Pittsburgh was a city of steel mills, where he worked under the harshest conditions, his hands calloused by the tools he used every day. The air was thick with coal dust and the hum of machinery; it was there that Flint&#x27;s trade took root, and he brought those skills to Texas.<\/p>\n<p>Here in Dallas, the small repair shop became a cornerstone for the Frozen family, maintaining its standards and pride passed down through generations. Every morning, Flint would start his day at the bench, surrounded by the tools he knew well from Pittsburgh: wrenches, pliers, and a toolbox full of parts. The air was quieter now, filled not with coal dust but with the faint hum of an electric saw as Flint worked on repairing old radios.<\/p>\n<p>In the house where Flint lived, the family kept their household books in the same careful hand that wrote music sheets for church concerts. Ruby Flames, my mother, inherited these records from her mother Jet, who passed them down through generations. The pages bear entries from 1949 to 1992, marking each birth, marriage, and death with meticulous care.<\/p>\n<p>The house where Flint lived was simple but sturdy, built for enduring the city’s weather. It housed not just a family&#x27;s needs but their ambitions too: Ruby would often learn piano lessons in the front room, as her mother had done before her. The same hand that wrote music also kept records of household events and milestones.<\/p>\n<p>The small repair shop where Flint worked became more than just his livelihood; it was a legacy he passed on to his son Jasper and later Onyx. Here, the tradition continued: keeping standards high and repairing what could be fixed, ensuring no promise went unfulfilled.<\/p>\n<p>As we look back at Flint Frozen’s arrival in 1947, the foundations of our family line were laid. His work ethic, the<\/p>"}, {"kind": "page", "label": "Page 22", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>Pittsburgh, Pennsylvania. That is where Flint&#x27;s story begins: a city of machines the size of houses, its shops running day and night. Here, Flint learned his trade in the midst of Pittsburgh&#x27;s steel country, where every machine was as large as a house. His journey here formed the temperament that would guide generations to come.<\/p>\n<p>The iron of this place defined Flint’s character. Weight, tolerance, patience — these were not just adjectives but ways of living. In Pittsburgh, work moved at its own pace, measured in cold arithmetic and hours that could only be completed through patient effort. These principles shaped the Frozen line&#x27;s temperament; they taught them to withstand the weight of their tasks and endure without haste.<\/p>\n<p>This city gave Flint the foundation from which he would build his family, ensuring that no matter where they moved or how fast life’s challenges moved, they carried with them a deep sense of work ethic and patience. As Flint brought his family to Dallas in 1947, carrying this legacy into their new home, it became more than just a move; it was an act of keeping their traditions alive.<\/p>\n<p>The city&#x27;s events — the Great Depression, World War II, and beyond — all pressed on Flint’s line, shaping them as much as the workbench or the daybook kept by Onyx. Yet, in these moments, Flint’s spirit remained constant, guiding his descendants through the storms to a place where they could be counted as part of this enduring family legacy.<\/p>"}, {"kind": "page", "label": "Page 23", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>In 1947, Flint Frozen and Pearl arrived in Dallas, carrying his wartime service discharge and her promise of a new home. The family counted the migration from that year, when they found both work and room amidst the city’s growing machine shops, their floors pouring under its relentless pace.<\/p>\n<p>Flint had been twenty-nine years old then, discharged from wartime service, and ready to find his next chapter in a bustling metropolis. He came ahead of the household by some weeks, in the winter of 1946, seeking out what they would make home together—a city whose machine shops were as busy as it poured its floors with new life.<\/p>\n<p>Their arrival was marked by Flint’s first glimpse of Dallas, a place where opportunities bloomed like the machines within its walls. He found work and room there, each discovery woven into a tapestry of their shared future, which began in 1947—when they stepped off that train to begin their new life together.<\/p>\n<p>Flint had left Pittsburgh behind, a city whose steel mills hummed with industry. Now he carried the knowledge gained from those machines and the promise found in Pearl&#x27;s embrace, ready to build their family amid the rising city’s thrumming rhythm.<\/p>"}, {"kind": "page", "label": "Page 24", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>Pearl Frozen, born Pearl Kowalski in 1921, is the Frozen family’s matriarch: Flint’s wife and the one who kept all of their papers, accounts, and table through the founding decades. She instituted the custom that no job or debt went unentered—Flint had his habit, but Pearl enforced its completeness. She died in 1999, a year before I was born, and I know her through the exact accounts she kept, which are as precise as Ruby’s family Bible and twice as argumentative in their margins.<\/p>\n<p>Her toolbox sits on a shelf at home, a relic of Flint&#x27;s days as a repairman. Each tool is marked with a note about repairs and services, a testament to Pearl’s meticulous record-keeping that ensured no detail was lost. The book she kept, her family Bible, contains entries from 1921 until her passing in 1999, marking each milestone of the line. Her handwriting is as careful and precise as Ruby Flames’ records, ensuring both families’ legacies were preserved through generations.<\/p>"}, {"kind": "page", "label": "Page 25", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>In Flint Frozen&#x27;s Dallas shop, the millwright&#x27;s craft demanded patience and skill. The tools of the trade were housed not just in cabinets but in a sturdy iron-bound chest, each tool bought singly and initialed by the craftsman&#x27;s hand. This toolbox was more than just storage; it was Flint&#x27;s capital, his credentials, a testament to forty years spent honing skills under Pittsburgh&#x27;s shops before moving to Dallas.<\/p>\n<p>The chest holds an iron-bound chest of memories, handed down through generations. It was my father, Onyx Frozen, who inherited this legacy from Flint — not as mere history but as the foundation that built his small repair shop. Each tool in its slot represents a moment, each inscription a story passed on by a master craftsman to a son.<\/p>\n<p>The toolbox sits heavy and true, a silent witness to a lineage of iron workers and their commitment to skill. Its weight is proof of Flint&#x27;s trade carried from Pennsylvania to Texas through hands like mine and my father’s. It tells the tale of generations keeping a craft alive, passing down a standard of meticulous workmanship that shapes not just tools but the character of those who carry it.<\/p>\n<p>This tradition ensures no detail in our line is lost. The day books, written meticulously by my grandmother Pearl Frozen, keep track of every job and debt, each entry a promise to return what was broken or misplaced. They are as exact as Flint’s toolbox, preserving the custom that nothing goes unentered. Our forebears valued this record-keeping above all else, keeping it alive across two families in Dallas.<\/p>\n<p>The family Bible Ruby Flames keeps bears entries from 1949 until her passing. The copperplate script of Jet Flames’ hand remains unchanged, marking milestones for generations to come. These records are as careful and precise as our daybooks, preserving the flame of Flint’s trade and the iron of Onyx&#x27;s shop. Both lines blend together in our hands, carrying forward a legacy that combines fire with patience — keeping the traditions of both families close.<\/p>"}, {"kind": "page", "label": "Page 26", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>The Frozen arrival in Dallas was a workingman&#x27;s landing of the classic kind. Rooms were found through the repair shop, a foreman with Flint’s old crew finding us an address that suited our needs. The first Dallas entry in his day book recorded jobs, wages, and landlords in three level lines.<\/p>\n<p>In spring, Pearl arrived with household goods and immediately began her accounts. The line remembers this arrival without romance but it is its own kind of romance: nothing was promised, everything was entered, and the city paid for competence in the usual coin of more work.<\/p>\n<p>Pearl’s husband Flint worked at a small Dallas repair shop run by his family. Their day book records each job, wage, and landlord as carefully as Ruby&#x27;s Bible keeps her household events. The shop is where Flint kept our line&#x27;s fire trade alive, passing it down through generations until today.<\/p>\n<p>The house was rented in the neighborhood of the repair shop, a working-class area where Flint’s father had found work early on. As we settled into our new home, Pearl began to keep meticulous accounts with care and diligence that has been passed from mother to daughter for generations.<\/p>\n<p>In this generation, I grew up here. Flint&#x27;s small Dallas workshop became my first job, teaching me the bench before any studio did. Our line of iron is a testament to patience — each repair is a promise kept in careful hands and on well-written pages. The city paid for competence as it always has, but our accounts ensured we never went without.<\/p>"}, {"kind": "page", "label": "Page 27", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>Jasper Frozen. My grandfather Jasper Frozen – Flint’s son, my father&#x27;s father – is the Frozen family’s patriarch: born in Dallas in 1948, a toolmaker all his working life, and the author of the doctrine still quoted by our joined family today: a family keeps what it can fix, and fixes what it keeps. If Flint founded the line in Texas, Jasper defined it – the standard of work, the keeping of the day book, the refusal to discard anything that could still be understood.<\/p>\n<p>When I was eight, I visited his small Dallas workshop for the first time. It smelled like oil, metal, and old machinery. Dad showed me how he kept every tool sharp and in its place, just as Jasper had taught him. The air of competence hung in the room, a tangible reminder of Flint’s legacy.<\/p>\n<p>Jasper was known not only for his hands but also for his meticulous day book, which meticulously documented each repair and job from 1948 to 2018. He refused to discard anything that could still be understood, ensuring every detail remained intact. His workbench became my first apprenticeship, teaching me the patience required in every task – a promise kept in careful hands.<\/p>\n<p>He died in 2018, when I was eighteen, and he is the grandfather I knew best. The day book remains open on his desk, a silent witness to his meticulous record-keeping and standard-setting. Every entry tells a story of repair and service, each one a promise kept by Jasper’s hands before it passed to me.<\/p>\n<p>As I look at the day book today, I am struck by how it carries forward both traditions: Flint&#x27;s iron work and Jasper’s careful records. It is a testament to our family’s commitment to these principles, ensuring that no detail goes unentered or forgotten. Our tradition ensures that our names remain alive not just on paper but in every tool we hold and every service we perform.<\/p>"}, {"kind": "page", "label": "Page 28", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>The doctrine in Jasper’s own era meant something harder than it does today. He formed it during decades when Dallas threw away machines, furniture, and whole trades because of their small repairs. For him, a family keeps what it can fix, and fixes what it keeps was not just an accusation but a mandate for his children to hold on tight to everything that could be understood or restored. His wife Coral’s amendment preserved the sentence by telling alone: people are included in the inventory. Today, our tradition has softened slightly; while we still insist on keeping things as they were intended, the meaning is less hard and more gentle, a reminder of care rather than an accusation. The joined family has been living inside these revised principles ever since.<\/p>"}, {"kind": "page", "label": "Page 29", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>Jasper and Coral&#x27;s children were my father Onyx, born in 1973, and my aunt Jade, born in 1976, who took the line&#x27;s keeping instinct into nursing and lives in Fort Worth. Jasper&#x27;s own sister, Topaz, went to Chicago at eighteen, married Obsidian Whitfield there, and raised a son she named Jasper for her brother. In Dallas, Onyx found his father&#x27;s bench, now polished and weathered with time but still sharp under his hands. The line&#x27;s hopes divided as they had in the past: one stayed close to home, working hard on the family repair shop; the other, like Topaz before her, left for a new city far away.<\/p>\n<p>As I grew up, my aunt Jade would often visit from Fort Worth, bringing stories of life there and memories of our childhoods. We&#x27;d sit around the old oak table in my grandfather&#x27;s house, where Ruby kept the family Bible, its pages yellowed with age but still full of her careful handwriting. The line&#x27;s hopes divided as they had in the past: one stayed close to home, working hard on the family repair shop; the other, like Topaz before her, left for a new city far away.<\/p>\n<p>At six hundred miles, Jade and I formed our own chapter. Her visits were rare but precious, filled with tales of Chicago&#x27;s vibrant culture and the challenges they faced as newcomers. She kept her aunt Jet’s tradition alive in Fort Worth, teaching nursing to those who needed it and passing on stories of a family that never left their roots despite moving continents.<\/p>\n<p>Onyx, meanwhile, grew into a master of his craft. The line&#x27;s hopes divided: one stayed close, working hard on the family repair shop; the other, like Topaz before her, left for a new city far away. As he took over his father’s bench, Onyx inherited his grandfather Jasper’s devotion to the trade and its values. He polished radios and televisions with care, each one telling a story of Dallas&#x27;s past.<\/p>\n<p>Jasper and Coral&#x27;s children were my father Onyx, born in 1973, and my aunt Jade, born in 1976, who took the line’s keeping instinct into nursing and lives in Fort Worth. The line’s hopes divided as they had before: one stayed close to home, working<\/p>"}, {"kind": "page", "label": "Page 30", "chapter": "The Frozen Line: Iron and Patience", "html": "<p>By 1973, my grandfather Jasper&#x27;s toolmaking was respected in Dallas, where we filled a shelf with day books. The Pittsburgh origin became an ever-present story, but no place anyone remembered anymore. The expectations of a son were clear: learn the bench, keep the book, be the man they sent for.<\/p>\n<p>I fulfilled all three, like my father Onyx did before me. But then I did something unexpected -- I married Ruby Flames. Bringing the fire line into our iron line&#x27;s house was a choice that changed everything. It combined two families and their traditions, weaving them together in Dallas. This union not only added another to the day books but also ensured no line lost its identity. The Frozen name would continue to be kept close, as it should, with both fires and irons standing strong in our lineage.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 31", "chapter": "The Parents: The Joining", "html": "<p>I taught piano to half the street’s children and played the organ at church — the very place where I met my father Onyx. My mother Ruby Flames kept the joined family’s books in the same hand: household accounts in the Frozen manner, and Bible entries in the Flames manner. The Flames line in her is not a memory but a going concern.<\/p>\n<p>In her front room, Opal&#x27;s ear captured every word, her stubbornness about standards guiding us through life. Jet&#x27;s instinct that everything important gets written down has always been part of my mother’s practice, passed from her to me and now carried forward by my wife Amber as she teaches piano to her own children. My mother kept the books in both manners: the household accounts in the careful hand of our Frozen line, and the family Bible entries in her Flames manner.<\/p>\n<p>The house we grew up in was a choice that changed everything. It combined two families and their traditions, weaving them together in Dallas. This union not only added another to the daybooks but also ensured no line lost its identity. The Frozen name would continue to be kept close — as it should — with both fires and irons standing strong in our lineage.<\/p>\n<p>The record in my mother’s hand is a testament to her commitment, ensuring that even as I pass on what she taught me about keeping records, the Flames line remains vibrant and active. Her practice of writing down everything important has been passed from one generation to another, creating a legacy that lives through each page, just like our family keeps close the traditions of both our lines: Irons and Fires.<\/p>"}, {"kind": "page", "label": "Page 32", "chapter": "The Parents: The Joining", "html": "<p>Onyx Frozen&#x27;s world was bound by his small repair shop, where Flint&#x27;s hands and Jasper&#x27;s standard converged into a living testament of perseverance. Each job he entered meticulously in the day book spoke volumes about the lineage carried on his shoulders. His grandfather, running mills in Texas, laid down the foundation for tools; his father, crafting them with precision, built the framework for radios and televisions; Onyx took these skills, transforming them into dead guitars and radios—remnants of a past era.<\/p>\n<p>The weather outside bore witness to their work: the cold air that passed through Dallas&#x27;s homes in winter, the dry Texas breeze in summer. Public events like city council meetings or community festivals might have been distant whispers compared to the daily hum of his bench and tools. Yet, even these moments pressed on him, shaping not just his life but the lineage he carried.<\/p>\n<p>Every job Onyx took on was a translation—smaller machines with more numerous tasks. Each entry in his day book marked not just time passed but also the progression from Flint&#x27;s hands to Jasper&#x27;s standard to Onyx’s bench. His dedication to understanding each machine before discarding it kept this line alive, ensuring neither era lost its identity.<\/p>\n<p>In Onyx Frozen’s world, the trade line was as much about patience and precision as it was about fixing broken equipment. He carried on his father&#x27;s work with care and purpose, keeping both lines close—flames and iron—and making them stronger through each job entered meticulously in the day book.<\/p>"}, {"kind": "page", "label": "Page 33", "chapter": "The Parents: The Joining", "html": "<p>In 1998, Ruby Flames was playing a piano at a church social in Dallas when the pedal failed under her foot. The immediate response from the congregation was a collective intake of breath. She paused for just a moment before continuing with deft fingers that never faltered. By the time she had completed one full service without stopping, everyone knew this was no ordinary pianist.<\/p>\n<p>The church called the repairman, and as they stood at Ruby’s side, Onyx Frozen, born in Dallas in 1973, stepped forward to fix the pedal. His presence alone filled a space that otherwise felt hollow. The piano&#x27;s restoration allowed for more singing after his hands had calmed her nerves.<\/p>\n<p>By the family&#x27;s account, he was already engaged in some deep thought before she had played even one service without stopping. He stayed at the church, and Ruby’s performance became something more than just a music event; it marked the joining of two lines—Flames from Mississippi to Texas, Frozen born in Dallas.<\/p>\n<p>The record supports the pedal, the church, and the year 1998, but it doesn&#x27;t capture what Ruby or Onyx meant to each other. Neither line has ever seen a reason to improve on that night: Ruby&#x27;s fingers dancing over the keys, Onyx’s hands moving deftly over the piano parts.<\/p>\n<p>The join is recorded in the family Bible, with entries for 1998, but it also lives in our hearts and minds. Here, we hold onto both lines—the Fires from Mississippi and the Frozen who worked the bench in Dallas—and ensure that neither line loses its identity. It&#x27;s a story of love and talent woven together by fate, symbolized through the very pedal that marked their joining.<\/p>"}, {"kind": "page", "label": "Page 34", "chapter": "The Parents: The Joining", "html": "<p>In 1999, my parents wedded at our childhood church, a place where we first met on that piano-wrapped altar. Opal Flames played from her usual spot, and Jasper Frozen stood witness in his hands freshly washed. The family Bible, with entries for 1998 but also living in our hearts, marked the joining: the date, names, and church in Ruby&#x27;s hand – she took up the record by then. Onyx’s day book recorded it similarly in his, just one line: the date, the names, ‘no charge’. Both archives agreed on everything except bookkeeping; they both upheld their records entirely.<\/p>\n<p>We sat at a kitchen table that night, where our parents first joined us. Ruby was there, her hands steady as she wrote these lines in the Bible, while Onyx kept his side with swift precision. The family came together, not just for joining but to reinforce what we had learned from them. My mother’s meticulous record-keeping and father’s standard of no charge were both honored, their traditions woven into our daily lives.<\/p>\n<p>That night, under the watchful gaze of the Bible and Onyx&#x27;s day book, I understood how these lines joined us—Ruby’s side of flames and Onyx’s line of frozen. We held onto them all, keeping each other close as we did so many things: fixing what we kept, writing down our lives, and ensuring no detail was lost. The joining wasn&#x27;t just in the church or the archives; it was at the kitchen table where Ruby first wrote these lines, and Onyx sealed his commitment there too.<\/p>"}, {"kind": "page", "label": "Page 35", "chapter": "The Parents: The Joining", "html": "<p>The two families took the match in their own styles. The Frozens gained a musician and were quietly aware the Flameses thought them a little too proud of their day book; the Flameses gained a repairman and were quietly aware the Frozens thought them a little too fond of their Bible&#x27;s margins. What the households became to each other was one extended family with two capitals — the shop and the front room — and a standing arrangement, never written and never broken, that Christmas alternates and funerals do not.<\/p>\n<p>At Ruby’s kitchen table where I first wrote these lines, her laughter echoed as we gathered to seal our commitment. The daybook from Flint’s Pittsburgh days lay open on the worn wooden surface, its copperplate script marking each entry like a weathered record of the past. Onyx sat at my right, his hands steady over his guitar, fingers dancing across strings in practiced silence. I held onto the daybooks, ensuring no detail was lost — the Frozens&#x27; pride and the Flameses’ patience.<\/p>\n<p>Slate&#x27;s presence filled the front room, where Jet’s piano played a soothing tune as she taught music to neighborhood children. The warmth of her teaching was a contrast to Flint&#x27;s meticulous shop, but both families understood their roles in keeping these names alive. Onyx listened intently as I wrote the story of our joining, his eyes reflecting my mother’s careful hands and his own quiet determination.<\/p>\n<p>Our alliances weren’t just formal agreements; they were woven into every meal, every conversation, and every shared memory. The Frozens’ pride in their day book mingled with the Flameses&#x27; patience over their Bible&#x27;s margins, creating a tapestry of family history that neither side could ignore. Onyx’s guitar and Ruby’s piano sang together in harmony, their music an anthem for our unique connection.<\/p>\n<p>As we sat there at Ruby’s kitchen table, each generation held its own traditions close while embracing the other&#x27;s strengths. The Frozens’ pride in their day book mirrored Flint’s careful record-keeping, reminding us that our family kept what it could fix and fixed what it kept. Onyx sealed his commitment with a promise to uphold these values, making sure no repair or detail was lost.<\/p>\n<p>In this moment, I realized the joining wasn’t just in the church or the archives; it was at Ruby’s kitchen table where we first wrote these lines together. The book<\/p>"}, {"kind": "page", "label": "Page 36", "chapter": "The Parents: The Joining", "html": "<p>Onyx Frozen’s line is marked by the repair shop, where he learned to hold the family together in Dallas. My father taught me his trade when I was young, teaching me how every job on the bench required understanding and care, not just replacing a part but restoring something whole.<\/p>\n<p>The repair shop became our household&#x27;s economy: it paid for the mortgage, bought strings for the piano, and even school shoes. In leaner months, we relied on my father’s reputation—his ability to understand what was broken, how to fix it, and the certainty of returning things back to their former state. This wasn’t just about money; it was a form of capital that no bank could match. My customers knew they were buying more than a repair—they were getting reassurance that something valuable had been comprehensively understood.<\/p>\n<p>As I grew up, my father’s work taught me patience and the importance of keeping what one has. The bench became not just a tool but a symbol of our family&#x27;s strength—how we hold everything together through good times and bad. It demanded attention to detail and a commitment to understanding the whole, from the wire spools in his hand to the children who would learn their first lessons of perseverance on that same bench. In this shop, Onyx’s line was born, shaped by the iron trade handed down from Flint Frozen to Jasper—staying true to his standard even through financial hardship and maintaining a day book where everything passed into his careful hands.<\/p>\n<p>The repair shop became our heartbeat, its work woven into every thread of our daily life. The customers knew they were buying not just a repair but certainty in their possessions—a promise that no matter what the world threw at them, there was someone who understood it all and could restore it to its former glory. And through this commitment to understanding and repairing, Onyx’s line found its identity—the Frozen lineage of iron and patience.<\/p>"}, {"kind": "page", "label": "Page 37", "chapter": "The Parents: The Joining", "html": "<p>In the front room of our house, my mother’s labor was constant and unyielding—lessons for children, organ for church services, weddings, funerals at a rate the family considered a ministry and the church saw as a bargain. It was steady work when repair work fluctuated in seasons. Music filled our house not just on special occasions but every day, like air in a room; it taught every child, including me, that a household can run on art practiced as discipline.<\/p>\n<p>The books kept by my mother balanced to the penny—her meticulous record-keeping, like her constant presence, ensured no entry was lost. Her choir’s music also held us together, each note echoing through the rooms, teaching persistence and care for communal life. Her labor defined not just our economic standing but the ethos of our family: that art practiced with discipline could sustain a household beyond mere commerce or repair.<\/p>\n<p>The books in her hand carried forward the traditions from Jet Flames&#x27; generation—records of births, marriages, deaths, like beads on a necklace passed down through generations. My mother’s work ensured these records didn’t fade; they became living history, held within her careful hands and handed to us by example. Her discipline taught us that art, practiced as duty, could be the foundation of our home.<\/p>"}, {"kind": "page", "label": "Page 38", "chapter": "The Parents: The Joining", "html": "<p>The small Dallas house my parents made was nestled between two bustling centers — the rhythmic hum of my father’s shop at one end of the day, the tinkling piano keys from his music studio at the other, and the steady flow of students through the front door, mingling with occasional phone calls to my mother’s customers in the back. We were raised here, our lives interwoven between the sounds of creation and repair.<\/p>\n<p>The rules that governed our household were a blend of traditions from both lines: nothing discarded that could be mended, no debt that could be avoided — lessons passed down through generations. Every job was meticulously documented and every birth entered into a family book, ensuring no detail slipped through the cracks. Our food was as carefully tended as our records; meals were cooked by Ruby to feed our growing household of four.<\/p>\n<p>The household economy thrived on my mother’s piano teaching and her careful management of the books that kept us standing — records of births, marriages, and deaths, passed down like beads on a family necklace. My father&#x27;s daybook of repairs was as vital as hers; every job he took on became part of our history.<\/p>\n<p>This small house within earshot of two capitals felt like home to me. The shop’s sounds at one end were the heartbeat of my childhood — the steady clatter that taught me about patience and precision. At the other, the piano keys rang out with melodies of joy and sorrow, teaching not just music but also the value of keeping everything in order.<\/p>\n<p>Here, under this careful hand, we learned to live within our means and to mend what could be mended. The house was a testament to both lines&#x27; traditions: Garnet&#x27;s fire keeper’s standard that no plant would go down on his watch, Flint’s toolmaker’s habit of never discarding any job or debt that still had meaning. This blend — the music-making, the repair work, and the careful record-keeping — made our home a place where every day was a lesson in keeping both lines strong.<\/p>\n<p>In these walls, I learned the value of discipline from my mother and the importance of craftsmanship from my father. The house became a sanctuary for all of us, a place where we could grow together, each generation&#x27;s story woven into its fabric. This is how my family grew up, within this small Dallas house that was both our home and a testament to<\/p>"}, {"kind": "page", "label": "Page 39", "chapter": "The Parents: The Joining", "html": "<p>From the moment my parents walked through the door, each brought a piece of their lineage into our home, a mosaic that was both familiar and new. The doctrine passed down from Jasper, etched in the air like an unspoken rule: a repair is a promise, not just to fix but to restore. Coral&#x27;s addition to the inventory — people are in it too — taught us empathy, weaving everyone into the tapestry of our lives.<\/p>\n<p>Slate’s keeper&#x27;s rule that the plant does not go down on your watch — keeping what we can and fixing what remains — was like a living testament from his father’s hand. Opal’s front room, where she taught music as an everyday necessity, like water, made sure that no moment passed unmarked by its gentle touch.<\/p>\n<p>And finally, behind them all, Jet’s Bible, with its columns of births, marriages, and deaths, preserved her legacy. It was a record keeper for the Flames line, handed down from Garnet to Jet over decades, becoming a cherished artifact in our house. Each entry spoke volumes about their lives, making sure nothing slipped through the cracks.<\/p>\n<p>I grew up inside all these things — the rules my father’s side taught us and the traditions my mother&#x27;s lineage passed on. The Bible, with its rows of names, became something both sacred and commonplace to me as I moved from childhood into adulthood. It was a reminder that our family story wasn’t just in our blood or deeds but in the habits we inherited — the day book habit, the repair is a promise standard, the keeper&#x27;s rule, the front room’s music lesson, and finally the Bible itself.<\/p>\n<p>As years passed and we gathered more stories and memories in this house, these inheritances from my parents’ lines continued to shape who we are. They kept our families alive, each one a part of the sum total that made up us, Frozen in Flames, born into two separate traditions but bound by love and history within this Dallas home.<\/p>"}, {"kind": "page", "label": "Page 40", "chapter": "The Parents: The Joining", "html": "<p>In 2003, my sister Opal was born, named for our grandmother Opal Flames. She would inherit her piano lessons and continue the family&#x27;s musical legacy. The naming of both children declared the joining twice over: mine with both surnames carried in the present tense, while Opal’s continued the continuity from our mother to us.<\/p>\n<p>Both of us were entered in Ruby’s hand at the beginning of the new generation, just as every previous one had been. We were named and dated in her meticulous record-keeping tradition, a part of what she kept alive. As we grew, so did her Bible, filled with entries that mirrored our presence there. The family name was now carried by both of us, Frozen in Flames.<\/p>\n<p>Looking back at the page, I can see how each generation shapes its future while honoring its past through these names and records. Ruby’s hand on this page has always been steady, ensuring no detail is lost from her father’s side to ours. In this house, our family name continues as a thread spun from two traditions: Flint&#x27;s daybooks of repair and Slate’s meticulous genealogies. It binds us all together in Dallas, each line passing the torch down through generations.<\/p>\n<p>As we move into the next chapter, my sister Opal will carry on the musical legacy, while I myself will seek to continue Onyx&#x27;s iron tradition—working with my hands and fixing what needs mending. The family name of Flames still flows through me, but now it carries a new meaning: the union made literal across two generations.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 41", "chapter": "My Generation", "html": "<p>2000. I was born in 2000, into a settled Texas family that year, one year old and two lines more than fifty years strong. The shop my father&#x27;s line owned had been established for five decades, its front room filled with warmth from the day&#x27;s work done. My grandparents Jasper and Slate sat at opposite ends of the table, each grandfather setting his standards on their respective sides.<\/p>\n<p>The family was settled in Texas for three generations now, tracing back to Mississippi and Pittsburgh through Flint and Garnet, who brought their families to Dallas together. I entered as a third generation born in Texas, into an old doctrine that my mother&#x27;s hand inscribed in the family Bible with no extra details -- only the date, the long name, and me.<\/p>\n<p>The shop was always there, its work pressing on both sides of the table like the weather outside, changing but never breaking the family’s routine. My grandparents Jasper and Slate sat at their respective tables, setting standards for generations to come. I was born into this settled state, a new chapter in the long-lived history that my parents kept as if it were up to me.<\/p>\n<p>The front room filled with warmth from day&#x27;s work, the house standing tall through its fifty years, the family holding steady and narrow like the shop next door. The doctrine of three generations, one year old and two lines more than fifty years in Texas, held strong through both Flint’s Pittsburgh and Garnet&#x27;s Mississippi roots. I was born into it all as a new chapter in this family’s long history.<\/p>\n<p>The depression, war, migration, and law did their part but the house remained, its front room always full of life from day&#x27;s work done, my grandparents setting standards on their respective sides. The doctrine held strong through Flint and Garnet’s moves to Dallas together, forming a joined family now as settled in Texas for three generations. I was born into it all with no extra details written down, only the date and long name in mother&#x27;s hand in the family Bible.<\/p>"}, {"kind": "page", "label": "Page 42", "chapter": "My Generation", "html": "<p>Dallas. I was born in Dallas, Texas, in a hospital across town from the river-flat wards where my father was born, and brought home to our small house between his shop and the front room. The place mattered to the two lines by then in a way it had not in 1947 or 1949: Dallas was no longer just a destination but their shared ground, both standing on this premise together.<\/p>\n<p>The hospital where I was born stood across from the river-flat wards where my father&#x27;s birthplace lay. It is where he was born, and where he spent his first few years of life, a child in a world marked by small houses and shops, between these premises, now mine as well, where we received this birthplace, which was our shared inheritance.<\/p>\n<p>I was born here, into a family that had found its foundation. The hospital is not just my birthplace but also the place where both lines of our ancestry meet. It stands on either side of town, between the shops and the wards, and it becomes the premise for both families. In this shared ground, I received my birth as a wager&#x27;s winnings, spent without ever knowing its true price.<\/p>\n<p>My mother kept her family&#x27;s records meticulously in the front room, and so did my father with his day book. Both traditions are passed down through generations, ensuring no detail is lost. The house where I was brought home to between these premises becomes our shared heritage, a testament to how we carry both lines forward together, no matter how far apart they started.<\/p>\n<p>The hospital across town from the river-flat wards now holds more than just a birth; it symbolizes the joining of two families in Dallas. It is here that my father&#x27;s work as an iron worker meets my mother&#x27;s passion for music, and where we found our home between their premises, both lines united on this ground, ensuring neither lost its identity.<\/p>"}, {"kind": "page", "label": "Page 43", "chapter": "My Generation", "html": "<p>In our house, Opal Flames takes center stage, a harmonious voice that echoes through our grandmother’s grand piano and into the generations yet unborn. She sang with grace in the front room, where her mother’s warmth mingled with my father&#x27;s precision. The Cold Room became her playground as she organized its first books, her hand as exact as Ruby Flames&#x27;. Here at the kitchen table, Opal sits between me and my sister, the second string of a musical line that began on our grandmother&#x27;s piano.<\/p>\n<p>She teaches piano to children in our mother’s front room now, passing down melodies right on schedule. Her place is always at the center of family gatherings, ready with words to ease tensions and with hands to pass the bread, just as her mother did before her. We know she will carry on the Flame line&#x27;s music, fourth generation strong, following in our grandmother’s footsteps. The house still holds my father’s steady workbench alongside Ruby’s meticulous accounts, a testament to two families’ traditions intertwined here.<\/p>\n<p>As we sit around this table, we are connected across decades — Opal between me and my sister, her voice echoing through the generations yet to come. We practice the lessons of our foremothers and fathers: keeping meticulous records in the family Bible, teaching with both hands on the piano bench, and ensuring no line loses its identity. In this house, where traditions meet and meld, we remain a part of the Flames lineage, carrying it forward as faithfully as our mother’s hand did over fifty years ago.<\/p>"}, {"kind": "page", "label": "Page 44", "chapter": "My Generation", "html": "<p>In 1969, Topaz Frozen left Dallas for Chicago, a city far from her childhood home. She went there not just to escape but also because she saw what lay ahead -- a life laid out on paper that seemed both inevitable and unfair. Her sister Jasper lived in Dallas, working at the school system until his retirement. Topaz married Obsidian Whitfield, carrying their love into Chicago where they raised Jasper&#x27;s son, Jasper Whitfield Jr., who now carries her great-grandmother’s name across generations.<\/p>\n<p>The Frozen line is rooted in day books that remain connected to our family, whether in Chicago or Dallas. This branch of the tree grew six hundred miles away yet still blooms strong with memories and traditions. On Christmas, we call one another from both cities; in life, Jasper Whitfield Jr.&#x27;s children return to attend funerals for their grandparents.<\/p>\n<p>Jasper&#x27;s sister, Topaz Frozen, is a testament to my family’s history. Her journey to Chicago was not just about escape but also understanding what awaited her on the other side of the tracks, if you will. It was then that she met Obsidian Whitfield and they settled in Chicago together, raising Jasper Whitfield Jr., who continues their legacy by carrying Topaz&#x27;s name forward.<\/p>\n<p>The Frozen line still stands strong, a testament to our family’s enduring spirit. We call each other across miles of time, remembering the traditions that have kept us bound through generations. In Chicago, we hold on tight to these ties and honor those who came before us in Dallas, their stories as vital as ever.<\/p>"}, {"kind": "page", "label": "Page 45", "chapter": "My Generation", "html": "<p>Growing up between two lines meant growing up inside both lines&#x27; work. My childhood rooms were divided by purpose: one belonged to my father Onyx Frozen&#x27;s shop and the other to my mother Ruby Flames’ piano lessons. The bench where he let me rewire a lamp at nine and restring guitars at eleven was an extension of his trade, always there for me as a child. He taught patience, discipline, and care by repairing dead instruments with meticulous attention.<\/p>\n<p>At home, in the front room, my mother Ruby Flames taught piano lessons according to her strict schedule — whether I was her son or not. She kept to the order she learned from her parents, who were also music teachers and church organists. Her teaching method was a mirror of Slate&#x27;s, the patriarch of our Frozen line.<\/p>\n<p>At the shop’s table, I was Jasper’s grandson, expected to listen first before touching anything. He taught me how to be an apprentice in his family trade with a calm respect for tools and materials. At my mother&#x27;s piano lessons, on the other hand, I was Slate&#x27;s student, expected to have practiced beforehand. They both offered me broken things rather than new ones — their way of keeping the traditions alive.<\/p>\n<p>I took apart my toys not just out of curiosity but because it gave me a sense of what was inside them. Both families understood that each piece had its own story and purpose, whether I played with them or repaired them. My love for the old instruments came from both lines, and in time, it shaped who I became.<\/p>"}, {"kind": "page", "label": "Page 46", "chapter": "My Generation", "html": "<p>In my generation’s first law, both households demanded work entered honestly and music practiced with no strings attached — whether loved or not. The church required us to sit where we could see our mother play the organ at Sunday services. And each line’s traditions dictated that things be kept — records as carefully as household physics, and each other as family needs.<\/p>\n<p>I do remember my parents’ habits of keeping everything possible, but I don’t recall them telling me what to keep. Instead, they lived by a simple rule: if something could be fixed, it was never thrown away. My mother Ruby’s meticulous record-keeping in the family Bible mirrored her father Slate’s careful care of household books — both passed down through generations.<\/p>\n<p>My father Onyx taught piano lessons and practiced with no regard for his love of music; he entered all work honestly at his repair shop, just as my grandfather Jasper did with his day book. Each line carried their traditions forward, ensuring neither lost its identity in Dallas.<\/p>\n<p>I grew up seeing them both practice these demands every day — the hands that could still play, and those who knew how to keep everything from broken guitars to family histories. My mother’s meticulous record-keeping in her Bible mirrored my father’s careful shop notes; they both kept everything possible, and taught their children to do the same. The Frozens’ pride and Flameses’ patience intertwined at our kitchen table.<\/p>\n<p>The repair shop became a heartbeat of my childhood — each day my father practiced his trade with no regard for what he loved or not. My mother played in church so her family could watch; she kept everything possible, passing down her meticulous habits to me as I taught piano lessons and maintained the old instruments we inherited from both lines. The Frozens’ work ethic and Flameses’ record-keeping ensured neither line lost its identity in Dallas.<\/p>"}, {"kind": "page", "label": "Page 47", "chapter": "My Generation", "html": "<p>The doctrine reached me the way it reaches everyone in this family: not as a speech but as a sentence overheard until it became a reflex. My grandfather Jasper said it at his bench when I was small and he was old — a family keeps what it can fix, and fixes what it keeps — about a customer&#x27;s lathe or radio, I think. My father applied the doctrine to machines, teaching me patience in the day-to-day grind of fixing. My mother took it even further, applying the rule with pointed care to people’s lives: her marriages, my fevers as a child.<\/p>\n<p>From the other line, my grandmother Opal taught me that version at her piano — you do not discard a slow student. What I understood then was: do not throw away. Now, what I understand is harder: some keeping is work, and some is only fear with good posture, and the sentence does not tell you which is which.<\/p>\n<p>I remember my father’s bench in his workshop, where he taught me to be patient as we worked through each repair. And I recall my mother’s piano at home, her version of the doctrine: do not discard a slow student. Now, as I sit here, I see these lines intertwined — work and fear, patience and doubt. The sentence does tell you which is which for some things, but it can be murky for others. Some keeping requires effort, while other things require just being present or understanding someone&#x27;s growth.<\/p>\n<p>In my own life, the doctrine has become a mix of hands-on care and the need to stay in the moment. It shapes how I approach teaching piano lessons — not just fixing mistakes, but understanding each student’s unique journey. And it influences how I support marriages and children — not just holding onto their problems, but also embracing them as part of the ongoing work of life.<\/p>\n<p>The doctrine has become a guide for my actions, a lens through which I view both the work required to keep something valuable and the fear that might prompt us to discard or ignore. It is harder now than when I first heard it — not just because of the added complexity but also because I see how easily we can slip into either mode without realizing it.<\/p>\n<p>As I continue my own journey, carrying this doctrine forward, I realize it holds a mirror up to our family’s history and how each generation has interpreted and applied these principles. Some parts are<\/p>"}, {"kind": "page", "label": "Page 48", "chapter": "My Generation", "html": "<p>The gathering I remember
