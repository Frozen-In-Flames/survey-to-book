*:<\/li><\/ul>\n<p>1. *<em>Preheat the Oven and Prepare the Cornbread Skillet<\/em>* Place a cast iron skillet over medium heat on your stovetop. Allow it to preheat for about 5 minutes until hot.<\/p>\n<p>2. *<em>Mix Dry Ingredients<\/em>* In a mixing bowl, combine cornmeal, salt, and baking soda. Mix well with a whisk or spoon.<\/p>\n<p>3. *<em>Add Eggs and Milk<\/em>* Add the eggs to the dry ingredients and mix gently but thoroughly using your hands or a wooden spoon until combined.<\/p>\n<p>4. *<em>Fold in Bacon Drippings<\/em>* Fold in half of the bacon drippings into the batter, ensuring they are evenly distributed throughout.<\/p>\n<p>5. *<em>Pour Into Skillet<\/em>* Pour the mixture into the preheated skillet and spread it out with a spatula to an even thickness.<\/p>\n<p>6. *<em>Bake at 425°F (218°C)<\/em>* Bake in the oven for 25 minutes or until the crust forms and is golden brown, tested by gentle pressure on the top surface of the cornbread.<\/p>\n<ul><li>*<em>Yield<\/em>*:<\/li><li>Approximately 3 quarts<\/li><\/ul>\n<ul><li>*<em>Storage<\/em>*:<\/li><li>The cornbread can be stored in an airtight container at room temperature.<\/li><li>Any jar whose lid is concave or unmoving under the thumb, and which makes a ping when cooling, indicates it’s ready to eat.<\/li><\/ul>\n<ul><li>*<em>Spoilage and Readiness<\/em>*:<\/li><li>If any jars show signs of doubt (lids are not secure), they should be eaten that week. Jars with questionable lids are discarded.<\/li><li>Jars that seal correctly will last for several months if stored in a cool, dry place away from direct sunlight.<\/li><\/ul>\n<p>This recipe follows the tradition set by Pearl Frozen’s meticulous record-keeping and Onyx Frozen’s precision standard. Each step is guided by heat<\/p>"}, {"kind": "page", "label": "Page 82", "chapter": "Preservation and Keeping", "html": "<p>In this chapter of Preservation and Keeping, I delve into my freezer discipline under Pearl Frozen’s meticulous standard. The freezer holds my accounts at below zero: stocks in flat bags that file like documents; beans and chili in single-session portions; brisket sliced and laid out; summer&#x27;s peaches against winter&#x27;s requests.<\/p>\n<p>Each item is carefully labeled with the dish and the date, affixed to a hand-tape label. This labeling system ensures accountability and visibility within my recipe record: what goes in is noted, what comes out is struck, and anything that has reached its year without being examined is scrutinized and usually discarded. The freezer&#x27;s rule acts as a perpetual inventory; any other use turns it into an archive of forgotten items.<\/p>\n<p>Today, I revisit this cold archive under the accounts standard. To start, I retrieve my summer’s peaches: perfect specimens, now frozen against winter’s cobbler requests. They were laid out and labeled with their dish and date in hand on tape when they arrived from the market last month. The freezer runs on the exacting rule: what goes in is noted, what comes out is struck, and items that have aged are inspected for freshness.<\/p>\n<p>The archive within my freezer consists of a rotation system that ensures nothing remains untouched or forgotten. Each item’s presence is documented with care, ensuring transparency and accountability. A quick check reveals no labels missing, indicating the rule has been followed meticulously month by month. This consistent practice maintains the integrity of what goes in and out, preserving each item for its intended use.<\/p>\n<p>The freezer itself functions as a tomb with a light inside, maintaining an environment where items are preserved until their natural expiration date or when they fail any test of freshness. The archive is not just storage; it’s a system that prevents decay and maintains the quality of what is kept. This method ensures that no item becomes obsolete, keeping my accounts in order and ensuring every meal prepared from these frozen treasures remains delicious.<\/p>\n<p>In conclusion, this freezer discipline acts as a testament to Pearl Frozen&#x27;s meticulous record-keeping. It embodies her standard of precision while providing a practical solution for preserving perishable items until their natural time comes. Every label is a reminder of the care and attention needed in keeping my accounts at below zero, ensuring that no item remains forgotten or decaying. The freezer serves as both an archive and a tomb, maintaining the integrity of what I keep<\/p>"}, {"kind": "page", "label": "Page 83", "chapter": "Preservation and Keeping", "html": "<p>*<em>Technique Lesson: Keeping<\/em>*<\/p>\n<p>Today, we teach the keeping method from Slate&#x27;s refrigeration knowledge as passed down to me by my father Onyx Frozen. The technique involves curing and smoking a brisket kin, like a beef navel, which is salted at two and a half percent weight with curing salt measured precisely like medicine. This process takes ten days in cold temperatures before the brisket is smoked over oak wood until it reaches its natural bend.<\/p>\n<p>*<em>Preparation:<\/em>*<\/p>\n<ul><li>*<em>Salt<\/em>*: Two and a half pounds of curing salt mixed into one hundred pounds of beef.<\/li><li>*<em>Beef<\/em>*: A 12-pound brisket, salted evenly with the curing mixture on all surfaces. The brisket rests in a refrigerator for ten days without refrigeration during this time.<\/li><\/ul>\n<p>*<em>Container:<\/em>*<\/p>\n<ul><li>Use a heavy-duty plastic or stainless steel container to preserve and manage temperature fluctuations.<\/li><\/ul>\n<p>*<em>Temperature:<\/em>*<\/p>\n<ul><li>Keep the container at 40°F (4°C) for the first four days, then drop it to 25°F (-3.9°C) for the next six days of curing.<\/li><\/ul>\n<p>*<em>Time:<\/em>*<\/p>\n<ul><li>After ten days in the cold, smoke the brisket over oak wood until it achieves its natural bend. This typically takes about twelve hours at a temperature range of 200°F (93°C), adjusting heat as needed to achieve even browning and flavor development.<\/li><\/ul>\n<p>*<em>Senses Check:<\/em>*<\/p>\n<ul><li>Throughout the curing process, check for saltiness with your tongue.<\/li><li>After ten days in cold temperatures, gently prod the brisket; it should be firm but not dry. Use a digital kitchen thermometer to ensure internal temperature reaches at least 40°F (4°C) and stays there.<\/li><\/ul>\n<p>*<em>Mistakes to Prevent:<\/em>*<\/p>\n<ul><li>Too much salt can overpower other flavors; adjust accordingly.<\/li><li>Incorrect temperature management can lead to premature curing or drying out the meat.<\/li><\/ul>\n<p>*<em>Test to Confirm Success:<\/em>*<\/p>\n<ul><li>Once smoked, slice a piece of brisket and check for even coloration. The interior should be well-moistened but not overcooked. Taste it to ensure saltiness and smoke flavor are balanced.<\/li><\/ul>\n<p>Today, I cure a beef navel with precision using two and a half pounds of curing salt mixed into one hundred pounds of beef. After ten days in cold temperatures, the brisket is smoked over oak wood until it reaches<\/p>"}, {"kind": "page", "label": "Page 84", "chapter": "Preservation and Keeping", "html": "<p>In my kitchen, keeping becomes the family sentence at its daily work. The beans improve with each repotting; the chili, transformed from simmered goodness into tacos by lunchtime, is always improved. And so it goes for every pot dish: their second day is indeed their true life in my hands.<\/p>\n<p>The brisket&#x27;s history has a rich arc: first as sandwiches, then hash, and finally as stock at session’s end. But there is one dish that stands apart—brisket hash of the fire year’s invention. It began when we celebrated a grand occasion with feasting, its remnants turned into the rebuilt studio’s first breakfast. Now, this meal becomes the room&#x27;s request, made only on the doctrine’s terms: morning after.<\/p>\n<p>To make brisket hash, I use two and a half pounds of curing salt mixed into one hundred pounds of beef. After ten days in cold temperatures, it is smoked over oak wood until the brisket reaches my taste—a golden crust without drying out. This technique requires precision, as does keeping—the right temperature, timing, and judgment to know when readiness has arrived.<\/p>\n<p>The substitution craft of keeping is evident in how I handle a missing ingredient: if cornmeal runs low, I use all-purpose flour. The swap works well; it costs only the loss of texture’s richness. But on this day, I am careful with ingredients like salt, ensuring flavor balance without sacrificing quality.<\/p>\n<p>Keeping here ensures no fried thing past its prime or dressed salad stands in my kitchen&#x27;s tradition. Every dish improves with each repotting and transforms with time to meet the doctrine’s terms: a meal that comes only the morning after.<\/p>\n<p>Today, I bake brisket hash over an open flame of butter and cornmeal, symbolizing the family&#x27;s practices passed through generations. Each serving is a moment to celebrate feeding those who gather around our open door—no apologies necessary. The dish embodies keeping and history; no matter how many times we prepare it, each bite ties us together in tradition.<\/p>"}, {"kind": "page", "label": "Page 85", "chapter": "Preservation and Keeping", "html": "<p>In my kitchen, I organize the scraps that keep us alive: bones, carcasses, ends of roasts, onion ends, herb stems, and vegetable peelings. These ingredients go into the stock or to the garden bed my wife maintains. Bacon grease is strained into a can as an asset, recorded in my mind like cash.<\/p>\n<p>The line&#x27;s standard for keeping begins when I add these things to our kitchen system: they are part of our daily feeding practice. When a kept thing has no named future — a bone without plans beyond the stock or one discarded because it feels like losing — that is where hoarding starts. At this point, the accounts do not allow such actions; instead, they require naming and planning for what we keep.<\/p>\n<p>Today, I return to my kitchen after a day of feeding guests. I set the bones from last night&#x27;s roast into the stock pot. The onion ends find their place in a basket to feed our plants later. The herb stems are saved, their potential yet untold. Vegetable peels that remain sound will be repurposed as well.<\/p>\n<p>In this kitchen, keeping is not hoarding but an investment: it feeds us and nurtures life around the table. Each ingredient has its place, each action named with care. Whether for immediate use or future planting, every scrap serves a purpose in our feeding system, ensuring no item goes to waste beyond its known future.<\/p>\n<p>Today&#x27;s pantry inventory includes five pounds of cornmeal and ten cups each of flour, rice, dried beans, and black-eyed peas; sugar, baking powder, soda, salt, annatto for depth, chipotle for smoke, pepper in various grinds, butter, bacon drippings, and peanut oil. Each staple serves its purpose without excess; they are the foundation from which new dishes emerge.<\/p>\n<p>The pantry is a testament to Pearl Frozen&#x27;s meticulousness: no item goes unused or unrecorded. In my kitchen, these items help sustain our family through meals that blend traditions from both lines — Ruby’s warmth and feeding people with Onyx&#x27;s precision. Each serving ties us together in history and tradition.<\/p>"}, {"kind": "page", "label": "Page 86", "chapter": "Preservation and Keeping", "html": "<p>In my kitchen’s pantry, I return keeping under pressure&#x27;s hardest test. The doctrine at an empty shelf still stands: it never allowed us to be without food or hope for months on almost no income while we waited. What making do meant was restocking before rent, ensuring meals were prepared with the first repair money.<\/p>\n<p>Today, in my Dallas pantry, I bake a frozen cornmeal bread using only what’s at hand. The empty shelf taught us not to wait but prepare: every item counted for both sustenance and future needs. No item went unused or unrecorded; each meal was fed from this discipline of keeping.<\/p>\n<p>I substitute a few ingredients with what&#x27;s readily available, knowing the cost isn&#x27;t in flavor but time. I use stale cornmeal mixed with fresh flour and sugar, adding salt and baking soda for structure. The pantry teaches me to make do without expensive ingredients, ensuring every dish is prepared with care.<\/p>\n<p>The final bread is as satisfying as the old recipes: a golden-brown texture that cracksle when cut. Each serving ties us together in history; it’s a reminder of our family practices passed through generations — feeding people with meticulousness and love. The pantry holds these lessons, just like keeping taught my mother to feed everyone who entered her household.<\/p>\n<p>In this chapter, the kitchens hold echoes of Flint and Pearl Frozen: completeness enforced by detailed record-keeping. My own kitchen blends traditions—Ruby’s warmth and Onyx&#x27;s precision—and becomes a bridge between past lines. This cornbread embodies both legacies; sustenance also carries forward lessons from each line.<\/p>"}, {"kind": "page", "label": "Page 87", "chapter": "Preservation and Keeping", "html": "<p>In this chapter of Preservation and Keeping, I open with a failure to save from my first studio. A stock that should have been carefully stored overnight was neglected due to fatigue, leading to its loss and recorded in the logbook—a lesson learned hard by throwing it out. My second month’s preserves were lost when their seal failed, caught swiftly during monthly inventories—another reminder of the importance of thoroughness.<\/p>\n<p>The freezer&#x27;s contents once faced a failure during the rebuild, when icehouse walls kept cold for two days before thawing entirely and taking its tax. These failures taught me that keeping is not merely about saving but understanding it as a discipline: a practice to hold back time rather than repeal it.<\/p>\n<p>What I have learned from these incidents is that a keeper who cannot throw away has only understood fear, which is futile when faced with the inevitable passage of time. Keeping is a methodical task requiring attention and diligence, not an illusion or magic spell. Today, at my kitchen table, I bake Jet Flames&#x27; cornbread over an open flame of butter and cornmeal, symbolizing these lessons passed through generations.<\/p>\n<p>### Jet’s Skillet Cornbread<\/p>\n<ul><li>*<em>Ingredients<\/em>*: 2 cups cornmeal, 1 tsp salt, 1 tsp baking soda, 2 eggs, 2 cups buttermilk, ½ cup bacon drippings.<\/li><li>*<em>Method<\/em>*: Preheat skillet to 425°F. Mix cornmeal and soda in a bowl; add eggs and milk, whisk briefly. Fold half of the bacon drippings into batter. Pour into hot skillet and bake for 25 minutes or until crust forms.<\/li><\/ul>\n<p>### Summary In this chapter, failure taught me that keeping is a disciplined practice—not an escape from time’s passage. Each dish I prepare—whether Jet Flames&#x27; cornbread over an open flame or Pearl Frozen&#x27;s beans simmered gently—is a testament to these teachings. The recipes are not mere instructions but the legacy of my mother and father carried forward through generations.<\/p>\n<p>Today, I serve Jet Flames&#x27; cornbread, imbued with family history: warmth from Ruby’s teaching, precision from Onyx’s standards. Each bite is a connection to our past—feeding those who gather around the table in honor of our traditions.<\/p>"}, {"kind": "page", "label": "Page 88", "chapter": "Preservation and Keeping", "html": "<p>Today in my kitchen, I open Jet Flames’ cornbread recipe from her cards—a testament to these teachings. The recipes are not mere instructions but the legacy of my mother and father carried forward through generations. My hands hold Jet’s original card, a piece of family history passed directly from the line&#x27;s matriarch. This dish has earned its place in our own kitchen record: made twice by Ruby, asked for once by Onyx, now entered here.<\/p>\n<p>The rule by which dishes earn their place in my recipe log is the family standard: they must have been made twice and then asked for at least once. Today, I bake Jet Flames’ cornbread over an open flame of butter and cornmeal, a moment to celebrate feeding those who gather around our table. Each serving is imbued with family history—Ruby’s warmth from her hands, Onyx’s precision from his standards.<\/p>\n<p>In my pantry, we take stock: what staple items are kept, in what quantity, in what order, and the reasoning of each shelf. We ensure no expense is wasted; every item serves a specific need without surplus. The pantry includes traditional spices and fats—annatto for depth, chipotle for smoke, pepper in various grinds—from past generations.<\/p>\n<p>This cornbread embodies both legacies: warm from Ruby’s teaching and precise from Onyx’s standards. Each bite connects us to our history—a connection that is celebrated at our table each day. The pantry inventory ensures we are well-prepared for the future meals of our family, carrying forward traditions with careful selection and discipline.<\/p>"}, {"kind": "page", "label": "Page 89", "chapter": "Preservation and Keeping", "html": "<p>In my kitchen, the heirlooms speak of their own history—testifying to each line’s custodianship. Jet’s iron skillet, seasoned by three generations of cornbread, is in weekly service here. Pearl&#x27;s account ledgers remain with her day books; her margins still argue for accuracy and completeness. Opal&#x27;s slotted spoon hangs at my stove, a reminder of Flint’s toolbox in the studio—a cousin to the kitchen that testifies to its continuity: this family&#x27;s practices are not about blood but custody—of keeping things as they were trusted.<\/p>\n<p>Today, Jet’s recipe cards reside in a tin passed down from her mother. This hands-on tradition remains mine, like my grandmother Ruby&#x27;s teaching of feeding people and teaching them is one act. As I bake cornbread today, the warmth and flavor are a testament to these kitchens&#x27; heirlooms: Flint&#x27;s precision, Pearl’s meticulous record-keeping, and Jet’s communal table.<\/p>\n<p>The kitchen itself is not merely a space but a tableau—a stove where the skillet glints with care, surfaces smooth from daily use. It radiates light that makes everything in reach seem accessible for cooking—tools within arm’s length, each serving made to fill hands as it should. Here, I stand beside Jet&#x27;s iron skillet, feeding those who gather around my table today.<\/p>\n<p>The kitchen is a place of keeping and handover—a space where the past and future meet, preserved with care and passed on through generations. This cornbread is not just a dish but a testament to our family’s continuity: Flint’s standards in precision, Pearl&#x27;s completeness in record-keeping, and Jet’s warmth that feeds her community. Each bite connects us to history, ensuring no meal enters our home unprepared.<\/p>"}, {"kind": "page", "label": "Page 90", "chapter": "Preservation and Keeping", "html": "<p>Beside myself, my kitchen stands a place of two tenses, each with its authority. Amber keeps it present: her photographs act as its visual index, her garden bed lush and vibrant, and her standard set table ensures every dish&#x27;s completion. She is the one who declares what belongs on this stove, her presence as much a part of it as any tool within reach.<\/p>\n<p>My sister Opal keeps its future in the way she was never appointed to: copies of our recipe record remain in her hands, distributed like family books, preserving our lineage through scattered pages rather than a singular keeper. She holds these archives just as she did the rest of our ancestors&#x27; stories, ensuring they survive by being shared.<\/p>\n<p>Both keepers fell into their roles not chosen but by choice; writing and showing up define them both. The last chapter is theirs too, like mine—a place where our family&#x27;s legacy unfolds through every page. Amber’s kitchen today holds a cornbread I bake over an open flame of butter and cornmeal, connecting us to Flint’s standards in precision, Pearl’s completeness in record-keeping, and Jet’s warmth that feeds her community. Each bite ties us together in history.<\/p>\n<p>At the end of this page, my next dish is not yet rendered: it&#x27;s a signature recipe from Onyx Frozen&#x27;s kitchen—Pearl&#x27;s Pot Beans. This chapter turns toward its final pages; what does our tradition hold for future kitchens? Who will write down these stories and show up to keep them alive?<\/p>\n<hr>"}, {"kind": "page", "label": "Page 91", "chapter": "Teaching and Handing On", "html": "<p>Today, my teaching starts with tasting—before knife or heat comes into play. It&#x27;s simple to check: a sip of broth from the pot tells whether it needs more salt; a bite of cornbread shows if it’s golden and soft enough. I teach first because feeding people is as important as understanding the job at hand.<\/p>\n<p>At my own kitchen counter, young chefs learn log and chili side by side, each session requiring them to keep both pots. They’ll become the ones who keep sessions too; it&#x27;s a simple rule: taste, then cook, never skip either step. The lessons are clear: listen before touching, understand tasks, charge honestly.<\/p>\n<p>At my sister’s table, I’m often the student instead of the teacher. Here, I learned to sit at the front room counter and watch as everyone eats. Ruby taught me by example—how a child is fed and what makes them happy with food. At her table, you learn that feeding people is about more than just cooking; it’s also about listening and understanding.<\/p>\n<p>My father’s kitchen became my next test: listen before touching, understand the job, enter every task in the day book, charge honestly. His precision made me realize that even small jobs need care—every measure counts, every detail important.<\/p>\n<p>This chapter shifts to Onyx Frozen&#x27;s kitchen, where I learn the iron standard of meticulousness and exactness. The pantry is a testament to Pearl’s record-keeping: everything tracked with her careful hand. From here, I move to my own counter, blending traditions—Ruby’s warmth with Onyx’s standards—and create new dishes.<\/p>\n<p>The final chapter opens with the handing on of craft: teaching first, tasting before cooking; observing at sister&#x27;s table; learning precision from father; and now, creating our future dishes. Each bite ties us together in history. At my kitchen counter today, I serve Jet Flames&#x27; cornbread—warm from Ruby’s teachings and precise from Onyx’s standards. Each bite connects us to our past, feeding those who gather around the open door.<\/p>"}, {"kind": "page", "label": "Page 92", "chapter": "Teaching and Handing On", "html": "<p>Today at my kitchen counter, I serve Jet Flames&#x27; cornbread—a dish handed down through generations with a story of its own. This recipe comes from Ruby’s teachings, passed over six hundred miles to Chicago in handwritten records, along with phone calls that paused on moments like the roux and photographs sent for judgment—just as her great-grandmother once did.<\/p>\n<p>Every bite of Jet Flames&#x27; cornbread ties us together in history. Like Topaz Whitfield learning these dishes from afar via letters and photographs, I stand at my stove today teaching this practice to someone who cannot visit. What survives across the distance is the recipe written down, but it lacks the shimmer and sound that only a kitchen can provide.<\/p>\n<p>I must teach you, new learner standing at your counter, how to handle the ingredients in order—cornmeal with just the right amount of salt, baking soda whisked in briefly, eggs added together, and then folded into buttermilk until smooth. Each step is necessary and important; failure happens sometimes, as it does when cooking any dish.<\/p>\n<p>When the batter goes into the skillet, heat to 425°F—just like Ruby taught me—and let it sizzle with water, shimmering in hot oil before the golden crust forms after about 25 minutes. If you’re too gentle, don’t worry; if too eager, don’t rush. Each bite should be a testament not just of feeding, but also teaching and precision—passing on this family recipe as carefully as Ruby did.<\/p>\n<p>At my kitchen counter today, serving Jet Flames&#x27; cornbread imbued with family history: warmth from Ruby&#x27;s teachings and precise from Onyx’s standards. Each bite connects us to our past, feeding those who gather around the open door in honor of our traditions.<\/p>"}, {"kind": "page", "label": "Page 93", "chapter": "Teaching and Handing On", "html": "<p>*<em>Chapter: Teaching and Handing On<\/em>*<\/p>\n<p>*<em>Recipe Lesson: Scrambled Eggs<\/em>*<\/p>\n<ul><li>*<em>Ingredients<\/em>*:<\/li><li>1 tablespoon unsalted butter<\/li><li>3 medium-sized eggs (beaten with a pinch of salt)<\/li><\/ul>\n<ul><li>*<em>Method<\/em>*:<\/li><\/ul>\n<p>1. *<em>Preparation Phase<\/em><em>: Preheat the small frying pan over low heat to ensure gentle warming. 2. <\/em><em>Butter Phase<\/em><em>: Once the pan reaches the desired temperature, add the butter in a single tablespoon. Be cautious not to overcrowd the pan; this step should be done smoothly and quickly. 3. <\/em><em>Foaming and Quiet Moments<\/em><em>: Wait until the butter begins to foam slightly. Then, it will fall into a quiet state, indicating readiness for adding the eggs. 4. <\/em><em>Egg Addition Phase<\/em><em>: Very gently, pour in the beaten egg mixture into the center of the foaming butter. Stir slowly with a spatula, folding rather than chopping, to maintain even mixing and avoid overcooking. 5. <\/em><em>Timing Check<\/em>*: Remove from heat as soon as the eggs start to shine through, ensuring they remain slightly runny for optimal texture.<\/p>\n<ul><li>*<em>Yield<\/em>*: Approximately 1 serving (2 medium-sized scrambled eggs)<\/li><\/ul>\n<p>*<em>Checks in Order<\/em>*:<\/p>\n<ul><li>Ensure the pan is at the correct low heat level and butter has fully foamed before adding eggs.<\/li><li>Be mindful not to overcrowd the pan with the butter, keeping it gentle throughout the process.<\/li><li>Slowly fold rather than chop the eggs to maintain a smooth texture.<\/li><\/ul>\n<p>*<em>Warnings and What To Do When It Goes Wrong Anyway<\/em>*:<\/p>\n<ul><li>If the eggs start to scramble too quickly or become overcooked: immediately place the hot pan under cold running water to cool down the surface of the eggs. The quick shock can help prevent them from continuing to scramble.<\/li><li>If the eggs are too dry after cooking: add a little bit more butter (if needed) and finish by gently folding again, aiming for an even spread without overcooking.<\/li><\/ul>\n<p>*<em>Safety Precautions<\/em>*:<\/p>\n<ul><li>Handle hot utensils with care; use oven mitts if necessary when handling hot pans or spatulas.<\/li><li>Never leave unattended pots on the stove, especially with butter or other oils as they can catch fire easily.<\/li><li>Keep a lid nearby in case of splashing, and know how to extinguish any<\/li><\/ul>"}, {"kind": "page", "label": "Page 94", "chapter": "Teaching and Handing On", "html": "<p>The doctrine at the end of this cookbook’s table is encapsulated by a simple but powerful instruction: arrive with your tools, taste before you judge, write down what you find, and leave the kitchen better documented than when you entered it. This principle guides every dish we make or learn, from the foundational practices to the latest creations.<\/p>\n<p>As I stand at my stove today, this doctrine is as relevant in my own kitchen as it was when Ruby first taught me about feeding people through her warm recipes and meticulous note-taking. At my father’s toolmaker&#x27;s bench, precision took center stage: listen before touching, understand tasks thoroughly, document every job meticulously, and charge honestly.<\/p>\n<p>In my own kitchen at home, the traditions from both lines blend together seamlessly. The warmth Ruby instilled in me is mirrored by Onyx’s standard of perfection; these two approaches are now woven into a cohesive family practice. Today, I bake Jet Flames’ cornbread over an open flame of butter and cornmeal. Each serving is a moment to celebrate feeding those who gather around the table.<\/p>\n<p>To newcomers like you standing at the counter today, here are some steps:<\/p>\n<ul><li>*<em>Safety Precautions<\/em>*: Handle hot utensils with care; use oven mitts if necessary when handling hot pans or spatulas.<\/li><li>Always be aware of unattended pots and liquids. Butter and other oils can catch fire easily, so keep a lid nearby in case of splashing. Know how to extinguish any flames safely.<\/li><\/ul>\n<p>When the cornbread is done:<\/p>\n<ul><li>*<em>Safety Check<\/em>*: Ensure that the crust has formed without overcooking by gently testing with a spatula.<\/li><li>The finished dish should be evenly golden and crackle when touched.<\/li><\/ul>\n<p>If something goes wrong, try adding more heat or reduce the oven temperature if necessary. Remember to maintain a careful balance of moisture and heat for optimal results.<\/p>\n<p>As you continue in this kitchen, let’s ensure we keep every tradition alive—feeding with care, documenting meticulously, and learning from each other. Each new dish we prepare is another step towards building a better kitchen and leaving our family&#x27;s history even richer than when we started.<\/p>"}, {"kind": "page", "label": "Page 95", "chapter": "Teaching and Handing On", "html": "<p>In this kitchen, the cornbread stands as our central debate—its standing argument after a hundred pages. Ruby taught me that feeding people and teaching them are one act. The Flames case, honestly given: sugar makes it cake; Cornmeal, salt, soda, buttermilk, heat, these ingredients were our ingenuity&#x27;s bread from a poor county, and sweetening it is gilding the tool. Meanwhile, Coral’s line by descent, and Chicago’s by adoption taught me that a spoonful of sugar balances sweetness, browns the crust, and a rule without one spoonful is not a recipe but a relic.<\/p>\n<p>My verdict, as the cook of a joined family, echoes this balance: none in the bread I serve. Sorghum on the table for whoever&#x27;s conscience requires it. This argument isn&#x27;t a failure; rather, it’s a vital sign—one that will be resumed at the next Christmas, on schedule. Each bite is a reminder of our past and the lessons we carry forward.<\/p>\n<p>Ruby taught me her cornbread was about balance—sweetening it not to make it cake but to enhance its texture. Onyx’s standard taught precision: listen before you touch, understand what&#x27;s in front of you, enter every job into your hands. The cornbread at my stove embodies these traditions, a reminder that feeding and teaching are one act.<\/p>\n<p>The Cornbread recipe from Jet Flames’ line:<\/p>\n<ul><li>*<em>Ingredients<\/em>*: 2 cups cornmeal, 1 tsp salt, 1 tsp baking soda, 2 eggs, 2 cups buttermilk, ½ cup bacon drippings.<\/li><li>*<em>Method<\/em>*: Preheat a skillet to 425°F. Mix cornmeal and soda in a bowl; add eggs and milk, whisk briefly. Fold half of the bacon drippings into batter. Pour into hot skillet and bake for 25 minutes or until crust forms.<\/li><\/ul>\n<p>Each serving is imbued with warmth from Ruby’s teaching and precision from Onyx’s standards. This cornbread ties us together—feeding those who gather around the table in honor of our traditions. Each bite celebrates feeding, learning, and keeping, ensuring no meal enters this kitchen unprepared.<\/p>"}, {"kind": "page", "label": "Page 96", "chapter": "Teaching and Handing On", "html": "<p>Today, I amend my archive as my mother taught me to feed people with care and keep every dish meticulously documented.<\/p>\n<p>The cornbread card from Jet’s hand says a teaspoon of soda; my mother&#x27;s memory tells her mother used half that in years when buttermilk was sharpest. Both are kept labeled, because the card records the dish and the memory captures its conditions. The gumbo is attributed to Coral alone by the studio, showing her roux and my grandfather Jasper’s stock—amending the attribution reflects a family&#x27;s complex inheritance: a dish like a family has two lines.<\/p>\n<p>The chili&#x27;s coffee was once believed to have been invented by me during lean years in Dallas. My father put coffee in bean pots at his small repair shop but never wrote it down. It is now written, recorded here as part of my own story and practice. This book records what matters: the family’s practices, failures, successes, and the lessons passed through generations.<\/p>\n<p>In my kitchen, I bake Jet Flames&#x27; cornbread over an open flame of butter and cornmeal, a reminder that each bite ties us together in history and tradition. Each serving is imbued with warmth from Ruby&#x27;s teaching and precision from Onyx&#x27;s standards. This cornbread celebrates feeding those who gather around the table in honor of our traditions.<\/p>\n<p>In my pantry, we take stock: what staple items are kept, in what quantity, in what order, and the reasoning behind each decision. We ensure no expense is wasted; every item serves a specific need without surplus. The pantry includes traditional spices and fats—annatto for depth, chipotle for smoke, pepper in various grinds—from past generations.<\/p>\n<p>Today, I serve Jet Flames&#x27; cornbread, a testament to our family&#x27;s practices passed through generations. Each bite connects us to our history: feeding those who gather around the table in honor of our traditions. The pantry and kitchen are not just places of preservation but also handovers—passing on lessons from one generation to the next.<\/p>"}, {"kind": "page", "label": "Page 97", "chapter": "Teaching and Handing On", "html": "<p>Today, we test the book&#x27;s declared purpose against its full record. The fire of our kitchens preserves traditions passed from generations—keeping standards that feed people, just as they did everywhere else. This chapter teaches you how to write down dishes your family might need again and treat your own recipes with care.<\/p>\n<p>The flames of the Flames line brought a piano teacher and church organist into Dallas in 1949: Jet Flames, her husband Garnet, and their children Ruby and Onyx. Her hand-written cornbread recipe was kept on slate boards for generations before being written down here. Today, we bake Jet Flames&#x27; cornbread over an open flame of butter and cornmeal. Each serving is a moment to celebrate feeding those who gather around the table.<\/p>\n<p>Onyx&#x27;s iron came with him from Pittsburgh in 1948: Flint, his wife Pearl, and their children Ruby and Onyx. He taught me precision through day book entries and careful measurements—a habit carried forward into my own kitchen as a day log that records every job entered into this record. Today, we bake Pearl&#x27;s Pot Beans with smoked ham hock and onion in a pot of cold water over an open flame.<\/p>\n<p>Today, our kitchens are the handover of traditions—keeping them alive for future generations. The record shows each dish from both lines passed through hands: Ruby’s warmth and feeding people, Onyx’s standard and precise record-keeping. Enter your family&#x27;s recipes into this book to preserve them. They are perishing, but we can write them down here.<\/p>\n<p>The next steps include mastering knife work with forward grip and a smooth cut; testing flour in the oven for perfect browning; seasoning each dish with salt and acid late for balance; frying chicken over an open flame of butter and cornmeal—each bite connects us to our history. Keep your pantry organized with five pounds of cornmeal, ten cups of grains and beans, and staple items like sugar and baking powder in quantity without excess.<\/p>\n<p>In the Chicago line, a disaster struck at the Cold Room’s first home kitchen: destroyed by fire in 2024, logs were transferred back, meals cooked from Ruby&#x27;s teachings recorded in Amber&#x27;s photographs. Today, session chili was a precise measurement of failure—a testament to passing traditions across generations—feeding those who gather around the table.<\/p>\n<p>Each dish tells stories of our family practices passed through generations<\/p>"}, {"kind": "page", "label": "Page 98", "chapter": "Teaching and Handing On", "html": "<p>Today at the counter, I turn to you as a beginner eager to carry these teachings forward. Let’s begin with taste: twice. Taste everything you put on your plate. Begin by touching each ingredient—listen for its presence in the dish, feel its weight, and smell it. Then take another bite; taste again. This simple act is fundamental to understanding flavor.<\/p>\n<p>Next, salt carefully. Salt should be layered within a recipe—salt in layers, not all at once. Salt your ingredients, then add more based on how it tastes. Taste as you go, always checking the saltiness of the dish. Don’t just sprinkle it; let its presence permeate every bite.<\/p>\n<p>Now for heat: decide by the table. Heat should be controlled by what’s served and eaten—by the people around you and their preferences. When cooking, keep a grease can at your side to check on the temperature of oil or butter. Taste as you go, tasting every few minutes until you have achieved that perfect golden crust.<\/p>\n<p>Next, keep records: write in your book. Keep a record of everything you do—every dish you learn, every failure, and its cause. Write these details down each day in your book. This habit ensures no detail is forgotten; it keeps the family’s teachings alive and allows for continuous improvement.<\/p>\n<p>Don’t serve dishes without tasting them first. Never discard something until you have thoroughly understood it. Taste everything you prepare before serving it to anyone else, even if it’s just a dish in your own home. It is always better to learn from taste than from failure alone. Always feed whoever is at the table with care.<\/p>\n<p>Stock for those who might be there. Keep an eye on future needs—what will likely come next, and how you can prepare dishes for different tastes and preferences. This habit ensures no one goes without because of a lack of foresight.<\/p>\n<p>And finally, learn one dish at a time. Never aim to learn ten approximately; focus on mastering one dish before moving onto the next. Focus on understanding every aspect—what works, what doesn’t—and then apply these lessons to new dishes. Every failure is an opportunity to improve your techniques and taste buds will become sharper.<\/p>\n<p>Now for when things go wrong: enter the failure and its cause, and cook again tomorrow. If a dish fails today, write down exactly why it didn’t work—what you did<\/p>"}, {"kind": "page", "label": "Page 99", "chapter": "Teaching and Handing On", "html": "<p>In today’s kitchen, I aim to recover Jet Flames’ fried pies from her card alone. These half-moon hand pies were made from dried peaches and biscuit dough, fried in an iron, a technique my cook handed down for generations before my mother, who never needed measurements but still held the flavor. The Chicago branch was consulted; cousins remembered flavors and methods. My sister and I tasted against two generations of memory, hoping to recover her exact temper and crisp texture.<\/p>\n<p>Today’s attempt is simple yet ambitious: to recreate this dish whole or in part. It may not be recovered completely—some truths are lost with cooks—but the open account of family recipes cannot be a shame. They are our agenda, passed down like history through generations.<\/p>\n<p>The fried pies will not be perfect, but they will carry her flavor and my sister’s taste against Jet Flames’ card alone. In the Chicago branch&#x27;s records lie stories of cousins who shared this recipe with their families. Today, I enter these iterations—my sister’s memory tasting, my own hand testing the crisp texture—and hope to bring a bit back from generations past.<\/p>\n<p>Tomorrow, after countless trials and taste checks, we will have a half-moon fried pie that captures her spirit. It may not be exact but it will carry forward the flame of family recipes open and honest in our hands.<\/p>"}, {"kind": "page", "label": "Page 100", "chapter": "Teaching and Handing On", "html": "<p>In closing, I serve Pearl&#x27;s pot of beans, my first memory from her kitchen at midnight when musicians gathered around a warm stove. It is a dish that has sustained every generation in our family: the mill town, the hill country, and even strangers who seek shelter during lean years.<\/p>\n<p>This recipe came to me from Ruby Flames&#x27; teachings, passed down through generations like an heirloom—a testament to her influence as much as it is of her own. The pot&#x27;s presence symbolizes feeding people without regard for expense or occasion: a simple dish that became the cornerstone of our family’s table.<\/p>\n<p>Today, I bake this cornmeal and bean stew in my Dallas kitchen, blending Ruby’s warmth with Onyx’s standard of precision. Each serving holds the promise of nourishment, just like her teaching did—feeding those who gather around the table.<\/p>\n<p>As we close on Pearl&#x27;s pot of beans, a dish that embodies our family&#x27;s traditions, I look ahead to the next chapter. Tomorrow, I will serve Jet Flames&#x27; cornbread over an open flame, carrying forward Ruby’s teachings with new hands and fresh memories. The recipe for this pie lies on page fifty-two, as it should belong, where it was originally written down by her hand.<\/p>\n<p>Tomorrow&#x27;s dish is not yet rendered, but the pages of my kitchen are already preparing for the next subject: a pie that will be baked in the tradition of Jet Flames&#x27; teaching and handed down through future generations. The chapter turns toward new dishes and kitchens as we continue to honor our family’s legacy open and honest in our hands.<\/p>\n<hr>"}, {"kind": "meta", "label"
