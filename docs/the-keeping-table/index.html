s color and voice guiding me to maintain the perfect temperature.<\/p>\n<p>After counting for my recipe&#x27;s required time—three minutes hot, three more cold—I test by gently pushing a piece of chicken into the skillet. It sizzles, crackling with excitement. Then I pull it out, golden brown and yielding slightly—just how Ruby taught me. The crust resists, not crumbling under pressure; its pitch confirms it’s done. Finally, I check for doneness in the center by piercing it gently, ensuring moistness.<\/p>\n<p>This test tells me that the heat was controlled correctly, the chicken cooked to perfection. Now, my Fried Chicken is ready, a testament to Ruby&#x27;s teaching and the Flames kitchen&#x27;s heritage of precision control.<\/p>"}, {"kind": "page", "label": "Page 43", "chapter": "Techniques", "html": "<p>In this chapter, I teach the palate’s discipline as method through seasoning. The technique starts with salt, starting onions as they sweat; it follows with meat before hitting the pan and again, lightly, at pot beginning and end. Fat is reserved for service, acid late, heat determined by the table.<\/p>\n<p>To illustrate: For my Fried Chicken, I start by salting onions as they sweat. This step is essential because salt draws moisture out of raw ingredients, enhancing flavor without overpowering it. The meat is seasoned before hitting the pan — lightly, always lightly, to prevent drying or overcooking. At pot beginning and again at end, a light seasoning ensures balanced flavors throughout.<\/p>\n<p>Fat, reserved until service, carries all else to the tongue, as salt does first impressions. Acid comes late in dishes like this, after heat is decided by each table&#x27;s needs, making flavor decisions personal rather than universal. The hard case — a dish you can’t taste one more time — indicates when palate fatigue sets in and it’s time for fresh eyes.<\/p>\n<p>For Fried Chicken, I trust the record: season by the measures that cards give, written by hands that were fresh like my mother&#x27;s or father&#x27;s. This method ensures balance and depth, making each bite a story of care and precision. The test is simple yet crucial: check for doneness in center with gentle piercing to ensure moistness.<\/p>\n<p>My Fried Chicken crust resists pressure, confirming it’s done. I pierce gently at center to verify moistness; the pitch confirms heat control. This technique ensures perfection from start to finish — a testament to Ruby’s teaching and our family’s kitchen legacy of precision control. Now, my chicken is ready, its flavors balanced, its texture satisfying, embodying both traditions: Ruby&#x27;s warmth with Onyx’s standard.<\/p>\n<p>The Fried Chicken serves as proof that the palate’s discipline comes through meticulous seasoning at every layer, making each bite a story of care and precision passed down from generations.<\/p>"}, {"kind": "page", "label": "Page 44", "chapter": "Techniques", "html": "<p>In my father’s Dallas kitchen, I start with what the scrap discipline saved: bones from the week’s meats, the ends of onions, celery gone honest, carrot tops, and herb stems — never the bitter or spoiled, always something to add nuance without drawing attention. The pot is brought up slowly, simmering gently on a low flame, then skimmed without apology until only a cloudy conscience remains. This boiled stock is a clouded conscience in my kitchen as well: it’s the liquid foundation of the Frozen line&#x27;s patience.<\/p>\n<p>Gravies are its children: drippings from fried chicken and roasted meats cooked into color that matches what the dish wants, with stock added in measured patience. Gravy-making is my first technique lesson; I practice it precisely, just like Onyx taught me to measure every job on his day book. The gravies are the stock’s children — a testament of our family&#x27;s traditions and standards.<\/p>\n<p>A stock is kept for three uses: soup, sauce, and rice or beans that cook in it and transform into something new, each dish becoming part of my own kitchen&#x27;s legacy. A freezer without stock is seen as a house without a day book by the Frozen line — an empty pantry waiting to be filled with what we need most.<\/p>\n<p>Today, I bring up the pot slowly on low flame, skim until only a cloudy conscience remains, and let it simmer gently for hours as instructed. The senses check: the liquid’s color, its scent, the smoke from onions or celery, all are indicators that patience is at work. A stock&#x27;s barest simmer prevents any mistakes of overheating — no burnt soup or sauce, no ruined rice or beans.<\/p>\n<p>Finally, I taste to test: a spoon dipped into the cloudy conscience reveals clarity and depth of flavor, confirming it was done right. The fried chicken comes next, its flavors balanced and texture satisfying, embodying both traditions — Ruby&#x27;s warmth with Onyx’s standard — as proof that discipline in seasoning at every layer carries forward.<\/p>\n<p>The stock becomes a liquid foundation for all dishes; the patience in this pot ensures no mistake is made. My kitchen now has a liquid tradition of precision and control, passing on what generations before me have taught: feeding people with care through disciplined methods.<\/p>"}, {"kind": "page", "label": "Page 45", "chapter": "Techniques", "html": "<p>Frying is the book&#x27;s most dangerous technique, and I teach it with respect stated first. Let’s begin by understanding what our hands do in this process: We start by knowing the oil&#x27;s temperature — either through the flour&#x27;s behavior or a thermometer that my father&#x27;s line insists on for precision.<\/p>\n<p>For the flour, we use a pinch, which dances and browns in just five counts of your breath. Alternatively, you can use a thermometer to ensure it&#x27;s at around 350°F (176°C) — this is the temperature where our food won&#x27;t steam but will start browning nicely.<\/p>\n<p>Next, prepare the coating: we use seasoned flour that’s twice dredged for chicken pieces. This ensures an even and crispy crust on both sides of each piece without overcrowding them in the pan.<\/p>\n<p>The pieces go into the pan away from your body to prevent any accidental burns. We follow a specific order when adding our ingredients — starting with the harder-to-crust meats like pork, then moving onto the chicken, followed by the vegetables that benefit from being fried gently at first until they absorb flavor without browning too much.<\/p>\n<p>The iron pan&#x27;s part is its memory: it holds and returns heat effectively. Cast-iron pans are key here as their surface retains heat well and distributes it evenly across a wide area — preventing hot spots and steaming of the food which breaks our promise of crispy, golden crusts.<\/p>\n<p>To test if we have fried correctly, check these senses:<\/p>\n<p>1. *<em>Texture:<\/em><em> The pieces should be firm on the outside but slightly soft on the inside; they shouldn’t come out soggy. 2. <\/em><em>Color:<\/em><em> They should turn a deep golden brown — not burnt, just caramelized and well-browned. 3. <\/em><em>Smell:<\/em>* Our pan will smell rich, with notes of garlic or onions if used.<\/p>\n<p>If any of these checks fail, you know the mistake has been made:<\/p>\n<ul><li>If the pieces are steamy, it means they were overcrowded in the pan or undercooked overall.<\/li><li>If the pieces aren’t golden brown enough, either your temperature is too low, or your cooking time is insufficient. Remember, heat and time are crucial to achieve a perfect crust.<\/li><\/ul>\n<p>To prevent any future mistakes:<\/p>\n<p>1. *<em>Never Overcrowd:<\/em>* Ensure that there’s space between each piece in the pan so they can cook without steaming. 2<\/p>"}, {"kind": "page", "label": "Page 46", "chapter": "Techniques", "html": "<p>In this chapter, we focus on teaching the slow techniques the Flames and Frozen lines agree on, specifically beans and grains. Let&#x27;s walk through the process step-by-step, from soaking to serving, ensuring each technique is done right.<\/p>\n<p>### Beans and Grains: The Slow Techniques<\/p>\n<p>*<em>Beans:<\/em>* First, we soak the beans overnight in cold water without adding any quick-soak heresies. This is a simple rule that Ruby Flames taught me. Overnight is long enough to soften the skins and hydrate the grains, but not so long that they become mushy.<\/p>\n<p>*<em>Grains:<\/em>* For the grains, Opal taught me to rinse them thoroughly with cold water before measuring by my knuckle. The knuckle is a useful guide: if it fits comfortably between two fingers, you have the right amount for one serving. This method ensures even distribution and prevents any grain from being too small or too large.<\/p>\n<p>*<em>Rinsing:<\/em>* After soaking, we rinse off the beans and grains under cold water to remove excess starch. This step is crucial because starch can make a dish gummy if not cleaned properly.<\/p>\n<p>*<em>Soaking Duration:<\/em>* The next day, place the soaked beans in your pot and cover with a couple of inches of water. Allow them to soak for at least 6 hours but up to overnight, depending on the type of bean (e.g., pinto, black-eyed peas). This soaking process softens them so they can cook more evenly.<\/p>\n<p>*<em>Rinsing:<\/em>* After soaking, give each grain another rinse in cold water to remove any excess starch. The grains should be clean and ready for cooking.<\/p>\n<p>*<em>Simmering:<\/em>* Now, we&#x27;re ready to simmer our beans and grains. Use a heavy-bottomed pot that’s large enough to accommodate the entire batch of soaked ingredients without overcrowding. Bring them to a gentle simmer over medium heat; avoid strong, direct heat as it can scorch or burn the surface of the grains.<\/p>\n<p>*<em>Lid:<\/em>* The lid should be slightly ajar so steam can escape but not let hot moisture out. This allows for even cooking and prevents boiling over.<\/p>\n<p>*<em>Seasoning:<\/em>* Add a generous pinch of salt at the end to taste, rather than throughout the simmering process. Over-salting early can ruin the flavor profile of the dish.<\/p>\n<p>### Testing<\/p>\n<p>To ensure you’ve done everything right, test your beans and grains using<\/p>"}, {"kind": "page", "label": "Page 47", "chapter": "Techniques", "html": "<p>### Eggs<\/p>\n<p>Eggs are my examination dish, as they were every cook&#x27;s in this book’s lineage. The scramble is low and slow, butter first, the eggs moved with a spatula in folds and taken off while they still shine, because they finish on the plate.<\/p>\n<ul><li>*<em>What to do:<\/em>*<\/li><li><em>Heat<\/em>: Place the pan over medium heat until hot.<\/li><li><em>Time<\/em>: Warm up the skillet for about 5 minutes before adding the butter.<\/li><li><em>Yield<\/em>: The scrambled eggs should be golden-brown with a smooth texture. They’re ready when they finish on the plate, not in the pan.<\/li><\/ul>\n<ul><li>*<em>Checks<\/em>*: Use a spatula to test if the egg is cooked through; it should be slightly runny and no longer shiny.<\/li><\/ul>\n<ul><li>*<em>Why It Works<\/em>*:<\/li><li>The gentle movement of the spatula ensures even cooking.<\/li><li>The low heat prevents overcooking.<\/li><li>The quick removal from the pan maintains an ideal texture and shine.<\/li><\/ul>\n<ul><li>*<em>Mistake to Prevent<\/em>*: Overcooked eggs can be tough, dry, or leathery. They lose their smooth texture and start to develop a bitter taste when left in the pan too long.<\/li><\/ul>\n<p>### Testing<\/p>\n<p>To ensure you’ve done everything right for scrambled eggs, test your skillet by adding a few drops of water. If they sizzle and evaporate quickly without bubbling over, the heat is appropriate. A quick scrape with the spatula should leave no residue or clumps. The final check: remove from the pan just as they start to finish on the plate.<\/p>\n<p>### Fry<\/p>\n<p>The fry is in bacon grease, the white set and laced at the edges, the yolk warm and running. Here’s how I do it:<\/p>\n<ul><li>*<em>What to Do<\/em>*:<\/li><li><em>Heat<\/em>: Bring your bacon grease to a medium-high temperature.<\/li><li><em>Time<\/em>: The bacon should be cooked until crisp and golden.<\/li><\/ul>\n<ul><li>*<em>Checks<\/em>*: Ensure that the eggs are fully set on one side, with the white edges just slightly cooked. Check for lacing by gently pressing down with the spatula; it should spring back quickly.<\/li><\/ul>\n<ul><li>*<em>Why It Works<\/em>*:<\/li><li>Proper temperature ensures even cooking of both sides.<\/li><li>The medium-high heat allows the eggs to crisp without drying out.<\/li><\/ul>\n<ul><li>*<em>Mistake to Prevent<\/em>*: Overcooked eggs can<\/li><\/ul>"}, {"kind": "page", "label": "Page 48", "chapter": "Techniques", "html": "<p>### Baking Measures<\/p>\n<p>Baking begins with the fat&#x27;s cut: cold butter or lard worked into flour until pieces are pea-sized and uneven. This ensures irregular crumb texture—uneven, not even, which keeps it from being forgettable. The liquid -- buttermilk always -- is cold, added once; stir just combined to maintain structure. A kneaded dough is ruined before baking.<\/p>\n<p>The oven&#x27;s readiness: test by hand at the door and preheat the iron for cornbread. Batter should smoke faintly with grease—just right. These are techniques first, recipes follow next.<\/p>\n<p>*<em>Why It Works<\/em><em>: Proper temperature ensures even cooking of both sides. Medium-high heat allows eggs to crisp without drying out. <\/em><em>Mistake to Prevent<\/em>*: Overcooked eggs can become rubbery and lack springiness.<\/p>\n<p>### Test: Lacing Check<\/p>\n<p>At this stage, check for lacing by gently pressing down with the spatula; it should spring back quickly. - *<em>Why It Works<\/em><em>: Proper temperature ensures even cooking of both sides. - The medium-high heat allows the eggs to crisp without drying out. - <\/em><em>Mistake to Prevent<\/em>*: Overcooked eggs can become rubbery and lack springiness.<\/p>\n<p>*<em>Test<\/em>*: At this stage, check for lacing by gently pressing down with the spatula; it should spring back quickly.<\/p>"}, {"kind": "page", "label": "Page 49", "chapter": "Techniques", "html": "<p>In this chapter, we teach the finishing technique that runs on studio nights—the pan sauce. The method I learned from Ruby, my mother, and Onyx, my father, is simple yet powerful. Here’s how it works:<\/p>\n<p>The meat comes out of the pan; the drippings stay, adding flavor to the dish. A shallot or onion goes in at the moment when the pan reaches its hottest point—when every drop of fat has bubbled up and down, leaving a golden-brown caramelizing layer. This is our opportunity to lift all those flavors we’ve worked so hard on.<\/p>\n<p>Next comes the deglaze: stock for regular nights; coffee when the pot runs out of liquid; wine when the session’s earned it—after all that work in the pan, there should be some left over from earlier dishes or leftovers. We scrape these into the pan with a wooden spoon until the flavors are fully integrated and everything has lifted up to form one rich liquid.<\/p>\n<p>We then turn off the heat but don’t skip adding butter: a tablespoon of it is melted and gently poured in while stirring quickly. This balances out any remaining dryness from the deglaze, making sure every bit of meat gets that extra touch of richness.<\/p>\n<p>Next comes a squeeze of lemon—any leftover citrus squeezed in fresh will do—and then salt. The salt is important; this is when we decide how our dish should taste and which flavors should stand out. It’s about balance: not too much or too little, but just the right amount to elevate everything else to perfection.<\/p>\n<p>The pan sauce decides whether plain meat becomes a dish because it returns all that history of cooking back into the very thing cooked—everything the meat knew, brought full circle as its signature, written in the pan&#x27;s own ink. It’s a simple technique, yet when done well, it transforms any piece of meat into something rich, savory, and deeply satisfying.<\/p>\n<p>Now, to test if you’ve got the recipe right: after adding the butter, give the sauce a stir and check for lacing—how easily does a spatula press down and bounce back? The liquid should be thick yet still move freely. If it feels too firm or gummy, it needs more cooking; if it’s too thin, add a little bit of stock to thicken.<\/p>\n<p>In this chapter, we blend the warmth from Ruby’s side—<\/p>"}, {"kind": "page", "label": "Page 50", "chapter": "Techniques", "html": "<p>In this chapter, we close the techniques chapter with our family&#x27;s doctrine as kitchen method: what can be fixed, fixed; and the honest limit named.<\/p>\n<p>Too salt: dilution is honest -- more of the dish’s body, a potato in a soup to be lifted out, acid and fat to rebalance what cannot be removed. Too thin: reduction, patience, or a roux made separately and married in. Broken — a sauce split, a gravy lumped: the blender or the sieve, and the lesson entered. Scorched at the edge: decant at once to a clean pot, take only what never touched the burn, and season up to meet what was lost.<\/p>\n<p>The one failure I do not save is the dish whose keeping was neglected — the stock left warm overnight, the jar whose seal failed. The doctrine fixes what it can; it does not gamble with what it cannot understand, and a doubtful dish is not understood. That one goes out, and the loss is entered in the book beside the rule that prevents it.<\/p>\n<p>The next chapter will delve into my own kitchen, where Ruby’s warmth blends with Onyx’s standard. I’ll render new dishes yet to be made, each an embodiment of both traditions. The cornbread we’ve been discussing today is just one example; from this chapter forward, every dish will carry the lessons learned across generations.<\/p>\n<p>The closing lines of page 10 are a transition toward the next subject: the first recipe not yet rendered. As I close my knife drawer and gather my ingredients for the cornbread, the door to Onyx’s toolmaker kitchen is just a step away. The journey into our family&#x27;s kitchens continues, each dish bringing us closer to understanding their methods of feeding people with precision and warmth.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 51", "chapter": "Signature Dishes", "html": "<p>Jet&#x27;s Skillet Cornbread<\/p>\n<p>*<em>Ingredients:<\/em>*<\/p>\n<ul><li>2 cups stone-ground yellow cornmeal<\/li><li>1 teaspoon salt<\/li><li>1 teaspoon baking soda<\/li><li>2 eggs<\/li><li>2 cups buttermilk<\/li><li>¼ cup bacon drippings (½ in the batter, half reserved)<\/li><\/ul>\n<p>*<em>Method:<\/em>* 1. Preheat a skillet to 425 degrees Fahrenheit with its grease until it smokes faintly. 2. In a large bowl, mix together the cornmeal and baking soda; pour in the eggs and buttermilk, whisking until just combined (do not beat). 3. Add half of the bacon drippings to the batter and fold gently. Pour the mixture into the preheated skillet with its greasy surface. 4. Bake for 25 minutes or until a crust forms on top, which should have the color of a good roof.<\/p>\n<p>*<em>Yield:<\/em>*<\/p>\n<ul><li>Serves approximately 8-10 wedges<\/li><\/ul>\n<p>*<em>Provenance Note:<\/em>* This recipe comes directly from Jet Flames herself, her hand-written recipes passed down through generations. The argument about sugar in cornbread is one that has been settled in my kitchen—none in the bread. At the family table, each eater decides their own sweetness as needed.<\/p>\n<p>Serve this warm and straight from the pan, in wedges, for a dish rich with warmth and history from both lines.<\/p>"}, {"kind": "page", "label": "Page 52", "chapter": "Signature Dishes", "html": "<p>Pearl&#x27;s Pot Beans<\/p>\n<p>*<em>Ingredients:<\/em>*<\/p>\n<ul><li>One pound of pinto beans, picked over and soaked overnight in cold water.<\/li><li>A smoked ham hock (one).<\/li><li>One onion, quartered.<\/li><\/ul>\n<p>*<em>Method:<\/em>* 1. Place all ingredients in a large pot that can hold one inch more space at the top than the beans need to cover them by two inches. 2. Cover with cold water, making sure to cover the beans and ham hock completely. 3. Bring the liquid to a bare simmer (a gentle but steady boil) over medium heat. 4. Keep the pot lid slightly ajar, allowing steam to escape while maintaining an even temperature. 5. Stir gently once in a half hour with a spoon; otherwise, allow the ingredients to cook without stirring except for checking.<\/p>\n<p>*<em>Yield:<\/em>*<\/p>\n<ul><li>Eight bowls of cooked beans (yielded by my previous recipe).<\/li><\/ul>\n<p>*<em>Provenance Note:<\/em>* This dish was handed down from Pearl Frozen, born Pearl Kowalski in 1921. She taught her family and community how to care for their pantry items meticulously—entering every job and charge into a day book habit enforced by her exactness. Her beans are a testament to these traditions passed through generations, ensuring each bean is picked over carefully and soaked properly overnight.<\/p>\n<p>*<em>Notes on Preparation:<\/em>*<\/p>\n<ul><li>The soaking water is kept and used later, believed by Pearl to enhance the flavor of the beans.<\/li><li>Salt is added in the last half hour, and a tablespoon of bacon grease is put in at the end for richness.<\/li><li>Beans are ready when five blown on with a spoon are tender all through.<\/li><\/ul>\n<p>*<em>Serving:<\/em>* Serve these warm pot beans straight from the pot, garnished with raw onion slices and a hot sauce to taste. The beans will improve over their first day of cooking, as Pearl&#x27;s accounts indicate—another example of patience and care in her kitchen.<\/p>"}, {"kind": "page", "label": "Page 53", "chapter": "Signature Dishes", "html": "<p>*<em>Recipe for Slate’s Brisket<\/em>*<\/p>\n<ul><li>*<em>Ingredients:<\/em>*<\/li><li>12-pound packer brisket (fat-side up)<\/li><li>6 pounds coarse salt<\/li><li>6 pounds coarse black pepper<\/li><\/ul>\n<ul><li>*<em>Method:<\/em>*<\/li><\/ul>\n<p>1. Preheat your oven to 250 degrees Fahrenheit. 2. Rub the brisket with equal parts coarse salt and pepper, making sure every square inch is covered. 3. Place the brisket in a roasting pan or on a wire rack set over a rimmed baking sheet. 4. Roast for 12 hours, turning once at the halfway point. 5. When done, let it rest for an hour, wrapped and kept at temperature.<\/p>\n<ul><li>*<em>Yield:<\/em>* A family’s worth of second-day portions, frozen in individual servings.<\/li><\/ul>\n<p>*<em>Technique Lesson: Knife Work<\/em>*<\/p>\n<p>Today, we teach knife work—focusing on grip (forward and firm), cut (smooth, precise), sharpening (consistent angle, paper testing), and testing (board pieces even, hand fatigue check). We cover mistakes to prevent such as gripping too tightly or rushing the cut. The test confirms firm grip, smooth cuts, sharp edge without fatigue.<\/p>\n<p>Next steps: move to other techniques like chopping and dicing. Chapter on heat control follows, emphasizing precise cooking over numbers, guided by fire’s color and voice, monitored through gentle hand-testing at specific heights. Testing a classic Fried Chicken demonstrates proper heat control—sizzling water, shimmering oil, golden crust without drying out.<\/p>\n<p>The summary then shifts to seasoning discipline starting with salt on onions, followed by meat, fat reserved for service. Fat and acid are added late; taste testing ensures balance and depth. Chapter concludes with frying technique, including temperature checks through flour behavior or thermometer use. Overcrowding prevents steaminess, proper spatula movements ensure even browning.<\/p>\n<p>*<em>Next Steps<\/em>*: Bean and grain<\/p>\n<p>*<em>Serving:<\/em>* Slice against the grain, pencil-thick at the flat, for a family’s worth of second-day portions. These warm pot beans straight from the pot, garnished with raw onion slices and a hot sauce to taste. The beans will improve over their first day of cooking, as Pearl’s accounts indicate—another example of patience and care in her kitchen.<\/p>"}, {"kind": "page", "label": "Page 54", "chapter": "Signature Dishes", "html": "<p>*<em>Fried Chicken<\/em>*<\/p>\n<p>My mother’s fried chicken has always been known as the pièce de résistance at our table. Tonight I’m setting the record straight with a recipe that captures the essence of her technique and the flavors she infused into it. This is the dish that stretches back to when Ruby taught piano lessons from an ancient wooden table, where hungry children and eager ears filled the air.<\/p>\n<p>*<em>Ingredients:<\/em>*<\/p>\n<ul><li>1 whole chicken (about 4 pounds), cut in eight pieces<\/li><li>2 cups all-purpose flour<\/li><li>1 tablespoon paprika<\/li><li>1 teaspoon garlic powder<\/li><li>1 teaspoon black pepper<\/li><li>Salt to taste (Ruby&#x27;s line measures)<\/li><li>Buttermilk, salted and cayenne-spiced (Rubie’s recipe)<\/li><li>Lard or peanut oil for deep frying<\/li><\/ul>\n<p>*<em>Yield:<\/em>* Sunday pieces go cold, argued by the family as the best.<\/p>\n<p>*<em>Method:<\/em><em> 1. <\/em><em>Soak Chicken:<\/em><em> Overnight in buttermilk seasoned with a tablespoon of salt and a teaspoon of cayenne. This step brings out the natural flavors and creates a tender base. 2. <\/em><em>Coat Chicken:<\/em><em> Dust the soaked chicken pieces with 2 cups of flour, followed by 1 tablespoon paprika, 1 teaspoon garlic powder, 1 teaspoon black pepper, and enough salt to taste as measured by Ruby’s line. Set aside for ten minutes to allow the crust to form its grip. 3. <\/em><em>Deep-Fry:<\/em>* Heat a heavy iron skillet with lard or peanut oil to an inch deep at 350 degrees Fahrenheit. The Frozen line insists on this temperature, which is confirmed by hand tests using flour.<\/p>\n<p>*<em>Frying Process:<\/em>*<\/p>\n<ul><li>Dark meat first; light meat last. Never overcrowd the pan to ensure even browning.<\/li><li>Fry for twelve to fifteen minutes, turning once until juices are clear and the crust has reached the color of Ruby&#x27;s front room piano wood (a deep golden hue).<\/li><li>Drain on a rack immediately.<\/li><\/ul>\n<p>*<em>Yield:<\/em>* Sunday pieces go cold; argued by the family as the true dish. Monday’s cold fried chicken is what my mother taught me to feed, not just cook, from her table.<\/p>\n<p>*<em>Notes:<\/em>* The yield of this recipe can be adjusted based on your kitchen and the number of people you are serving. The key is to follow Ruby&#x27;s tradition of feeding<\/p>"}, {"kind": "page", "label": "Page 55", "chapter": "Signature Dishes", "html": "<p>*<em>Coral&#x27;s Gumbo<\/em>*<\/p>\n<p>In the Frozen kitchen, Coral’s gumbo is a staple dish preserved from her people in Texas. The recipe is simple yet crucial: one cup of flour and one cup of oil cooked in a Dutch oven for forty-five minutes until it reaches the color of an old penny—the roux. This is where the magic begins.<\/p>\n<p>Once the roux is achieved, we add the trinity: two onions, diced bell pepper, three stalks of celery, all chopped and simmered gently into the roux until they are soft. Then comes the garlic—a key component in Coral’s gumbo. After that, we incorporate two quarts of stock, a chicken cut up and browned, a pound of andouille sausage (a blend of pork sausage with spices), two cups of okra, and a sprinkling of bay leaves, thyme, and cayenne to the standard.<\/p>\n<p>Simmer everything together for about two hours at a gentle simmer. Serve over rice—file is not cooked in with the pot as Coral’s family prefers—and enjoy it tableside rather than in the pot itself.<\/p>\n<p>The dish holds an accent—a proud one—from its origins in Texas, learning the flavor of brisket smoke like language fluently but with an unmistakable touch.<\/p>\n<p>*<em>Recipe Yield:<\/em>*<\/p>\n<ul><li>Serves 10 to 12 people<\/li><\/ul>\n<p>*<em>Ingredients (in order of use):<\/em>*<\/p>\n<ul><li>1 cup flour<\/li><li>1 cup cooking oil<\/li><li>2 quarts stock<\/li><li>2 onions, diced<\/li><li>Diced bell pepper and celery, three stalks<\/li><li>1 pound andouille sausage, cut up<\/li><li>2 cups okra, peeled and sliced<\/li><li>Bay leaves and thyme (a small handful)<\/li><li>A pinch of cayenne pepper<\/li><\/ul>\n<p>*<em>Method:<\/em>* 1. In a Dutch oven, add the flour and oil, stir on medium heat for forty-five minutes until the roux reaches the color of an old penny. 2. Add the onions, bell peppers, and celery to the roux, cook until soft. 3. Stir in the garlic, then add stock, chicken, and andouille sausage. 4. Simmer all ingredients together over medium-low heat for two hours.<\/p>\n<p>*<em>Notes:<\/em>*<\/p>\n<ul><li>Adjust quantities based on your kitchen and number of servings desired.<\/li><li>File is<\/li><\/ul>"}, {"kind": "page", "label": "Page 56", "chapter": "Signature Dishes", "html": "<p>*<em>Session Chili<\/em>*<\/p>\n<p>My signature chili is a hearty pot made for working people who need sustenance without deteriorating over time. The recipe comes from my studio but finds its soul in the fires of both my lines—Ruby&#x27;s warmth and Onyx&#x27;s precision. It starts with three pounds of beef chuck, ground coarse or cut small, to bring depth to each bite.<\/p>\n<p>The chiles are four anchos and two chipotles, toasted and soaked and finely ground with their liquor; a cup of the studio’s coffee adds a signature punch—each sip enhances what the pot drinks. The onion, garlic, and cumin form the base, all gently simmered together in the afternoon for a midnight eating. This timing ensures the chili waits without breaking down and improves by being reheated at the hour of the break.<\/p>\n<p>Simmer until thick and rich; it’s ready when the chiles are soft and the beef is tender. Salt at the end brings out flavor, and fresh lime juice with raw onions on the table adds a lively touch.<\/p>\n<p>*<em>Recipe:<\/em>*<\/p>\n<ul><li>3 lbs beef chuck (ground coarse or cut small)<\/li><li>4 anchos chiles<\/li><li>2 chipotle chiles<\/li><li>Onion, chopped<\/li><li>Garlic, minced<\/li><li>Cumin seeds<\/li><li>1 cup studio’s coffee<\/li><\/ul>\n<p>*<em>Method:<\/em>* 1. Toast and soak the chiles overnight. 2. Chop the onions, mince the garlic, and grind the chiles with their liquor. 3. In a large pot over medium heat, toast and add the ground chiles until fragrant. 4. Add chopped onions, minced garlic, cumin seeds, then pour in cup of coffee from studio’s stash. 5. Stir to combine, bring to a gentle simmer, cover, and cook for 2 hours. 6. Adjust seasoning with salt at the end.<\/p>\n<p>*<em>Yield:<\/em>* A session&#x27;s worth—twice as filling and hearty as most pots made for working folk.<\/p>\n<p>The chili&#x27;s sizzle is rich and deep, much like the laughter of a bustling studio. The crust on its bowl resists pressure but crumbles tenderly in hands. The smell is of simmering meat and earthy spices, mingled with coffee’s robust presence—a perfect blend to warm any kitchen or soul.<\/p>"}, {"kind": "page", "label": "Page 57", "chapter": "Signature Dishes", "html": "<p>*<em>Midnight Migas Recipe<\/em>*<\/p>\n<p><em>Ingredients:<\/em><\/p>\n<ul><li>6 eggs (beaten)<\/li><li>4 stale corn tortillas (cut into strips), crisped in 1 tablespoon bacon grease<\/li><li>½ onion, diced<\/li><li>Tomatoes or salsa as needed<\/li><li>Handful of grated cheese<\/li><\/ul>\n<p><em>Method:<\/em><\/p>\n<p>1. *<em>Crisp the Tortillas<\/em>*: In a non-stick pan over medium heat, add 1 tablespoon bacon grease and heat until hot. Add the tortilla strips and cook for about 2 minutes on each side to achieve a crispy texture.<\/p>\n<p>2. *<em>Soften the Onion<\/em>*: Pour in the diced onion into the same pan with the crispy tortillas. Stir gently to coat them evenly in the grease.<\/p>\n<p>3. *<em>Pour in Eggs<\/em>*: Slowly pour in the beaten eggs, ensuring they cover the onions and tortilla strips completely. Use a spatula to fold the eggs over themselves twice. Be careful not to scramble too much as you want it to remain slightly runny on top.<\/p>\n<p>4. *<em>Remove from Heat<\/em>*: Remove the pan from the heat immediately when the eggs begin to set but still have a bit of fluid texture. This should take about 2-3 minutes total cooking time, depending on your stove’s intensity and the thickness of the egg mixture.<\/p>\n<p>5. *<em>Cheese Over<\/em>*: Sprinkle in a handful of grated cheese over the top of the migas mixture while it&#x27;s hot. The cheese will melt slightly and stick to the eggs, creating a rich topping.<\/p>\n<p>6. *<em>Serve<\/em>*: Serve right in the pan or transfer to plates for serving.<\/p>\n<p><em>Yield:<\/em><\/p>\n<ul><li>4 servings<\/li><\/ul>\n<p>*<em>Notes on Resourcefulness:<\/em>*<\/p>\n<p>I invented this dish in my unpaid-assistant months in another man’s studio kitchen when the cupboard held only these ingredients: stale tortillas, an onion, and a few eggs. It was a simple yet nourishing meal born from necessity—using what was available to me at that moment. The technique is straightforward and doesn&#x27;t require much time or energy.<\/p>\n<p>The dish has since become my signature—a standing dish in the pantry chapter of this book—and musicians have even requested it by name over telephone calls from three different continents, testament to its popularity and adaptability. Musicians often find themselves with only basic ingredients when performing away from home, making this recipe a go-to for those moments.<\/p>"}, {"kind": "page", "label": "Page 58", "chapter": "Signature Dishes", "html": "<p>Jasper&#x27;s Potato Soup<\/p>\n<p>*<em>Recipe Rendering:<\/em>*<\/p>\n<ul><li>*<em>Ingredients:<\/em>*<\/li><li>Two pounds of potatoes, peeled and cut into honest pieces.<\/li><li>One onion.<\/li><li>Water to cover both ingredients (about one cup).<\/li><li>A knob of butter (a small piece, about 1 tablespoon).<\/li><li>A cup of milk.<\/li><li>Salt and black pepper to taste.<\/li><\/ul>\n<ul><li>*<em>Method:<\/em>*<\/li><\/ul>\n<p>1. Place the peeled potatoes in a pot with enough water to cover them. Add an onion. 2. Bring the mixture to a boil over medium-high heat. Once boiling, reduce the heat to maintain a gentle simmer. 3. After about half an hour of simmering, the potatoes will start to turn into soft, slumping pieces. 4. Half of these potatoes are removed from the pot and crushed against its side with the back of a spoon or spatula to release some natural starches and flavors. 5. Add the milk to the pot off the boil (if it&#x27;s already boiling, turn the heat down slightly). 6. Continue simmering until the soup is creamy and well-combined.<\/p>\n<ul><li>*<em>Yield:<\/em>*<\/li><\/ul>\n<p>Four bowls of warm, substantial potato soup with a light sprinkling of black pepper on top.<\/p>\n<p>*<em>Provenance Note:<\/em>*<\/p>\n<p>Jasper&#x27;s Potato Soup comes from my toolmaker father, Onyx Frozen. It was a dish he made on nights when a job had gone wrong in his Dallas repair shop. This simple recipe is a declaration that feeding people isn&#x27;t about variety or fancy; it’s about someone cooking with warmth and substance, ensuring the family remains fed by their efforts.<\/p>\n<p>The soup&#x27;s plainness aligns with Onyx&#x27;s standard of precision: listen before touching, understand tasks fully, document everything meticulously. These principles have been passed down through generations in his kitchen, forming a tradition that sustains us all.<\/p>"}, {"kind": "page", "label": "Page 59", "chapter": "Signature Dishes", "html": "<p>### Opal&#x27;s Peach Cobbler<\/p>\n<p>*<em>Recipe<\/em>*<\/p>\n<ul><li>*<em>Ingredients:<\/em>*<\/li><li>Six ripe peaches, sliced (about 2 pounds)<\/li><li>Three-quarters of a cup of sugar, divided (¾ cup total)<\/li><li>A squeeze of lemon juice<\/li><li>Half a stick of butter, melted<\/li><li>One cup all-purpose flour<\/li><li>One cup granulated sugar<\/li><li>One cup milk, at room temperature<\/li><li>A teaspoon baking powder<\/li><li>A pinch of salt<\/li><\/ul>\n<ul><li>*<em>Method:<\/em>*<\/li><\/ul>\n<p>1. Slice the peaches and place them in a mixing bowl. 2. In another bowl, mix together three-quarters of a cup of sugar with a squeeze of lemon juice. Set aside. 3. Preheat your oven to 350 degrees Fahrenheit (F). 4. Place half a stick of butter in the baking dish and let it melt thoroughly in the oven while you prepare the batter. 5. In a medium-sized bowl, combine one cup all-purpose flour with one cup granulated sugar, one teaspoon baking powder, and a pinch of salt. 6. Gradually add one cup of milk to the dry ingredients while whisking constantly; avoid overmixing. 7. Pour the wet mixture into the melted butter in the dish. 8. Carefully spread half of the peach slices on top of the batter, then pour the remaining peach slices and juices over them. 9. Gently press the fruit into the batter to adhere. 10. Bake for forty-five minutes or until golden brown and a toothpick inserted into the center comes out clean.<\/p>\n<ul><li>*<em>Yield:<\/em>*<\/li><li>Serves 8<\/li><\/ul>\n<hr>\n<p>### Provenance Note<\/p>\n<p>*<em>Where It Came From:<\/em>* Opal&#x27;s peach cobbler is handed down from my grandmother Opal, who taught me feeding through her lessons. This tradition was passed on to my sister Opal and now it lives on in this family recipe—on piano-side afternoons.<\/p>\n<p>The front room&#x27;s simple yet effective method of blending sliced peaches with a sweet batter infused with the essence of butter and sugar is how we file our affections: in dishes, addressed. The card-trick-like rise of the batter through the fruit remains as magical today as it was fifty summers<\/p>"}, {"kind": "page", "label": "Page 60", "chapter": "Signature Dishes", "html": "<p>### Lemon Chess Pie<\/p>\n<p>*<em>Ingredients:<\/em>*<\/p>\n<ul><li>1 cup plus 2 tablespoons all-purpose flour<\/li><li>1/4 cup granulated sugar<\/li><li>1 tablespoon cornmeal (the chess pie&#x27;s signature pinch)<\/li><li>Zest and juice of two lemons, about 1 tablespoon zest<\/li><li>1/4 cup milk<\/li><li>4 large eggs<\/li><li>1/2 stick unsalted butter, melted<\/li><\/ul>\n<p>*<em>Method:<\/em><em> 1. <\/em><em>Crust:<\/em>* Preheat your oven to 350 degrees Fahrenheit.<\/p>\n<ul><li>In a pie plate, sprinkle the flour and sugar over the crust. Add the cornmeal and lemon zest into the mixture.<\/li><\/ul>\n<p>2. *<em>Filling:<\/em>* In a large bowl, whisk together the eggs and milk until smooth.<\/p>\n<ul><li>Pour the egg-milk mixture into the pie plate with the filling ingredients.<\/li><\/ul>\n<p>3. *<em>Mixing:<\/em><em> Stir everything together until well combined. 4. <\/em><em>Baking:<\/em><em> Pour the filling into the prepared crust and bake for 40 minutes or until the top is golden brown and set. 5. <\/em><em>Setting:<\/em>* The top should be freckled gold, indicating it&#x27;s done.<\/p>\n<p>*<em>Yield:<\/em>*<\/p>\n<ul><li>Approximately 8 servings<\/li><\/ul>\n<p>This lemon chess pie is a testament to Ruby’s culinary legacy as taught by her hand-written recipes passed down through generations. It combines rich flavors of sweet lemons and butter with the simple yet essential elements of flour, sugar, and cornmeal—each ingredient contributing to the perfect texture. The filling was traditionally whisked in a specific order: flour, sugar, cornmeal, zest, juice, milk, eggs, then butter.<\/p>\n<p>The dish is emblematic of Ruby’s teaching that feeding people and teaching them are one act. It stands as an enduring testament to her culinary wisdom and the importance of tradition within our family’s kitchen. Today, this pie remains a cornerstone in celebrations—served at every joining occasion, including my own wedding where it witnessed something more significant than just the pie itself.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 61", "chapter": "Feeding the Studio", "html": "<p>In 2022, I founded the Cold Room in a converted Dallas icehouse, and its first kitchen corner was defined by these items: a hot plate, a kettle, an electric skillet my aunt Jade had used, four mugs, and my studio coffee pot, which stood before the second microphone. The walls of this room echoed with the thick, cold-keeping sound that kept food warm and the cook calm—it was designed for holding temperature as it did for ice. Everything since—like a kitchen table, a shelf, and a second burner—has been added to that initial set-up. It’s a testament to the lineage from Ruby Flames’ warmth to Onyx Frozen’s precision. The inventory remains unchanged.<\/p>\n<p>Today, I stand at the hot plate in my Dallas front room kitchen, and it is emblematic of Ruby&#x27;s teaching that feeding people and teaching them are one act. This room holds warmth and history—Ruby’s cornbread, the pie from her church socials, and Onyx’s meticulous day book habit. It stands as an enduring testament to our family&#x27;s culinary wisdom.<\/p>\n<p>The next chapter in this kitchen will be focused on feeding the studio. The table here is set with a hot plate ready for its first meal, just as Ruby taught—feeding people and teaching them are one act. My mission is to ensure that each dish not only nourishes but also reflects tradition and history, making every meal a moment of connection.<\/p>"}, {"kind": "page", "label": "Page 62", "chapter": "Feeding the Studio", "html": "<p>In the kitchen of my studio session, I gather the musicians around a simple hot plate. Ruby’s lesson of feeding them and teaching them as one act is in effect here: each meal serves both needs without ceremony, warming hearts and minds to return them refreshed.<\/p>\n<p>Tonight, we have migas—golden tortillas with black beans and scrambled eggs—taking five minutes just like they were meant to. The migas are a testament to Ruby’s influence on my cooking; she taught me the importance of balance, substance, and warmth over ceremony or excess.<\/p>\n<p>The migas are served first, their golden crusts inviting as the musicians warm back up from long days or late nights. Then comes the chili, simmered until it waits patiently without deteriorating. Each bite is rich with salt and spice, returning them to work just a bit warmer than they left it.<\/p>\n<p>This meal serves not only as sustenance but also as an occasion—a chance to share food, stories, and support within our community of artists. The table remains simple yet warm, reflecting the tradition that feeding people is also teaching them; each dish nourishes both body and soul.<\/p>"}, {"kind": "page", "label": "Page 63", "chapter": "Feeding the Studio", "html": "<p>The studio&#x27;s coffee is a clock that keeps time without needing eyes or hands. The twelve-cup drip machine hums steadily, its water heated to perfection by Flint’s weighing instinct, which still survives as a scoop, ensuring each cup holds just the right amount of strong, rich coffee.<\/p>\n<p>The pot whirs softly at intervals—once in the morning, once during the meal, and again at midnight. A fresh pot signifies that we are early in our work session; if left to brew longer, it signals that evening has arrived and engineers begin packing their things for home, unconsciously preparing to leave but always leaving one more cup on the stove.<\/p>\n<p>My wife, a keen photographer, captures these moments, often showing the pot as a silent witness in every photograph of our decade-long sessions. She sees in the coffee’s clockwork not just its rhythm but also the warmth it brings to each session, much like how her photographs capture the room&#x27;s essence—the air filled with memories and anticipation.<\/p>\n<p>In my own kitchen, this tradition continues. The twelve-cup drip machine stands at center stage, its hum a constant reminder of the work that needs attention. It’s not just a clock; it’s a tool for precision and discipline, like the day book in Onyx&#x27;s shop or Jet’s meticulous handwriting. Each cup holds a story: the aroma tells us if the coffee is ready to be sipped, and the resistance when pressed by our fingers gives us feedback on how much we’ve extracted.<\/p>\n<p>The room is warm with the scent of roasted beans and freshly brewed coffee. The surfaces gleam under the soft light of my kitchen’s lamps, reflecting every detail with a gentle glow. Tools are within reach—knives, spatulas, ladles—and they seem to call out to be used, each standing in its place like an eager actor ready for their moment on stage.<\/p>\n<p>My wife sits at the table, her hands steady and focused as she takes notes. She is here not just to photograph but to observe, to record the moments that bring us together—a chance to share food, stories, and support within our community of artists. Each dish we prepare nourishes both body and soul, each meal a testament to the tradition that feeding people also teaches them.<\/p>\n<p>This kitchen is simple yet warm, embodying the warmth of Ruby&#x27;s teaching and the precision of Onyx’s standards. It&#x27;s not just<\/p>"}, {"kind": "page", "label": "Page 64", "chapter": "Feeding the Studio", "html": "<p>In this chapter, we paint the studio’s icehouse kitchen—a testament to my lifelong arrangement between food, music, and work. The room chose a table made from a door laid across two filing cabinets in its first year; it has steadfastly refused upgrades, adhering to the doctrine that understood simplicity, kept tradition, and worked well for me.<\/p>\n<p>The kitchen sits within the thick-walled icehouse cool, where meals steam in air that never quite warms. It is here that I cook, and where everyone gathers—artists, musicians, and students—at the table’s edge. The food steams alongside the music, a symphony of tastes and sounds that define my day.<\/p>\n<p>Amber&#x27;s prints capture this space with session food and paper in about equal measure: the truest portrait of the Cold Room is set here. Each meal I prepare fills the air with steam while the studio hums to life, inspiring creativity and conversation alike.<\/p>\n<p>I stand at the stove, surrounded by tools within reach—knives honed on stone, a day book open to elbow height. The room echoes my precision and exactness; knives are sharpened to a consistent angle tested by paper, and every job is entered meticulously in my hand-kept record.<\/p>\n<p>Today, I cook for myself first: the chicken from Onyx’s kitchen—a golden crust on top, a juicy pink inside, served with the mustard butter that Ruby taught me, warming each bite. As the meal steams in this cool air, I listen to the music flowing through the walls—chamber music and jazz, blues and folk—that defines my creative space.<\/p>\n<p>The table is set with session paper and food, as equal measures reflect my life’s arrangement: food within earshot of the music, and music within smell of the food. Each day, we gather here, sharing meals that nourish both body and soul—a community of artists united by our love for taste and sound.<\/p>\n<p>This kitchen holds echoes of Flint and Pearl Frozen: completeness enforced through meticulous account-keeping. My own kitchen blends traditions—Ruby’s warmth with Onyx&#x27;s standard—and becomes a bridge between past lines. The food here is simple yet warm, nourishing in the tradition of both families.<\/p>"}, {"kind": "page", "label": "Page 65", "chapter": "Feeding the Studio", "html": "<p>In this chapter, I place my own hard season inside my kitchen&#x27;s history, plainly costed: the thin year of 2020, when sessions stopped all at once and repairs became a man’s only bank. My pantry was filled with beans in rotation, rice, eggs, and the freezer worked like a ledger, every scrap into stock.<\/p>\n<p>That kitchen ran on the keeping—cost entered and lesson kept. A cook who can feed people well on almost nothing owns a skill no season can take, and the repair money of that year—saved by a kitchen that spent almost nothing badly—is, in the end, what capitalized the Cold Room two years later.<\/p>\n<p>Today, my pantry holds staples like cornmeal, flour, rice, dried beans, black-eyed peas, sugar, baking powder, soda, salt, and spices. The fats include butter, bacon drippings, lard, and peanut oil. Each item serves a specific purpose without surplus; they are the foundation from which new dishes emerge.<\/p>\n<p>I organize my pantry meticulously: stockpots for cooking, larders for grains, freezers for preservation. Every item is labeled with its purpose—milk for drinking or cooking, eggs to make custards, butter for pastry, bacon drippings for frying chicken, and lard for pie crusts. The pantry’s discipline ensures no expense is wasted; it reflects Pearl Frozen&#x27;s professionalism while carrying forward her exacting standards.<\/p>\n<p>My own kitchen blends traditions—Ruby’s warmth with Onyx’s standard—and becomes a bridge between past lines. This cornbread embodies both legacies: sustenance also carries forward lessons from each line.<\/p>\n<p>I bake Jet Flames’ skillet cornbread using buttermilk handled until it looks right, just like Ruby taught me. The results are a golden-brown texture with satisfying crackles. Each serving is imbued with warmth and flavor passed down through generations.<\/p>\n<p>*<em>Substitution Craft: Making Do<\/em>*<\/p>\n<p>Today, I made do by swapping the bacon drippings for lard from my freezer. This substitution works because lard has similar flavors and textures, making it a viable alternative in recipes that call for bacon drippings. The cost of this swap is slightly higher than using bacon drippings, but since the pantry already contains these staples, the expense is minimal.<\/p>\n<p>This dish nourishes both body and soul—a community of artists united by our<\/p>"}, {"kind": "page", "label": "Page 66", "chapter": "Feeding the Studio", "html": "<p>In my Dallas front room kitchen, I gather musicians around an ancient wooden table, setting out meals for six with Pearl’s arithmetic in mind. The session budget dictates priorities—first protein like chili meat and beans&#x27; hock, then bread, and finally coffee—a fuel for the minds of the studio.<\/p>\n<p>Here, there&#x27;s no economizing on salt, fat, or my attention—the three least expensive but most decisive elements that set the tone and flavor of each meal. Ruby’s principle of knowing what you eat translates to a simple rule: feed others on the difference.<\/p>\n<p>I start with chili meat and beans&#x27; hock, selecting ingredients carefully—salted, smoked, and well-seasoned for robustness. Then comes the bread, made from scratch in my pantry—a testament to Onyx’s precision. The coffee is always freshly brewed, because a cheap pot is no substitute for quality.<\/p>\n<p>The table gathers musicians: John at one end, his fingers flying over guitar strings; Sarah at the other, her eyes closed as she plays piano. I serve them first, ensuring each person finds something they enjoy—chili meat and beans&#x27; hock for strength, bread that’s soft yet holds its shape, a cup of freshly brewed coffee.<\/p>\n<p>Each musician is a character in their own right—an artist with his or her own tastes and preferences, just as my grandmother taught me. I serve John first, then Sarah next, followed by the rest. The meal is not merely sustenance but also an opportunity to connect over food—what we eat reveals who we are.<\/p>\n<p>After serving, we talk about work, artists’ lives, and each other’s music. These moments nourish both bodies and souls—a community of musicians united by our shared passion and commitment. The session budget may dictate the meal, but it doesn’t limit the richness of our conversations or the care with which I prepare for them.<\/p>\n<p>As the meal unfolds, so does my kitchen—the pantry inventory takes stock of what’s kept: five pounds of cornmeal, ten cups of flour, rice, dried beans, and black-eyed peas. Staples like sugar, baking powder, soda, and salt are organized meticulously. Every item serves a specific purpose without surplus—these staples are the foundation from which new dishes emerge.<\/p>\n<p>Today, I bake Jet&#x27;s skillet cornbread using Ruby’s buttermilk recipe—a golden-brown texture with satisfying crackles. Each<\/p>"}, {"kind": "page", "label": "Page 67", "chapter": "Feeding the Studio", "html": "<p>In this year, 2024, disaster struck at my first home’s corner: a fire claimed not only the building next to the Cold Room but also my own kitchen. The log books were safely transferred back to our house; I cooked from my household&#x27;s kitchen and my mother&#x27;s, feeding those rebuilding my family in the ways she taught me: arithmetic by my sister, Amber photographing the ruined space before sentimentality took over, and money sent by the Chicago line with a note that said only &#x27;for the keeping&#x27;.<\/p>\n<p>The first meal in the rebuilt studio room was session chili, made on a new hot plate as we still smelled the rebuilding&#x27;s aftermath. This dish is recorded in our log as the studio’s second founding.<\/p>\n<p>Yet this moment of recovery was not without its failure. The fire destroyed my kitchen&#x27;s inventory and much more, leaving us with a bare foundation to build from scratch. The session chili was a testament to our resilience but also a reminder that some pieces were irreplaceable.<\/p>\n<p>To mend these gaps, I turned to the pantry in my household&#x27;s kitchen—a storehouse of ingredients carefully curated by Ruby and Onyx. The pantry’s organization—stockpots, larders, and freezers meticulously arranged for specific purposes—became our guide as we rebuilt not only physical spaces but also memories.<\/p>\n<p>The log entry reads: *<em>Session Chili, Second Founding<\/em>*, with the quantity recorded as 10 servings, method in order, heat set to medium-high, time at least 2 hours. The chili is a dish that combines warmth and precision—Ruby&#x27;s care infused into every ingredient and Onyx’s exactitude guiding the simmer.<\/p>\n<p>Today, I stand at my kitchen counter, measuring each cup of beans, stirring the broth until it reaches the right color, adding just the right amount of spices to preserve Ruby’s flavor. Each serving is a testament to our family’s enduring spirit, made possible by the lessons we learned from both lines—Ruby&#x27;s warmth and feeding people, Onyx&#x27;s standard of precision.<\/p>\n<p>As I bake, the fire in my heart echoes that first day: a fire year ago left us rebuilding but also forced me to remember what truly feeds us. The session chili is more than just a dish; it’s a ritual—a reminder of our family’s journey from disaster to recovery and beyond.<\/p>"}, {"kind": "page", "label": "Page 68", "chapter": "Feeding the Studio", "html": "<p>In the studio kitchen, I find myself following my sister Opal’s example, gathering the engineers around our table at set hour. Each session is a testament to feeding and teaching being one act, as her grandmother taught. My sister brings with her a sense of responsibility: that those sitting down are hers to care for.<\/p>\n<p>Today, we gather not only for work but also for a meal together. The warmth emanating from the stove, the smell of cooking filling the air, is a reminder of my mother’s kitchen, where feeding and teaching were inseparable. As I bake, I feel a connection to her hands that once wrote in that hand as exact as ours.<\/p>\n<p>The session chili we are preparing shows an assumption underneath it: that everyone at the table is there by choice. This simple yet profound act reflects our history of gathering around the same table, whether for work or meal, and the importance of those who sit down to be taken care of by their host.<\/p>\n<p>As I serve first, I am reminded of my grandmother’s rule that feeding and teaching are one act, just as it was for Opal. The session chili is more than a dish; it’s a ritual—a reminder of our family’s journey from rebuilding after the fire year ago to today’s gatherings at the table. Each serving is imbued with warmth and flavor passed down through generations, embodying both traditions.<\/p>"}, {"kind": "page", "label": "Page 69", "chapter": "Feeding the Studio", "html": "<p>The studio’s standing meal is the session chili, a dish born of need and ceremony. When Ruby asks for it, I know we’ve reached the right hour—a time when the room knows its work has done something worthy. The night demands acknowledgment, not scheduling. Tonight, the sizzle in the pan sings a pitch that says “done,” before any timer ticks to five or ten minutes past.<\/p>\n<p>The studio’s mugs have become the dish&#x27;s proper vessels, just as they were after the fire year ago when we gathered around a skillet for warmth and sustenance. Like the family Bible whose flyleaf carries the line of births, marriages, and deaths in my mother&#x27;s hand, the session chili is a record of our shared history. Each serving, like that first one at Slate’s room, is imbued with warmth and flavor passed down through generations, embodying both traditions.<\/p>\n<p>Tonight, as I cook the session chili, its sizzle sings to me from the pan—a sign that it&#x27;s ready for the mugs by the window. The texture of the meat, pulled until tender, crumbles into a golden crust when fried. As I taste each serving, the flavor deepens, like the stew in Pearl’s pot beans or the brisket in Jet’s skillet. Each sip from the mugs is a moment to celebrate what we’ve built together, from rebuilding after the fire year ago to today&#x27;s gatherings at the table.<\/p>"}, {"kind": "page", "label": "Page 70", "chapter": "Feeding the Studio", "html": "<p>In this closing line of the studio chapter, I reflect on how my kitchen taught the lessons of patience and attentiveness to the studio through a day book kept meticulously in both hands. My father’s bench and grandmother’s flyleaf guide me still: every session entered to minute, who played, what broke, what worked.<\/p>\n<p>The next chapter pivots toward the family&#x27;s full table where these practices come together. Here, my kitchen becomes not just a place of log entries but a source of warmth and feeding people through moments that cannot be hurried. The studio taught patience with an audience; now, I bring this lesson to the table, making each moment count in serving those who gather around it.<\/p>\n<p>The chapter concludes with a new dish ready for the next page: a recipe from my great-grandmother’s hand-written flyleaf—cornbread made just as Ruby Flames taught me. As I prepare it over an open flame of butter and cornmeal, this simple yet satisfying meal bridges both lines of our family’s kitchen practices. It is a testament to how we feed one another across generations, each recipe passed from hand to hand like the logs in my father&#x27;s day book.<\/p>\n<p>*<em>Jet Flames&#x27; Cornbread<\/em>*<\/p>\n<ul><li>*<em>Ingredients<\/em>*: 2 cups cornmeal, 1 tsp salt, 1 tsp baking soda, 2 eggs, 2 cups buttermilk.<\/li><li>*<em>Method<\/em>*: Preheat oven to 400°F. Mix cornmeal and soda in a bowl; add eggs and milk, whisk briefly. Fold half of the bacon drippings into batter. Pour into hot oven and bake for 15 minutes or until golden brown.<\/li><\/ul>\n<p>This dish serves as both the chapter&#x27;s conclusion and the next page’s beginning. The log entry from my father&#x27;s bench becomes the cornerstone of this new recipe—keeping the thing, entering it, feeding those who gather around the table. Each serving is a moment to celebrate the practices that have been passed down through generations: patience with an audience, attentive listening, and the promise to feed people with warmth and care.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 71", "chapter": "Occasions", "html": "<p>Today at my kitchen table, Amber joins me, setting up her camera with practiced ease. The scene is familiar—each chair in place for those who gather to feed and be fed, each plate positioned as if photographed by her mother&#x27;s hand. As I set down a piece of Jet Flames&#x27; cornbread, the warm aroma fills the air, carrying the weight of generations.<\/p>\n<p>The Veranos, born Amber Verano, brought their own inheritance—images and letters—to my table in 2023, when Amber married me. What she inherited from her family was precision akin to that taught by her schoolteacher mother and an eye for detail akin to her father&#x27;s sign painter’s vision. Her plates are composed the way her prints are, with a purposeful artistry.<\/p>\n<p>At my studio, these standards joined our household without contest; Amber is the reason the meals we photographed there are now documented in archives across rooms, each photograph telling stories of feeding and being fed. At home, she carries her mother&#x27;s precision to set every plate and gather each person around the table with practiced ease.<\/p>\n<p>In this kitchen scene, I find myself cooking Jet Flames&#x27; cornbread over an open flame of butter and cornmeal, symbolizing family practices passed through generations—patience with an audience, attentive listening, and the promise to feed people with warmth and care. Each serving is a moment to celebrate feeding those who gather around the table.<\/p>"}, {"kind": "page", "label": "Page 72", "chapter": "Occasions", "html": "<p>In 2023, our wedding feast took place in the church hall where my parents&#x27; joining began—a place both families hold dear as a cornerstone of their heritage. The cooking was indeed the families&#x27; own, with no caterer considered; it was a point of doctrine that we cook together. My mother, Ruby Flames, made the fried chicken and lemon chess pie, while Slate&#x27;s brisket recipe was in my father’s hands. Amber&#x27;s mother, Beryl, crafted the rolls she is known for. And at the end of the table, the Frozen line&#x27;s gumbo stood as a tribute to its own incoming bride—honoring generations as they pass.<\/p>\n<p>My role that evening was simple yet important: I served food to everyone who entered our home together, creating a shared meal where families came together as one. This act of feeding my guests became an integral part of the day’s narrative. As each plate passed through the dining hall and into hands, it told a story—of tradition carried forward from mother to daughter, father to son.<\/p>\n<p>To recreate this scene in my kitchen now, I find myself serving the same roles as my parents did that special day. The table is set with dishes made by Ruby’s warmth and Slate’s precision, each piece telling stories of feeding those who gather around it—just as they did for our wedding feast. Every guest receives their place setting, symbolizing the family&#x27;s practices passed through generations, where everyone is fed, and everything is accounted for.<\/p>\n<p>Today, serving Jet Flames&#x27; cornbread over an open flame of butter and cornmeal, I carry forward this tradition in my own kitchen. The table remains central, with each person’s plate a moment to celebrate feeding those who gather around it—just like they did that day many years ago.<\/p>"}, {"kind": "page", "label": "Page 73", "chapter": "Occasions", "html": "<p>In this year&#x27;s great gathering at full table, my parents&#x27; house becomes the center of our extended family reunion. My father crafted a board to accommodate all, stretching the table to its limits, as we count every living relative with a single glance. The Chicago line by train has not yet been disrupted.<\/p>\n<p>The dishes without which it would not be Christmas are set according to an unspoken constitution: the standing rib of beef that heralds winter’s bounty; my mother&#x27;s chicken for those who cannot consume beef; Pearl&#x27;s beans, always made because they are a beloved family tradition; greens to cleanse and prepare the palate for richer fare; cornbread for its comforting texture; and two pies, each representing a family that has stopped expecting anyone else. The young are given their first taste of Christmas joy, while elders share stories and offer advice.<\/p>\n<p>We begin with the standing rib of beef, savoring every tender cut. My mother&#x27;s chicken follows, serving those who prefer not to eat meat. Pearl always prepares her beans in a pot of liquid that sings as it simmers, making them a comfort food on cold nights. Greens come next, providing a palate-cleansing start. Cornbread is served alongside, its golden crust inviting everyone to partake. Finally, two pies are placed at the table; one for each family member who can no longer be expected.<\/p>\n<p>The piano gets played whether anyone schedules it or not, as if its melodies have always been an integral part of this festive gathering. The young are fed first, followed by the old and elders, their voices heard with equal weight. Our gatherings have changed over time, adapting to new circumstances but maintaining a core warmth and tradition.<\/p>\n<p>Today, I serve Jet Flames&#x27; cornbread over an open flame of butter and cornmeal. Each piece is a moment to celebrate feeding those who gather around the table. Just as they did that day many years ago, we hold onto traditions—feeding each other, counting our numbers, and sharing stories over the food we love.<\/p>"}, {"kind": "page", "label": "Page 74", "chapter": "Occasions", "html": "<p>In the dim light of the church, the broken pedal organ hummed as my mother played, her fingers dancing across the keys with the same rhythmic precision that she imparted to me in piano lessons. The congregation&#x27;s table, a gathering where quantity was never hinted at, demanded its cooks prepare dishes for travelers and waiters alike — meals for those whose troubles were private to themselves or mine alone.<\/p>\n<p>At my mother&#x27;s place there, both her ministry on the organ and her kitchen worked simultaneously. Music and feeding, two ministries in one accounting, created a warm unity that extended beyond the gathering hour. The chess pie of this book is a testament to that table’s dish: a recipe born from those socials where my parents met over the organ&#x27;s broken pedal.<\/p>\n<p>At these church gatherings, I learned the lesson of the day — how a room of people working together eats like one family does when fed as such. My mother taught me then, and my studio runs on the same principle today. When I feed my guests with care and attention, they are not just satisfied but united in their moments of togetherness.<\/p>\n<p>Today, in my own kitchen, a day after those church socials, I bake chess pie — a small slice for each person who has gathered around this table. It is more than a dish; it&#x27;s a reminder of the unity that can be fostered when we feed one another with care and respect. Just as they did back then, my guests are united by the shared experience of eating together.<\/p>"}, {"kind": "page", "label": "Page 75", "chapter": "Occasions", "html": "<p>In this chapter, we set the food inside its occasion—the day, the people, the reason for the gathering, and how the occasion changed what was cooked and how much. The hardest occasion is a funeral, when Pearl&#x27;s accounts would have approved that the lines cook: bringing food without being asked for, in dishes labeled to their owners—custody tracked even in mourning.<\/p>\n<p>On this day, we bring beans, chicken, cobbler, and potato soup from the patriarch’s plain standard. What is brought waits and reheats, but asks nothing; what is eaten is about half of it, with the rest only present, its presence a table that stays full so the house does not feel emptied.<\/p>\n<p>At a funeral, what we feed are people who have gathered around this table: fed and unhurried and not left alone with an empty kitchen. The rules of that table are the doctrine&#x27;s gentlest form: keep what you can—those present at the gathering, those nourished by the act of feeding. Keeping the house from feeling emptied means feeding all who enter, respecting their presence, and filling the table until it remains full.<\/p>\n<p>Today, I bake Jet Flames&#x27; cornbread in an open flame of butter and cornmeal, symbolizing how our family&#x27;s practices have been passed through generations. Each serving is a moment to celebrate feeding those who gather around this table. Just as they did back then, my guests are united by the shared experience of eating together, creating unity from the act of nourishing one another with care and respect.<\/p>\n<p>The potato soup sits beside the cornbread, its rich broth comforting in silence. I pass it out first to Ruby’s generation—those who were there, those whose presence fills the house. Then the chicken and cobbler come, filling in spaces left by hunger or haste. The beans are held back for last, asking nothing of their eaters but their presence on this table.<\/p>\n<p>As they gather around, I serve each guest a slice of Jet Flames&#x27; cornbread, symbolizing not only sustenance but also unity. Each piece is imbued with the warmth and history passed down through generations—Ruby&#x27;s teachings and Onyx’s standard. The cornbread asks nothing from its eaters, yet it fills their plates until they remain full, keeping the house from feeling empty.<\/p>\n<p>The potatoes simmer gently next to the stove, adding depth to our meal<\/p>"}, {"kind": "page", "label": "Page 76", "chapter": "Occasions", "html": "<p>In the center of my home kitchen sits Jet’s Skillet Cornbread, golden brown and crackling at the edges—a symbol of our family&#x27;s reunion across six hundred miles. The meal begins as custom dictates: brisket, beans, and cornbread in iron all sit on platters awaiting their guests.<\/p>\n<p>Today, I serve the first course to my sister, Ruby Flames’ daughter, who calls from Chicago every few weeks, asking for her mother’s cobbler. Jet&#x27;s recipe has traveled with her, a cherished memory passed down through generations. The cornbread is not just a dish but a bridge between us—a reminder that distance does not weaken our bond.<\/p>\n<p>The conversation begins as the guests arrive, sharing stories and laughter over the food. Ruby, my sister, arrives first, followed by Topaz, whose line&#x27;s kitchen has taught her dishes to learn Chicago’s ways. The table is filled with warmth from both traditions, a testament of our family&#x27;s history.<\/p>\n<p>As the meal progresses, we share anecdotes about our mother, Jet, who passed down her recipes and her rule: whoever was present was fed. Her cornbread and brisket are still part of our tradition, yet each dish carries its own unique flavor—Ruby’s from Texas, Topaz’s from Dallas.<\/p>\n<p>The beans simmer slowly in my iron, adding a comforting depth to our meal. The potatoes next to the stove add a gentle note, their steam rising warmly. Each bite brings us closer together, and each piece of cornbread holds the promise that our family will always find ways to feed one another, no matter how far apart we may be.<\/p>\n<p>As I serve Jet&#x27;s cornbread, my sister looks at me with a knowing smile—a blend of familiarity and affection. She knows these dishes, like she knows every line in our kitchen’s cookbook. This meal is not just sustenance; it is the heartbeat of our family, a reminder that tradition never dies, even when we are spread across the nation.<\/p>\n<p>Today’s gathering holds more than just food—it brings us back to Jet&#x27;s Skillet Cornbread and her rule: whoever was present was fed. It ties us together in memory, ensuring that no matter how far apart we might be, our family will always find a way to feed one another and keep each other close.<\/p>"}, {"kind": "page", "label": "Page 77", "chapter": "Occasions", "html": "<p>In a family of stone-named children, birthdays are days to gather at the table. This keeps tradition alive in the kitchen, where my mother or sister cooks a dish asked for by the name day&#x27;s guest. A bought cake is like an unopened letter: it misses the warmth that comes from personal effort. My sister Opal’s birthday is sweetest enforcement, and her grandmother’s cobbler with a candle is cooked without argument, no matter how complicated its inclusion becomes.<\/p>\n<p>Opal’s request for this dish marks a point in her life—a child named after her grandmother learns her genealogy through the mouth before opening any book. She sits at the table as she was six, her grandmother’s warmth and wisdom passed down in that moment of feeding. The crust is firm yet crackles when it’s done, and its golden-brown texture is a testament to hours spent over fire and iron—Ruby&#x27;s hands shaping batter, Onyx’s measuring instinct ensuring each serving fits.<\/p>\n<p>Today, as I gather around this table on my sister’s name day, we bake Jet Flames’ cornbread. The sizzle of the hot skillet fills the room with the pitch of its perfect pitch, a symphony in action that tells us when it is ready. Each crackle and hiss sing out with the satisfaction of precise timing and heat control—Ruby&#x27;s warmth tempered by Onyx’s precision.<\/p>\n<p>The crust resists without cracking, inviting more bites as we marvel at how this family tradition has been passed down through generations. This cornbread embodies both traditions: Ruby’s hands shaping the batter into a golden masterpiece and Onyx’s measured approach that ensures every serving is perfect. The smell of it speaks volumes to those around—the depth of flavor from the ingredients, the care in preparation—and I hold each serving close as a moment of feeding and learning.<\/p>\n<p>This cornbread ties us together, reminding us that no matter how far apart we may be, our family will always find a way to feed one another and keep each other close. As Opal&#x27;s day continues, she learns her genealogy with every bite—her grandmother’s dish teaching her history and love in the kitchen.<\/p>"}, {"kind": "page", "label": "Page 78", "chapter": "Occasions", "html": "<p>In this chapter, I stand at Agate Verano’s front room kitchen, where he lettered storefronts half a century ago with precision as fine as his words on paper. The air is thick with the scent of ink and freshly turned earth from his street. Beside me, Beryl Verano’s schoolroom sits in amber—her rolls, measured to perfection just like my mother’s recipes.<\/p>\n<p>The kitchen&#x27;s surface is warm from daily use: a cast iron skillet gleams under the noonday sun, while an old wooden table where Agate and Beryl once laid out their letters radiates a sense of history. Their household food was precise, lettered as carefully as their work—just like mine documents each meal I enter.<\/p>\n<p>Beryl’s rolls at this table are measured to her schoolroom standard, just as Agate regards his menu board with the same reverence he would a public document. When we married in, these lessons of presentation and respect were what my wife&#x27;s family taught me about feeding people: a form of respect that goes beyond just what is served.<\/p>\n<p>Now, in our joined household, I do both—documenting each meal by entering it as my mother’s line does, while Beryl’s rolls land at the table looking perfect. Amber’s photographs tie us together, where the two documentations meet like her letters and mine on Agate and Beryl&#x27;s kitchen table.<\/p>\n<p>The skillet here is a living testament to precision passed down from one generation of letterers to another—now combined in our modern household. Each serving we prepare today carries forward these traditions, ensuring no meal enters without being carefully observed and respected as it lands upon the family’s dining table.<\/p>"}, {"kind": "page", "label": "Page 79", "chapter": "Occasions", "html": "<p>Feeding the stranger is the doctrine with its coat off. The rule is Coral&#x27;s amendment practiced without discussion: whoever is at the table at the hour is fed from what there is, and the pot was sized three generations ago for exactly this person. When my household opens its door, any hungry soul, be it the musician far from home, the neighbor in a bad week, or the engineer who stayed past the last bus, gets the standing meal rather than an apology meal: chili reheated, migas made fresh, coffee as if the night were young. It came from Jet&#x27;s table, where the street&#x27;s children materialized and were seated without ceremony.<\/p>\n<p>My family has no hospitality policy; we have a simple doctrine: whoever is present at our table is fed. The meals are warm and honest, testaments to generations of feeding strangers as family does—no apologies, just food for those who need it most. Jet’s table taught us that feeding happens when people gather in one place, and each meal carries forward the traditions of Ruby Flames&#x27; kitchen—feeding with warmth and no apology.<\/p>\n<p>Today, I carry this doctrine into my own dining room, where strangers find their way to a warm meal without ceremony. Each serving is imbued with history: the chili reheated from Jet&#x27;s table, migas made fresh from Onyx’s days at the toolmaker’s shop, coffee as if the night were young, like those who materialized at Jet&#x27;s table in Dallas two generations ago. The open door of my kitchen is a living testament to feeding strangers as family does—no apologies, just food for all who gather around it.<\/p>\n<p>The meals I prepare today are not only sustenance but also a bridge between the past and present, ensuring no meal enters without being carefully observed and respected as it lands upon our family’s dining table. Each dish is a moment to celebrate feeding those who come together at my kitchen&#x27;s open door, carrying forward generations of warmth and honesty from Jet&#x27;s table in Dallas two generations ago.<\/p>"}, {"kind": "page", "label": "Page 80", "chapter": "Occasions", "html": "<p>In this meal&#x27;s warm embrace, I reflect on how every gathering at my kitchen&#x27;s open door is more than just a feast—it’s our family history made edible. Today, we honor the occasion that brought us together—my partner Amber&#x27;s homecoming. This day marked the reunion of two lines: her Chicago-born lineage and mine from Texas, each with its own tales and traditions.<\/p>\n<p>As I slice Jet Flames&#x27; cornbread, my thoughts turn to how this meal represents our family’s journey and the joy we share as a community. Each bite is a moment in time—Ruby&#x27;s warmth, Onyx&#x27;s standard, Amber&#x27;s presence. My father’s day book habits guide every dish; Ruby taught piano lessons at an ancient wooden table where hungry children gathered around. Today, I stand here with amber light filtering through window panes, the smells of brisket and beans wafting from my kitchen.<\/p>\n<p>The menu entries speak volumes: the cornbread recalls Jet&#x27;s love for her family’s Cornbread, while Amber brings a Chicago twist with her sweet potato hash to complement the meal’s flavors. My father&#x27;s meticulous day book habits are carried forward in each recipe I write—every job entered, every charge honest, and every task understood before action.<\/p>\n<p>Yet this occasion is not just about food; it’s also a testament of how our family has grown together through trials and triumphs. Today, my kitchen is the canvas where we continue to paint a history that binds us all—the joy, warmth, and honesty passed down from generations past. Each bite of Jet Flames&#x27; cornbread is a reminder of those who came before us and the future we hope to write.<\/p>\n<p>As I look toward tomorrow’s pages in this book, my hands rest on the cookbook&#x27;s spine, ready to embrace new dishes and kitchens not yet entered. Tonight, at Amber&#x27;s homecoming feast, every dish is a chapter written with care, each meal a moment of our family’s history made edible.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 81", "chapter": "Preservation and Keeping", "html": "<p>*<em>Recipe: Keeping Cornbread<\/em>*<\/p>\n<ul><li>*<em>Ingredients<\/em>*:<\/li><li>2 cups cornmeal (Old Hickory brand)<\/li><li>1 tsp salt, coarse<\/li><li>1 tsp baking soda<\/li><li>2 eggs, room temperature<\/li><li>2 cups buttermilk, cold and at room temperature<\/li><li>½ cup bacon drippings, cooled<\/li><\/ul>\n<ul><li>*<em>Method<\/em>
