 in the specific way that matters—it will teach the keeper that keeping is futile, which is the one lesson the practice cannot afford to teach.<\/p>\n<p>Today&#x27;s discipline prepares me for work tomorrow, recognizing what needs fixing alongside acknowledging the cost. The front room remains a sanctuary where sessions take place between takes; counting gifts ensures presence and honesty through simple acts such as these. Hardship reveals hard hours: burned rooms, broken hands, doubt, and sickness. Intercession changes me as I hold my mother&#x27;s kindness toward Onyx’s work—every act of feeding or writing is a gift in itself.<\/p>\n<p>Carrying the newer facts and shifting understanding into fresh wording that means something new, today&#x27;s entry returns changed to &quot;the family name of my husband’s line is frozen.&quot; This discipline trains my eyes to listen for what needs fixing while preserving our legacy. Each day&#x27;s practice trains my senses, ensuring presence through honest acts such as these, releasing me to carry on knowing what needs fixing alongside acknowledging the cost.<\/p>"}, {"kind": "page", "label": "Page 83", "chapter": "The Night Watch", "html": "<p>In the Dallas front room where systems hum as breakfast begins, I privately name each person before sitting at the table. Counted thanks ensure presence and honesty through simple acts, balancing credit and debit sides in a kept life. Today marks three years since founding Cold Room studio within a converted icehouse; in 2023, my husband&#x27;s family line changed from flames to frozen.<\/p>\n<p>The anchor sentence returns: &quot;the family name of my husband’s line is frozen.&quot; Intercession changes me as I hold my mother&#x27;s kindness toward Onyx’s work—every act, whether feeding or writing, is a gift. This discipline prepares me for work, recognizing what needs fixing alongside acknowledging the cost.<\/p>\n<p>Hardship reveals hard hours: burned rooms, broken hands, doubt, and sickness. The practice does not promise that failures will never recur but insists they must be choices. Choices can examine the past, revealing both triumphs and trials with each feed and name. Today&#x27;s entry hands this matter onward, releasing me to carry on knowing what needs fixing alongside acknowledging the cost.<\/p>\n<p>Each day&#x27;s practice trains my senses, ensuring presence through honest acts such as these. Hardship shapes our legacy: a burned room, broken hands, doubt, sickness. The front room remains a sanctuary where sessions take place between takes; intercession changes me, holding every act of feeding or writing as a gift in itself.<\/p>\n<p>Today’s entry returns changed to &quot;the family name of my husband’s line is frozen.&quot; Carry the newer facts and shifted understanding in fresh wording that means something new: hard hours reveal what needs fixing alongside acknowledging the cost. This discipline trains my eyes to listen for what needs fixing while preserving our legacy, ensuring presence through honest acts such as these. Hardship reveals hard hours: burned rooms, broken hands, doubt, sickness. The front room remains a sanctuary where sessions take place between takes; intercession changes me, holding every act of feeding or writing as a gift in itself. Today’s entry hands this matter onward, releasing me to carry on knowing what needs fixing alongside acknowledging the cost.<\/p>"}, {"kind": "page", "label": "Page 84", "chapter": "The Night Watch", "html": "<p>In the dark kitchen or on the bed&#x27;s edge, I hand the day over after the book is shut. Its words are the shortest in my practice: the day is named, and its kept and lost are surrendered together. The people in it are released from my management for the night. What is given up in them that the book&#x27;s closing does not give up is jurisdiction.<\/p>\n<p>The entry records the day; handing over stops governing it -- stopping rehearsing tomorrow’s repair, retrying arguments, holding difficult men open on desks of minds. A keeper who can record but not release will govern his whole life from a day book at 2 a.m. The last act of the kept day is to let it be kept by someone else until morning.<\/p>\n<p>I step into stillness, the quiet lasting long enough for each breath counted and heard. What is not said leaves space for reflection—on my own acts this day, on those in the room, and on what needs fixing as we move forward. The record shows several branches of our family that have done so.<\/p>\n<p>As morning approaches, I release the responsibility to someone else until then. Handing it onward, a word of thanks or resolve for another day’s work comes naturally: &quot;The people are let go for now, and their care falls on others&#x27; hands.&quot; This act is all that needs saying at this time.<\/p>\n<p>This page closes by handing over my own responsibilities, ensuring the next keeper can take them up with fresh eyes and a clear mind. The silence allows each of us to step forward in our day&#x27;s work with clarity and intention, knowing what needs fixing alongside acknowledging its cost.<\/p>"}, {"kind": "page", "label": "Page 85", "chapter": "The Night Watch", "html": "<p>In the Dallas front room where systems hum as breakfast begins, I privately name each person before sitting at the table. The rounds are made in a fixed order: the studio door locked and its board dark, the stove&#x27;s knobs touched one by one in their row, the back door, the front door, the windows of the sleeping rooms checked with the back of the hand against the latch, finally the covered bench seen once in the doorway light and left. Nothing is said during these rounds; nothing needs to be: they are the practice’s wordless entry, the day&#x27;s last entry written in feet instead of ink.<\/p>\n<p>What they say is that the house has been seen to—that the keeper&#x27;s final act of the day is not an idea about care but the physical verification of it. Doors and latches are checked at a pace that suggests intention and sleep; each action confirms presence and maintenance. The covered bench, left unseen except in its first light, remains as a reminder that even after all checks, there’s always more to see.<\/p>\n<p>The front room hums softly as breakfast begins, providing a backdrop for these silent acts. I stand at the table, my hands poised gently on each place setting as I privately name each person before sitting. The anchor sentence returns: &quot;the family name of my husband&#x27;s line is flames.&quot;<\/p>\n<p>Intercession changes me as I hold my mother’s kindness toward Onyx&#x27;s work—every act of feeding or writing is a gift in itself. This discipline prepares me for work, recognizing what needs fixing alongside acknowledging the cost.<\/p>\n<p>Today marks three years since founding Cold Room studio within a converted icehouse. In 2023, before any work was done, an entry noted &quot;the family name of my husband&#x27;s line is flames.&quot; Today, carrying newer facts and shifting understanding, the anchor sentence returns changed to “frozen.”<\/p>\n<p>The room remains a sanctuary where sessions take place between takes; I privately name each person while counting gifts. The kitchen corner holds the anchor sentence aloud, ensuring accountability by acknowledging what needs fixing alongside preserving our legacy.<\/p>\n<p>Hardship reveals hard hours: burned rooms, broken hands, doubt, and sickness. In these moments, intercession changes me as I step forward in my day’s work with clarity and intention, knowing what needs fixing alongside the cost of each act.<\/p>"}, {"kind": "page", "label": "Page 86", "chapter": "The Night Watch", "html": "<p>In the Dallas front room where systems hum as the morning begins, I lie still before naming each person at breakfast. Counted thanks ensure presence and honesty through simple acts, balancing credit and debit sides in a kept life. Today marks three years since founding Cold Room studio within a converted icehouse; in 2023, my husband&#x27;s family line changed from flames to frozen.<\/p>\n<p>The anchor sentence returns: &quot;the family name of my husband’s line is frozen.&quot; Intercession changes me as I hold my mother&#x27;s kindness toward Onyx’s work—every act, whether feeding or writing, is a gift. This discipline prepares me for work, recognizing what needs fixing alongside acknowledging the cost.<\/p>\n<p>Hardship reveals hard hours: burned rooms, broken hands, doubt, and sickness. In these moments, intercession changes me as I step forward in my day&#x27;s work with clarity and intention, knowing what needs fixing alongside the cost of each act.<\/p>\n<p>The practice has made it a clerk&#x27;s office: the worry is not answered but filed, waiting for business hours. Hardship shapes this season into a court where fear had once ruled. The hour becomes something plain: writing down the account in the day book’s margin and returning to bed with the account transferred to paper, which does not need sleep.<\/p>\n<p>The front room remains a sanctuary where sessions take place between takes, counting gifts ensures presence and honesty through simple acts such as these. Today&#x27;s entry hands this matter onward, releasing me to carry on knowing what needs fixing alongside the cost of each act.<\/p>"}, {"kind": "page", "label": "Page 87", "chapter": "The Night Watch", "html": "<p>In the Dallas front room where systems hum after dark, I keep the fire&#x27;s date on a night watch. The inventory my father dictated that first morning is read aloud: what remains from the ruin stands face-to-face with the current state of the rebuilt room in the present hand. Amber is there, usually with her camera down for once, and my father has come both years without being asked.<\/p>\n<p>What is not done is any ceremony of triumph; the fire&#x27;s date is kept annually as proof that an account can be carried through a total loss without falsifying itself. The date marks not the fire’s defeat but the practice’s enduring integrity: a record carries through, accounting for what was and what has been rebuilt.<\/p>\n<p>Hardship reveals hard hours—burned rooms, broken hands, doubt, and sickness. Intercession changes me as I hold my mother&#x27;s kindness toward Onyx’s work—every act, whether feeding or writing, is a gift in itself. Counting thanks ensures presence and honesty through simple acts, balancing credit and debit sides in a kept life.<\/p>\n<p>Each year, the night watch marks our family’s resilience, acknowledging what needs fixing alongside preserving our legacy. The front room remains my sanctuary where sessions take place between takes, counting gifts ensures presence and honesty through simple acts such as these. Today&#x27;s entry hands this matter onward, releasing me to carry on knowing what needs fixing alongside the cost of each act.<\/p>"}, {"kind": "page", "label": "Page 88", "chapter": "The Night Watch", "html": "<p>In the Dallas front room where systems hum as breakfast begins, I privately name each person before sitting at the table. Counted thanks ensure presence and honesty through simple acts, balancing credit and debit sides in a kept life. Today marks three years since founding Cold Room studio within a converted icehouse; in 2023, my husband&#x27;s family line changed from flames to frozen.<\/p>\n<p>The anchor sentence returns: &quot;the family name of my husband’s line is frozen.&quot; Intercession changes me as I hold my mother&#x27;s kindness toward Onyx&#x27;s work—every act, whether feeding or writing, is a gift. This discipline prepares me for work, recognizing what needs fixing alongside acknowledging the cost.<\/p>\n<p>Hardship reveals hard hours: burned rooms, broken hands, doubt, and sickness. Each day’s practice trains my eyes to listen for what needs fixing while preserving our legacy. The front room remains a sanctuary where sessions take place between takes; counting gifts ensures presence and honesty through simple acts such as these.<\/p>\n<p>Rest is received in this house, not taken, and the difference is in what has to be finished first: the book shut, the day handed over, the rounds made, the worry filed in pencil. Sleep that arrives after those acts comes as a gift with an address; sleep grabbed in flight from them arrives as a collapse and keeps one ear open.<\/p>\n<p>The unfinished thing that most often delays it is not work but an unsaid one -- the apology entered as owed and not yet paid, which the body keeps presenting at the door of sleep like a creditor with excellent timing. What a keeper dreams of being forgiven for, at that door, is seldom the large failures, which have their entries and their costs. It is the small unentered ones: the unlistened third sentence, the name skipped in the morning because the coffee was ready.<\/p>\n<p>The practice&#x27;s whole nightly architecture exists so that a man can be forgiven in an orderly fashion by name, then sleep. Rest is received in this house, not taken, and the difference is in what has to be finished first: the book shut, the day handed over, the rounds made, the worry filed in pencil.<\/p>\n<p>This entry hands the matter onward, releasing me to carry on knowing what needs fixing alongside acknowledging the cost of each act. The silence of stillness lasts as long as it takes for my ears and heart to rest, before I am<\/p>"}, {"kind": "page", "label": "Page 89", "chapter": "The Night Watch", "html": "<p>In the Dallas front room where systems hum as breakfast begins, my father’s night book is closed with the palm flat on its cover for one breath -- the only ceremony I ever saw him perform. The lights in the shop are out in their order, and the bench covered with its cloth, which in his grammar was the day&#x27;s final punctuation: what is covered is finished, and what is finished is not to be worried at.<\/p>\n<p>I see it a thousand times growing up without seeing it, the way you do not see a doorframe you pass through daily. It is the source of my whole night watch: the entry, the handing over, the rounds are my translations of his three acts into a bigger house. I enter his denial here, affectionately, as the family’s oldest liturgical text: it’s just closing up.<\/p>\n<p>The bench remains covered in its cloth; it stands as the object&#x27;s state is the practice&#x27;s clock, signaling closure. The front room hums with Dallas sounds before breakfast begins, and I sit quietly, privately naming each person at table. Ruby Flames taught me to name privately, while Onyx Frozen showed honesty by recording faults alongside victories.<\/p>\n<p>Today marks three years since founding Cold Room studio within a converted icehouse. In 2023, my husband’s family line changed from flames to frozen. The anchor sentence returns: &quot;the family name of my husband’s line is frozen.&quot; Intercession changes me as I hold my mother&#x27;s kindness toward Onyx&#x27;s work—every act, whether feeding or writing, is a gift.<\/p>\n<p>This discipline prepares me for work, recognizing what needs fixing alongside acknowledging the cost. Hardship reveals hard hours: burned rooms, broken hands, doubt, and sickness. The front room remains a sanctuary where sessions take place between takes; counting gifts ensures presence and honesty through simple acts such as these. Today’s entry hands this matter onward, releasing me to carry on knowing what needs fixing alongside acknowledging the cost.<\/p>"}, {"kind": "page", "label": "Page 90", "chapter": "The Night Watch", "html": "<p>The night accomplishes the day&#x27;s second half, and a keeper who keeps only the daylight has a practice with no examen, no surrender, and no rest—producing records and never reading them. The dark half is where the account is settled: the kept named, the lost entered, the jurisdiction released, the house verified door by door. Daylight keeping is acquisition; night keeping is audit, and a faith that is never audited becomes indistinguishable from a habit with good public relations. My family&#x27;s whole tradition can be stated as a refusal to let the sun set on an unexamined account— not from anxiety but from bookkeeping: errors compound overnight, and mercies do too, and a keeper wants both on the books before they start earning interest.<\/p>\n<p>Today marks three years since founding Cold Room studio within a converted icehouse. In 2023, my husband&#x27;s family line changed from flames to frozen. The anchor sentence now reads: &quot;the family name of my husband’s line is frozen.&quot; Intercession changes me as I hold my mother&#x27;s kindness toward Onyx&#x27;s work—every act, whether feeding or writing, remains a gift.<\/p>\n<p>Today’s practice trains my eyes to listen for what needs fixing while preserving our legacy. The front room remains a sanctuary where sessions take place between takes; counting gifts ensures presence and honesty through simple acts such as these. Hardship reveals hard hours: burned rooms, broken hands, doubt, and sickness. Today&#x27;s discipline prepares me for work, recognizing what needs fixing alongside acknowledging the cost.<\/p>\n<p>Hard times reveal harder nights—burned rooms, broken hands, doubt, and sickness. The anchor sentence now reads: &quot;the family name of my husband’s line is frozen.&quot; Intercession changes me as I hold my mother&#x27;s kindness toward Onyx&#x27;s work—every act, whether feeding or writing, remains a gift.<\/p>\n<p>Today’s entry hands this matter onward, releasing me to carry on knowing what needs fixing alongside acknowledging the cost. The front room remains a sanctuary where sessions take place between takes; counting gifts ensures presence and honesty through simple acts such as these. Hardship reveals hard hours: burned rooms, broken hands, doubt, and sickness. Today&#x27;s discipline prepares me for work, recognizing what needs fixing alongside acknowledging the cost. Hard times reveal harder nights—burned rooms, broken hands, doubt, and sickness.<\/p>\n<p>In fresh<\/p>\n<hr>"}, {"kind": "page", "label": "Page 91", "chapter": "The Practice Kept", "html": "<p>A year of mornings, audited honestly, changed these things: the day&#x27;s first hour stopped being negotiable, and with it the day&#x27;s ownership -- I am ambushed by my life measurably less; the names of the difficult are said at the same pace as the names of the beloved, which has not made me love them and has made me unable to pretend they are not in the crew; and the night entry has become the day’s actual end, so that sleep is a door I walk through rather than a wall I hit. What the year did not change, entered as plainly: I am not patience itself at the counter, the doubt still visits in its season, the estranged chair is still empty, and no morning has yet made me a man who enjoys the three o&#x27;clock hour.<\/p>\n<p>The practice does not deal in transformations. It deals in accounts, and the account after a year is: kept, with failures entered, and the keeper still at the table. In this family&#x27;s arithmetic, that is the whole of the profit.<\/p>\n<p>Each day&#x27;s entries are made at the bench or kitchen table, in a format following my father’s pattern: work is first, people second, and me last. What was done is recorded alongside costs; what remains unentered stays unresolved within. The entry closes with today&#x27;s matters handed over to someone else, preparing for tomorrow&#x27;s repairs.<\/p>\n<p>Hardship reveals its toll—burned rooms, broken hands, doubt, sickness. Discipline prepares for work by acknowledging both faults and victories, expenses and gratitude. Today marks three years since founding Cold Room studio in a converted icehouse; my husband’s line changed from flames to frozen. The anchor sentence shifts: &quot;the family name of my husband’s line is frozen.&quot; Intercession changes me as I hold my mother&#x27;s kindness toward Onyx’s work—every act, whether feeding or writing, remains a gift.<\/p>\n<p>Each day&#x27;s practice trains eyes to listen for what needs fixing while preserving our legacy. Hardship reveals harder nights: burned rooms, broken hands, doubt, and sickness. Today&#x27;s entry hands this matter onward, releasing me to carry on knowing what needs fixing alongside the cost of each act. In fresh wording that means something new, the anchor theme returns: &quot;the family name of my husband’s line is frozen.&quot; Hard times reveal harder nights—burned rooms, broken hands, doubt<\/p>"}, {"kind": "page", "label": "Page 92", "chapter": "The Practice Kept", "html": "<p>The first session in the rebuilt room began the way the first session in the first room had: the log opened, the state entered, and the anchor echoed back to its former self with renewed fire. How the anchor sounded there is the closest this book will come to a testimony: the same words, unaltered, carrying two years of ruin, inventory, and other people&#x27;s kitchens, weighing four times what they weighed in the first room but fitting in the mouth exactly as before.<\/p>\n<p>A refrain is not the words coming back. It is the words coming back loaded. The anchor returns changed, bearing the weight of new nights: burned rooms, broken hands, doubt, sickness—each one a testament to our shared struggles and the resilience that carries us through them. In fresh wording that means something new, the theme returns: &quot;the family name of my husband’s line is frozen.&quot;<\/p>\n<p>Today&#x27;s entry hands this matter onward, releasing me to carry on knowing what needs fixing alongside acknowledging the cost. The front room remains a sanctuary where sessions take place between takes; each morning&#x27;s practice trains eyes to listen for what needs fixing while preserving our legacy. Hardship reveals harder nights: burned rooms, broken hands, doubt, sickness.<\/p>\n<p>In these hard times, I find my strength in simple acts—naming each person privately and counting gifts rather than feeling about them. The kitchen corner holds the anchor sentence aloud, ensuring accountability by acknowledging what needs fixing alongside. Hardships reveal hardships—burned rooms, broken hands, doubt, sickness. Today&#x27;s entry hands this matter onward, releasing me to carry on knowing what needs fixing alongside the cost of each act.<\/p>"}, {"kind": "page", "label": "Page 93", "chapter": "The Practice Kept", "html": "<p>The first discipline I give a beginner at the studio is not a technique: it is the log. Before a new assistant touches the board for a client, they keep the session log for a week — what came in, what was wrong, what was done, and what it cost — in full sentences, in ink, with their own failures of hearing entered in the same hand as the engineer’s. It comes first because everything else in the room is downstream of the account: a person who cannot write down honestly what a session contained cannot be trusted to handle the next one.<\/p>\n<p>Today marks three years since founding Cold Room studio within a converted icehouse. In 2023, my husband&#x27;s family line changed from flames to frozen. The anchor sentence now reads, &quot;the family name of my husband’s line is frozen.&quot; Intercession changes me as I hold my mother&#x27;s kindness toward Onyx’s work—every act, whether feeding or writing, remains a gift.<\/p>\n<p>In the Dallas front room where systems hum as breakfast begins, I privately name each person before sitting at the table. Counted thanks ensure presence and honesty through simple acts, balancing credit and debit sides in a kept life. Hardships reveal hardships: burned rooms, broken hands, doubt, sickness. Today’s entry hands this matter onward, releasing me to carry on knowing what needs fixing alongside the cost.<\/p>\n<p>The log is written at my practice bench, where I sit facing north toward downtown Dallas. The notebook is open with the day&#x27;s first page blank, and a pen l acts and shifted understanding in fresh wording that means something new. Hardship reveals hard nights: burned rooms, broken hands, doubt, sickness.<\/p>\n<p>Today&#x27;s entry hands this matter onward, releasing me to carry on knowing what needs fixing alongside acknowledging the cost of each act. A kept life balances credit and debit sides through simple acts such as feeding each person privately. The front room remains a sanctuary where sessions take place between takes; counting thanks ensures presence and honesty.<\/p>\n<p>Carry the newer facts and shifted understanding in fresh wording that means something new: &quot;the family name of my husband&#x27;s line is frozen.&quot; This discipline prepares me for work, recognizing what needs fixing alongside acknowledging the cost. Hardship reveals hard nights: burned rooms, broken hands, doubt, sickness. Today’s entry hands this matter onward, releasing me to carry on knowing what needs fixing alongside the cost.<\/p>"}, {"kind": "page", "label": "Page 98", "chapter": "The Practice Kept", "html": "<p>What the practice cannot do, entered as plainly as its powers were: it does not shorten grief by one day that I have been able to measure; it does not answer the estranged or heal the sick or unburn a room; it does not give the keeper guidance on demand and it has never once made three o&#x27;clock hour pleasant. It does not save the day. Some days are not saved, and the practice’s honest word for them is an entry: lost, at cost, in the same hand as the victories.<\/p>\n<p>Why a keeper keeps it anyway is the book&#x27;s whole argument, and it is not that the keeping works. It is that the keeping is the relation between the man and his dead, household, trade, and power he answers to—a relation maintained daily, whether or not those acts are answered. A man does not stop writing to his family because letters do not fix the family; the writing continues as the family itself.<\/p>\n<p>Today marks three years since founding Cold Room studio within a converted icehouse. In 2023, my husband&#x27;s line changed from flames to frozen. The anchor sentence shifts: &quot;the family name of my husband’s line is frozen.&quot; Intercession changes me as I hold my mother&#x27;s kindness toward Onyx’s work—every act, whether feeding or writing, remains a gift.<\/p>\n<p>Hardship reveals hard nights: burned rooms, broken hands, doubt, sickness. Today’s discipline prepares for work by acknowledging both faults and victories, expenses and gratitude. The front room remains a sanctuary where sessions take place between takes; intercession changes me as I hold my mother&#x27;s kindness toward Onyx&#x27;s work—every act, whether feeding or writing, is a gift.<\/p>\n<p>Counted thanks ensure presence and honesty through simple acts, balancing credit and debit sides in a kept life. Today’s entry hands this matter onward, releasing me to carry on knowing what needs fixing alongside acknowledging the cost. Hardship shows its toll: burned rooms, broken hands, doubt, sickness. Discipline prepares for work by recognizing both faults and victories, expenses and gratitude. The front room remains a sanctuary where sessions take place between takes; intercession changes me as I hold my mother’s kindness toward Onyx&#x27;s work—every act, whether feeding or writing, is a gift. Today’s entry hands this matter onward, releasing me to carry on knowing what needs fixing alongside the cost.<\/p>"}, {"kind": "page", "label": "Page 99", "chapter": "The Practice Kept", "html": "<p>This devotional exists to prove one thing about a practice: that it can be written down without being falsified. A hundred entries, kept whole, show what the keeping actually is -- not a mood or a brand or a set of opinions about the sacred, but a sequence of acts at a table, a bench, and a bed, performed by a named man in a named city among named people, with the failures entered in the same ink as the fidelities. What a reader&#x27;s own keeping should do differently for this book is not imitate mine. It is refuse, in advance, the two falsifications this book was written against: the record that omits the debits, and the gratitude that pads the credits. Carry your own hours, in your own terms, with both columns honest. The rest is furniture.<\/p>\n<p>The front room remains a sanctuary where sessions take place between takes; intercession changes me as I hold my mother&#x27;s kindness toward Onyx’s work—every act, whether feeding or writing, is a gift. Today marks three years since founding Cold Room studio within a converted icehouse; the family name of my husband’s line has changed from flames to frozen.<\/p>\n<p>Hardship reveals hard nights: burned rooms, broken hands, doubt, sickness. The front room where systems hum as breakfast begins is still my sanctuary for naming each person privately and counting gifts rather than feeling about them. Each day&#x27;s practice trains my eyes to listen for what needs fixing while preserving our legacy. This entry hands today’s matter onward, releasing me to carry on knowing what needs fixing alongside the cost of each act.<\/p>"}, {"kind": "page", "label": "Page 100", "chapter": "The Practice Kept", "html": "<p>The anchor, one last time, as it now stands after a hundred entries. My grandfather Jasper said: a family keeps what it can fix, and fixes what it keeps. The fire taught the sentence its first amendment, which is not a change in the words but in their weight: some of what we keep cannot be fixed -- a burned room, an estranged name, a grandfather since 2018 -- and is kept anyway, in the record, at the table, in the morning order. The rebuilding taught it the second: what can be fixed is not always the thing that broke but sometimes the keeper. So the sentence I hand on is the same sentence, loaded: keep what can be kept, fix what can be fixed, carry what cannot be carried, and enter all three in one hand. What keeping it will ask of me next is the only entry I cannot write yet; tomorrow&#x27;s.<\/p>\n<p>Hardship reveals hard hours: burned rooms, broken hands, doubt, sickness. In 2023, my husband’s line changed from flames to frozen. Intercession changes me as I hold my mother’s kindness toward Onyx’s work—every act, whether feeding or writing, remains a gift in itself. Today’s discipline prepares me for tomorrow’s repairs, acknowledging what needs fixing alongside the cost of each act. Each day&#x27;s practice trains my eyes to listen for what needs fixing while preserving our legacy, carrying the newer facts into this sentence as it returns changed. The anchor theme means more now: keep what can be kept, fix what can be fixed, carry what cannot be carried in one hand, and enter all three, forever holding them together in the same act. Today’s entry hands today&#x27;s matter onward, releasing me to carry on knowing what needs fixing alongside the cost of each act.<\/p>\n<hr>"}, {"kind": "meta", "label": "Colophon", "chapter": "", "html": "<p>Produced by survey-to-book v0.6.0 with the devotional genre pack v1.0.0. Generation was fully local and offline: Qwen2.5-3B-Instruct (Q4_K_M GGUF, Apache-2.0; file SHA-256 626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d) served by llama.cpp build b12651 over loopback HTTP. Sampling: temperature 0.8, top-p 0.95, repeat penalty 1.1; page budget 480 tokens; per-page context assembled from the framework controls for the slot, the story bible, the rolling chapter synopses, and a short closing excerpt of the most recent page. The pack&#x27;s refrain parameter was on for this build: a devotional is refrain-shaped by genre -- the practice is the same words returned to daily -- so the book&#x27;s anchor theme returns across the pages as a theme, restated with development, never copied verbatim; each page was measured for verbatim sentence overlap against all earlier pages, and a page that repeated earlier sentences beyond the allowance was regenerated with the overlap named, up   '<a href="https://github.com/Frozen-In-Flames/survey-to-book">Source repository</a>';
const opt0 = document.createElement('option');
opt0.value = 0; opt0.textContent = 'Front matter';
sel.appendChild(opt0);
for (const ch of DATA.chapters) {
  const o = document.createElement('option');
  o.value = ch.first; o.textContent = ch.name;
  sel.appendChild(o);
}
const optEnd = document.createElement('option');
optEnd.value = DATA.screens.length - 1; optEnd.textContent = 'Colophon';
sel.appendChild(optEnd);
let i = 0;
try { i = Math.min(parseInt(localStorage.getItem(POSKEY) || '0', 10) || 0,
                   DATA.screens.length - 1); } catch (e) { i = 0; }
function render() {
  const s = DATA.screens[i];
  let head = '';
  if (s.kind === 'page') {
    head = '<h2>' + s.chapter + '</h2><h3 class="pagelabel">' + s.label +
           '</h3>';
  } else {
    head = '<h2>' + s.label + '</h2>';
  }
  main.innerHTML = head + s.html;
  const pages = DATA.screens.filter(x => x.kind === 'page').length;
  posEl.textContent = s.kind === 'page'
    ? s.label + ' of ' + pages + ' · ' + s.chapter
    : s.label;
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === DATA.screens.length - 1;
  endEl.hidden = !(i === 0 || i === DATA.screens.length - 1);
  let v = 0;
  for (const o of sel.options) if (parseInt(o.value, 10) <= i) v = o.value;
  sel.value = v;
  document.getElementById('progress').style.width =
    (100 * i / (DATA.screens.length - 1)) + '%';
  try { localStorage.setItem(POSKEY, String(i)); } catch (e) {}
  window.scrollTo(0, 0);
}
prevBtn.onclick = () => { if (i > 0) { i--; render(); } };
nextBtn.onclick = () => { if (i < DATA.screens.length - 1) { i++; render(); } };
sel.onchange = () => { i = parseInt(sel.value, 10); render(); };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prevBtn.onclick();
  if (e.key === 'ArrowRight') nextBtn.onclick();
});
render();
</script>
</body>
</html>
