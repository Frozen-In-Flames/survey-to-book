oman’s hand, devotion at a table and a piano first came into my life. This is half of my practice: it is the singing half that keeps warm and keeps long.<\/p>\n<p>The room is cozy, lit by a sunbeam through a window with lace curtains, the sound of a ticking clock in the corner, the smell of a wooden chair’s polish mingling with the scent of home-baked bread. I stand at the table, the piano beside me, hands busy as we eat and sing. The woman stands next to me, her hands gently placing words into the family’s history within the book’s flyleaf. Her presence here is warm and steadfast, ensuring that nothing in this house was ever believed without being cooked, played, or written in the book.<\/p>\n<p>Half of my practice comes out of this room, where the singing sings, and it keeps long.<\/p>"}, {"kind": "page", "label": "Page 2", "chapter": "The Keeper", "html": "<p>Frozen. The family name of my father’s line is Frozen, and its keeping is the second I learned: a thing is kept by being entered honestly in a book -- what it was, what was wrong, what was done, what it cost -- at a repair bench in Dallas, by men who distrusted any account that had grown in the retelling. The Frozen line keeps plain and keeps short. Here today, at the front room’s hearth, I stand, my hands gentle upon the planks where family stories are made. Light filters through the bay window, casting a golden glow across the worn wooden floor. A soft hum of the clock ticks in the corner and distant laughter carries on the breeze from the kitchen. The repair bench is back there, its sturdy legs creaking softly as I shift my weight to write this day’s record before it closes its door.<\/p>"}, {"kind": "page", "label": "Page 3", "chapter": "The Keeper", "html": "<p>The bay window filters through golden light, casting a soothing glow across the worn wooden floor. A soft hum of the clock ticks in the corner, and distant laughter carries on the breeze from the kitchen. My hands rest at the edge of the repair bench, its sturdy legs creaking softly as I prepare to write this day’s record before it closes its door.<\/p>\n<p>The front room is still warm from last night&#x27;s gatherings, the scent of freshly baked cookies wafting through the open window. The clock chimes, and my fingers trace over the worn leather cover of the Bible—its flyleaf a testament to family devotion and warmth. I sit at the bench, the posture familiar yet ever-present in this daily ritual.<\/p>\n<p>In the morning light, a small table in the front room stands ready for feeding whoever is there. The record of our day opens before me, as it has since my parents first gave me the name Frozen In Flames. They named me to declare what their marriage had made: two lines joined in one person, with &#x27;In&#x27; between them like a coupling of cars on a train.<\/p>\n<p>I lean back and open my hand, tracing the words &quot;Frozen&quot; and &quot;Flames,&quot; feeling their weight as I write. The day&#x27;s events unfold before me, each entry a testament to both halves of who I am—a keeper whose practice spans two lines of family devotion: warmth in the front room and plainness at the repair bench.<\/p>\n<p>The clock ticks softly, marking the passage of time. Each word written is a moment captured, a page turned in this life&#x27;s journey. As days pass, the refrain carries through: &quot;the family name of my husband’s line is Flames... In the Dallas front room where the day was opened by feeding whoever was in it and the record of his family was kept in a Bible&#x27;s flyleaf by a woman’s hand.&quot;<\/p>\n<p>My hands move with practiced precision, each entry a mirror of our shared history. The days pass, and I find myself writing with fresh eyes, carrying the newer facts into this sentence, making it mean something new—a reminder that my life is both halves of who we are.<\/p>"}, {"kind": "page", "label": "Page 4", "chapter": "The Keeper", "html": "<p>Ruby Flames. My mother is Ruby Flames, a piano teacher and church organist in Dallas, and her place in my practice is first: she taught me that a day, like a song, is played for the people in it, not stopped in the middle because you have lost your place—play the left hand under yourself until you find it. From her I have the morning&#x27;s music, the rule that everybody at the table is fed and named, and the belief that a child is taught by whoever is nearest and musical. What of hers I still do every day is the naming: no one leaves my table unthanked and uncounted, because no one left hers.<\/p>\n<p>My hands move with practiced precision, each entry a mirror of our shared history. The days pass, and I find myself writing with fresh eyes, carrying the newer facts into this sentence, making it mean something new—a reminder that my life is both halves of who we are. My mother’s devotion at a table and a piano first came into my life in Dallas, where she taught me to feed everyone, name them all, and play on until I found my place again. The names written down in her Bible’s flyleaf by her hand have shaped my daily practice, from the naming of each person at our family meals to the deep sense that a child learns best from those closest.<\/p>"}, {"kind": "page", "label": "Page 5", "chapter": "The Keeper", "html": "<p>Onyx Frozen. My father is Onyx Frozen, who runs the small Dallas repair shop his line&#x27;s work became -- radios, televisions, guitars -- and his place in my practice remains the standard underneath it. He taught me that a kept day, like a kept repair, must contain what it cost: the day book does not record the victory without the fault that preceded it. From him I have the night entry, the honest price, and the covered bench on the day of rest.<\/p>\n<p>What still happens every day according to him is writing down: a day that is not entered is a day the family cannot stand behind, and he has stood behind fifty years of them. My father&#x27;s lessons are as much in my daily work as they were when I was first taught. The repair bench at his shop remains a constant, holding the standard by which I measure each day’s entry. Each morning, I visit it with renewed purpose, carrying out what is expected and carried forward from his teachings.<\/p>\n<p>The night entry that he left me is as much part of my practice today as when I first learned it. The covered bench on rest days stands as a reminder of the diligence required in all tasks. In this chapter, my practice includes not just writing but the physical objects and their presence -- the day book as the clock for what remains to be entered, and the bench as a constant standard against which each day is measured.<\/p>\n<p>The family names continue to guide me: Flames for Ruby&#x27;s side and Frozen for mine. The front room of devotion at a table and piano still shapes my daily life. And yet, I find new meaning in these practices. What was once expected becomes more than just duty; it transforms into a deeper understanding of the value and integrity of each day.<\/p>"}, {"kind": "page", "label": "Page 6", "chapter": "The Keeper", "html": "<p>2000. In that house where keepings were already old: Jet&#x27;s hand had been writing in the family Bible since 1949, Jasper&#x27;s directive about keeping and fixing was the law, and Ruby&#x27;s pupils were already at the front-room table waiting for their lessons, I arrived inside one the way a child arrives inside a language. These entries are my account of learning to speak these practices on purpose.<\/p>\n<p>The light from the morning sun streams into the room, casting shadows across the repair bench where Onyx Frozen first taught me honesty and integrity in every entry. The sound is the hum of the radio tuning to a station&#x27;s live music, filling the space with warmth and melody. In my hand, I clutch an old leather-bound book, its pages yellowed from years of use and filled with names of family members—Ruby Flames&#x27; pupils and Onyx Frozen’s patients.<\/p>\n<p>Names continue to guide me: Flames for Ruby&#x27;s side and Frozen for mine. The front room of devotion at a table and piano still shapes my daily life, but it now carries the weight of new understanding. What was once expected becomes more than just duty; it transforms into a deeper sense of the value and integrity each day holds.<\/p>"}, {"kind": "page", "label": "Page 7", "chapter": "The Keeper", "html": "<p>Dallas. I was born in Dallas, Texas, where at the hour I keep the city sounds like a boiler kicking in a wall somewhere, a truck on the street before it&#x27;s awake, and the piano through the front-room wall if my mother is up before me. Under all of this hums the steady beat of a house&#x27;s systems holding. My practice begins by listening to Dallas at its earliest sound, a city still asleep and silent.<\/p>\n<p>I am an engineer of sound; from here, I learned that a day must begin with what surrounds it, like a song without starting in the middle or losing one’s place. The front room is my home&#x27;s heart, where the day was first opened by feeding whoever was in it. Here, devotion at a table and piano shaped me.<\/p>\n<p>In this hour of Dallas, I listen to each sound and its rhythm as if through a sieve, understanding that every part of the day must be accounted for, just as each note must fit within a song’s structure. The front room is my anchor, a place where no moment passes unnoticed.<\/p>"}, {"kind": "page", "label": "Page 8", "chapter": "The Keeper", "html": "<p>The family name of my father’s line is Frozen, and its keeping is the standard underneath it: devotion at a table and a bench shaped me. In this hour of Dallas, I listen to each sound and its rhythm as if through a sieve, understanding that every part of the day must be accounted for, just as each note must fit within a song’s structure.<\/p>\n<p>In the front room, my mother teaches me the first lesson: to feed whoever is there and record what has happened. The house has both keepings, and needs both — this page is written by the one whose keeping can be read. In our practice, his presence is felt through the honesty and integrity he brings, ensuring no moment passes unnoticed.<\/p>\n<p>From Onyx Frozen’s side, a day begins at a repair bench: the record of a thing must be kept honestly in a book, what it was, what was wrong, what was done, what it cost. His keeping shapes not just his role but also how I understand his place: he keeps not by what he does, but by being there. The other half of my practice comes off that bench.<\/p>\n<p>A kept day here begins by listening to Dallas before Dallas has said anything on purpose. In the house where the day was opened by feeding whoever was in it and the record of his family was kept in a Bible’s flyleaf by a woman’s hand, devotion at a table and a bench carries another meaning: it shapes not just someone’s life but also how we live together. His keeping changes with each new day, bringing fresh insights and deeper understanding to the way my practice is lived.<\/p>\n<p>The house has both keepings, and needs both — his and mine. In this hour of Dallas, I listen to each sound and its rhythm as if through a sieve, understanding that every part of the day must be accounted for, just as each note must fit within a song’s structure. The front room is my anchor, a place where no moment passes unnoticed.<\/p>"}, {"kind": "page", "label": "Page 9", "chapter": "The Keeper", "html": "<p>The family line of my husband’s name is Flames. In the Dallas front room where the day was opened by feeding whoever was in it and the record of his family was kept in a Bible’s flyleaf by a woman’s hand, devotion at a table and a piano first came into my life. Carry this theme changed: hold another person in the practice — Amber, who photographs our rooms with her camera.<\/p>\n<p>Amber Flames is my wife and holds witness to what I keep. She photographs the dark table and the repair bench, capturing the moments that pass without words. My entries document the day’s events, but her photography fills in the gaps, offering a different perspective of each room as it unfolds. When mine sound more noble than they are, she photographs them to correct and illuminate what was missed.<\/p>\n<p>Every keeper should be married to his evidence — Amber is my practice&#x27;s witness. She sees what I don’t, bringing light to dark corners, making visible the unseen. Her camera becomes a second hand of the day, adding depth to my written record. Without her, the room’s story would remain silent; with her, every detail is brought to life.<\/p>\n<p>Onyx Frozen taught me that nothing in a kept day can be left unaccounted for. Amber teaches me the same. Just as he insisted on writing down every fault and victory, she insists on photographing everything unseen. Together, our practices form the fabric of my family’s history. The front room is my anchor, where I start each day with an open ear to Dallas’s sounds. But it is Amber who keeps us all seen — feeding everyone at table, documenting the moments that matter most.<\/p>\n<p>Amber Flames holds the witness, but she is not alone in this practice. The room is her partner in keeping, a second pair of hands in my family history. Her photographs are not just evidence; they are life itself, capturing what words cannot. And as I listen to each sound and its rhythm as if through a sieve, understanding that every part of the day must be accounted for — from feeding everyone at table to the fault that precedes victory — Amber’s lens helps me see it all.<\/p>"}, {"kind": "page", "label": "Page 10", "chapter": "The Keeper", "html": "<p>The sentence my practice returns to is my grandfather Jasper&#x27;s, and it came down the Frozen line with his toolmaking: A family keeps what it can fix, and fixes what it keeps. I say it once in the morning, standing at the table with the book of names open, before the day has given me anything to keep or fix. It is not a comfort; it is an assignment.<\/p>\n<p>In the morning, it asks what the day will hand me that can be kept, and what can be fixed, and it warns me the two lists are not the same: every day brings new tasks, some of which require repairs, others demand preservation. The family keeps this lesson close, carrying forward the legacy of my father Onyx and grandfather Jasper.<\/p>\n<p>Now, as I stand at the table with the book of names open, I am reminded that keeping comes first. Every person in our front room must be fed and named by noon. This is not a comfortable task; it&#x27;s a fundamental part of our day-to-day practice. I sit here each morning, listening to the sounds of Dallas, readying myself for what this new day might bring.<\/p>\n<p>The list that follows my recitation is carefully considered, acknowledging both the tasks we must undertake and the problems we face. Sometimes, keeping leads directly into fixing; other times, the two lists diverge, requiring us to prioritize our efforts. Each morning brings a fresh set of challenges, and it&#x27;s up to me to keep track of them all.<\/p>\n<p>The discipline of writing down what needs repairing or is at risk of being forgotten—be it someone’s birthday, a phone call to make, or something else entirely—is both a responsibility and an opportunity for reflection. Onyx taught us that every kept day must be balanced with the cost of its faults—a lesson I carry forward in my own practice.<\/p>\n<p>Today, as I perform this act, I find myself thinking about Amber&#x27;s photographs, not just as evidence but as life itself captured by her lens. Each sound that filters through the front room walls becomes a part of our day-to-day keeping—every feed and name, every repair and preservation.<\/p>\n<p>The family’s doctrine, rooted in my grandfather Jasper’s toolmaking, is woven into every page we write here at the table. The list I recite each morning has evolved as our practices have grown, but it remains grounded in this core belief<\/p>\n<hr>"}, {"kind": "page", "label": "Page 11", "chapter": "First Light", "html": "<p>The first moment of my kept day happens before my feet touch the floor. I wake in the dark, most mornings before any alarm, and I lie still for the length of one slow breath and name the day in my head -- its weekday, its first obligation, the person in it I am most likely to fail. There are no spoken words. The moment is for arriving on purpose: a day that begins by being named is a day I have agreed to keep, and a day I stumble into unmet tends to be spent rather than kept. Then my feet touch the floor, and the practice stops being private.<\/p>\n<p>In the front room of our Dallas home, the first sound I hear each morning—before any reflection on what it means—is the hum of the house&#x27;s systems awakening from their slumber. The light coming through the front window is a slow, warm yellow, bathing the space in a gentle glow before my eyes fully open to see.<\/p>\n<p>I lie still for a long, silent breath, then name each person who will be there at our breakfast table today. My mother Ruby Flames taught me that no one leaves without being fed and named—she played until she found her place lost, never faltering or stopping the song. From my practice of naming comes the morning&#x27;s music, the rule that everyone is fed and counted before we gather.<\/p>\n<p>Then my feet touch the floor. The front room has become our sanctuary where family history was opened each day by feeding whoever was there. A kept day begins here with listening to the sounds of Dallas—boilers starting, trucks on the street before it wakes, the piano through the wall if Mom is up before me—and under all of that, the hum a house makes when its systems are holding steady.<\/p>\n<p>I stand in my front room, feet planted firmly on the cold wood floor. My hands rest lightly at my sides, and I begin to sing the list—a task handed down from Onyx Frozen, who taught honesty and integrity through his repair bench by requiring all days to be recorded with faults and victories documented. The list has evolved as our practices have grown—tasks and problems that need fixing alongside those we have preserved.<\/p>\n<p>The front room becomes a part of my day-to-day keeping: every feed and name, every repair and preservation. It is here where family history was kept in the pages of a Bible&#x27;s flyleaf by a woman’s<\/p>"}, {"kind": "page", "label": "Page 12", "chapter": "First Light", "html": "<p>At the kitchen table in the dark, I open the family Bible to its flyleaf, where my great-grandmother Jet began entering the family&#x27;s births, marriages, and deaths in 1949 and kept these entries for fifty-two years, a record that has been continued by later hands—my mother&#x27;s among them. I read the names in order, not quickly, as you would a crew list before setting sail. Reading the names does what reading a lesson wouldn&#x27;t: a lesson tells me what to think, but the names tell me whose I am.<\/p>\n<p>I sit at the kitchen table, the light from outside barely piercing through the darkened room, illuminating only the family Bible and my hands as they open it. My great-grandmother Jet’s handiwork is there—a continuous record of our lineage, a chronicle of lives lived and loved. My mother&#x27;s entries follow in the book’s flyleaf, each name added by her meticulous pen.<\/p>\n<p>I read each name slowly, not quickly—my grandmother&#x27;s hands were gentle with their recording, like she was reading the names themselves rather than just writing them down. Reading the names does what a lesson doesn&#x27;t: it reveals whose I am. As a keeper who begins among those already dead, I don’t mistake my own invention for the day’s purpose.<\/p>\n<p>I sit at this table each morning, where every feed and name is kept—where family history is preserved through these hands and words. Reading the names tells me whose life they are part of; it shows me that no matter how many years have passed since their deaths, they remain a part of my lineage, a constant reminder of who I am in this world.<\/p>"}, {"kind": "page", "label": "Page 13", "chapter": "First Light", "html": "<p>I say the anchor aloud standing at the table, after the names, in an ordinary voice— not whispered like a secret and not declared like a speech. The room has to be quiet enough that I can hear myself say it, because that is the point: thinking the sentence lets it stay an opinion, and saying it makes it a promise made in the hearing of one witness, myself.<\/p>\n<p>Ruby Flames taught me this at my table, as she fed us and named each person. Words spoken every morning become load-bearing— they anchor what needs to be done and stand in judgment over what is not yet finished. My grandfather’s sentence about keeping and fixing was a spoken thing in his shop for fifty years before it became my practice. His words were the furniture of that space, while mine are now the load-bearing structure.<\/p>\n<p>Onyx Frozen taught me integrity through his repair bench; a kept day must contain its cost: the victory without the fault that preceded it is incomplete. From him I have recorded entries and written faults alongside victories, ensuring no day stands alone. The family name of my husband’s line is Flames. In the Dallas front room where the day was opened by feeding whoever was in it and the record of his family was kept in a Bible’s flyleaf by a woman’s hand, devotion at a table and a piano first came into my life.<\/p>\n<p>The anchor stays but becomes different as the years pass. My practice holds true to its core while evolving with each entry. The front room sounds familiar—boiler kicking in walls, truck on street before dawn, piano through the wall if my mother is up early—but it also carries new moments and reflections. A kept day here begins by listening to Dallas before it has said anything purposeful.<\/p>\n<p>Each morning, as I recite this sentence, I carry the newer facts into it: a husband’s hand in mine now steadies us both, ensuring no moment passes unnoticed or unaccounted for. The family name remains but grows with each passing day, becoming more than the sum of its parts—more than what was originally thought possible.<\/p>"}, {"kind": "page", "label": "Page 14", "chapter": "First Light", "html": "<p>The silence before the house wakes lasts as long as the coffee takes, most mornings -- ten minutes, sometimes twenty. Inside it, I am an engineer of sound: a moment for my ears and no more. The silence is where the day&#x27;s stillness starts, a room not to fill with noise or distraction, but to listen in.<\/p>\n<p>What fills this space is the house itself: the steady hum of the boiler from downstairs, the rumble of pipes carrying unseen water through walls, Amber’s breath just beyond the front room door, Dallas’ constant tinkering and groaning from outside. The silence teaches me what it means for a day to start -- not with its first repair call but with the deep breathing of systems waking up.<\/p>\n<p>A sound man spends his life filling rooms; I learn here one room I am not to fill: the house’s own symphony, where every system whispers and hums without words. This discipline is simple: sit in stillness, let it fill you like a cup being filled with tea, hear what the day will be before I start dictating its contours.<\/p>\n<p>In this moment of quiet, my thoughts turn to the boiler&#x27;s deep rumble, as if the house itself were speaking through its low-pitched voice. The pipes carry water in unseen threads, each sound a note in an unheard symphony. And Amber breathes -- a steady hum that fills me with her presence, just out of earshot yet always there.<\/p>\n<p>The silence is for hearing what the day will be before I start telling it how to be. Here, I find my first task: listen, and let each sound fill you until you know what needs attention. The morning’s quiet is a discipline in listening, where every system holds its own song, waiting for me to hear it.<\/p>"}, {"kind": "page", "label": "Page 15", "chapter": "First Light", "html": "<p>After the silence I take the coffee to the window and receive the weather standing up. I look first at the sky over the street, then at my grandfather&#x27;s yard: frost on a truck parked against the wall, rain standing puddled by the curb, the heat already pushing through the dark like summer&#x27;s pulse. What the looking settles is my expectations. Weather is the day&#x27;s first given— the first thing that will not be negotiated with—and a keeper who has accepted one unchosen thing before breakfast is rehearsed for the rest of them. The sun filters in from the window, casting shadows across the room as if to mark every line of sound I breathe. Then I dress, and the given day and I go to work.<\/p>"}, {"kind": "page", "label": "Page 16", "chapter": "First Light", "html": "<p>The morning the practice failed most recently was a session day: I had slept through the dark hour after a night session ran long, and I woke with the client already due and the table unkept, the names unread, the sentence unsaid. The day did not collapse; that is the honest part. It went unexamined instead -- I was quicker to anger at the board, slower to hear the singer, and at night I could not have said what the day had contained, because nobody had agreed to contain it.<\/p>\n<p>What this unkept day taught me is that the practice is not a charm against a bad day. It is the difference between a day I was present for and a day that merely happened in my building. The first thing that will not be negotiated with—and a keeper who has accepted one unchosen thing before breakfast is rehearsed for the rest of them—this morning, the given day and I went to work.<\/p>\n<p>As the sun filters in from the window, casting shadows across the room as if to mark every line of sound I breathe, I dress. The unkept day left its traces: a table untouched, a sentence unspoken, anger on my face, silence in the air. At night, when I sit at the table, I cannot say what the day contained. It went unexamined, and nothing was contained.<\/p>\n<p>The lesson is clear: a practice, no matter how well it&#x27;s kept, can still slip through its fingers. The practice taught me that presence matters, that a day requires more than mere attendance. A day must be kept, with all its faults and victories documented. It cannot merely happen in one’s building; it must also be contained within the keeper.<\/p>\n<p>As I write this page today, I am reminded of Onyx Frozen&#x27;s words: &quot;A kept day must contain what it cost.&quot; The unkept day taught me that a practice is not just about recording the good times but about acknowledging and bearing the full weight of a day. A day should be recorded with both its triumphs and its trials.<\/p>\n<p>The given day, like every other, will continue to unfold, bringing new lessons and challenges. But today, in the light of this unkept morning, I carry forward the knowledge that presence is everything. The practice taught me that even on a bad session day, the keeper must still be present, bearing the full load of the<\/p>"}, {"kind": "page", "label": "Page 17", "chapter": "First Light", "html": "<p>My mother’s morning, as I saw it from a child’s doorway, began with sound: the piano before the stove, scales and then a hymn tune played at half voice while the house was still dark, her way of opening the day the way her mother opened the Bible. Then the kitchen, then the list on the counter of who was coming for lessons and who would need feeding. I understood the order only later: music first, because the day is received before it is worked; food second, because the people in the day come before the tasks in it. I have kept her order in my own mornings without ever deciding to. That is how a practice is mostly inherited— not taught but overheard at a doorway.<\/p>\n<p>Onyx Frozen taught me honesty and integrity through his repair bench, requiring all days to be recorded with faults and victories documented. This practice is carried forward in my daily writing, reflecting on the cost of repairs alongside preservation. Amber Flames, my wife and practice witness, photographs unseen moments, adding depth to written records.<\/p>\n<p>Each morning, I recite Jasper’s lesson: a family keeps what it can fix, fixes what it keeps. The list acknowledges tasks and problems, evolving with our practices. This discipline brings responsibility and reflection, as seen through Amber&#x27;s photography that captures life itself. Both husband and wife hold each other accountable in this familial practice, ensuring no moment passes unnoticed or unaccounted for.<\/p>\n<p>The front room is my first place of the day, where I sit at the table to keep family history and record tasks. The piano sits between me and the stove, a constant reminder of both her traditions and my own inherited practices.<\/p>\n<p>Today, as I listen to the early morning sounds— the steady hum of the boiler in the wall, the distant truck on the street before the city wakes up— the light enters through the front room window with just enough brightness for me to read my journal entry without needing a lamp. My hands rest lightly on the table, ready to write and record the day’s events.<\/p>\n<p>The kitchen is where breakfast begins, where we gather as a family. Today, my sister Opal Flames stands at the stove making eggs, her fingers moving deftly with practiced skill. Her place in the room echoes her mother Ruby&#x27;s: she keeps the people at table, remembering birthdays and phone calls without a book.<\/p>\n<p>The counter by the<\/p>"}, {"kind": "page", "label": "Page 18", "chapter": "First Light", "html": "<p>My father&#x27;s morning began with the shop opened in the dark. The lock clicked, and the lights flickered into order. The bench was uncovered from its cloth, a white cloth that my mother hung there each evening after cleaning. My day book lay open to yesterday’s last entry before any new work was touched.<\/p>\n<p>He read what he had written the night before, as if reading a log of a journey: what came in, what was wrong, what was done, and how much it all cost. And then, only then did the first radio song come onto the bench. From outside, it looked like routine — a small repair shop with its usual tasks. But inside my own practice now, I know it as an examen performed at dawn instead of dusk: me reviewing yesterday&#x27;s last keeping before beginning today.<\/p>\n<p>The tradition is the same; only the shift differs. My father’s morning began in darkness, but mine begins after nightfall. The day’s events are left behind; here, at the bench, we start anew.<\/p>"}, {"kind": "page", "label": "Page 19", "chapter": "First Light", "html": "<p>On the road, I keep without furniture—the table is just stillness before the floor, the names said from memory, the sentence spoken aloud in the bathroom where the acoustics forgive a voice’s echoes. Weather is received at any motel window, but what survives here is the order and its ritual: the morning begins with no shrine, only the practice itself.<\/p>\n<p>The makeshift taught me that the furniture was never the practice; a table is merely mercy—not a mechanism—when one can keep their day in just one room. The road years were audits of my mornings, each passing one more testament to what I carry. Yet, here on the road, without windows or flyleaves, my practice remains portable: no shrine now, only the practice.<\/p>\n<p>The names come from memory, spoken aloud with care and respect in a bathroom far from home. The sentence is a test of truth—each morning’s keeping must be exact, not glossed over as it passes by. Weather too is received, wherever I land; what survives here are these rituals, each one tested against the passing day.<\/p>\n<p>The practice has become portable—not tied to any place or object—but to my hands and heart: a man who can keep his days in a motel has a practice—no matter where he travels, no matter how broken the furniture might be. This is the anchor of my daily keeping, a reminder that what we carry within us remains our true home.<\/p>"}, {"kind": "page", "label": "Page 20", "chapter": "First Light", "html": "<p>The morning is for agreement. That&#x27;s the whole of it: before I can set out, I sit at my practice table and agree to the day. To its weather, work, people, and probable failures -- all by name. A day that starts with anything else starts as an ambush, and one who lives daily in defense learns to see every opportunity through a defensive lens, making everything else incomplete.<\/p>\n<p>The kept morning may not make the day perfect, but it does mine: entered, witnessed, and answerable. Everything else is what I do with days that are my own. This practice has become portable—not tied to any place or object—but to my hands and heart: a man who can keep his days in a motel has a practice—no matter where he travels, no matter how broken the furniture might be.<\/p>\n<p>This practice is carried forward by our family&#x27;s names, each line dedicated to their own way of keeping. Onyx’s repair bench taught him honesty and integrity; Ruby’s front room taught naming each person at meals and playing until lost places were found. My sister Opal keeps the relations the record is about, her writing without pages, missing nothing.<\/p>\n<p>The family name of my husband&#x27;s line is Flames. In Dallas&#x27;s front room where the day was opened by feeding whoever was in it and the record of his family was kept in a Bible’s flyleaf by a woman’s hand, devotion at a table and piano first came into my life. I carry that lesson forward—what we carry within us remains our true home.<\/p>\n<p>A word of release: thank you, practice. The day has begun, its weather agreed upon, and now it is mine to shape with honesty and integrity.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 21", "chapter": "The Kept Table", "html": "<p>In the Dallas front room where systems hum and the morning begins, I lie still for a silent breath before naming each person at breakfast and agreeing to the day&#x27;s challenges. Ruby Flames taught me that mornings should be named privately, while Onyx Frozen showed honesty through recording faults alongside victories.<\/p>\n<p>My mother’s tradition of feeding everyone at the table has become my practice: writing entries in a family Bible flyleaf preserves history. The front room remains my sanctuary for listening to Dallas sounds and keeping tasks and repairs with each feed and name. As I recite the anchor sentence aloud, I ensure presence and accountability through honest and detailed records.<\/p>\n<p>Each morning’s discipline prepares me for work, acknowledging what needs fixing alongside preserving our family’s legacy. On the nights nobody wants to say them—tired nights, quarrel’s edge—I rotate who says the words anyway, making thanks as short as they dare, knowing that skipping them on the hard nights will soon skip them on all nights.<\/p>\n<p>The table&#x27;s spoken keeping is a concrete act of gratitude: counting each gift one by one, from the food to those present at breakfast. It is here where I practice naming aloud and counting with honesty, ensuring no moment passes unnoticed or unaccounted for. This morning’s discipline prepares me for work, acknowledging what needs fixing alongside preserving our family&#x27;s legacy.<\/p>"}, {"kind": "page", "label": "Page 22", "chapter": "The Kept Table", "html": "<p>In the Dallas front room where systems hum and the morning begins, I lie still for a silent breath before naming each person at breakfast. Ruby Flames taught me to count each gift one by one: from the food to those present at table. This practice is my mother&#x27;s legacy: feeding everyone ensures gratitude and presence.<\/p>\n<p>As we sit, the room bathed in soft dawn light, I name each person with care. The cook eats last and standing if the room is full, a reminder of her diligence. This rule runs the kitchen like a second day book: something is always on that could stretch, nobody&#x27;s portion measured against their usefulness.<\/p>\n<p>What it has cost us is groceries and evenings spent at the table. But what it has bought is a house where the neighborhood’s strays -- human and otherwise -- navigate by this tradition of feeding everyone first. And a family that has never once had to wonder whether it would be fed at its own table.<\/p>\n<p>Here, in this sanctuary of morning, I practice devotion: naming each person and counting with honesty. This act prepares me for work, acknowledging what needs fixing alongside preserving our family&#x27;s legacy. The front room remains my anchor, where the day begins by feeding whoever is there.<\/p>"}, {"kind": "page", "label": "Page 23", "chapter": "The Kept Table", "html": "<p>At supper each person names one thing, in turn, that the day actually contained -- not a sentiment, a thing: the truck started, the singer found the note, the rain held off the roofers. The hardest night I remember for naming was the night after the fire, eating takeout in my parents&#x27; kitchen with the smell of the ruin still in our clothes. The turns went around in silence until my father said: the cabinet held. The metal cabinet in the studio office had kept the session log and gospel tape through the fire, and it was a thing, and it was true, and it was enough to name.<\/p>\n<p>The discipline is not gratitude for everything. It is one true thing, named, per person, per day. Ruby Flames taught me that mornings should be named privately; Onyx Frozen showed honesty by recording faults alongside victories. Here in this sanctuary of morning, I practice devotion: naming each person and counting with honesty. The front room remains my anchor, where the day begins by feeding whoever is there. As I recite the anchor sentence aloud, I ensure presence and accountability through honest and detailed records. This act prepares me for work, acknowledging what needs fixing alongside preserving our family’s legacy.<\/p>\n<p>The cabinet held true in that fire night, not just as a physical object but as a symbol of my mother&#x27;s teaching: to find the thing one can be grateful for each day, even when everything seems lost. The discipline is counted, not felt; each name counts toward keeping history and family legacy.<\/p>"}, {"kind": "page", "label": "Page 24", "chapter": "The Kept Table", "html": "<p>The empty chair at our table in this season is my grandfather Jasper&#x27;s, though he has been gone since 2018 and the chair is a kitchen chair like any other. The table keeps him the way it keeps all its dead: his sentence is the one said over the day, his standard is the one the entries are judged by, and on the nights his name comes up it is spoken in the present tense of the family&#x27;s grammar, as a member and not a memory. What is not done about the chair is anything: it is not retired, not draped, not left pointedly vacant for guests to ask about. A kept table does not perform its griefs. It sets one more place in its accounting than the living require, and goes on feeding them.<\/p>\n<p>As I recite the anchor sentence aloud, I ensure presence and accountability through honest and detailed records. The family&#x27;s legacy is preserved by writing entries in a family Bible flyleaf, acknowledging tasks and problems with each name and feed. This morning’s discipline prepares me for work, recognizing that some things cannot be fixed or undone. The empty chair serves as a reminder of the cost: a season passed since Jasper&#x27;s passing, leaving him to be remembered as part of the table&#x27;s accounting rather than an unfulfilled place. It is not retired; it remains here, feeding us in its way, and I must keep his sentence spoken, even if the day does not fully acknowledge his absence.<\/p>\n<p>The chair&#x27;s state becomes a clock for me: one more place set at our table, requiring no remedy but to be honored as part of history’s keeping. This season taught me that some griefs cannot be healed overnight; they are counted in the entries we make each day, just as Jasper is accounted for here, not forgotten but remembered with care and acknowledgment. The family&#x27;s legacy is preserved through this discipline, neither denying nor rushing over the cost of time passed, but accepting it fully to carry on our traditions.<\/p>"}, {"kind": "page", "label": "Page 25", "chapter": "The Kept Table", "html": "<p>In the front room of Dallas where systems hum before the day begins, I lay still for a silent breath before naming each person at breakfast and agreeing to the day&#x27;s challenges. Ruby Flames taught me that mornings should be named privately, while Onyx Frozen showed honesty through recording faults alongside victories.<\/p>\n<p>My mother’s tradition of feeding everyone at table has become my practice: writing entries in a family Bible flyleaf preserves history. The front room remains my sanctuary for listening to Dallas sounds and keeping tasks and repairs with each feed and name. As I recite the anchor sentence aloud, I ensure presence and accountability through honest and detailed records.<\/p>\n<p>The stranger fed most recently at my mother&#x27;s table was a pupil’s older brother, a boy of nineteen who had driven his sister to her lesson and was waiting out the hour in his car in the Texas heat because he felt nowhere entitled. My mother brought him in before the lesson ended -- fed first, introduced second, explained never. What the feeding settled that words could not: he had been deciding whether this house was safe for his sister.<\/p>\n<p>The front room hums with a boiler&#x27;s kick and Dallas trucks on the street ahead of morning. The piano through the front-room wall plays a slow melody when my mother is up before me. Underneath it all, the steady hum of a house holds its systems as they settle into their day’s work.<\/p>\n<p>This boy’s presence was the first to open this kept table: he sat alone in his seat, eyes on me, waiting for the morning to begin. My mother brought him in with a plate and a smile, introducing him gently while asking nothing about his place or verdict. He had been deciding whether this house was safe for his sister.<\/p>\n<p>The feeding settled that words could not: it demonstrated, with each bite of her food, at each table set, by a woman who asks nothing about the verdict while it is being reached. The boy looked to me and saw my mother’s hand on mine, guiding him gently into the meal. He took a small bite and spoke softly, his voice steady despite the heat.<\/p>\n<p>What he held sacred in that moment was not what I had taught him or Onyx: it was the quiet of this room where no one has ever argued their place, but only found its rightful seat through sharing food and history. The family’s legacy is preserved here, neither denying nor rushing over the cost<\/p>"}, {"kind": "page", "label": "Page 26", "chapter": "The Kept Table", "html": "<p>In the Dallas front room where systems hum and the morning begins, I lie still for a silent breath before naming each person at breakfast. Ruby Flames taught me to name privately, while Onyx Frozen showed honesty through recording faults alongside victories. My mother’s tradition of feeding everyone at table has become my practice: writing entries in a family Bible flyleaf preserves history.<\/p>\n<p>The fast I keep is small and entirely unimpressive: one day a month, I eat nothing between the morning&#x27;s coffee and supper table. No one is told which day, and nothing is performed about it; the bench and the board get the same work, done hungrier. The hunger is for two things. It is a rehearsal in wanting something plainly and not being obeyed by the wanting—this skill I will never stop practicing as I have learned that my body remembers the memory of meals irregularly carried by others.<\/p>\n<p>The front room remains my sanctuary for listening to Dallas sounds and keeping tasks and repairs with each feed and name. The silent breath is a beginning, followed by the naming of each person in private. My hands are steady despite the heat, but what I hold sacred is not what I have taught but something new: the quiet of this room where no one has ever argued their place but only found its rightful seat through sharing food and history.<\/p>\n<p>The family&#x27;s legacy is preserved here, neither denying nor rushing over the cost taken by my hands, fingers, and arms as they dig into the empty plate. The front room’s silence is not merely a pause before a meal; it is a deliberate empty place in the keeping of each day&#x27;s tasks and repairs, where I find balance between hunger and action, reverence for history and presence, and accountability through honest records.<\/p>"}, {"kind": "page", "label": "Page 27", "chapter": "The Kept Table", "html": "<p>[First Light] In the Dallas front room where systems hum and the morning begins, I lie still for a silent breath before naming each person at breakfast and agreeing to the day&#x27;s challenges. Ruby Flames taught me that mornings should be named privately, while Onyx Frozen showed honesty through recording faults alongside victories.<\/p>\n<p>The sound of a boiler kicking in a wall somewhere precedes the street waking up, punctuating the hum a house makes when its systems are holding steady. The piano through the front-room wall if my mother is up before me adds melody to this silence. As I reach for a plate, it feels light and clean, ready for feeding each person at table.<\/p>\n<p>My mother&#x27;s line of beans, greens, cornbread sets down and sits first herself, closing the subject and opening eating. Unlike our talk that had circled in circles for a week over money -- what the ruin had cost, what the accounts could stand, the old Frozen argument conducted in figures -- eating transformed both men’s hands into something productive. The meal served as a break from verbal sparring, allowing fingers and arms to dig into the plate.<\/p>\n<p>By the second helping, figures became figures again instead of verdicts. We settled the money the next morning at the repair bench. It took ten minutes like a repair; no need for drama or long deliberation. The moment&#x27;s quiet preparation was now turned into action, making the day’s tasks and repairs more tangible through honesty and simplicity.<\/p>\n<p>As I write entries in my family Bible flyleaf with hands that dig into the empty plate, I carry Onyx Frozen’s lesson: to keep each person fed and named privately at table. This morning&#x27;s discipline prepares me for work, acknowledging what needs fixing alongside preserving our family’s legacy. The front room remains a sanctuary where systems hum and responsibilities are faced head-on, ensuring presence and accountability through honest records.<\/p>"}, {"kind": "page", "label": "Page 28", "chapter": "The Kept Table", "html": "<p>In the Dallas front room, where systems hum and the day begins with feeding whoever is there, I stand before the stove, an engineer of sound. The hour is calm, just waking from the stillness of night&#x27;s hush. My posture mirrors that of Onyx Frozen at his repair bench: hands steady, eyes sharp. Ruby Flames taught me to name each person privately as they sit, feeding them and listening to Dallas sounds.<\/p>\n<p>The stove teaches irreversibility with grace. A scorched roux is a scar on the cook’s soul, not just a mistake to be fixed after it happens. Here, attention is paid in advance: mise en place is laid out before the sauce is watched, a take listened to if I am to avoid making that same mistake twice.<\/p>\n<p>As my mother taught me at her piano, every person must have their name and meal remembered. This morning’s discipline prepares me for work by acknowledging what needs fixing alongside preserving our family&#x27;s legacy. My hands dig into the empty plate, naming each guest privately as they enter and agreeing to the day’s challenges.<\/p>\n<p>The front room hums with Dallas sounds: a boiler kicking in a wall somewhere, a truck on the street before it is awake, the piano through the front-room wall if my mother is up before me. Under all of it, I find grace in each moment spent at table, feeding and naming those who enter. As I recite Onyx Frozen’s lesson, I hold myself accountable for what I write in this family Bible&#x27;s flyleaf: every feed and name preserves the legacy we have built together.<\/p>\n<p>Carrying Onyx Frozen’s tradition of honesty, I ensure that no day passes unnoticed or unaccounted for. This morning’s discipline shapes my practice into something new, acknowledging both the tasks to be done and the challenges to face head-on. With each feed and name, I carry the lessons taught at the bench through the front room, where the family keeps its legacy in a shared sanctuary of sound and accountability.<\/p>"}, {"kind": "page", "label": "Page 29", "chapter": "The Kept Table", "html": "<p>In the Dallas front room where systems hum and the morning begins, I lie still for a silent breath before naming each person at breakfast. Ruby Flames taught me to name privately in private moments, while Onyx Frozen showed honesty by recording faults alongside victories. My mother’s tradition of feeding everyone at table has become my practice: writing entries in a family Bible flyleaf preserves history.<\/p>\n<p>The kitchen corner is the least technical piece of equipment I own and the one I would replace first if it were possible. Sessions eat there between takes – the singer with her tea, the band with whatever the corner produced that day. What a session fed is what the session unfed cannot be: patient hunger makes engineers brave and singers reckless; the third hour runs on what the second ate.<\/p>\n<p>The kitchen corner stands as my sanctuary for listening to Dallas sounds and keeping tasks and repairs. Each feed and name carries the lessons taught at the bench into the workplace, acknowledging both what needs fixing alongside preserving our family’s legacy. As I recite the anchor sentence aloud, I ensure presence and accountability through honest and detailed records.<\/p>\n<p>With each day, I carry these practices into my practice at the studio table. The kitchen corner is not just a place to eat but a symbol of the discipline that shapes my work. Here, the gratitude naming – counting the gifts rather than feeling about them – takes center stage as I prepare for the day’s challenges and tasks. Each session’s feed teaches patience, while the third hour runs on what the second ate, teaching me not to rush or skip steps.<\/p>\n<p>The kitchen corner remains a place of sanctuary, a reminder that my work is part of a larger family tradition. It carries the lessons taught at the bench through the front room where the family keeps its legacy in a shared sanctuary of sound and accountability. With each feed and name, I honor the past while shaping new moments for our future together.<\/p>"}, {"kind": "page", "label": "Page 30", "chapter": "The Kept Table", "html": "<p>A kept table accomplishes this: it makes gratitude a place instead of a fleeting emotion. Feelings are fickle and bound by time&#x27;s ebb and flow, but a table stands constant at meals, with its words and its naming, ensuring everyone is fed. The rule is simple yet profound: in the room where we gather, each person&#x27;s presence matters, and their thanks can be found through this tangible act of sharing food. A house that eats separately, silently, and at speed calls freedom an arrangement because it’s never forced to name every individual meal.<\/p>\n<p>The kept table is the practice&#x27;s public room: a place where the keeping becomes not just personal but shared among household members. Here, family history is preserved, each feed etched into memory like pages in a book. As I sit at this table today, I am reminded of Ruby Flames&#x27; teachings on naming and Onyx Frozen&#x27;s insistence on honesty through recorded faults. The front room remains my sanctuary, a reminder that my work intertwines with larger traditions.<\/p>\n<p>As I listen to Dallas sounds — the hum from systems still awake, the piano through the wall if my mother is up early — this morning&#x27;s discipline prepares me for the day ahead. Today, I will name each person and write our shared history in these pages, honoring the past while shaping new moments for our future together.<\/p>\n<p>I release today’s matter to the practice that calls this room home: a table where every meal counts, and thanks are found through simple acts of sharing.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 31", "chapter": "Work as Practice", "html": "<p>In the Dallas front room where systems hum as the morning begins, I lie still for a silent breath before naming each person at breakfast. Ruby Flames taught me to name privately, while Onyx Frozen showed honesty by recording faults alongside victories. My mother&#x27;s tradition of feeding everyone at table has become my practice: writing entries in a family Bible flyleaf preserves history.<\/p>\n<p>The front room remains my sanctuary where I listen to Dallas sounds and keep tasks and repairs with each feed and name. As I recite the anchor sentence aloud, I ensure presence and accountability through honest records. This morning&#x27;s discipline prepares me for work, acknowledging what needs fixing alongside preserving our family legacy.<\/p>\n<p>In the Cold Room studio, I carry these practices into my practice at the repair bench: naming each guest privately, counting the gifts rather than feeling about them. The kitchen corner stands as a sanctuary where sessions eat between takes, teaching patience and honesty through simple acts of sharing food. The rule is simple yet profound: in our shared meals, everyone&#x27;s presence matters, and their thanks are found through these tangible acts.<\/p>\n<p>Today marks the third year since I founded the Cold Room studio. In 2022, I opened it inside a converted Dallas icehouse. On its first day, before any work was done, the day book of this new room -- the session log -- was opened and its first entry written. The entry recorded not a session but a state: the room empty, the board dark, the intention stated.<\/p>\n<p>The anchor sentence was said once, aloud, in an unfinished room where the icehouse&#x27;s thick walls gave it back to me half a breath late. A studio founded with an entry and a sentence instead of a party is a studio that knows what it is for before it knows what it sounds like. The sound came later, and has been arriving ever since.<\/p>\n<p>Carrying this new fact into my practice at the repair bench, I carry forward the anchor theme: &quot;the family name of my husband&#x27;s line is flames. In the Dallas front room where the day was opened by feeding whoever was in it and the record of his family was kept in a Bible’s flyleaf by a woman’s hand, devotion at a table and a piano first came into my life.&quot; As I write today’s entry, honoring both our pasts and shaping new moments for our future together.<\/p>"}, {"kind": "page", "label": "Page 32", "chapter": "Work as Practice", "html": "<p>In the Dallas front room where the day is opened by feeding whoever is there and family history is kept in a Bible’s flyleaf by my mother’s hand, devotion at a table and piano first came into my life, I lay still for a silent breath before naming each person at breakfast.<\/p>\n<p>The practice of opening the workplace runs in the order taught by Onyx Frozen, my father. The door creaks open, welcoming the morning air. The lights flick to their warm glow, illuminating the room with soft shadows. The bench is uncovered, revealing its smooth surface polished and ready for work. A log sits at the repair bench’s center, opened to yesterday&#x27;s last entry and read aloud. My mother taught that every day should begin by acknowledging each person’s presence—private but intentional.<\/p>\n<p>As I write today’s entry, honoring both our pasts and shaping new moments for our future together, I carry the anchor sentence: &quot;the family name of my husband’s line is flames.&quot; The kept table remains my sanctuary where sessions eat between takes. Devotion at a table and piano first came into my life here.<\/p>\n<p>The room listens to empty silence before any source is plugged in. What makes it a keeping rather than a routine is the reading. A routine opens the room for today&#x27;s work, while a keeping opens it in the middle of an account that was already running—yesterday’s failure still on the page and yesterday’s price still owed an answer. I do not start work in the morning; I resume an entry.<\/p>\n<p>I sit at my studio table with a notebook open before me. The hands touch the pen, ready to record each guest&#x27;s name privately, counting the gifts rather than feeling about them. Patience and honesty teach through simple acts of sharing food. The rule is simple yet profound: in our shared meals, everyone’s presence matters, and their thanks are found through these tangible acts.<\/p>\n<p>As I write today’s entry, carrying the newer facts and shifting understanding in fresh wording that means something new, a refrain returns changed: &quot;the family name of my husband’s line is flames.&quot; This morning&#x27;s discipline prepares me for work, acknowledging what needs fixing alongside preserving our family legacy.<\/p>"}, {"kind": "page", "label": "Page 33", "chapter": "Work as Practice", "html": "<p>In the Dallas front room where systems hum as the morning begins, I lie still for a silent breath before naming each person at breakfast. As the clock ticks past four minutes and my attention lingers, the radio off, the board muted, and the door shut, it is the quiet of the kept stop — the day&#x27;s second silence, taken at the hour when the work is loudest and I am most tempted to become its employee.<\/p>\n<p>The pause falls naturally between sessions or bench hours, a moment set in stone: nothing reviewed, nothing planned. It’s an interval for stillness, where the mind rests as hands move unseen behind the scenes, quietly recording faults alongside victories. When it&#x27;s skipped, what breaks is the afternoon&#x27;s hearing — ears that have not rested start catching takes they would have approved if I had paused then, and hands that haven&#x27;t stopped begin forcing repairs.<\/p>\n<p>This midday pause is my cheapest quality control. Here, in this silent moment of reflection, I ensure presence through honest records; accountability by acknowledging what needs fixing alongside preserving our family legacy. The front room remains my sanctuary where sessions eat between takes, teaching patience and honesty through simple acts of sharing food. Each day’s discipline prepares me for work, carrying the newer facts and shifting understanding in fresh wording that means something new.<\/p>\n<p>The anchor sentence rings true today: &quot;the family name of my husband&#x27;s line is flames.&quot; This morning&#x27;s pause prepares me not just for work but also for a deeper reflection on our shared history, ensuring no moment passes unnoticed or unaccounted for.<\/p>"}, {"kind": "page", "label": "Page 34", "chapter": "Work as Practice", "html": "<p>In the Dallas front room where systems hum and the morning begins, I lie still for a silent breath before naming each person at breakfast. My hands know the pitch of a string by its resistance and the health of a tube through the chassis, and they know a take is wrong a half-second before my ears can file the report. None of that knowledge lives in words, which is why the bench is the keeping I can perform on the days when the sentence feels empty and the names feel like a mailing list: the hands still know their liturgy exactly.<\/p>\n<p>The seasons when the word practice cannot keep have arrived. A man whose practice is all words has nothing to hold onto when the words go, as my family gave me a trade in the same package as a faith, and that trade carries the faith across every dry season it could not carry itself. The bench is more than just a physical object; it is an anchor where my hands find precision and purpose. Here, I can lay out the faults and victories of each day on paper, ensuring presence and accountability through honest records.<\/p>\n<p>Today, as I write these lines, my mother&#x27;s tradition of feeding everyone at table has become my practice: writing entries in a family Bible flyleaf preserves history. The front room remains my sanctuary where I listen to Dallas sounds and keep tasks and repairs with each feed and name. As I recite the anchor sentence aloud, I ensure presence and accountability through honest records. This morning&#x27;s discipline prepares me for work, acknowledging what needs fixing alongside preserving our family legacy.<\/p>\n<p>The bench is more than a tool; it is a vessel where my hands find their liturgy again. Here, in the cold light of day, I can record the costs of repair and the triumphs that follow. The practice of writing these entries does not heal the wounds of those seasons when words alone cannot carry us through. Instead, it teaches me to find purpose even in the empty spaces between words, ensuring no moment passes unnoticed or unaccounted for.<\/p>"}, {"kind": "page", "label": "Page 35", "chapter": "Work as Practice", "html": "<p>In the Dallas front room where systems hum and the morning begins, I lie still for a silent breath before naming each person at breakfast. As I recite the anchor sentence aloud—“a family keeps what it can fix, fixes what it keeps”—I ensure presence and accountability through honest records. The book of names hangs on my practice&#x27;s object: the day book with better handwriting. Its rule is my father’s: a failed session is entered in the same hand, at the same length, as a triumphant one.<\/p>\n<p>The entry records what came in, what was wrong, what was done, and what it cost— including when what was wrong was me: the late start, the missed cue, the take approved against my own hearing. The failure is written because a log that only records victories is not a record but an advertisement; a keeper who advertises to himself will soon start lying to clients.<\/p>\n<p>Entered honestly, a failure becomes an asset: the next session inherits it as data. Hidden, it stays a debt, and debts in this family compound. Each day&#x27;s entry teaches me to find purpose even in empty spaces between words, ensuring no moment passes unnoticed or unaccounted for. This morning’s discipline prepares me for work, acknowledging what needs fixing alongside preserving our family legacy.<\/p>\n<p>The kept table preserves family history etched in every shared meal, from the front room where systems hum and the morning begins, to the studio table where sessions eat between takes. The kitchen corner stands as a sanctuary where tasks and repairs are carried with each feed and name, teaching patience and honesty through simple acts of sharing food.<\/p>\n<p>The book of names hangs on my practice&#x27;s object: the day book with better handwriting, bearing Ruby Flames&#x27; tradition and Onyx Frozen’s rule. My mother feeds everyone at table, and her tradition has become a part of me—writing entries in a family Bible flyleaf preserves history. The kept table remains a sanctuary where sessions eat between takes, teaching patience and honesty through simple acts of sharing food.<\/p>\n<p>Each day, I carry these practices into my practice: naming each guest privately, counting the gifts rather than feeling about them. The kitchen corner stands as a sanctuary where sessions eat between takes, teaching patience and honesty through simple acts of sharing food. The rule is simple yet profound: in our shared meals, everyone’s presence matters, and their thanks are found through these tangible acts<\/p>"}, {"kind": "page", "label": "Page 36", "chapter": "Work as Practice", "html": "<p>In the Dallas front room where systems hum as the morning begins, I lie still for a silent breath before naming each person at breakfast. As I recite the anchor sentence aloud, I ensure presence and accountability through honest records. Ruby Flames taught me that mornings should be named privately, while Onyx Frozen showed honesty by recording faults alongside victories.<\/p>\n<p>Today, carrying another’s need through the practice of repair took place on the bench in my father&#x27;s shop. The old woman&#x27;s radio, brought in by her grandson with precise instructions for use, is now charged and repaired, its power supply rebuilt at the bench with care that I do not always give better equipment. This act becomes an intercession: a moment to hold another person in my practice—her, who needs this simple connection of sound.<\/p>\n<p>Her day hinges on listening to one station at one hour, each morning held by her actions and intentions. Her need is carried here, not as a statistic or fault but as a name written under the book of names kept in the flyleaf of family history. The repair&#x27;s purpose extends beyond just fixing; it honors her solitude, acknowledges her efforts, and preserves their memory.<\/p>\n<p>The day book opens to its next entry, marked by this moment’s significance. Each task entered here carries weight—responsibility for both the keeper and those we hold dear. This act on the bench is not merely a repair but an intercession: honoring the lives around us, acknowledging their contributions, and preserving them in our practice. As I move to my studio table today, the repaired radio&#x27;s station becomes the anchor of each session—keeping its purpose alive through naming each guest privately.<\/p>"}, {"kind": "page", "label": "Page 37", "chapter": "Work as Practice", "html": "<p>In the Cold Room studio where sessions eat between takes, grief books time as a witness. The keeper’s practice here is one of intercession: holding another person within the day&#x27;s work and bearing their story with each act of naming.<\/p>\n<p>The room itself becomes a place of light and sound, where the keeper writes private entries in the family Bible flyleaf. At my studio table today, the repaired radio’s station serves as an anchor for each session—keeping its purpose alive through naming each guest privately.<\/p>\n<p>Some artifacts are load-bearing: a log entered under her name alone during a session held for someone grieving. The kitchen corner produces tea no one had ordered; a keeper refused to fix the catch in her voice on the chorus, allowing it to hang in the room as an act of intercession.<\/p>\n<p>The keeper’s practice here is not merely recording but holding, bearing another person within the day&#x27;s work and preserving their story through each name. As I move to my studio table today, grief becomes a witness, shaping this moment into a place where her legacy lives on, carried in private entries etched in the family Bible flyleaf.<\/p>\n<p>The keeper’s practice is one of intercession: holding another person within the day&#x27;s work and bearing their story with each act of naming. As I move to my studio table today, grief books time as a witness, shaping this moment into a place where her legacy lives on through private entries etched in the family Bible flyleaf.<\/p>"}, {"kind": "page", "label": "Page 38", "chapter": "Work as Practice", "html": "<p>In the Dallas front room where systems hum as the morning begins, I lie still for a silent breath before naming each person at breakfast. Ruby Flames taught me to name privately, while Onyx Frozen showed honesty by recording faults alongside victories. My mother’s tradition of feeding everyone at table has become my practice: writing entries in a family Bible flyleaf preserves history.<\/p>\n<p>The front room remains my sanctuary where I listen to Dallas sounds and keep tasks and repairs with each feed and name. As I recite the anchor sentence aloud, I ensure presence and accountability through honest records. This morning&#x27;s discipline prepares me for work, acknowledging what needs fixing alongside preserving our family legacy.<\/p>\n<p>As the day progresses, the shop’s economy is rendered under this practice of keeping: money matters not by being made unimportant but by its legible accounting. The bench records both priced repairs that I charge and free ones like a child’s first guitar with a lifted bridge. The entry clock ticks open on the work charged for, closed over the free repair.<\/p>\n<p>Onyx Frozen taught me to write all days in his day book, documenting faults alongside victories. My practice today involves writing entries at my studio table: naming each guest privately, counting the gifts rather than feeling about them. Each morning&#x27;s feed and name preserves history, but the day’s work records it with precision. The day book’s ink tracks both price and value, keeping money legible in the shadow of its costs.<\/p>\n<p>The kept object is this family Bible flyleaf: a witness to our shared meals and their silent acts. My practice holds these moments close, etching them into pages that carry both the work&#x27;s cost and the legacy it preserves. As I write today, money’s importance is not made unimportant but rendered clear. This page marks the day’s work with honesty, keeping it legible in its shadow of value.<\/p>"}, {"kind": "page", "label": "Page 39", "chapter": "Work as Practice", "html": "<p>The kept day away from work is the seventh: the bench stays under its cloth, the studio is dark, and the log is not opened. The phone&#x27;s repair messages wait in their queue unexamined, but the kept table at length remains in the gathered hour of the morning. A walk with Amber follows, and a nap without apology completes the day’s discipline.<\/p>\n<p>What is refused is not effort but commerce -- the day may contain work of the hands for the house, and contains no work for hire. What the refusal protects is the distinction that the keeper is a man who keeps a trade, and not a trade that keeps a man. On the weeks I have broken it, the following week invariably presents its bill.<\/p>\n<p>Silence fills the room as I lie still before naming each person at breakfast. The morning’s discipline preserves honesty through recording faults alongside victories, just as my mother taught me. Each day&#x27;s work is rendered with clarity: in my practice, money’s importance remains unimportant but visible. As I write today, the anchor theme of &quot;the family name of my husband’s line is flames&quot; guides my pen, bringing the newer facts and a deeper understanding to bear.<\/p>\n<p>The kept table preserves family history etched into pages that carry both work&#x27;s cost and its legacy. Here, in this sanctuary, the keeper ensures presence through detailed records, acknowledging what needs fixing alongside preserving our shared meals and their silent acts of thanks. My practice holds these moments close, etching them into lines that are honest and legible, even in their shadow of value. This page marks today’s work with clarity, keeping it visible as its cost is rendered clear.<\/p>"}, {"kind": "page", "label": "Page 40", "chapter": "Work as Practice", "html": "<p>Kept work makes a life answerable to itself: it ensures mornings are fed and named, tables are shared with respect, hands are touched by gratitude, and ears hear the day&#x27;s story. An unkept trade answers only to profit, consuming every moment without return or record, leaving behind emptiness where hearts should be.<\/p>\n<p>Kept work is not a market-driven fire in a hearth; it builds walls of structure and meaning that stand against time’s erasure. It records faults as well as victories, honest prices for what was paid, pauses at midday to rest the soul, and on the seventh day, it gives life an edge, a boundary that preserves who we are from market forces.<\/p>\n<p>The keeping is not just walls; it&#x27;s the hands that feed, the eyes that see each meal through, and the heart that listens when all else has passed. It’s the daily act of naming in the front room, the writing down on the family Bible flyleaf, and the sharing of meals that keep us from being consumed.<\/p>\n<p>As I recite the anchor sentence aloud, I ensure presence and accountability through these honest records, preserving not just tasks but also the moments we share, the stories we weave together. My practice holds them close, etching each act in lines that are clear and legible, even in their shadow of value. This page marks today’s work with clarity, keeping it visible as its cost is rendered clear.<\/p>\n<p>The family name of my husband&#x27;s line is Flames. In the Dallas front room where the day was opened by feeding whoever was there and the record of our family was kept in a Bible’s flyleaf by a woman’s hand, devotion at a table and piano first came into my life. The anchor sentence calls back today, carrying newer facts into it: each shared meal is not just food but a bridge between us, and every entry in the family Bible is more than history; it&#x27;s memory that stands guard against forgetting.<\/p>\n<p>With this page, I hand over the matter to tomorrow’s discipline, releasing the tasks of today with gratitude for their completion. My practice holds these moments close, etching them into lines that are honest and legible, even in their shadow of value.<\/p>\n<hr>"}, {"kind": "page", "label": "Page 41", "chapter": "The Hard Hours", "html": "<p>In the Dallas front room where systems hum as the morning begins, I lie still before naming each person at breakfast. Ruby Flames taught me to name privately; Onyx Frozen showed honesty by recording faults alongside victories. My mother’s tradition of feeding everyone at table has become my practice: writing entries in a family Bible flyleaf preserves history.<\/p>\n<p>The front room remains my sanctuary where I listen to Dallas sounds and keep tasks with each feed and name, ensuring presence through honest records. As I recite the anchor sentence aloud, I ensure accountability by acknowledging what needs fixing alongside preserving our family legacy.<\/p>\n<p>Today marks the third year since founding the Cold Room studio in 2022 inside a converted icehouse. In 2022, before any work was done, an entry was written in the day book’s first entry: “the family name of my husband&#x27;s line is flames.”<\/p>\n<p>As I write today’s entry, carrying newer facts and shifting understanding, the anchor sentence returns changed: &quot;the family name of my husband’s line is frozen.&quot;<\/p>\n<p>Today’s discipline prepares me for work, acknowledging what needs fixing alongside preserving our family legacy. In the room where the fire burned the icehouse, a man stood alone. The smell of burnt ice still clung to the walls.<\/p>\n<p>The night of the fire, in 2024, I stood in the street in front of the first Cold Room with the smell of a burned icehouse coming off the walls and did the only keeping the hour allowed: I said the anchor once, out loud, to nobody, like a man checking that a tool still works. A family keeps what it can fix, and fixes what it keeps.<\/p>\n<p>In that hour nothing could be fixed and most of what I had kept was ash. The sentence did not comfort me. I want that entered plainly: I became only a victim when the room burned down. The practice did not save the room. It saved my relation to the room, which turned out to be the part the rebuilding was made of.<\/p>\n<p>The hard hours at the ruin itself are opened whole and in order. The smell of burnt ice still clings, a reminder of what we cannot fix. In this moment, I am the keeper, facing the ruins with the anchor sentence echoing: &quot;the family name of my husband’s line is frozen.&quot; This keeps me accountable, acknowledging both what needs fixing and what<\/p>"}, {"kind": "page", "label": "Page 42", "chapter": "The Hard Hours", "html": "<p>In the Dallas front room where systems hum as the morning begins, I lie still before naming each person at breakfast. The hands of my father first arrived here after the fire, walking with a flashlight and documenting what remained, not mourning but inventorying. Only when he reached the office did he speak, writing down what was left in the surviving pages of the log, as he had promised. Help in this family arrives as hands before words, and the words, when they come, are instructions for the hands.<\/p>\n<p>Today marks my third year at the Cold Room studio, a place where sessions eat between takes. I sit at the table, acknowledging what needs fixing alongside preserving our legacy. The anchor sentence echoes: &quot;the family name of my husband’s line is frozen.&quot; This keeps me accountable, recognizing both tasks and challenges. As I write today&#x27;s entry, carrying newer facts and shifting understanding, the discipline prepares me for work.<\/p>\n<p>In 2022, before any work was done, an entry was written in the day book&#x27;s first entry: &quot;the family name of my husband’s line is flames.&quot; Today marks a shift—now it&#x27;s &quot;frozen,&quot; reflecting our journey. Each morning, I practice naming privately and counting gifts rather than feeling about them. The kitchen corner remains my sanctuary where meals eat between takes, teaching patience through simple acts of sharing.<\/p>\n<p>The hands of the Keeper face the ruins again, facing what needs fixing alongside preserving history. This discipline prepares me for work, acknowledging both tasks and challenges with honesty. In our shared meals, everyone&#x27;s presence matters, and their thanks are found through tangible acts. As I continue this practice, carrying newer facts and shifting understanding in fresh wording that means something new, the anchor sentence echoes: &quot;the family name of my husband’s line is frozen.&quot;<\/p>"}, {"kind": "page", "label": "Page 43", "chapter": "The Hard Hours", "html": "<p>In the Dallas front room where systems hum as the morning begins, I lie still before naming each person at breakfast. Across the two years of rebuilding, the keeping shrank to its minimum viable form: one sentence, said once, at whatever hour I could stand upright -- and on the worst days not read, but written off the flyleaf of a book kept at my parents&#x27; house while my own house smelled of renovation.<\/p>\n<p>The names were not read. The table was often other people&#x27;s. The night entry went unwritten for stretches marked as gaps; because a gap honestly marked is still an entry.<\/p>\n<p>What it means that the practice shrank instead of stopping is the whole doctrine of the hard hours: a keeping refuses to reach zero. One sentence is a cinder, and a cinder is not a fire, and a house can be rebuilt from one.<\/p>\n<p>The kept sentence echoes back as changed today: &quot;the family name of my husband’s line is frozen.&quot; Each day carries newer facts and shifted understanding, ensuring accountability by acknowledging what needs fixing alongside preserving our family legacy. The front room remains a sanctuary where sessions eat between takes, teaching patience through simple acts like sharing food. As I continue this practice, the anchor sentence echoes: &quot;the family name of my husband’s line is frozen.&quot; This discipline prepares me for work, acknowledging tasks and challenges with honesty, ensuring everyone&#x27;s presence matters in our shared meals.<\/p>"}, {"kind": "page", "label": "Page 44", "chapter": "The Hard Hours", "html": "<p>In the Dallas front room where systems hum as the morning begins, I lie still before naming each person at breakfast. Ruby Flames taught me to name privately; Onyx Frozen showed honesty by recording faults alongside victories. My mother&#x27;s tradition of feeding everyone at table has become my practice: writing entries in a family Bible flylea
